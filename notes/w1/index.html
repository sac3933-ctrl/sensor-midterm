<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Week 1 센서의 기초 — 강의 해설 노트</title>
<style>:root{
  --bg:#f7f7f4;--card:#ffffff;--ink:#1d1d1b;--sub:#5d5d58;--line:#e2e1da;
  --accent:#2457c5;--accent-soft:#e8eefb;--talk:#fff7e6;--talk-line:#f0c46b;
  --tip:#e7f5ea;--tip-line:#5aae6c;--tip-ink:#1f5a2c;--star:#d99a00;--q:#c2410c;
  --ok:#1f7a3a;--ng:#b42318;--box:#e5484d;--barH:96px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141413;--card:#1e1e1c;--ink:#ecebe6;--sub:#a9a8a1;--line:#34342f;
  --accent:#7aa2ff;--accent-soft:#1f2a44;--talk:#2b2416;--talk-line:#8a6a26;
  --tip:#16301d;--tip-line:#3f8a52;--tip-ink:#bfe6c8;--star:#f2c14e;--q:#fb923c;
  --ok:#5fd18a;--ng:#ff8a80;--box:#ff6b6b;
}}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
/* top bar */
/* ---- sidebar layout ---- */
:root{--sideW:300px;--railW:56px}
.ic{border:1px solid var(--line);background:var(--card);border-radius:8px;min-width:34px;height:34px;font-size:15px;line-height:1;padding:0 8px}
.ic.on{background:var(--accent);border-color:var(--accent);color:#fff}
#side{position:fixed;top:0;left:0;bottom:0;width:var(--sideW);z-index:60;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.sd-head{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
.sd-title{font-size:15px;margin:0;line-height:1.3;flex:1;min-width:0}
.sd-title small{display:block;font-size:12px;font-weight:400;color:var(--sub)}
.sd-search{padding:4px 12px 6px}
#q{width:100%;height:38px;border:1px solid var(--line);border-radius:9px;padding:0 10px;font:inherit;font-size:14.5px;background:var(--bg);color:var(--ink)}
#q:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
.qf{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.qc{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:1px 9px;font-size:12px}
.qc.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.qres{margin:0 8px 6px;max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.qmeta{font-size:12px;color:var(--sub);padding:6px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg)}
.hit{display:flex;gap:8px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:7px 10px;font-size:13px;line-height:1.45}
.hit:hover,.hit.sel{background:var(--accent-soft)}
.hn{flex:0 0 auto;min-width:30px;height:22px;border-radius:6px;background:var(--accent);color:#fff;font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 4px}
.hb{min-width:0;display:flex;flex-direction:column}
.hl{font-weight:700;font-size:12px;color:var(--accent);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hs{color:var(--ink);word-break:break-word}
.hs mark,mark.hit{background:#fde047;color:#000;border-radius:3px;padding:0 1px}
mark.hit{box-shadow:0 0 0 3px #fde047}
.sd-tools{display:flex;flex-wrap:wrap;gap:5px;align-items:center;padding:4px 12px 8px;border-bottom:1px solid var(--line)}
.tb{border:1px solid var(--line);background:var(--card);border-radius:8px;padding:3px 9px;font-size:12.5px;white-space:nowrap}
.tb.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.savest{font-size:11.5px;color:var(--sub);padding:2px 8px;border:1px solid var(--line);border-radius:99px;white-space:nowrap}
.savest.db{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 40%,transparent)}
.savest.local{color:var(--q)}
.sd-nav{flex:1;min-height:0;overflow:auto;padding:4px 6px 20px;position:relative}
.partsep{font-size:11px;font-weight:700;color:var(--sub);letter-spacing:.04em;padding:10px 8px 3px}
.nv{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;border-radius:7px;padding:5px 8px;font-size:13px;line-height:1.35}
.nv:hover{background:var(--bg)}
.nv .nn{flex:0 0 auto;min-width:24px;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums;font-size:12px}
.nv .nt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nv .mk{flex:0 0 auto;font-size:11px}
.nv.st .mk::before{content:"★";color:var(--star)}
.nv.qm .mk::after{content:"?";color:var(--q);font-weight:800;margin-left:2px}
.nv.cur{background:var(--accent);color:#fff}.nv.cur .nn{color:#fff}
.nv.pend{opacity:.55}
body.staronly .nv[data-go]:not(.st):not([data-go="map"]):not([data-go="guide"]){opacity:.35}
#rail{display:none;position:fixed;top:0;left:0;bottom:0;width:var(--railW);z-index:60;background:var(--card);border-right:1px solid var(--line);flex-direction:column;align-items:center;gap:6px;padding:10px 0}
.rl-sep{width:28px;border-top:1px solid var(--line);margin:4px 0}
.rl-cur{font-size:12px;font-weight:800;color:var(--accent)}
#topbar{display:none;position:fixed;top:0;left:0;right:0;z-index:50;height:52px;align-items:center;gap:8px;padding:0 10px;background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.tb-cur{flex:1;min-width:0;font-weight:700;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#scrim{display:none;position:fixed;inset:0;z-index:55;background:rgba(0,0,0,.35)}
main{padding:20px 24px 80px calc(var(--sideW) + 24px)}
main>*{max-width:920px;margin-left:auto;margin-right:auto}
body.side-collapsed #side{display:none}
body.side-collapsed #rail{display:flex}
body.side-collapsed main{padding-left:calc(var(--railW) + 24px)}
@media (max-width:1023px){
  #topbar{display:flex}
  #rail{display:none!important}
  #side{display:flex!important;width:min(340px,88vw);transform:translateX(-105%);transition:transform .2s ease;box-shadow:4px 0 20px rgba(0,0,0,.15)}
  body.drawer-open #side{transform:none}
  body.drawer-open #scrim{display:block}
  main{padding:calc(52px + 14px) 12px 80px!important}
  #bSide::before{content:"✕"} #bSide{font-size:0}
  #bSide::before{font-size:15px}
}
@media (min-width:1024px) and (max-width:1199px){:root{--sideW:260px}}
h1{font-size:22px;margin:4px 0 14px}
.card,.slide{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:0 0 18px}
.slide,.card{scroll-margin-top:calc(var(--barH) + 8px)}
/* map */
.map{display:grid;grid-template-columns:1fr minmax(120px,170px) 1fr;gap:10px;align-items:center}
.map .center{grid-column:2;grid-row:1/span 3;background:var(--accent);color:#fff;border-radius:50%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:800;font-size:18px;padding:10px}
.br{border:2px solid var(--accent-soft);border-radius:10px;padding:8px 10px;background:var(--bg);min-width:0}
.br b{display:block;font-size:14.5px;color:var(--accent)}
.br ul{margin:4px 0 4px 16px;padding:0;font-size:13.5px;line-height:1.5}
.sref{display:inline-block;border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:5px;font-size:12px;line-height:1.4;padding:0 5px;margin:1px 2px}
.links{margin-top:12px;font-size:14px}
.links li{margin:4px 0}
@media (max-width:640px){
  .map{grid-template-columns:1fr}
  .map .center{grid-column:1;grid-row:auto;border-radius:12px;aspect-ratio:auto;padding:12px;order:-1}
  .map .br{grid-column:auto!important;grid-row:auto!important}
}
.guide{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.guide>div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-width:0}
.guide h3{margin:0 0 6px;font-size:15px}
.guide ol,.guide ul{margin:0;padding-left:20px;font-size:14px;line-height:1.6}
.guide details{font-size:14px;margin:4px 0}
@media (max-width:640px){.guide{grid-template-columns:1fr}}
/* slide */
.shead{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;margin-bottom:8px}
.shead h2{margin:0;font-size:18px;flex:1 1 300px}
.shead h2 .no{color:var(--accent);margin-right:6px}
.marks{display:flex;gap:6px}
.marks button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:2px 10px;font-size:13px}
.marks .bs.on{background:var(--star);border-color:var(--star);color:#000;font-weight:700}
.marks .bq.on{background:var(--q);border-color:var(--q);color:#fff;font-weight:700}
.thumb{display:block;width:100%;height:auto;max-width:560px;border:1px solid var(--line);border-radius:8px;cursor:zoom-in;background:#fff;aspect-ratio:1287/910}
.one{margin:10px 0 0;padding:8px 12px;border-left:4px solid var(--accent);background:var(--accent-soft);border-radius:0 8px 8px 0}
.one b{color:var(--accent);margin-right:6px}
.talk{margin:10px 0 0;background:var(--talk);border:1px solid var(--talk-line);border-radius:10px;padding:10px 14px}
.talk .lab{font-weight:700;font-size:14px}
.talk p{margin:6px 0}
.talk .sum{font-weight:600;border-top:1px dashed var(--talk-line);padding-top:6px}
body.noeasy .talk,body.noeasy .tip{display:none}
.grp{margin:14px 0 4px;font-size:12px;font-weight:700;color:var(--sub);letter-spacing:.05em}
details.sec{border:1px solid var(--line);border-radius:9px;margin:6px 0;background:var(--card)}
details.sec>summary{padding:8px 12px;font-weight:600;cursor:pointer;list-style:none}
details.sec>summary::before{content:"▸";display:inline-block;width:16px;transition:transform .15s}
details.sec[open]>summary::before{transform:rotate(90deg)}
details.sec>summary::-webkit-details-marker{display:none}
.sbody{padding:0 12px 12px;overflow-x:auto}
.tip{background:var(--tip);border-left:4px solid var(--tip-line);color:var(--tip-ink);border-radius:0 8px 8px 0;padding:6px 10px;margin:4px 0 10px;font-size:14.5px}
.tip::before{content:"🎙 강사 한마디  ";font-weight:700}
table{border-collapse:collapse;width:100%;font-size:14px;margin:4px 0}
th,td{border:1px solid var(--line);padding:5px 7px;text-align:left;vertical-align:top}
th{background:var(--bg)}
.pair td:first-child{color:var(--sub);width:48%}
.cap{font-size:13px;color:var(--sub);margin:4px 0}
.steps{margin:0;padding-left:0;list-style:none}
.steps li{padding:5px 8px;border-bottom:1px dashed var(--line);font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11.5px;font-weight:700;border-radius:4px;padding:0 5px;margin:0 2px;line-height:1.6;vertical-align:1px}
.tag.ai{background:#e0e7ff;color:#3730a3}.tag.gs{background:#fef3c7;color:#92400e}.tag.wn{background:#fee2e2;color:#991b1b}.tag.wk{background:#dcfce7;color:#166534}
@media (prefers-color-scheme:dark){.tag.ai{background:#312e81;color:#e0e7ff}.tag.gs{background:#78350f;color:#fef3c7}.tag.wn{background:#7f1d1d;color:#fee2e2}.tag.wk{background:#14532d;color:#dcfce7}}
/* figure */
.figwrap{position:relative;overflow:hidden;width:100%;max-width:640px;border:1px solid var(--line);border-radius:8px;background:#fff}
.figwrap img{position:absolute;display:block;max-width:none}
.box{position:absolute;border:2px solid var(--box);background:rgba(229,72,77,.06);border-radius:4px;padding:0}
.box span{position:absolute;top:-1px;left:-1px;background:var(--box);color:#fff;font-size:12px;font-weight:700;line-height:1;padding:3px 5px;border-radius:3px 0 4px 0}
.box.act{border-width:3px;background:rgba(229,72,77,.16);box-shadow:0 0 0 2000px rgba(0,0,0,.28);z-index:2}
.fignav{display:flex;gap:4px;flex-wrap:wrap;margin:8px 0 4px}
.fignav button{min-width:32px;height:30px;border:1px solid var(--line);background:var(--bg);border-radius:6px}
.fignav button.act{background:var(--box);border-color:var(--box);color:#fff;font-weight:700}
.figdesc{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-height:48px}
.figdesc b{color:var(--box)}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13.5px}
.flow span{border:1px solid var(--line);border-radius:8px;padding:5px 8px;background:var(--bg);text-align:center;line-height:1.35}
.flow span.hl{border-color:var(--accent)}
.flow small{color:var(--sub)}
/* quiz */
.qz{border:1px solid var(--line);border-radius:9px;padding:10px 12px;margin:8px 0}
.qz .qq{font-weight:600;margin-bottom:6px}
.qz .opt{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:7px 10px;margin:4px 0}
.qz .opt.ok{border-color:var(--ok);background:rgba(31,122,58,.12)}
.qz .opt.ng{border-color:var(--ng);background:rgba(180,35,24,.12)}
.qz .exp{margin-top:6px;font-size:14.5px}
.qz textarea,.memo textarea{width:100%;min-height:70px;border:1px solid var(--line);border-radius:8px;padding:8px;font:inherit;background:var(--bg);color:var(--ink)}
.qbar{display:flex;gap:10px;align-items:center;margin-top:6px}
.qbar button,.qz .show{border:1px solid var(--accent);color:var(--accent);background:transparent;border-radius:999px;padding:2px 12px;font-size:13.5px}
.score{font-weight:700}
.model{margin-top:6px;background:var(--bg);border-radius:8px;padding:8px 10px;font-size:14.5px}
.model label{display:block}
.memo{margin-top:14px}
.memo .lab{font-size:13px;font-weight:700;color:var(--sub)}
.pending{color:var(--sub);font-size:14px;margin-top:8px}
/* tooltip terms */
.tt{border-bottom:1.5px dotted var(--accent);cursor:help}
#tip{position:absolute;z-index:80;max-width:min(320px,calc(100vw - 16px));background:var(--card);border:1px solid var(--accent);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:8px 11px;font-size:14px;line-height:1.55;display:none}
#tip .n{font-weight:700;color:var(--accent)}
#tip .r{color:var(--sub);font-size:12.5px}
/* lightbox */
#lb{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;padding:10px;cursor:zoom-out}
#lb img{max-width:100%;max-height:100%;background:#fff;border-radius:6px}
body.staronly .slide:not(.st){display:none}
#empty{display:none}
body.staronly #empty.show{display:block}
ul.mem{margin:4px 0 8px;padding-left:20px}
.rv h4{margin:8px 0 2px;font-size:14px;color:var(--accent)}

.tag.bk{background:#e0f2fe;color:#075985}
@media (prefers-color-scheme:dark){.tag.bk{background:#0c4a6e;color:#e0f2fe}}
.booksec{border-color:#7dd3fc}
.booksec>summary{color:#0369a1}
@media (prefers-color-scheme:dark){.booksec{border-color:#0c4a6e}.booksec>summary{color:#7dd3fc}}
h4.bkh{margin:12px 0 4px;font-size:14.5px;color:var(--accent)}
h4.bkh:first-child{margin-top:4px}
.sbody ul{margin:4px 0;padding-left:20px}
.math{font-family:"Cambria Math","Times New Roman",serif;white-space:nowrap}
.warnbox{background:rgba(220,38,38,.07);border:1px solid rgba(220,38,38,.35);border-radius:8px;padding:7px 10px;margin:8px 0;font-size:14.5px}
.slide.apx{border:2px solid #7dd3fc}
table.wide{min-width:620px}

.latestsec{border-color:#fbbf24}
.latestsec>summary{color:#b45309}
@media (prefers-color-scheme:dark){.latestsec{border-color:#78350f}.latestsec>summary{color:#fcd34d}}
.src{font-size:13px;line-height:1.6;margin:10px 0 4px;word-break:break-all}
.src a{color:var(--accent)}

.sd-hub{display:block;margin:2px 12px 8px;padding:6px 10px;border:1px solid var(--line,#e3e7ee);border-radius:8px;font-size:13px;font-weight:600;text-decoration:none;color:#2563eb;background:rgba(37,99,235,.06)}
.sd-hub:hover{background:rgba(37,99,235,.12)}
@media (prefers-color-scheme:dark){.sd-hub{color:#93c5fd;background:rgba(122,167,255,.08)}}
#side.col .sd-hub{display:none}
</style></head>
<body>
<aside id="side" aria-label="노트 메뉴">
<div class="sd-head"><button id="bSide" class="ic" aria-label="메뉴 접기" aria-expanded="true" title="메뉴 접기 ( [ )">⟨</button><h1 class="sd-title">Week 1 · 센서의 기초<small>강의 해설 노트</small></h1></div>
<a class="sd-hub" href="../" title="통합 목차·전체 검색">📚 통합 노트 · 전체 검색 · 과제·시험</a>
<div class="sd-search"><input id="q" type="search" placeholder="검색 — 한글·영어 ( / )" autocomplete="off" aria-label="노트 검색"><div id="qf" class="qf"></div></div>
<div id="qres" class="qres" hidden></div>
<div class="sd-tools"><button id="bStar" class="tb">★ 표시만</button><button id="bAll" class="tb">전체 펼치기</button><button id="bEasy" class="tb on">🎙 쉬운 설명</button><span id="save" class="savest">저장: 확인 중</span></div>
<nav id="nums" class="sd-nav"></nav>
</aside>
<div id="rail" aria-label="접힌 메뉴"><button id="rlOpen" class="ic" title="메뉴 펼치기 ( [ )" aria-label="메뉴 펼치기">⟩</button><button id="rlSearch" class="ic" title="검색 ( / )" aria-label="검색">🔍</button><button id="rlStar" class="ic" title="★ 표시만" aria-label="★ 표시만">★</button><button id="rlEasy" class="ic on" title="🎙 쉬운 설명" aria-label="쉬운 설명">🎙</button><div class="rl-sep"></div><button id="rlPrev" class="ic" title="이전 (←)" aria-label="이전">▲</button><div id="rlCur" class="rl-cur">지도</div><button id="rlNext" class="ic" title="다음 (→)" aria-label="다음">▼</button></div>
<header id="topbar"><button id="tbMenu" class="ic" aria-label="메뉴 열기">☰</button><div id="tbCur" class="tb-cur">지도</div><button id="tbSearch" class="ic" aria-label="검색">🔍</button></header>
<div id="scrim"></div>
<main></main>

add(2, { pages:"pp.30–31 (1.5)", items:[
 {h:"1.5 센서화 시대 (p.30)", b:"<p>센서와 통신 기술을 바탕으로 한 사물인터넷(IoT)이 스마트 홈·스마트 자동차를 가능하게 하고, 스마트 공장에서는 모든 기계가 생산라인을 효율적으로 운영하도록 정보를 제공해요. 지역별로 흩어진 사물인터넷을 하나로 이어 전 세계 사물을 하나의 대형 IoT로 묶으려는 시도도 진행 중이에요.</p><p class='cap'>슬라이드의 'Physical AI·초연결'과 같은 흐름을 교재는 '센서화(sensorization)'로 표현해요. 1장 첫 그림도 Sensorization 가운데에 IoT·Mobile·Wearable·Health care를 놓고 있어요.</p>"},
 {h:"그림 1.15 사물 인터넷의 아키텍처 (p.31)", b:"<div class='flow'><span class='hl'>센서를 장착한 사물<br><small>에너지·산업·헬스케어·교통·국방·스마트 홈·스마트 카·웨어러블</small></span>→<span>유선 / 무선</span>→<span>네트워킹<br><small>게이트웨이·라우터, 모바일</small></span>→<span>통신 서비스</span>→<span class='hl'>데이터 센터·클라우드<br><small>서버 저장, 데이터 분석</small></span></div><ul><li>센서 기술의 발전 없이는 사물 인터넷이나 스마트 시스템을 실현할 수 없어요. IoT에서는 <b>센서와 액추에이터가 내장된 사물</b>이 유무선 네트워크로 서로 연결돼요.</li><li>모바일·가전 센서, 스마트 카, 웨어러블 센서 분야가 크게 성장할 것으로 보고, 4차 산업에서도 센서 기술이 핵심 역할을 한다고 해요.</li><li>센서화(sensorlization) 시대에는 분야별 요구(needs)에 맞는 최적의 센서를 개발하는 것이 센서 연구자·기술자의 의무라고 맺어요.</li></ul><p>[현업] 공장에 대입하면: 설비 센서 → PLC·게이트웨이 → 사내 네트워크 → SCADA·MES·Historian 서버 → 데이터 분석·AI. 슬라이드 2번의 '상황 인식 → 판단 지원 → 피드백' 중 '판단'이 데이터 센터·클라우드 쪽에서 일어나요.</p><p class='cap'>[원본 확인] 교재 본문은 'sensorlization'으로 적혀 있어요. 일반적인 철자는 sensorization이에요(1장 첫 그림도 Sensorization).</p>"}

add(6, { pages:"p.12, p.22 (1.1·1.3.8)", items:[
 {h:"1.3.8 선택성 (p.22)", b:"<ul><li>센서는 원하는 물리현상만 검출하고 다른 현상의 영향은 받지 않아야 해요. 그래서 <b>선택성은 다른 모든 특성보다 우선</b>하고, 선택성이 없는 센서는 센서라고 할 수 없다고 해요.</li><li>대부분 센서는 온도·습도의 영향을 받으므로 ① 센서 구조를 바꾸거나 ② 전자회로로 보상해 그 영향을 없애요.</li><li>습도·가스 센서처럼 특정 화학물질을 첨가해 선택성을 만들기도 해요.</li></ul>"},

add(8, { pages:"pp.11–13 (1.1)", items:[
 {h:"센서 기술과 원리별 분류 (p.12)", b:"<ul><li>측정대상에서 정보를 뽑아내는 데 관련된 소프트웨어·하드웨어 기술을 <b>센서 기술(sensor technology)</b>이라 해요.</li><li>변환 원리로 나누면 물리효과를 쓰는 <b>물리센서</b>, 화학효과를 쓰는 <b>화학센서</b>, 생체의 인식 능력을 쓰는 <b>바이오센서(biosensor)</b>가 있어요.</li><li>정보를 전기신호로 바꾸는 이유: <b>증폭, 귀환(feedback), 필터링(filtering), 미분, 저장</b> 같은 신호처리가 간단하고, <b>멀리 떨어진 곳까지 전송</b>할 수 있기 때문이에요.</li></ul>"},
 {h:"표 1.1 입력 에너지 6가지와 사람의 오감 (p.13)", b:"<table><tr><th>에너지 형태</th><th>센서가 이용하는 특성 예</th><th>대응하는 오감</th></tr><tr><td>역학적 (mechanical)</td><td>위치, 속도, 가속도, 힘, 토크, 압력, 변형, 유량, 질량, 밀도, 모멘트, 변위, 형상, 방위, 점도</td><td>청각, 촉각</td></tr><tr><td>복사 (radiant)</td><td>복사강도, 에너지, 파장, 진폭, 위상, 투과율, 편광</td><td>시각, 촉각</td></tr><tr><td>열 (thermal)</td><td>열, 온도, 열속(flux)</td><td>촉각</td></tr><tr><td>자기 (magnetic)</td><td>자계세기, 자기 모멘트, 투자율, 자속밀도</td><td>—</td></tr><tr><td>화학 (chemical)</td><td>농도, 반응율, 산화환원전위, 생물학적 특성</td><td>후각, 미각</td></tr><tr><td>전기 (electrical)</td><td>전압, 전류, 저항, 정전용량, 주파수</td><td>—</td></tr></table><p class='cap'>비전기적 에너지 5개 중 4개(역학·복사·열·화학)는 오감과 짝지을 수 있어요. 냄새·맛은 사람마다 차이가 있어 화학센서는 절대량 검출이 매우 어렵다고 해요. 슬라이드 그림의 '광'은 교재의 '복사(radiant)'에 해당해요.</p>"},
 {h:"트랜스듀서 vs 센서 vs 액추에이터 (p.13, 그림 1.2)", b:"<div class='flow'><span>입력신호</span>→<span class='hl'>입력 트랜스듀서<br><small>= 센서</small></span>→<span>신호처리기</span>→<span class='hl'>출력 트랜스듀서<br><small>= 액추에이터</small></span>→<span>출력신호</span></div><p>트랜스듀서는 한 에너지 형태를 다른 형태로 바꾸는 소자를 통틀어 부르는 말이에요. 비전기량을 전기신호로 바꾸는 입력 쪽이 <b>센서</b>, 전기신호를 다른 에너지로 바꾸는 출력 쪽이 <b>액추에이터(actuator)</b>예요. 둘의 차이는 '출력이 전기신호인가'로 정해지지만, 실제로는 두 용어를 같은 뜻으로 자주 써요.</p>"}
]},[
 {t:"mc", q:"[교재 p.13] 표 1.1에서 사람의 오감에 대응하는 감각이 '없는' 에너지 형태 두 가지는?",
  o:["자기 에너지, 전기 에너지","열 에너지, 화학 에너지","복사 에너지, 역학 에너지","역학 에너지, 자기 에너지"],
  e:"사람은 자기장이나 전압을 직접 느끼는 감각이 없어요. 그래서 자기센서·전기 측정이 특히 필요해요."},
 {t:"mc", q:"[교재 p.13] 그림 1.2의 계측 시스템에서 전기신호를 받아 모터를 돌리는 출력 쪽 트랜스듀서를 무엇이라 부르나요?",
  o:["액추에이터","센서","신호처리기","트랜스미터"],
  e:"입력 트랜스듀서 = 센서(비전기 → 전기), 출력 트랜스듀서 = 액추에이터(전기 → 다른 에너지)예요."}
]);

add(9, { pages:"pp.14–15 (1.2)", items:[
 {h:"센서 시스템과 신호조정 (p.14)", b:"<ul><li>센서는 혼자 동작하지 않고, 신호 조정기(signal conditioner)와 아날로그·디지털 신호처리 회로로 이루어진 큰 시스템의 일부예요. 이 시스템은 계측 시스템, 데이터 획득 시스템(data acquisition system), 공정 제어 시스템(process control system)일 수 있어요.</li><li>대부분 센서 출력은 <b>작은 전압·전류·저항 변화</b>라서 처리 전에 조정해야 해요. 기본 신호조정 기능: <b>증폭, 신호변환, 임피던스 변환, 선형화(linearization), 필터링</b>.</li><li>ADC로 디지털화한 뒤 마이크로컨트롤러/프로세서에서 <b>교정(calibration), 비직선성 수정(non-linearity correction), 오프셋 제거(offset elimination)</b>를 해요.</li></ul><p class='cap'>그림 1.3은 슬라이드 9번 그림과 같은 구조예요. 슬라이드 '보정(Correction)'을 교재는 '수정'으로, '외부 간섭요소'를 '외부교란인자'로 적었어요.</p>"},
 {h:"스마트(인텔리전트) 센서의 기능 (p.15)", b:"<ul><li>새로운 데이터의 취득·처리·저장: 측정하고 연산·통계 처리해 메모리에 저장</li><li>자동보상: 외부 파라미터 변화를 자동으로 보상</li><li>자기진단(self-diagnostics): 스스로 고장 여부 진단</li><li>의사결정(decision-making): 어떤 데이터를 보낼지 스스로 선택</li><li>통신(communications capability): 다른 센서와 정보 교환</li></ul>"},
 {h:"트랜스미터와 4–20 mA (p.15)", b:"<p>산업체의 <b>트랜스미터(transmitter)</b>는 4–20 mA 출력전류를 내는 센서 시스템이에요. 정보를 확도 손실 없이 먼 거리로 보내고, EMI/RFI 같은 전기적 잡음에 강해요. 다만 출력이 전류라 배터리 수명이 짧아질 수 있어요.</p><p>[현업] 공장 압력·온도 트랜스미터의 4–20 mA가 PLC 아날로그 입력 카드로 들어가 숫자가 되고, 그 값이 SCADA·Historian·MES로 올라가요.</p>"}
], num:[
 "[AI 보충] 0~100 ℃ 트랜스미터의 4–20 mA 환산: 스팬 = 20 − 4 = 16 mA",
 "50 ℃ → 4 + 16 × (50/100) = 4 + 8 = 12 mA,  75 ℃ → 4 + 16 × 0.75 = 16 mA",
 "거꾸로 읽기: 10 mA → (10 − 4) ÷ 16 × 100 = 37.5 ℃",
 "[AI 보충] 0 mA가 아니라 4 mA에서 시작하므로, 0 mA가 읽히면 '0 ℃'가 아니라 단선(고장)으로 판단할 수 있어요"
]},[
 {t:"mc", q:"[교재 p.15] 0~100 ℃ 범위의 4–20 mA 온도 트랜스미터가 75 ℃를 잴 때 출력 전류는?",
  o:["16 mA","15 mA","12 mA","18.75 mA"],
  e:"4 + 16 × 0.75 = 4 + 12 = 16 mA. 0 mA가 아니라 4 mA에서 시작한다는 점이 함정이에요(15 mA는 20 × 0.75)."},
 {t:"mc", q:"[교재 p.15] 센서가 스스로 고장 여부를 판단하는 스마트 센서 기능은?",
  o:["자기진단(self-diagnostics)","자동보상","의사결정","통신"],
  e:"자동보상은 외부 파라미터(온도 등) 변화를 보상하는 기능, 의사결정은 보낼 데이터를 고르는 기능이에요."}
]);

add(10, { pages:"p.15, p.21 (1.3·1.3.7)", items:[
 {h:"1.3 센서의 기본 특성 (p.15)", b:"<ul><li>센서 사양·특성에는 <b>국제 표준이 없고</b> 센서마다 형식이 달라서, 데이터 시트를 정확히 이해하는 것이 중요해요.</li><li>정특성: 입력이 시간적으로 변하지 않을 때 — 감도, 직선성, 히스테리시스, 선택성 등. 동특성: 시간에 따라 변할 때 — 응답시간, 주파수 특성.</li></ul><p class='cap'>슬라이드 목록(교정·감도·선형성·정확도·히스테리시스)과 조금 달라요. 교재는 선택성을 정특성에 넣고, 교정·정확도는 따로 다뤄요. 시험에서는 슬라이드 표현을 따르세요.</p>"},
 {h:"1.3.7 히스테리시스 (p.21, 그림 1.8)", b:"<ul><li>입력 x를 <b>늘려 가며</b> 잴 때와 <b>줄여 가며</b> 잴 때, 같은 입력 x₁에서 출력이 다른 현상이에요. 두 출력의 차 y₂ − y₁을 <b>히스테리시스 차</b>라고 해요.</li><li>히스테리시스 차는 입력 변화의 진폭과 입력 크기에 따라 달라져요.</li><li>FSO 대비 백분율로 나타내요: <span class='math'>히스테리시스 = (y₂ − y₁)/FSO × 100 %FS</span></li><li>원인은 센서 재료의 물리적 성질이에요. 특히 탄성재료, 강자성체, 강유전체를 쓰는 센서에서 중요해요.</li></ul><p class='cap'>그림 1.8: 아래쪽 곡선(→)이 입력을 올릴 때, 위쪽 곡선(←)이 내릴 때이고, 가운데 점선이 이상적인 직선이에요.</p>"}
], num:[
 "① FSO = 5 V,  같은 x₁에서 올릴 때 y₁ = 2.00 V, 내릴 때 y₂ = 2.05 V  [AI 보충·가정한 숫자]",
 "② 히스테리시스 차 = y₂ − y₁ = 2.05 − 2.00 = 0.05 V",
 "③ 히스테리시스 = 0.05 ÷ 5 × 100 = 1 %FS"
]},[
 {t:"mc", q:"[교재 p.21] FSO가 10 V인 압력 센서에서, 같은 압력에서 올릴 때 4.00 V, 내릴 때 4.20 V가 나왔다. 히스테리시스는?",
  o:["2 %FS","0.2 %FS","5 %FS","20 %FS"],
  e:"(4.20 − 4.00) ÷ 10 × 100 = 0.2 ÷ 10 × 100 = 2 %FS."},
 {t:"mc", q:"[교재 p.21] 히스테리시스가 특히 중요해지는 센서 재료가 아닌 것은?",
  o:["순수 저항 금속선(이상적인 경우)","탄성재료","강자성체","강유전체"],
  e:"교재는 탄성재료·강자성체·강유전체를 쓰는 센서에서 재료 자체 때문에 생기는 히스테리시스가 중요하다고 했어요."}
]);

add(11, { pages:"p.16 (1.3.1)", items:[
 {h:"1.3.1 전달함수와 감도 (p.16, 그림 1.4)", b:"<ul><li><b>전달함수(transfer function)</b>: 센서의 물리적 입력신호와 출력신호 사이의 함수 관계. 방정식, 테이블, 그래프로 나타내요.</li><li>이상적인 센서는 입출력이 원점을 지나는 직선이라 <span class='math'>y = Sx</span>이고, 그 기울기 S가 감도예요: <span class='math'>S = 출력량/입력량 = Δy/Δx</span>.</li><li>'감도가 높다' = 작은 입력 변화에 큰 출력 변화가 얻어진다는 뜻이에요.</li></ul><p class='cap'>슬라이드의 교정 직선 y = ax + b에서 b = 0인 이상적인 경우가 교재의 y = Sx예요. 그림 1.4의 동작범위는 −x_min ~ +x_max예요(21번 FS와 연결).</p>"}
]});

add(12, { pages:"pp.16–17, p.19 (1.3.1·1.3.5)", items:[
 {h:"비선형 전달함수 (pp.16–17)", b:"<ul><li>입출력 관계가 비선형이면 기울기가 입력값에 따라 변하므로, <b>특정 입력값 x₀에 대해서만</b> 감도를 정의할 수 있어요: <span class='math'>S = dy(x₀)/dx</span> (슬라이드의 순간 감도).</li><li>실제로 많은 센서는 비선형이에요. 그래서 ① 제한된 동작범위 안에서 선형으로 보거나, ② 비선형 전달함수를 <b>몇 개의 직선으로 모델링</b>해요. 비선형 센서의 직선화 기술은 센서 개발에서 매우 중요해요.</li></ul>"},
 {h:"비선형 센서의 교정 (p.19)", b:"<p>비선형 센서는 수학적 모델에 따라 2점 이상의 측정치가 필요해요. 또 다른 방법은 교정곡선을 여러 작은 <b>섹션으로 나누고 각 섹션을 직선으로 보아 섹션마다 a, b를 구한 뒤</b>, 교정곡선을 여러 직선의 묶음(직선군)으로 나타내는 거예요.</p><p class='cap'>슬라이드 오른쪽 '매듭' 그림이 바로 이 방법(구간별 직선)과 일치해요.</p>"}
]});

add(13, { pages:"pp.25–26 (1.3.12)", items:[
 {h:"1.3.12 환경의 영향과 드리프트 (p.25, 그림 1.12)", b:"<ul><li>온도·습도처럼 성능에 영향을 주는 외부 변수를 <b>환경 파라미터(environmental parameter)</b>라고 해요.</li><li>시간·온도 등 때문에 감도나 출력 레벨이 변하는 것을 센서 특성의 <b>불안정성 또는 드리프트(drift)</b>라고 해요.</li><li>(a) 특성곡선이 a → b로 기울기가 바뀌는 것 = <b>감도 오차(감도 드리프트)</b>. 정격입력(100 %FS)에서 온도 때문에 생긴 출력 변화 = <b>온도 스팬 오차(span error)</b>.</li><li>(b) 입력이 0인데 출력이 0이 아닌 것 = <b>오프셋 또는 영점 드리프트(zero drift)</b>. 기울기는 같고 c만큼 위로 평행이동해요.</li><li>(c) 두 드리프트가 함께 생기면 <b>총오차</b>가 더 커져요.</li></ul>"},
 {h:"그 밖의 환경 요인 (pp.25–26)", b:"<ul><li>반도체 센서는 온도 의존성이 매우 커서 온도 보상이 꼭 필요해요. 광센서는 온도에 따른 굴절율 변화, 정전용량형 센서는 유전율 변화가 문제예요.</li><li>상대 변위를 쓰는 센서는 진동의 영향을 받아요(출력 변동, 지지부 탈락, 영구 변형, 리드선 단선).</li><li>전원전압 변동 → 감도 변화·드리프트, 소자 자체의 주울 열 → 열적 드리프트.</li></ul>"}
]},[
 {t:"mc", q:"[교재 p.25] 압력을 전혀 가하지 않았는데 센서 출력이 0.2 V로 나오고, 기울기는 원래와 같다. 어떤 드리프트일까요?",
  o:["오프셋(영점) 드리프트","감도 드리프트","온도 스팬 오차만","히스테리시스"],
  e:"입력 0에서 출력이 0이 아니고 기울기는 같으니 직선이 평행이동한 영점 드리프트(그림 1.12 b)예요."}
]);

add(14, { pages:"p.17, p.24 (1.3.3·1.3.10)", items:[
 {h:"1.3.3 분해능 (p.17)", b:"<ul><li>Δx가 작아지면 Δy도 작아져서, 결국 입력이 변해도 출력 변화를 식별할 수 없게 돼요(Δy = 0). 이때의 입력 크기 Δx가 분해능(resolution), 즉 검출 가능한 최소입력증분이에요.</li><li>원인은 두 가지: ① 입력 변화분이 센서 내부에서 <b>흡수</b>되어 출력에 나타나지 않는 경우, ② 센서 내부의 <b>잡음(noise)</b>.</li><li>분해능은 작을수록 좋아요. 아날로그 센서는 0.1 %/FS 정도이고, 디지털 센서는 <b>비트(bit)</b>로 정해져요: 12 bit → <span class='math'>1/2¹² = 1/4096 = 0.024 %/FS</span>.</li></ul>"},
 {h:"1.3.10 잡음 (p.24)", b:"<ul><li>잡음은 원하지 않는 불규칙한 신호예요. 원리적으로 없앨 수 없는 것도 있고, 전원 리플(ripple)·진동 같은 환경 변동 때문인 것도 있어요.</li><li>입력 변화(Δx)에 대한 응답(Δy)이 잡음레벨 이하가 되면 오차가 생겨요.</li><li>감도가 높으면 작은 신호도 잡을 수 있지만, 잡음이 커지면 감도가 높아도 <b>측정 하한(lower limit)</b>이 나빠져요. 그래서 <b>신호대 잡음비(S/N ratio)</b>를 높여(필터 등) 검출 하한을 개선해요.</li></ul>"}
], num:[
 "① 12 bit: 2¹² = 4096칸 → 1/4096 = 0.000244 = 0.0244 %FS",
 "② 0~100 ℃ 센서라면 한 칸 = 100 ℃ × 0.000244 ≈ 0.0244 ℃",
 "③ 10 bit: 2¹⁰ = 1024칸 → 1/1024 ≈ 0.000977 ≈ 0.098 %FS (12 bit보다 4배 거칢)"
]},[
 {t:"mc", q:"[교재 p.17] 10 bit 디지털 센서의 분해능(%FS)은 대략?",
  o:["0.098 %FS","0.024 %FS","1 %FS","0.01 %FS"],
  e:"1/2¹⁰ = 1/1024 ≈ 0.000977 = 0.098 %FS. 0.024 %FS는 12 bit예요."},
 {t:"mc", q:"[교재 p.24] 감도는 그대로인데 잡음이 커졌다. 측정 하한은?",
  o:["나빠진다(더 큰 입력부터 검출)","좋아진다","변하지 않는다","감도가 커진다"],
  e:"잡음레벨 아래의 응답은 구분이 안 되니, 잡음이 크면 검출 가능한 최소 입력이 커져요. S/N비를 높이는 필터가 대책이에요."}
]);

add(15, { pages:"p.19 (1.3.5)", items:[
 {h:"1.3.5 교정 (p.19, 그림 1.6)", b:"<ul><li>교정(calibration) = 센서에 <b>기지의 입력 값(known value)</b>을 넣어 출력을 측정하는 과정. 이때 쓰는 기지의 입력 값을 <b>표준(standard)</b>이라고 해요.</li><li>교정으로 입력-출력 관계가 수립되고, 그 곡선이 교정 곡선(calibration curve)이에요.</li><li>교정은 시간이 오래 걸려서, 제조비용을 줄이려면 <b>교정점을 가능한 한 최소화</b>하는 것이 매우 중요해요.</li><li>그래서 센서 특성의 <b>직선성</b>이 교정을 쉽게 하는 가장 중요한 요소예요(직선이면 적은 점으로도 관계를 정할 수 있으니까요).</li></ul>"}
]},[
 {t:"mc", q:"[교재 p.19] 교재가 '센서 교정을 쉽게 하는 데 가장 중요한 요소'로 든 특성은?",
  o:["직선성","응답시간","히스테리시스","선택성"],
  e:"직선이면 두세 점만으로 교정 관계를 정할 수 있어 교정점을 줄일 수 있어요."}
]);

add(21, { pages:"p.17, pp.20–21 (1.3.2·1.3.6)", items:[
 {h:"1.3.2 동작범위와 풀 스케일 (p.17)", b:"<ul><li>의미 있는 출력을 내는 최대입력과 최소입력 사이 범위 = <b>동작범위(operating range)</b> 또는 <b>스팬(span)</b>. 이것을 <b>입력 풀 스케일(input full scale, FS)</b> 또는 full-scale range라고도 해요.</li><li>출력 쪽은 <b>풀 스케일 출력(FSO)</b> = 최대 입력 시 출력 y_max와 최소 입력 시 출력 −y_min 사이의 대수적 차이예요.</li><li>(+)범위와 (−)범위가 다른 경우가 많고, x_min이 0이면 스팬은 0 ~ +x_max예요. 정격입력·정격출력이라는 말도 함께 써요.</li></ul>"},
 {h:"1.3.6 비직선성 (pp.20–21, 그림 1.7)", b:"<ul><li>교재는 이 양을 <b>비직선성(nonlinearity)</b>이라고 부르고, 식은 슬라이드 21번과 같아요: 최대출력편차/정격출력 × 100 %FS (또는 입력 기준).</li><li>가장 간단한 방법은 <b>두 종점을 연결한 직선</b>을 기준으로 삼는 것이고, 널리 쓰는 또 하나는 <b>최소자승법으로 구한 BFSL(best fit straight line)</b>에서 실측곡선이 벗어난 정도를 계산하는 거예요(그림 1.7 b: 비직선성 ±0.2 %FS).</li><li>입력이 허용한계를 넘으면 출력이 포화되어 직선성을 잃으므로 동작범위의 상한(정격)을 정해요.</li><li>센서소자가 직선이 아니면 변환회로로 전체 직선성을 맞추고, 반대로 소자가 좋아도 변환회로·증폭기가 나쁘면 전체 직선성이 나빠져요.</li></ul><p class='cap'>용어 차이: 교재 '직선성/비직선성' = 슬라이드 '선형성'. 시험에서는 슬라이드 표현을 따르세요.</p>"}
], num:[
 "① [AI 보충·가정] 최소 입력에서 출력 −2 V, 최대 입력에서 +8 V",
 "② FSO = 8 − (−2) = 10 V (대수적 차이 → 빼기)",
 "③ 최대출력편차 0.02 V → 비직선성 = 0.02 ÷ 10 × 100 = 0.2 %FS (그림 1.7 b의 ±0.2 %FS 수준)"
]},[
 {t:"mc", q:"[교재 p.17] 최소 입력에서 출력 −1 V, 최대 입력에서 +4 V인 센서의 FSO는?",
  o:["5 V","4 V","3 V","−5 V"],
  e:"FSO는 y_max와 −y_min의 대수적 차이: 4 − (−1) = 5 V."}
]);

add(24, { pages:"pp.20–21 (1.3.6)", items:[
 {h:"기준직선을 무엇으로 잡나 (pp.20–21)", b:"<p>교재는 비직선성의 기준직선으로 ① 두 종점을 잇는 직선, ② 최소자승법 BFSL 두 가지를 소개해요. 슬라이드 24번은 선형성을 '이상적인 기준직선(참값에서 기대되는 직선)', R²을 '데이터로 구한 회귀직선'에 대해 평가한다고 구분해요.</p><p class='cap'>그래서 BFSL을 기준으로 비직선성을 계산하면 R²과 같은 회귀직선을 쓰지만, 여전히 단위(%FS vs 없음)와 보는 값(최대편차 vs 설명력)은 달라요 [AI 보충].</p>"}
]});

add(25, { pages:"pp.18–19 (1.3.4)", items:[
 {h:"반복성·재현성과 정도 (p.18)", b:"<ul><li>반복성·재현성 정의는 슬라이드와 같아요(동일조건·단기간 / 장기간·다른 사람·다른 실험실).</li><li><b>정도(精度, precision)</b>는 측정의 반복성이나 재현성의 척도예요.</li><li>재현성을 좋게 유지하려면 센서를 정기적으로 <b>검사·교정·보수</b>해야 해요.</li></ul>"},
 {h:"그림 1.5 확도와 정도의 차이 (p.19)", b:"<table><tr><th></th><th>측정값(×) 분포</th><th>평균 vs 참값</th><th>판정</th></tr><tr><td>(a)</td><td>넓게 퍼짐</td><td>평균 = 참값</td><td>확도 높음, 정도 나쁨</td></tr><tr><td>(b)</td><td>좁게 모임</td><td>평균이 참값과 멂</td><td>정도 좋음, 확도 나쁨</td></tr></table><p class='cap'>쉽게: 확도 = '평균이 정답에 가까운가', 정도 = '값들끼리 서로 가까운가'.</p>"}
]},[
 {t:"mc", q:"[교재 p.19] 10번 측정한 값이 서로 매우 비슷한데, 평균이 참값보다 5 % 높다. 맞는 판정은?",
  o:["정도는 좋고 확도는 나쁘다","확도는 높고 정도는 나쁘다","둘 다 좋다","둘 다 나쁘다"],
  e:"값끼리 가까우니 정도(precision) 좋음, 평균이 참값에서 머니 확도(accuracy) 나쁨 — 그림 1.5 (b) 경우예요."},
 {t:"sa", q:"[교재 p.19] 확도(정확도)와 정도의 차이를 그림 1.5를 예로 설명해 보세요.",
  m:"확도는 측정값의 평균이 참값에 얼마나 가까운지, 정도는 측정값들이 서로 얼마나 가깝게 모이는지(반복성·재현성)이다. (a)는 평균이 참값과 일치하지만 넓게 퍼져 확도는 높고 정도는 나쁘며, (b)는 좁게 모였지만 평균이 참값에서 멀어 정도는 좋고 확도는 나쁘다.",
  p:["확도 = 평균과 참값의 근접","정도 = 값들끼리의 근접(반복성·재현성)","(a)·(b) 사례 구분"]}
]);

add(26, { pages:"p.18 (1.3.4)", items:[
 {h:"교재의 오차 정의 (p.18)", b:"<ul><li>확도(確度, accuracy)는 출력이 참값에 얼마나 가까운지의 척도이고, 실제로는 <b>부정확도(inaccuracy), 즉 오차(error)</b>로 나타내요.</li><li>절대 오차: 참값과 측정값 사이 최대 편차 <span class='math'>|xₘ − xₜ|</span></li><li>상대(백분율) 오차: <span class='math'>ε = (xₘ − xₜ)/xₘ × 100 %</span> … (1.4a)</li><li>정격출력(FSO) 기준: <span class='math'>ε = (xₘ − xₜ)/FSO × 100 %</span> … (1.4b)</li><li>예: 입력 FS 100 kPa, FSO 10 Ω 압력 센서의 오차를 ±0.5 %, ±500 Pa, ±0.05 Ω 등으로 표현해요.</li></ul><div class='warnbox'>[원본 확인] <b>기호가 슬라이드와 반대예요.</b> 교재: xₘ = 참값(실제 입력), xₜ = 측정값 / 슬라이드 26번: xm = 측정값, xt = 참값. 두 식 모두 '참값으로 나눈다'는 뜻은 같아요. 시험에서는 슬라이드 기호(xm = 측정, xt = 참)를 따르세요. 교재는 '확도', 슬라이드는 '정확도'라고 불러요.</div>"}
], num:[
 "① 교재 예: 입력 FS 100 kPa의 ±0.5 % = 100 kPa × 0.005 = 0.5 kPa = ±500 Pa (1 kPa = 1000 Pa)",
 "② 같은 센서 FSO 10 Ω의 ±0.5 % = 10 Ω × 0.005 = ±0.05 Ω",
 "③ FSO 기준 오차: FSO 10 V, 측정 오차 0.05 V → 0.05 ÷ 10 × 100 = 0.5 %FSO"
]},[
 {t:"mc", q:"[교재 p.18] 입력 풀 스케일 200 kPa인 압력 센서의 오차가 ±0.25 %FS이다. Pa로 바꾸면?",
  o:["±500 Pa","±50 Pa","±5000 Pa","±0.5 Pa"],
  e:"200 kPa × 0.0025 = 0.5 kPa = 500 Pa."}
]);

add(28, { pages:"p.15 (1.3)", items:[
 {h:"정특성 ↔ 동특성 정리 (p.15)", b:"<p>교재 분류: 정특성 = 감도·직선성·히스테리시스·선택성, 동특성 = 응답시간·주파수 특성. 히스테리시스의 정의와 식은 10번의 📖 교재 보충에 있어요.</p>"}
]});

add(29, { pages:"pp.22–23 (1.3.9)", items:[
 {h:"1.3.9 동특성과 시간응답 (pp.22–23, 그림 1.9)", b:"<ul><li>동특성 = 입력을 갑자기 바꿀 때의 <b>시간응답(과도) 특성</b> + 입력을 정현적으로 바꿀 때의 <b>주파수 응답 특성</b>.</li><li>출력은 즉시 변하지 못하고 시간 지연이 생겨요. 응답시간은 보통 입력으로 <b>계단함수(step function)</b>를 넣어 측정해요.</li><li>상승시간 t_r: 포화값의 <b>90 %</b>에 도달하는 시간.</li><li>시정수 τ: 포화값의 <b>63 %</b>에 도달하는 시간. 시간응답이 <b>순수한 지수함수일 때만</b> 정의할 수 있어요.</li><li>감쇠(하강)시간 t_d: 출력이 포화값의 <b>10 % 또는 37 %</b>로 떨어지는 데 걸리는 시간(그림 1.9 b).</li><li>실제 계단응답은 지수함수가 아닌 경우가 많아 센서 종류·제조사마다 응답시간 정의가 달라요. 예: <b>t₀.₅</b>를 응답시간으로 쓰는 회사도 있어요 → 데이터시트 확인 필요.</li></ul><p class='cap'>용어 차이: 슬라이드는 90 % 도달 시간을 '응답시간', 교재는 '상승시간 t_r'이라고 불러요. 슬라이드의 회복시간(recovery time)은 교재의 감쇠시간 t_d에 해당하는 개념으로 보여요 [추정]. 시험에서는 슬라이드 표현을 따르세요.</p>"}
], num:[
 "① 포화 출력 4.0 V, 기준 0 V [AI 보충·가정]",
 "② 감쇠시간 기준 10 % = 0.1 × 4.0 = 0.4 V → 입력 제거 후 출력이 0.4 V로 떨어지는 시간 = t_d",
 "③ 37 % 기준이면 0.37 × 4.0 = 1.48 V (37 % ≈ e⁻¹ = 0.368, 시정수와 같은 지점)"
]},[
 {t:"mc", q:"[교재 p.23] 시정수 τ를 '정의할 수 있는' 조건은?",
  o:["시간응답이 순수한 지수함수일 때","입력이 정현파일 때","출력이 포화되지 않을 때","히스테리시스가 있을 때"],
  e:"63 % 지점이 의미를 갖는 건 1 − e⁻¹ 꼴의 순수 지수 응답일 때뿐이에요. 그래서 실제 센서는 회사마다 응답시간 정의가 달라요."}
]);

add(30, { pages:"p.23 (1.3.9, 그림 1.10)", items:[
 {h:"주파수 응답특성과 차단주파수 (p.23)", b:"<ul><li>입력을 정현적(sin·cos)으로 바꾸며 입력 주파수에 따른 출력 변화를 보는 것이 주파수 응답특성이에요.</li><li>입력 주파수가 어느 이상 높아지면 출력이 입력 변화를 따라가지 못하고 줄어들기 시작해요.</li><li>출력이 <b>−3 dB</b>(진폭비 <b>0.707</b>)만큼 떨어지는 주파수를 <b>응답 주파수(흔히 차단 주파수)</b>라고 해요.</li><li>특정 주파수에서 입력 저하 때문에 생기는 오차를 <b>동적 오차(dynamic error) δ(ω)</b>라고 해요 — 그 주파수에서 입력 진폭을 얼마나 잘 재현하는지의 척도예요.</li></ul><p class='cap'>[AI 보충] 슬라이드 30번은 '구동 주파수가 다른 센서끼리 상대 변화량(Δf/f₀)으로 비교하라'는 내용이고, 교재의 주파수 응답은 '입력 신호가 빨리 변할 때 출력이 따라오는 정도'예요. 같은 '주파수 특성'이라는 이름 아래 서로 다른 관점이에요.</p>"}
], num:[
 "① dB(데시벨) 진폭비: 20 × log₁₀(진폭비)",
 "② 20 × log₁₀(0.707) = 20 × (−0.1505) ≈ −3.0 dB",
 "③ 입력 진폭 1 V → 차단주파수에서 출력 진폭 ≈ 0.707 V,  [AI 보충] 전력으로는 0.707² ≈ 0.5 (절반)"
]},[
 {t:"mc", q:"[교재 p.23] 차단 주파수에서 출력 진폭은 저주파 때의 약 몇 배인가요?",
  o:["0.707배 (−3 dB)","0.5배 (−3 dB)","0.63배","0.9배"],
  e:"−3 dB = 진폭비 0.707이에요. 0.5는 전력비(0.707²)이고, 0.63은 시정수, 0.9는 상승시간 기준이에요."}
]);

add(31, { pages:"p.24 (1.3.11)", items:[
 {h:"1.3.11 출력 임피던스 (p.24, 그림 1.11)", b:"<ul><li>센서와 전자회로를 연결할 때 센서 출력이 입력회로에 잘 전달되려면 센서의 <b>출력 임피던스(output impedance) Z_o</b>를 알아야 해요.</li><li>(a) <b>전압 출력</b> 센서: Z_o가 회로 입력 임피던스 Z_i와 <b>직렬</b> → V = V_s가 되려면 <b>Z_o는 작고 Z_i는 가능한 한 커야</b> 해요.</li><li>(b) <b>전류 출력</b> 센서: Z_o가 회로에 <b>병렬</b> → I = I_s가 되려면 <b>Z_o는 가능한 한 크고 Z_i는 작아야</b> 해요.</li></ul><table><tr><th>목적</th><th>조건</th><th>근거</th></tr><tr><td>신호(전압) 왜곡 최소</td><td>Z_o ≪ Z_i (전압 출력)</td><td>교재 1.3.11</td></tr><tr><td>부하 전력 최대</td><td>R_L = R_S (임피던스 매칭)</td><td>슬라이드 31·32</td></tr></table><p class='cap'>[AI 보충] 측정 회로에서는 보통 '전압을 정확히 읽는 것'이 목적이라 Z_i를 크게, 고주파 신호 전달·안테나처럼 '전력을 최대로 보내는 것'이 목적이면 매칭을 써요. 목적에 따라 조건이 달라요.</p>"}
], num:[
 "[AI 보충] 전압 분배: V = V_s × Z_i/(Z_o + Z_i)",
 "① Z_o = 1 kΩ, Z_i = 1 MΩ → V = V_s × 1,000,000/1,001,000 ≈ 0.999 V_s (전압 99.9 % 전달)",
 "② Z_o = 1 kΩ, Z_i = 1 kΩ(매칭) → V = V_s × 1000/2000 = 0.5 V_s (전압은 절반, 대신 부하 전력이 최대)"
]},[
 {t:"mc", q:"[교재 p.24] 출력 임피던스가 작은 전압 출력 센서를 측정 회로에 연결할 때, 측정 회로 입력 임피던스 Z_i는?",
  o:["가능한 한 크게","센서 Z_o와 같게","가능한 한 작게","0으로"],
  e:"직렬로 나뉘는 전압 분배에서 Z_i가 클수록 V가 V_s에 가까워져요. Z_o와 같게(매칭) 하면 전압은 절반이 돼요."},
 {t:"sa", q:"[교재 p.24·슬라이드 31] '전압 출력 센서는 Z_i를 크게'와 '최대 전력 전달은 R_L = R_S'가 서로 모순이 아닌 이유를 설명해 보세요.",
  m:"목적이 다르기 때문이다. 센서 측정에서는 센서 전압을 왜곡 없이 읽는 것이 목적이므로 Z_o ≪ Z_i로 해서 V ≈ V_s가 되게 한다. 임피던스 매칭(R_L = R_S)은 부하에 전달되는 전력을 최대로 하려는 조건이며, 이때 부하 전압은 V_s의 절반이 된다.",
  p:["목적 차이(전압 정확도 vs 전력 최대)","Z_o ≪ Z_i → V ≈ V_s","매칭 시 전압은 절반, 전력 최대"]}
]);

window.NOTE.titles[34] = "교재 부록 — 1.4 센서의 분류";
S[34] = {
  appendix: true,
  one: "슬라이드에는 없는 교재 1.4절 내용이에요 — 센서를 전원 공급 유무, 출력 형식, 검출대상, 재료, 변환현상, 용도로 나눠 봐요.",
  talk: [
    "예를 들어 도서관 책을 '저자별', '주제별', '출판연도별'로 각각 정리할 수 있듯이, 센서도 보는 관점에 따라 여러 방식으로 나눠요. 표준화된 하나의 분류법은 없어요.",
    "가장 헷갈리는 건 전원 공급 유무에 따른 분류예요. 외부 전원을 받아 동작하는 변조형(능동형)과, 측정 대상에서 에너지를 얻어 스스로 신호를 만드는 자기발전형(수동형)이 있어요. 책마다 능동·수동을 반대로 부르기도 해서 교재도 주의를 줘요.",
    "출력 형식으로는 아날로그·디지털, 변환현상으로는 역학·전자기·광·온도·화학 센서로 나눠요. 이 과목의 주차별 센서(가스, 자기, 속도, 가속도, 자이로, 초음파, 바이오)를 이 표에 대입해 보면 전체 지도가 생겨요 [AI 보충]."
  ],
  sum: "정리하면: 센서는 동작 에너지 공급 유무(변조형 modulating/능동형 active vs 자기발전형 self-generating/수동형 passive), 출력신호(아날로그 analog vs 디지털 digital), 검출대상, 센서재료, 변환현상(역학·전자기·광·온도·화학), 용도에 따라 분류해요.",
  book: { pages:"pp.26–30 (1.4)", items:[
   {h:"1.4.1 동작 에너지 공급 유무 (pp.26–27, 그림 1.13)", b:"<table><tr><th></th><th>변조형 센서 (능동형)</th><th>자기발전형 센서 (수동형)</th></tr><tr><td>영문</td><td>modulating / active sensor</td><td>self-generating / passive sensor</td></tr><tr><td>전원</td><td>외부에서 보조전원 공급</td><td>외부 전원 불필요</td></tr><tr><td>출력 전력</td><td>대부분 외부 전원에서 얻음. 입력은 출력을 '제어'만 함</td><td>입력(측정대상)에서 얻음</td></tr><tr><td>특징</td><td>공급전원전압으로 전체 감도를 바꿀 수 있음. 전선이 더 많음. 폭발성 분위기에서 보조전원은 폭발 위험 증가</td><td>배선 간단</td></tr><tr><td>예</td><td>포토트랜지스터, 서미스터</td><td>포토다이오드, 열전대</td></tr></table><div class='warnbox'>[원본 확인] 저자에 따라 변조형을 '수동형', 자기발전형을 '능동형'으로 반대로 부르기도 해요. 교재는 혼동을 피하려고 능동·수동이라는 말을 쓰지 않는다고 밝혀요. 시험에서는 슬라이드·교수님 표현을 따르세요.</div>"},
   {h:"1.4.2 출력신호 형식 (p.27)", b:"<ul><li><b>아날로그 센서</b>: 출력이 연속적으로 변하는 신호이고, 보통 정보는 출력의 진폭에 들어 있어요. 대부분의 센서가 아날로그예요. 출력이 가변주파수인 센서는 디지털 변환이 쉬워 <b>준 디지털 센서(quasi-digital sensor)</b>라고도 해요.</li><li><b>디지털 센서</b>: 전송이 쉽고 재현성·신뢰성이 높고 더 정확한 경우가 많아요. 예: 로터리 인코더. 소자 자체가 디지털인 경우는 드물고 대부분 ADC를 조합해요.</li><li>여기까지는 학술적 분류이고, 산업계는 아래의 특수성에 따른 분류를 더 선호해요.</li></ul>"},
   {h:"1.4.3 검출대상 (pp.27–28, 표 1.2)", b:"<p>검출대상은 '수(number)'부터 '혈당'까지 물리·화학·생물학적 양이고, 1차원부터 3차원까지 있어서 한 양을 재려고 여러 센서를 쓰기도 해요.</p><table class='wide'><tr><th>수</th><th>위치</th><th>변형</th><th>유속</th><th>성분조성</th><th>입자</th><th>열량</th><th>유해·유독가스</th></tr><tr><td>길이</td><td>레벨</td><td>압력</td><td>속도·가속도</td><td>수분</td><td>비중밀도</td><td>온도</td><td>맛</td></tr><tr><td>면</td><td>직선변위</td><td>토크</td><td>음파</td><td>이온농도</td><td>탐상</td><td>화재</td><td>냄새</td></tr><tr><td>입체</td><td>회전변위</td><td>유량</td><td>진동</td><td>탁도</td><td>습도</td><td>연기</td><td>혈당</td></tr></table><p class='cap'>[추정] 표 1.2는 열 제목과 아래 항목이 꼭 같은 분류로 묶여 있지는 않아 보여요(예: '유해·유독가스' 아래 맛·냄새·혈당). 검지 대상 32개를 격자로 나열한 표로 보면 돼요.</p>"},
   {h:"1.4.4 센서재료 (p.28, 표 1.3)", b:"<table><tr><th>재료</th><th>대표 센서 예</th></tr><tr><td>금속</td><td>RTD, 스트레인 게이지, 로드셀, 열전대</td></tr><tr><td>반도체</td><td>홀 소자, 반도체 압력센서, 가속도센서, 포토다이오드, CCD</td></tr><tr><td>세라믹</td><td>습도센서, 서미스터, 가스센서, 압전센서, 산소센서</td></tr><tr><td>광섬유</td><td>온도·레벨·압력·변형센서</td></tr><tr><td>유전체</td><td>초전형 센서, 온도센서</td></tr><tr><td>고분자</td><td>습도센서, 압전 센서, 초음파 센서</td></tr><tr><td>생체 물질</td><td>혈당센서, 면역센서, DNA센서, 기타 바이오센서</td></tr><tr><td>복합 재료</td><td>PZT 압전 센서, 고분자-나노 복합 센서</td></tr></table><ul><li>반도체는 가장 많이 쓰여 왔고, 반도체 기술 + 마이크로머시닝(micromachining)을 합친 <b>MEMS</b> 센서(실리콘 압력, 가속도, 자이로스코프, 유량, 마이크로 가스 센서)가 개발되고 있어요.</li><li>세라믹은 내식성·내열성·내마모성이 뛰어나고, 광섬유 센서는 전자유도 외란 같은 전기신호 센서의 문제를 피하려고 연구되기 시작했어요.</li></ul>"},
   {h:"1.4.5 변환현상 (p.29, 표 1.4)", b:"<table><tr><th>분류</th><th>대표 센서</th><th>이 과목 주차 [AI 보충]</th></tr><tr><td>역학센서</td><td>근접, 회전각, 레벨, 속도, 가속도, 진동, 하중, 압력, 유량</td><td>Week 5 속도, Week 6 가속도·진동, Week 7 자이로, Week 9 초음파</td></tr><tr><td>전자기센서</td><td>홀 센서, 자기저항(MR), GMR, TMR</td><td>Week 3·4 자기센서</td></tr><tr><td>광센서</td><td>포토다이오드, 포토트랜지스터, 적외선, 자외선, 광전관, 이미지센서(CCD·CMOS)</td><td>—</td></tr><tr><td>온도센서</td><td>열전대, RTD, NTC/PTC 서미스터, IC온도센서, 광 고온계</td><td>—</td></tr><tr><td>화학센서</td><td>가스, 습도, 이온, 바이오센서(효소, 면역)</td><td>Week 2 가스, Week 13 바이오</td></tr></table><ul><li>역학센서는 공장 자동화의 핵심으로 <b>기계량</b>(거리·위치·회전각·근접·속도·가속도·하중·토크)과 <b>유체량</b>(압력·유량·유속·점도·밀도) 센서로 나뉘어요.</li><li>온도센서는 가장 많이 쓰이는 센서 중 하나예요. 자기센서는 홀 효과·자기저항효과가 주류이고, 비접촉으로 유속·유량·변위·전류·온도·두께·레벨을 재요. 최근엔 GMR·TMR 고감도 자기센서가 자동차 등에 쓰여요.</li><li>광센서는 검출파장에 따라 가시광선·적외선·자외선·방사선 센서로 나뉘고, 화학센서 중 혈당 센서가 대표적인 바이오센서이며 가장 큰 시장을 이루고 있어요.</li></ul>"},
   {h:"1.4.6 용도 (p.30)", b:"<p>산업용, 민생용, 연구용, 의료용, 군사용 등으로 나누고, 더 구체적으로는 자동차용, 로봇용, 방재용으로도 나눠요. <b>산업용</b>은 더 높은 확도를, <b>자동차용</b>은 혹독한 환경 때문에 훨씬 넓은 동작온도 범위와 내구성을 요구해요.</p><p>[현업] 공장 설비용 센서를 고를 때 데이터시트에서 '확도(정확도)'와 '동작온도 범위·보호등급'을 먼저 보는 이유예요.</p>"}
  ]},
  review: {

    exam: "센서는 외부 전원이 필요한 변조형과 측정대상에서 에너지를 얻는 자기발전형, 아날로그와 디지털, 검출대상·재료·변환현상(역학·전자기·광·온도·화학)·용도 등 여러 관점으로 분류한다.",

<script>(function(){
"use strict";
const N = window.NOTE, FIGS = window.FIGS, W = N.week;
const PW = 1287, PH = 910;
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;");
const pad = n => String(n).padStart(2,"0");
// tags: [AI 보충] [추정] [원본 확인] [현업]
const tagify = h => String(h)
  .replace(/\[교재([^\]]*)\]/g,'<span class="tag bk">교재$1</span>')
  .replace(/\[AI 보충([^\]]*)\]/g,'<span class="tag ai">AI 보충$1</span>')
  .replace(/\[추정([^\]]*)\]/g,'<span class="tag gs">추정$1</span>')
  .replace(/\[원본 확인\]/g,'<span class="tag wn">원본 확인</span>')
  .replace(/\[현업\]/g,'<span class="tag wk">현업</span>');
const T = s => tagify(esc(s));
const sref = n => `<button class="sref" data-go="${n}">${n}</button>`;
const srefs = a => a.map(sref).join("");

/* ---------- storage (account → browser fallback) ---------- */
const LAST = N.total + (N.slides[N.total+1] ? 1 : 0);
const LSP = "sensorNote:"+W+":";          // localStorage key prefix (keep stable)
const state = {};                          // key "s07" -> {star,q,memo,t}
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)||"null"); } catch(e){ return null; } };
const lsSet = (k,v) => { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch(e){ return false; } };
for (let n=1;n<=LAST;n++){ const k="s"+pad(n); state[k] = lsGet(LSP+k) || {star:false,q:false,memo:"",t:0}; }
let col = null; const timers = {}, chains = {};
function setStatus(t){ const e=$("#save"); const cls = t.startsWith("☁")?"db":(t.startsWith("💾")?"local":"");
  e.className = "savest "+cls;
  e.textContent = cls==="db" ? "저장: 계정(db) ✓" : cls==="local" ? (t.includes("실패")?"저장: 브라우저 (계정 실패)":"저장: 브라우저") : "저장: 확인 중";
  e.title = t; }
function save(k){
  state[k].t = Date.now();
  lsSet(LSP+k, state[k]);
  if (!col) return;
  clearTimeout(timers[k]);
  timers[k] = setTimeout(()=>{
    const body = Object.assign({}, state[k]);
    chains[k] = (chains[k]||Promise.resolve()).then(()=>col.doc(W+"-"+k).set(body))
      .then(()=>setStatus("☁ 계정에 저장됨"))
      .catch(()=>setStatus("💾 브라우저에만 저장 (계정 저장 실패)"));
  }, 700);
}
async function initCloud(){
  setStatus("… 확인 중");
  if (!(window.claude && typeof window.claude.use === "function")) { setStatus("💾 브라우저에만 저장 (계정 연결 안 됨)"); return; }
  try {
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    const uid = user && await user.id();
    if (!db || !uid) { setStatus("💾 브라우저에만 저장 (계정 연결 안 됨)"); return; }
    const c = db.collection("data/users/"+uid);   // private per-user path
    const snap = await Promise.race([c.get(), new Promise((_,rej)=>setTimeout(()=>rej("timeout"),10000))]);
    snap.docs.forEach(d=>{
      if (!d.id.startsWith(W+"-")) return;
      const k = d.id.slice(W.length+1), v = d.data();
      if (state[k] && v && (v.t||0) > (state[k].t||0)) { state[k] = Object.assign({star:false,q:false,memo:""}, v); lsSet(LSP+k, state[k]); }
    });
    col = c;
    // push local entries newer than cloud
    const cloud = {}; snap.docs.forEach(d=>cloud[d.id]=d.data());
    for (const k in state){ const cv = cloud[W+"-"+k]; if ((state[k].t||0) > ((cv&&cv.t)||0)) { save(k); } }
    applyMarks();
    setStatus("☁ 계정에 저장됨");
  } catch(e){ col = null; setStatus("💾 브라우저에만 저장 (계정 연결 안 됨)"); }
}

/* ---------- render ---------- */
function renderMap(){
  const m = N.map, br = m.branches;
  const side = (b,i)=>`<div class="br" style="grid-column:${i<3?1:3};grid-row:${i%3+1}"><b>${esc(b.name)}</b><ul>${b.kw.map(k=>`<li>${T(k)}</li>`).join("")}</ul>${srefs(b.s)}</div>`;
  return `<section class="card" id="map"><h2 style="margin:0 0 10px;font-size:18px">🗺 전체 지도</h2>
  <div class="map"><div class="center">${esc(m.center)}</div>${br.map(side).join("")}</div>
  <div class="links"><b>가지끼리 이어지는 관계</b><ul>${m.links.map(l=>`<li><b>${esc(l.a)}</b> ⇢ <b>${esc(l.b)}</b>: ${T(l.t)} ${srefs(l.s)}</li>`).join("")}</ul></div></section>`;
}
function renderGuide(){
  const g = N.guide;
  return `<section class="card" id="guide"><h2 style="margin:0 0 10px;font-size:18px">🧭 학습 가이드</h2><div class="guide">
  <div><h3>공부 방법</h3><ul>${g.how.map(x=>`<li>${T(x)}</li>`).join("")}</ul></div>
  <div><h3>순서</h3><ol>${g.order.map(o=>{const [a,b]=o.s.split("–").map(Number);return `<li>${esc(o.t)} ${sref(a)}–${sref(b)}</li>`}).join("")}</ol></div>
  <div><h3>핵심</h3><ol>${g.core.map(c=>`<li>${T(c.t)} ${srefs(c.s)}</li>`).join("")}</ol></div>
  <div><h3>점검</h3><ol>${g.check.map(c=>`<li>${T(c.q)} ${srefs(c.s)}<details><summary>답 보기</summary>${T(c.a)}</details></li>`).join("")}</ol></div>
  </div></section>`;
}
function sec(title, inner, cls=""){ return `<details class="sec ${cls}"><summary>${title}</summary><div class="sbody">${inner}</div></details>`; }
function tipH(t){ return t ? `<div class="tip">${T(t)}</div>` : ""; }
function renderFig(n, f){
  const fg = FIGS[f.key]; const [x0,y0,x1,y1] = fg.crop, cw=x1-x0, ch=y1-y0;
  const boxes = fg.boxes.map((b,i)=>`<button class="box" data-i="${i}" aria-label="영역 ${i+1}" style="left:${(b[0]-x0)/cw*100}%;top:${(b[1]-y0)/ch*100}%;width:${(b[2]-b[0])/cw*100}%;height:${(b[3]-b[1])/ch*100}%"><span>${i+1}</span></button>`).join("");
  const nav = `<button data-mv="-1" aria-label="이전">‹</button>${fg.boxes.map((_,i)=>`<button data-i="${i}">${i+1}</button>`).join("")}<button data-mv="1" aria-label="다음">›</button>`;
  return `<div class="fig" data-cur="0">
    <div class="figwrap" style="aspect-ratio:${cw}/${ch}"><img src="img/p${pad(n)}.jpg" alt="Slide ${n} 그림 부분" width="${PW}" height="${PH}" style="width:${PW/cw*100}%;height:auto;left:${-x0/cw*100}%;top:${-y0/ch*100}%">${boxes}</div>
    <div class="fignav">${nav}</div><div class="figdesc"></div>
    <script type="application/json">${JSON.stringify(f.items).replace(/</g,"\\u003c")}<\/script></div>`
    + (f.redraw ? `<details class="sec" style="margin-top:8px"><summary>한글로 다시 그린 도표</summary><div class="sbody">${tagify(f.redraw)}</div></details>` : "");
}
function renderQuiz(qs){
  return `<div class="quiz" data-q="${esc(JSON.stringify(qs))}"></div>`;
}
function renderSlide(n){
  const d = N.slides[n], k="s"+pad(n), title = N.titles[n] || "";
  const isApx = n > N.total;
  let h = `<section class="slide${isApx?" apx":""}" id="s${n}" data-n="${n}"><div class="shead"><h2><span class="no">${isApx?"📖 부록":"Slide "+pad(n)}</span>${esc(title)}</h2>
  <div class="marks"><button class="bs" data-k="${k}" aria-pressed="false">★ 시험 강조</button><button class="bq" data-k="${k}" aria-pressed="false">? 질문</button></div></div>
  ${isApx?"":`<img class="thumb" src="img/p${pad(n)}.jpg" width="${PW}" height="${PH}" loading="lazy" alt="Slide ${n} 원본" data-zoom="${n}">`}`;
  if (!d){ h += `<p class="pending">이 장의 해설은 다음 묶음에서 추가돼요. ★/? 표시와 메모는 지금도 쓸 수 있어요.</p>`; }
  else {
    h += `<div class="one"><b>한 줄</b>${T(d.one)}</div>`;
    h += `<div class="talk"><div class="lab">🎙 강사 설명</div>${d.talk.map(p=>`<p>${T(p)}</p>`).join("")}<p class="sum">${T(d.sum)}</p></div>`;
    let lec = "";
    if (d.terms) lec += sec("용어", tipH(d.terms.tip)+`<table><tr><th>영문</th><th>한글</th><th>쉬운 뜻</th></tr>${d.terms.rows.map(r=>`<tr><td>${T(r[0])}</td><td>${T(r[1])}</td><td>${T(r[2])}</td></tr>`).join("")}</table>`);
    if (d.orig) lec += sec("원문 풀어 읽기", tipH(d.orig.tip)+`<table class="pair"><tr><th>원문</th><th>풀이</th></tr>${d.orig.rows.map(r=>`<tr><td>${T(r[0])}</td><td>${T(r[1])}</td></tr>`).join("")}</table>`);
    if (d.fig) lec += sec("그림 읽기", tipH(d.fig.tip)+renderFig(n,d.fig), "figsec");
    if (d.table) lec += sec("표", tipH(d.table.tip)+tagify(d.table.html));
    if (d.num) lec += sec("숫자 예제", tipH(d.num.tip)+`<ol class="steps">${d.num.steps.map(s=>`<li>${T(s)}</li>`).join("")}</ol>`);
    if (lec) h += `<div class="grp">강의 중</div>`+lec;
    if (d.book){ const b=d.book;
      const inner = b.items.map(i=>`<h4 class="bkh">${esc(i.h)}</h4>${tagify(i.b)}`).join("")
        + (b.num ? `<h4 class="bkh">숫자 예제</h4><ol class="steps">${b.num.map(x=>`<li>${T(x)}</li>`).join("")}</ol>` : "");
      h += `<div class="grp">교재 보충</div>`+sec(`📖 교재 보충 — 『센서공학입문』 ${esc(b.pages)}`, inner, "booksec"); }
    if (d.latest){ const l=d.latest;
      const inner = l.items.map(i=>`<h4 class="bkh">${esc(i.h)}</h4>${tagify(i.b)}`).join("")
        + `<p class="src"><b>출처</b><br>${l.src.join("<br>")}</p><p class="cap">조사 시점: ${esc(l.asof)}. 시장·점유율 숫자는 해마다 바뀌어요. 시험에서는 슬라이드 숫자를 따르세요.</p>`;
      h += `<div class="grp">최신 보충</div>`+sec(`🆕 최신 보충 — ${esc(l.asof)} 기준 웹 자료`, inner, "latestsec"); }
    if (d.review){ const r=d.review;
      h += `<div class="grp">복습</div>`+sec("핵심 논리 · 외울 것 · 시험 답안 · 백지 복원", `<div class="rv"><h4>핵심 논리</h4><p>${T(r.logic)}</p><h4>외울 것</h4><ul class="mem">${r.mem.map(x=>`<li>${T(x)}</li>`).join("")}</ul><h4>시험 대비 한 줄 답안</h4><p>${T(r.exam)}</p><h4>백지 복원 과제</h4><ul class="mem">${r.blank.map(x=>`<li>${T(x)}</li>`).join("")}</ul></div>`); }
    if (d.quiz && d.quiz.length) h += `<div class="grp">퀴즈</div>`+sec(`퀴즈 (${d.quiz.length}문제)`, renderQuiz(d.quiz), "qsec");
  }
  h += `<div class="memo"><div class="lab">📝 메모</div><textarea data-k="${k}" placeholder="강의 중 들은 말, 궁금한 점…"></textarea></div></section>`;
  return h;
}

/* ---------- quiz ---------- */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function buildQuiz(el){

  let html = "";
  qs.forEach((q,qi)=>{

      const opts = shuffle(q.o.map((t,i)=>({t,ok:i===0})));
      html += `<div class="qz mc"><div class="qq">Q${qi+1}. ${T(q.q)}</div>${opts.map(o=>`<button class="opt" data-ok="${o.ok?1:0}">${T(o.t)}</button>`).join("")}<div class="exp" hidden>${T(q.e)}</div></div>`;
    } else {
      html += `<div class="qz sa"><div class="qq">Q${qi+1}. (서술형) ${T(q.q)}</div><textarea placeholder="내 답을 먼저 써 보세요"></textarea><div class="qbar"><button class="show">모범 답안 보기</button></div><div class="model" hidden><b>모범 답안</b><p>${T(q.m)}</p><b>채점 포인트</b>${q.p.map(p=>`<label><input type="checkbox"> ${T(p)}</label>`).join("")}</div></div>`;
    }
  });
  if (mcN) html += `<div class="qbar"><span class="score">객관식 점수 0 / ${mcN}</span><button class="retry">다시 풀기 (보기 섞기)</button></div>`;
  el.innerHTML = html; el.dataset.score = "0"; el.dataset.mcn = mcN;

/* ---------- glossary tooltips ---------- */
const GL = N.glossary.slice().sort((a,b)=>b[0].length-a[0].length);
const isAscii = s => /^[\x00-\x7F%]+$/.test(s);
const reSrc = GL.map(g=>{
  const e = g[0].replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  return isAscii(g[0]) ? `(?<![A-Za-z])${e}(?![A-Za-z])` : e;
}).join("|");
const RE = new RegExp(reSrc, "g");
const SKIP = "a,button,.quiz,.fig,.math,summary,.tt,.tag,.sref,textarea,script,.shead";
function tipify(root, used){
  const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {acceptNode(n){
    if (!n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
    if (n.parentElement.closest(SKIP)) return NodeFilter.FILTER_REJECT;
    return NodeFilter.FILTER_ACCEPT; }});
  const nodes=[]; while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(node=>{
    const s = node.nodeValue; RE.lastIndex = 0; let m, last=0, frag=null;
    while((m = RE.exec(s))){
      const term = m[0]; if (used.has(term)) continue;
      used.add(term); frag = frag || document.createDocumentFragment();
      frag.appendChild(document.createTextNode(s.slice(last, m.index)));
      const sp = document.createElement("span"); sp.className="tt"; sp.tabIndex=0; sp.dataset.g=term; sp.textContent=term;
      frag.appendChild(sp); last = m.index+term.length;
    }
    if (frag){ frag.appendChild(document.createTextNode(s.slice(last))); node.parentNode.replaceChild(frag, node); }
  });
}
const tipEl = () => $("#tip");
let tipFor = null;
function showTip(el){
  const g = N.glossary.find(x=>x[0]===el.dataset.g); if(!g) return;
  const t = tipEl();
  t.innerHTML = `<div class="n">${esc(g[0])} — ${esc(g[1])}</div><div class="r">읽는 법: ${esc(g[2])}</div><div>${esc(g[3])}</div><div class="r">${tagify(esc(g[4]))}</div>`;
  t.style.display="block"; t.style.left="0px"; t.style.top="0px";
  const r = el.getBoundingClientRect(), tw = t.offsetWidth, th = t.offsetHeight, vw = document.documentElement.clientWidth;
  let left = r.left + window.scrollX; left = Math.max(window.scrollX+8, Math.min(left, window.scrollX+vw-tw-8));
  let top = r.bottom + window.scrollY + 6;
  if (r.bottom + th + 10 > window.innerHeight && r.top - th - 6 > 0) top = r.top + window.scrollY - th - 6;
  t.style.left = left+"px"; t.style.top = top+"px"; tipFor = el;
}
function hideTip(){ tipEl().style.display="none"; tipFor=null; }

const isWide = () => window.matchMedia("(min-width:1024px)").matches;
function barH(){ const tb=$("#topbar"); const h = (tb && getComputedStyle(tb).display!=="none") ? tb.offsetHeight : 0;
  document.documentElement.style.setProperty("--barH", h+"px"); return h; }
function goEl(el, extra){ if(!el) return; const y = el.getBoundingClientRect().top + window.scrollY - barH() - (extra||8); window.scrollTo({top:Math.max(0,y), behavior:"smooth"}); }
function go(n){ closeDrawer(); goEl(document.getElementById(n==="map"?"map":n==="guide"?"guide":"s"+n)); }

function updCur(){

/* ---------- search ---------- */
let IDX = [], PAIRS = [], qCat = "all", hits = [], hitSel = -1;
const CATS = [["all","전체"],["body","본문"],["term","용어"],["book","교재"],["latest","최신"],["quiz","퀴즈"],["memo","내 메모"]];
const norm = t => String(t).toLowerCase();
const nospace = t => t.replace(/\s+/g,"");
function textOf(el){ const c = el.cloneNode(true); c.querySelectorAll("script,button.box").forEach(x=>x.remove()); return c.textContent.replace(/\s+/g," ").trim(); }
function addIdx(o){ o.L = norm(o.text); o.NS = nospace(o.L); IDX.push(o); }
function buildIndex(){
  IDX = [];
  addIdx({n:"map", cat:"body", label:"전체 지도", el:$("#map"), text:textOf($("#map"))});
  addIdx({n:"guide", cat:"body", label:"학습 가이드", el:$("#guide"), text:textOf($("#guide"))});
  for (const sec of $$(".slide")){
    const n = +sec.dataset.n;
    addIdx({n, cat:"title", label:"제목", el:sec, text:(N.titles[n]||"")});
    const one=$(".one",sec); if (one) addIdx({n, cat:"body", label:"한 줄", el:one, text:textOf(one)});
    const talk=$(".talk",sec); if (talk) addIdx({n, cat:"body", label:"강사 설명", el:talk, text:textOf(talk)});
    for (const d of $$("details.sec",sec)){
      if (d.parentElement.closest("details.sec")) continue;
      const lab = $("summary",d).textContent.replace(/\s+/g," ").trim();
      let text = textOf($(".sbody",d));
      const js = $(".fig script",d); if (js){ try{ text += " " + JSON.parse(js.textContent).join(" "); }catch(e){} }
      const cat = d.classList.contains("booksec")?"book": d.classList.contains("latestsec")?"latest": d.classList.contains("qsec")?"quiz": lab.startsWith("용어")?"term":"body";
      addIdx({n, cat, label:lab.replace(/^📖 |^🆕 /,""), el:d, text});
    }
  }
  for (const g of N.glossary){
    const first = $(`main .tt[data-g="${CSS.escape(g[0])}"]`);
    const sl = first ? first.closest(".slide, #map, #guide") : null;
    addIdx({n: sl ? (sl.dataset.n ? +sl.dataset.n : sl.id) : null, cat:"term", label:"용어 사전", gl:g[0], el:first, text:`${g[0]} — ${g[1]} (${g[2]}): ${g[3]}. ${g[4]}`});
  }
  // 한·영 짝 (동의어 확장용)
  PAIRS = N.glossary.map(g=>[g[0], g[1], g[2]]);
  for (let n=1;n<=LAST;n++){ const d=N.slides[n]; if (d && d.terms) d.terms.rows.forEach(r=>PAIRS.push([r[0], r[1]])); }
  PAIRS = PAIRS.map(p=>p.map(x=>norm(String(x).replace(/\[[^\]]*\]/g,"").split(/ \(|\(|\/| — /)[0].trim())).filter(x=>x.length>=2));
}
function expand(q){
  const out = [q]; if (q.length < 2) return out;
  for (const p of PAIRS){ if (p.some(f=>f===q || (q.length>=3 && f.includes(q)) || (f.length>=3 && q.includes(f)))) for (const f of p) if (!out.includes(f) && out.length<5) out.push(f); }
  return out;
}
function snip(text, L, idx, len){
  if (idx < 0) return esc(text.slice(0, 90)) + (text.length>90?"…":"");
  const a = Math.max(0, idx-34), b = Math.min(text.length, idx+len+50);
  return (a>0?"…":"") + esc(text.slice(a, idx)) + "<mark>" + esc(text.slice(idx, idx+len)) + "</mark>" + esc(text.slice(idx+len, b)) + (b<text.length?"…":"");
}
const W8 = {title:100, term:60, body:30, book:25, latest:25, quiz:15, memo:50};
function runSearch(){
  const raw = $("#q").value.trim(), box = $("#qres");
  clearMarks();
  if (!raw){ box.hidden = true; box.innerHTML=""; hits=[]; return; }
  const q = norm(raw), terms = expand(q);
  hits = [];
  for (const e of IDX){
    if (qCat!=="all" && !(qCat===e.cat || (qCat==="body" && e.cat==="title"))) continue;
    let best=null, cnt=0;
    for (const t of terms){
      let i = e.L.indexOf(t);
      if (i>=0){ cnt += e.L.split(t).length-1; if (!best) best={i, t}; }
      else if (e.NS.includes(nospace(t))){ cnt++; if (!best) best={i:-1, t}; }
    }
    if (!best) continue;
    hits.push({e, t:best.t, i:best.i, score:(W8[e.cat]||20) + Math.min(cnt,5)*3 + (best.t===q?5:0)});
  }
  if (qCat==="all" || qCat==="memo"){
    for (const k in state){ const m = state[k].memo||""; if (!m) continue; const L = norm(m);
      const t = terms.find(t=>L.includes(t)); if (!t) continue;
      const n = +k.slice(1); hits.push({e:{n, cat:"memo", label:"내 메모", text:m, L, el:$(`#s${n} .memo`)}, t, i:L.indexOf(t), score:W8.memo}); }
  }
  hits.sort((a,b)=> b.score-a.score || (numOf(a.e.n)-numOf(b.e.n)));
  const total = hits.length; hits = hits.slice(0, 60); hitSel = hits.length ? 0 : -1;
  const also = terms.slice(1);
  let h = `<div class="qmeta">${total ? (total>60 ? total+"곳 중 상위 60" : total+"곳") : "결과 없음"}${also.length?` · 함께 찾음: ${also.map(esc).join(", ")}`:""}</div>`;
  h += hits.map((x,i)=>{ const n=x.e.n; const tag = n==="map"?"지도":n==="guide"?"가이드":n==null?"—":(n>N.total?"부록":n);
    return `<button class="hit${i===hitSel?" sel":""}" data-hit="${i}"><span class="hn">${tag}</span><span class="hb"><span class="hl">${esc(x.e.label)}${typeof n==="number"&&x.e.cat!=="title"?` · ${esc(N.titles[n]||"")}`:""}</span><span class="hs">${snip(x.e.text, x.e.L, x.i, x.t.length)}</span></span></button>`; }).join("");
  box.innerHTML = h; box.hidden = false;
}
const numOf = n => typeof n==="number" ? n : (n==="map"?-2:n==="guide"?-1:999);
function clearMarks(){ $$("mark.hit").forEach(m=>{ const p=m.parentNode; p.replaceChild(document.createTextNode(m.textContent), m); p.normalize(); }); }
function markIn(el, t){
  if (!el || !t) return null;
  const w = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, {acceptNode(n){ return n.parentElement.closest("script,.tt,textarea") ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT; }});
  while (w.nextNode()){ const n = w.currentNode, i = norm(n.nodeValue).indexOf(t); if (i<0) continue;
    const r = document.createRange(); r.setStart(n,i); r.setEnd(n,i+t.length); const m = document.createElement("mark"); m.className="hit"; r.surroundContents(m); return m; }
  return null;
}
function openHit(i){
  const x = hits[i]; if (!x) return; const e = x.e;
  closeDrawer(); clearMarks();
  if (e.gl && e.el){ goEl(e.el, 120); setTimeout(()=>showTip(e.el), 650); return; }
  let el = e.el; if (!el){ if (e.n!=null) go(e.n); return; }
  for (let d = el.closest("details"); d; d = d.parentElement && d.parentElement.closest("details")) d.open = true;
  if (el.tagName==="DETAILS") el.open = true;
  if (e.cat==="memo"){ goEl(el, 120); return; }
  const m = markIn(el, x.t);
  goEl(m || el, m ? Math.round(window.innerHeight*0.3) : 8);
}
function selHit(d){ if (!hits.length) return; hitSel = (hitSel + d + hits.length) % hits.length;
  $$("#qres .hit").forEach((b,i)=>b.classList.toggle("sel", i===hitSel)); const b=$(`#qres .hit[data-hit="${hitSel}"]`); if (b) b.scrollIntoView({block:"nearest"}); }

/* ---------- marks ---------- */
function applyMarks(){
  for (const k in state){
    const n = +k.slice(1), s = state[k], sec = document.getElementById("s"+n); if(!sec) continue;
    sec.classList.toggle("st", !!s.star);
    const bs=$(".bs",sec), bq=$(".bq",sec), ta=$(".memo textarea",sec);
    bs.classList.toggle("on",!!s.star); bs.setAttribute("aria-pressed", !!s.star);
    bq.classList.toggle("on",!!s.q); bq.setAttribute("aria-pressed", !!s.q);
    if (document.activeElement!==ta) ta.value = s.memo||"";
    const nb = $(`#nums .nv[data-go="${n}"]`); if (nb){ nb.classList.toggle("st", !!s.star); nb.classList.toggle("qm", !!s.q); }
  }
  $("#empty").classList.toggle("show", !Object.values(state).some(s=>s.star));
}

document.addEventListener("click", e=>{
  const t = e.target;
  const tt = t.closest(".tt");
  if (tt){ e.preventDefault(); if (tipFor===tt) hideTip(); else showTip(tt); return; }
  if (!t.closest("#tip")) hideTip();
  const g = t.closest("[data-go]"); if (g){ const v=g.dataset.go; go(v==="map"||v==="guide"?v:+v); return; }
  const hb = t.closest("[data-hit]"); if (hb){ openHit(+hb.dataset.hit); return; }
  const qc = t.closest(".qc"); if (qc){ qCat = qc.dataset.cat; $$("#qf .qc").forEach(b=>b.classList.toggle("on", b===qc)); runSearch(); return; }
  if (t.closest("#bSide")){ if (isWide()) setCollapsed(!document.body.classList.contains("side-collapsed")); else closeDrawer(); return; }
  if (t.closest("#rlOpen")){ setCollapsed(false); return; }
  if (t.closest("#rlSearch,#tbSearch")){ openSearch(); return; }
  if (t.closest("#tbMenu")){ openDrawer(); return; }
  if (t.closest("#scrim")){ closeDrawer(); return; }
  if (t.closest("#rlPrev,#rlNext")){ step(t.closest("#rlNext")?1:-1); return; }
  if (t.closest("[data-zoom]")){ const n = t.closest("[data-zoom]").dataset.zoom; $("#lb img").src = `img/p${pad(n)}.jpg`; $("#lb").style.display="flex"; return; }
  if (t.closest("#lb")){ $("#lb").style.display="none"; return; }
  const bs = t.closest(".bs,.bq");
  if (bs){ const k=bs.dataset.k, f = bs.classList.contains("bs")?"star":"q"; state[k][f]=!state[k][f]; save(k); applyMarks(); return; }
  const fig = t.closest(".fig");
  if (fig){ const b = t.closest("[data-i],[data-mv]"); if (b){ if (b.dataset.mv) setFig(fig, +fig.dataset.cur + +b.dataset.mv); else setFig(fig, +b.dataset.i); } return; }
  const opt = t.closest(".opt");
  if (opt){ const qz = opt.closest(".qz"); if (qz.dataset.done) return; qz.dataset.done="1";
    $$(".opt",qz).forEach(o=>{ if (o.dataset.ok==="1") o.classList.add("ok"); });
    const right = opt.dataset.ok==="1"; if(!right) opt.classList.add("ng");
    const ex = $(".exp",qz); ex.hidden=false; ex.insertAdjacentHTML("afterbegin", `<b style="color:var(--${right?"ok":"ng"})">${right?"정답!":"오답 —"}</b> `);
    const qu = qz.closest(".quiz"); if (right) qu.dataset.score = +qu.dataset.score+1;
    $(".score",qu).textContent = `객관식 점수 ${qu.dataset.score} / ${qu.dataset.mcn}`; return; }
  if (t.closest(".retry")){ const qu=t.closest(".quiz"); buildQuiz(qu); return; }
  if (t.closest(".show")){ const m = $(".model", t.closest(".qz")); m.hidden = !m.hidden; t.textContent = m.hidden?"모범 답안 보기":"모범 답안 접기"; return; }
  if (t.closest("#bStar,#rlStar")){ const on = document.body.classList.toggle("staronly"); $$("#bStar,#rlStar").forEach(b=>b.classList.toggle("on", on)); applyMarks(); updCur(); return; }
  if (t.closest("#bAll")){ const b=t.closest("button"), open=!b.classList.contains("on"); b.classList.toggle("on",open); b.textContent = open?"전체 접기":"전체 펼치기"; $$("main details").forEach(d=>d.open=open); return; }
  if (t.closest("#bEasy,#rlEasy")){ const on = document.body.classList.contains("noeasy"); $$("#bEasy,#rlEasy").forEach(b=>b.classList.toggle("on",on)); document.body.classList.toggle("noeasy",!on); try{localStorage.setItem("sensorNote:easy", on?"1":"0");}catch(e){} return; }
});
document.addEventListener("pointerover", e=>{ const tt=e.target.closest&&e.target.closest(".tt"); if (tt && e.pointerType==="mouse") showTip(tt); });
document.addEventListener("pointerout", e=>{ const tt=e.target.closest&&e.target.closest(".tt"); if (tt && e.pointerType==="mouse" && !(e.relatedTarget&&e.relatedTarget.closest&&e.relatedTarget.closest("#tip"))) hideTip(); });
let lastPtr=0; document.addEventListener("pointerdown", ()=>{ lastPtr=Date.now(); }, true);
document.addEventListener("focusin", e=>{ if (Date.now()-lastPtr<800) return; if (e.target.classList&&e.target.classList.contains("tt")) showTip(e.target); });
let qT=0; document.addEventListener("input", e=>{ if (e.target.id==="q"){ clearTimeout(qT); qT=setTimeout(runSearch,140); return; } const ta=e.target.closest(".memo textarea"); if(ta){ const k=ta.dataset.k; state[k].memo=ta.value; save(k); } });
function step(d){ const vs = visibleSlides(); const i = vs.indexOf(cur);
  if (i<0){ if (d>0 && vs.length) go(vs[0]); return; }
  const j = i + d; if (j<0) go("map"); else go(vs[Math.min(vs.length-1, j)]); }
document.addEventListener("keydown", e=>{
  const a = document.activeElement;
  if (a && a.id==="q"){
    if (e.key==="ArrowDown"){ e.preventDefault(); selHit(1); } else if (e.key==="ArrowUp"){ e.preventDefault(); selHit(-1); }
    else if (e.key==="Enter"){ e.preventDefault(); if (hitSel>=0) openHit(hitSel); }
