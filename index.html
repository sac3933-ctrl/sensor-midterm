 방향</li><li>v × B 외적</li><li>q 부호 곱해 힘 방향</li><li>쌓이는 전하로 (+)/(−) 면 결정</li></ol></div><div class=\"dsec\"><div class=\"dh\"><span>3</span>차근차근 풀이 (처음 보는 사람용)</div><h4>먼저 알아야 할 것</h4><p><b>로렌츠 힘</b>: 자기장 B 속에서 움직이는 전하 q는 옆으로 밀려요. 방향은 F = q(v × B)로 정해요. v는 전하가 움직이는 방향이에요.</p><p><b>오른손 규칙</b>(v × B): 오른손 네 손가락을 v 방향으로 펴고, B 방향으로 감아쥐면 엄지가 v × B 방향이에요. 그다음 q의 부호를 곱해요. q가 −(전자)면 방향을 뒤집어요.</p><div class=\"tw\"><table class=\"t sm\"><tr><th></th><th>n형</th><th>p형</th></tr><tr><td>움직이는 캐리어</td><td>전자 (−e)</td><td>정공 (+e)</td></tr><tr><td>캐리어 속도 v</td><td>전류와 <b>반대</b> 방향</td><td>전류와 <b>같은</b> 방향</td></tr></table></div><p>그래서 n형과 p형은 <b>같은 쪽으로 휘어요</b>(속도도 반대, 부호도 반대라 두 번 뒤집힘). 하지만 쌓이는 전하가 −냐 +냐가 달라서 V_H 극성이 반대예요.</p><h4>외적 표 (외워 두면 편해요)</h4><div class=\"eqn\">x̂ × ŷ = ẑ,  ŷ × ẑ = x̂,  ẑ × x̂ = ŷ<br>순서를 바꾸면 부호가 반대: x̂ × ẑ = −ŷ</div><h4>i) n형, I = +x, B = +z</h4><ol class=\"st\"><li>전자 속도 v = 전류 반대 = −x 방향</li><li>v × B = (−x̂) × ẑ = −(x̂ × ẑ) = −(−ŷ) = +ŷ</li><li>전자 q = −e → F = −e × (+ŷ) = <b>−ŷ</b> 방향</li><li>전자가 −y면(앞)에 쌓임 → −y면 (−), +y면 (+)</li></ol><h4>ii) p형</h4><ol class=\"st\"><li>정공 속도 v = 전류와 같은 +x</li><li>v × B = x̂ × ẑ = −ŷ</li><li>정공 q = +e → F = <b>−ŷ</b> (n형과 같은 방향!)</li><li>정공이 −y면에 쌓임 → −y면 (+), +y면 (−) → n형과 극성 반대</li></ol><h4>iii) B = −z</h4><p>B가 반대면 v × B가 반대 → 힘도 반대 → 전자는 +y면에 쌓여요. +y (−), −y (+).</p><div class=\"warn\"><b>자주 하는 실수</b> · 전자의 속도를 전류 방향으로 두고 계산한 뒤 q의 부호도 뒤집으면, 두 번 뒤집어서 정공 답이 나와요. 전자는 \"속도 반대 + 전하 음수\"를 한 번씩만 적용해요.</div></div><div class=\"dsec\"><div class=\"dh\"><span>4</span>답안지에 이렇게 쓰세요 · 시험용 짧은 버전</div><div class=\"xline\"><b>i)</b><q>\"I×B = +x × +z = −y → 전자가 −y면 → −y (−), +y (+)\"</q></div><div class=\"xline\"><b>ii)</b><q>\"정공도 −y면 → −y (+), +y (−). 몰리는 면은 같고 부호만 반대\"</q></div><div class=\"xline\"><b>iii)</b><q>\"B가 반대면 힘도 반대 → +y면에 전자 → +y (−), −y (+)\"</q></div><ul class=\"final-list\"><li>i) n형: 전자 −y면 → −y (−), +y (+)</li><li>ii) p형: 정공 −y면 → −y (+), +y (−)</li><li>iii) B = −z: n형 +y (−), −y (+)</li></ul></div></div></details>\n    <details><summary>정답 확인</summary><div class=\"ans\">\n      <p class=\"final\">i) 전자 −y면 → −y (−), +y (+) &nbsp; ii) 정공 −y면 → −y (+), +y (−) &nbsp; iii) 반대: +y (−), −y (+)</p>\n      <ol>\n        <li>n형: 전자 속도 v = −x̂ → v × B = (−x̂) × ẑ = +ŷ → F = (−e)(+ŷ) = −ŷ</li>\n        <li>p형: 정공 속도 v = +x̂ → v × B = x̂ × ẑ = −ŷ → F = (+e)(−ŷ) = −ŷ</li>\n        <li>둘 다 −y로 휘지만 쌓이는 전하가 (−)/(+)로 달라서 V_H 극성이 반대</li>\n        <li>B 방향이 바뀌면 힘 방향이 바뀌어 극성도 반대</li>\n      </ol>\n      <p class=\"one\">시험 답안에는 \"다수 캐리어의 전하 부호가 반대이므로 V_H 극성이 반대이고, R_H = −1/(nq) → +1/(pq)\"까지 쓰면 좋아요.</p>\n    </div></details>\n  </div>\n<div class=\"card\" id=\"c10-C\">\n    <div class=\"card-top\"><span class=\"id\">10-C</span><span class=\"ttl\">V_H 크기와 \"무엇이 바뀌면\"</span><span class=\"tag sim\">유사 · 판단</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">V_H 크기</span><span class=\"kw\">일정한 이유</span></div><p class=\"fline\">→ V_H = IB/(nqt) · 일정 = <b>qE_H = qvB</b></p></div>\n    <div class=\"fig\" data-hall='{\"I\": \"+x\", \"B\": \"+z\", \"dims\": true}'></div>\n    <div class=\"given\">n형, n = <b class=\"v\">10²² m⁻³</b>, I = <b class=\"v\">1 mA</b>, B = <b class=\"v\">0.1 T</b>, t = <b class=\"v\">1 μm</b>, q = 1.6×10⁻¹⁹ C</div>\n    <ol class=\"q\">\n      <li>|V_H| = IB/(nqt)</li>\n      <li>B를 2배로 하면? 두께를 절반으로 하면? n을 2배로 하면?</li>\n      <li>자기장을 계속 인가해도 V_H가 일정한 이유</li>\n    </ol>\n    <details class=\"deep\"><summary>풀이 보기 · 공식 → 순서 → 차근차근 → 답안지 문장</summary><div class=\"dbody\"><div class=\"dsec\"><div class=\"dh\"><span>1</span>이 공식에 숫자만 넣으면 돼요</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">홀 전압</span><span class=\"fe\">V_H = I × B ÷ (n × q × t)</span><span class=\"fs\">이 문제: 10⁻³ × 0.1 ÷ (10²² × 1.6×10⁻¹⁹ × 10⁻⁶) = 0.0625 V</span></div><div class=\"frow\"><span class=\"fl\">일정한 이유</span><span class=\"fe\">qE_H = qvB</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>자기센서01</b> p.15 · Hall sensor · 로렌츠 힘으로 전자 휨</li><li><b>자기센서01</b> p.16 · Charge(e⁻, h⁺) 휨의 방향</li><li><b>자기센서01</b> p.17 · 왜 V_H가 일정하게 유지되는가</li><li><b>자기센서01</b> p.19–20 · Hall voltage (V_H) 식 · p형</li><li><b>자기센서01</b> p.21 · Hall angle · 큰 V_H 조건</li></ul></div></div><div class=\"dsec\"><div class=\"dh\"><span>2</span>풀이 순서 (이 순서대로만)</div><ol class=\"flow\"><li>R_H = 1/(nq)</li><li>V_H = R_H I B / t (단위 m로)</li><li>비례·반비례로 변화 판단</li><li>qE_H = qvB로 일정한 이유</li></ol></div><div class=\"dsec\"><div class=\"dh\"><span>3</span>차근차근 풀이 (처음 보는 사람용)</div><h4>i) 크기 계산</h4><p>홀 계수 R_H = 1/(nq): 캐리어 농도 n이 작을수록 크다는 뜻이에요. 캐리어가 적으면 같은 전류를 흘리려고 하나하나가 더 빨리 움직이고, 그만큼 세게 휘어요.</p><ol class=\"st\"><li>R_H = 1/(10²² × 1.6 × 10⁻¹⁹) = 1/1600 = 6.25 × 10⁻⁴ m³/C</li><li>V_H = R_H × I × B / t = 6.25 × 10⁻⁴ × 10⁻³ A × 0.1 T ÷ 10⁻⁶ m</li><li>= 6.25 × 10⁻⁸ ÷ 10⁻⁶ = 0.0625 V = <b>62.5 mV</b></li></ol><h4>ii) 무엇이 바뀌면</h4><p>V_H = IB/(nqt)에서 위(분자)에 있는 I, B가 커지면 커지고, 아래(분모)에 있는 n, t가 커지면 작아져요.</p><ol class=\"st\"><li>B × 2 → V_H × 2</li><li>t × ½ → V_H × 2 (얇을수록 유리)</li><li>n × 2 → V_H × ½</li></ol><h4>iii) V_H가 일정한 이유</h4><ol class=\"st\"><li>자기장이 걸리면 캐리어가 로렌츠 힘(qvB)으로 한쪽 면에 쌓이기 시작</li><li>쌓인 전하 때문에 양 면 사이에 홀 전기장 E_H가 생김</li><li>E_H가 다음 캐리어를 반대로 미는 전기력 qE_H를 만듦</li><li>전하가 쌓일수록 qE_H가 커지다가 qE_H = qvB가 되면 힘의 합이 0</li><li>이후 캐리어는 휘지 않고 직진 → 더 이상 안 쌓임 → V_H 일정</li></ol><p>비유: 물이 한쪽 벽에 몰리면 물 높이 차가 생겨 더 이상 몰리지 못하는 것과 비슷해요. 다만 실제로는 물의 무게가 아니라 쌓인 전하의 전기장이 막는 거예요.</p><div class=\"warn\"><b>자주 하는 실수</b> · t는 μm를 m로 바꿔요: 1 μm = 10⁻⁶ m. mm(10⁻³)와 섞이면 1000배 틀려요.</div></div><div class=\"dsec\"><div class=\"dh\"><span>4</span>답안지에 이렇게 쓰세요 · 시험용 짧은 버전</div><div class=\"xline\"><b>i)</b><q>\"V_H = IB/(nqt) = 10⁻³ × 0.1 / (10²² × 1.6×10⁻¹⁹ × 10⁻⁶) = 62.5 mV\"</q></div><div class=\"xline\"><b>ii)</b><q>\"B 2배 → 2배, t 절반 → 2배, n 2배 → 절반\"</q></div><div class=\"xline\"><b>iii)</b><q>\"qE_H = qvB 평형에 도달하면 전하가 더 쌓이지 않아 V_H가 일정하다\"</q></div><ul class=\"final-list\"><li>i) 62.5 mV</li><li>ii) B×2 → 2배, t×½ → 2배, n×2 → ½배</li><li>iii) 홀 전기장의 전기력 = 자기력 → 더 안 쌓임</li></ul></div></div></details>\n    <details><summary>정답 확인</summary><div class=\"ans\">\n      <p class=\"final\">i) 62.5 mV &nbsp; ii) 2배, 2배, 절반 &nbsp; iii) 전기력 = 자기력 평형</p>\n      <ol>\n        <li>R_H = 1/(nq) = 1/(10²² × 1.6×10⁻¹⁹) = 6.25×10⁻⁴ m³/C</li>\n        <li>V_H = 6.25×10⁻⁴ × 10⁻³ × 0.1 / 10⁻⁶ = 0.0625 V</li>\n        <li>V_H ∝ IB/(nt) → B×2 → 2배, t×½ → 2배, n×2 → ½</li>\n      </ol>\n      <p class=\"one\">iii) Lorentz force로 한쪽 면에 전하가 쌓이면 양 면 사이에 홀 전기장 E_H가 생겨요. 전기력 qE_H가 자기력 qvB와 같아지면 캐리어가 더 휘지 않고 직진하므로 전하가 더 쌓이지 않고 V_H가 일정해요.</p>\n    </div></details>\n    <details class=\"calc-in\"><summary>fx-570ES PLUS 입력 순서</summary><div class=\"kbody\"><div class=\"krow\"><div class=\"kl\">R_H</div><div class=\"kk\"><kbd class=\"n\">1</kbd><kbd>÷</kbd><kbd>(</kbd><kbd class=\"n\">1</kbd><kbd>×10ˣ</kbd><kbd class=\"n\">22</kbd><kbd>×</kbd><kbd class=\"n\">1.6</kbd><kbd>×10ˣ</kbd><kbd>(−)</kbd><kbd class=\"n\">19</kbd><kbd>)</kbd><kbd>=</kbd></div><div class=\"kd\">6.25×10⁻⁴</div></div><div class=\"krow\"><div class=\"kl\">V_H</div><div class=\"kk\"><kbd>Ans</kbd><kbd>×</kbd><kbd class=\"n\">1</kbd><kbd>×10ˣ</kbd><kbd>(−)</kbd><kbd class=\"n\">3</kbd><kbd>×</kbd><kbd class=\"n\">0.1</kbd><kbd>÷</kbd><kbd class=\"n\">1</kbd><kbd>×10ˣ</kbd><kbd>(−)</kbd><kbd class=\"n\">6</kbd><kbd>=</kbd></div><div class=\"kd\">0.0625</div></div><p class=\"knote\">÷ 1 ×10ˣ (−) 6 은 계산기가 한 숫자(10⁻⁶)로 묶어서 처리해요. 괄호 없이 넣어도 돼요.</p></div></details>\n  </div>\n<div class=\"gen\" id=\"g6\">\n    <div class=\"row\"><span><b class=\"k\">새 숫자로 한 번 더</b> · n형/p형, 전류·자기장 방향, 크기가 바뀌어요</span><button class=\"btn\" data-gen=\"6\">새 문제</button></div>\n    <div class=\"out\"></div>\n  </div>"}, "t11": {"title": "홀 구동 회로 · AMR · GMR · SQUID", "pts": "4", "html": "\n  \n  <p class=\"why\">홀 센서 구동 방식부터 자기저항 센서, SQUID까지. 계산 하나(11-A)와 서술형 세 묶음이에요.</p>\n<div class=\"card\" id=\"c11-A\">\n    <div class=\"card-top\"><span class=\"id\">11-A</span><span class=\"ttl\">AMR · GMR 판단</span><span class=\"tag\">강의</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">AMR</span><span class=\"kw\">GMR</span></div><p class=\"fline\">→ R = R⊥ + ΔR cos²θ · GMR = (R_AP − R_P)/R_P</p></div>\n    <ol class=\"q\">\n      <li>AMR에서 R⊥ = <b class=\"v\">100 Ω</b>, R∥ = <b class=\"v\">103 Ω</b>. 전류와 자화의 각 θ = 45°일 때 R(θ) = R⊥ + ΔR·cos²θ는?</li>\n      <li>바버 폴을 45°로 만드는 이유는?</li>\n      <li>GMR에서 R_P = <b class=\"v\">10 Ω</b>, R_AP = <b class=\"v\">11.2 Ω</b>일 때 자기저항비와, 두 자성층이 평행일 때 저항이 작은 이유</li>\n    </ol>\n    <details class=\"deep\"><summary>풀이 보기 · 공식 → 순서 → 차근차근 → 답안지 문장</summary><div class=\"dbody\"><div class=\"dsec\"><div class=\"dh\"><span>1</span>이 공식에 숫자만 넣으면 돼요</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">AMR</span><span class=\"fe\">R = R⊥ + ΔR × cos²θ</span><span class=\"fs\">이 문제: 100 + 3 × 0.5 = 101.5 Ω</span></div><div class=\"frow\"><span class=\"fl\">GMR 비</span><span class=\"fe\">(R_AP − R_P) ÷ R_P × 100</span><span class=\"fs\">이 문제: (11.2 − 10) ÷ 10 × 100 = 12 %</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>자기센서02</b> p.6 · AMR 동작원리 2 · R(θ) 식, 45° 직선영역</li><li><b>자기센서02</b> p.7 · barber pole biasing</li><li><b>자기센서02</b> p.13–17 · GMR · Spin-dependent scattering</li><li><b>자기센서02</b> p.18 · 다층막 GMR 자기저항 비</li></ul></div></div><div class=\"dsec\"><div class=\"dh\"><span>2</span>풀이 순서 (이 순서대로만)</div><ol class=\"flow\"><li>ΔR = R∥ − R⊥, cos²45° = 0.5</li><li>45° 부근 선형 영역</li><li>GMR 비 계산 · 평행/반평행 산란</li></ol></div><div class=\"dsec\"><div class=\"dh\"><span>3</span>차근차근 풀이 (처음 보는 사람용)</div><h4>i) AMR</h4><p>AMR은 전류와 자화 방향이 나란할 때(θ = 0°) 저항이 최대, 수직일 때(90°) 최소예요. 그 사이는 cos²θ로 변해요.</p><div class=\"eqn\">ΔR = 103 − 100 = 3 Ω, cos²45° = (0.707)² = 0.5 → R = 100 + 3 × 0.5 = <b>101.5 Ω</b></div><h4>ii) 바버 폴 45°</h4><p>cos²θ 그래프는 0° 근처에서 평평해서(기울기 0) 작은 자기장 변화에 거의 반응하지 않아요. 45° 근처는 거의 직선이라 자기장에 비례해서 저항이 변해요. 알루미늄 띠를 45°로 붙여 전류 방향을 비스듬히 만드는 이유예요.</p><h4>iii) GMR</h4><div class=\"eqn\">자기저항비 = (R_AP − R_P)/R_P = (11.2 − 10)/10 × 100 = <b>12 %</b></div><p>두 자성층 자화가 평행이면 한쪽 스핀(예: 위 스핀) 전자는 두 층 모두를 거의 부딪히지 않고 통과해서 지름길이 생겨요 → 저항 작음. 반평행이면 어느 스핀이든 한 층에서는 크게 부딪혀서 지름길이 없어요 → 저항 큼.</p></div><div class=\"dsec\"><div class=\"dh\"><span>4</span>답안지에 이렇게 쓰세요 · 시험용 짧은 버전</div><div class=\"xline\"><b>i)</b><q>\"R = 100 + 3 × cos²45° = 101.5 Ω\"</q></div><div class=\"xline\"><b>ii)</b><q>\"cos²θ 곡선이 45° 부근에서 직선이라 자계에 비례한 선형 응답을 얻기 위해\"</q></div><div class=\"xline\"><b>iii)</b><q>\"(11.2 − 10)/10 = 12 %. 평행이면 한 스핀의 전자가 산란 없이 통과해 저항이 작다\"</q></div><ul class=\"final-list\"><li>i) 101.5 Ω</li><li>ii) 45° 부근이 선형 영역</li><li>iii) 12 % · 평행이면 스핀 의존 산란 적어 저항 작음</li></ul></div></div></details>\n    <details><summary>정답 확인</summary><div class=\"ans\">\n      <p class=\"final\">i) 101.5 Ω &nbsp; ii) 선형 영역 &nbsp; iii) 12 %, 스핀 의존 산란이 적음</p>\n      <ol>\n        <li>ΔR = 3 Ω, cos²45° = 0.5 → 100 + 1.5 = 101.5 Ω</li>\n        <li>cos²θ 곡선은 45° 부근이 직선 → 자계에 대해 저항이 선형으로 변함</li>\n        <li>(11.2 − 10)/10 = 12 %</li>\n      </ol>\n      <p class=\"one\">평행이면 한 스핀 방향 전자는 계면에서 산란 없이 지나가 평균자유행정이 길어지고 저항이 작아요. 반평행이면 모든 전자가 산란돼 저항이 커요.</p>\n    </div></details>\n    <details class=\"calc-in\"><summary>fx-570ES PLUS 입력 순서</summary><div class=\"kbody\"><div class=\"krow\"><div class=\"kl\">각도 단위 확인</div><div class=\"kk\"><kbd>SHIFT</kbd><kbd>MODE</kbd><kbd class=\"n\">3</kbd></div><div class=\"kd\">화면 위쪽에 D 표시 (Deg)</div></div><div class=\"krow\"><div class=\"kl\">R(45°)</div><div class=\"kk\"><kbd class=\"n\">100</kbd><kbd>+</kbd><kbd class=\"n\">3</kbd><kbd>×</kbd><kbd>cos</kbd><kbd class=\"n\">45</kbd><kbd>)</kbd><kbd>x²</kbd><kbd>=</kbd></div><div class=\"kd\">101.5</div></div><div class=\"krow\"><div class=\"kl\">GMR 비</div><div class=\"kk\"><kbd>(</kbd><kbd class=\"n\">11.2</kbd><kbd>−</kbd><kbd class=\"n\">10</kbd><kbd>)</kbd><kbd>÷</kbd><kbd class=\"n\">10</kbd><kbd>×</kbd><kbd class=\"n\">100</kbd><kbd>=</kbd></div><div class=\"kd\">12</div></div><p class=\"knote\">cos를 누르면 \"cos(\"가 열려요. 45 다음 )로 닫고 x²를 눌러야 (cos 45)²가 돼요.</p></div></details>\n  </div>\n<div class=\"card\" id=\"c11-B\">\n    <div class=\"card-top\"><span class=\"id\">11-B</span><span class=\"ttl\">홀 센서 구동 회로 · 재료 · 구조</span><span class=\"tag ess\">서술형 · 강의 범위</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">정전류</span><span class=\"kw\">정전압</span><span class=\"kw\">InSb</span><span class=\"kw\">GaAs</span><span class=\"kw\">십자형</span></div><p class=\"fline\">→ 정전류 = 안정·직선성 but 복잡 · 정전압 = 간단 but μ 온도 의존 · InSb 고감도 / GaAs 온도 안정 · 십자형 = f_H ≈ 1</p></div>\n    <ol class=\"q\"><li>홀 센서의 정전류 구동과 정전압 구동의 장단점을 비교하라.</li><li>홀 센서 재료로 InSb와 GaAs의 특징은?</li><li>실용 홀 센서가 십자형(cross-shaped) 구조인 이유와 형상계수의 의미는?</li><li>홀 전압 offset의 원인은?</li></ol>\n    <details class=\"deep\"><summary>풀이 보기 · 외울 것 → 답안 문장 → 쉬운 설명</summary><div class=\"dbody\">\n      <div class=\"dsec\"><div class=\"dh\"><span>1</span>외울 것 (키워드·식)</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">정전류</span><span class=\"fe\">V_H = R_H·I·B/t → 직선성 우수, 저항·온도 영향 적음 / 회로 복잡, 전류 노이즈</span></div><div class=\"frow\"><span class=\"fl\">정전압</span><span class=\"fe\">V_H = μ(w/l)·V·B → 간단·저가 / 저항 변화·전원 오차·μ 온도 의존</span></div><div class=\"frow\"><span class=\"fl\">재료</span><span class=\"fe\">InSb: 고이동도 → 고감도 / GaAs: 고온 안정</span></div><div class=\"frow\"><span class=\"fl\">형상계수</span><span class=\"fe\">l/w > 3 → f_H ≈ 1, 십자형 실용</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>자기센서01</b> p.22 · Hall sensor materials</li><li><b>자기센서01</b> p.23–25 · 형상계수 f_H, 십자형</li><li><b>자기센서01</b> p.27–29 · 정전류/정전압 구동, 온도의존성</li><li><b>자기센서01</b> p.31 · Offset 원인</li></ul></div></div>\n      <div class=\"dsec\"><div class=\"dh\"><span>2</span>답안지에 이렇게 쓰세요</div><p class=\"note\" style=\"margin:0 0 8px\">【 】 = 강의자료 원문 표현 (그대로 쓰면 안전) · 〔 〕 = 작년 교수님 답안 표현</p><div class=\"xline\"><b>Q1. 홀 센서의 정전류 구동과 정전압 구동의 장단점을 비교하라.</b><q>정전류: 【직선성 우수】, 【센서 저항 및 온도 변화의 영향을 상대적으로 줄일 수 있음】, 【V_H 안정성 높음】 / 【회로가 복잡하다 → 비용증대】, 【전류의 노이즈가 홀 전압에 영향】. 정전압: 【회로가 간단하고 비용이 낮음】 / 【센서 저항이 변화하면 전류가 변화 → V_H 영향】, 【전원 전압의 오차가 V_H에 영향】, 【V_H의 온도 의존성이 크다 → 이동도의 온도 의존성 때문】.</q></div><p class=\"easy\">쉬운 말로 → 정전류는 비싸지만 흔들림이 적고, 정전압은 싸지만 온도에 흔들려요.</p><div class=\"xline\"><b>Q2. 홀 센서 재료로 InSb와 GaAs의 특징은?</b><q>【Higher mobility and larger energy bandgap are preferred】. 【InSb: Energy bandgap 매우 작지만 high mobility → high sensitivity】, 【GaAs: high temperature stability】. InSb는 【정전압 구동회로가 유리】.</q></div><p class=\"easy\">쉬운 말로 → InSb는 민감, GaAs는 튼튼이에요.</p><div class=\"xline\"><b>Q3. 실용 홀 센서가 십자형(cross-shaped) 구조인 이유와 형상계수의 의미는?</b><q>이상적 홀 전압식은 【무한히 긴 홀 소자】 기준이라 실제는 【형상계수 f_H(0~1)】를 곱한다. 【f_H는 l/w의 함수이며 l/w ≫ 3 범위에서는 거의 1】. 【제작하기가 훨씬 더 용이한 십자형 구조로부터 동일한 형상계수 값을 얻을 수 있기 때문】에 실용 센서는 십자형이며 【형상계수 ~1, 제작용이, 전극간 short 방지】.</q></div><p class=\"easy\">쉬운 말로 → 길쭉하게 만들어야 식대로 나오는데, 십자 모양이면 작아도 같은 효과예요.</p><div class=\"xline\"><b>Q4. 홀 전압 offset의 원인은?</b><q>【전극 위치의 비대칭, 센서 형상의 불균일, 접촉저항 차이, 전극 크기 차이】. 【단순한 offset은 보정하여 제거할 수 있지만 온도·전류·자기장·증폭기 drift 등에 따라 offset이 변할 수 있다】.</q></div><p class=\"easy\">쉬운 말로 → 자기장이 없어도 0이 아닌 출력이 나오는 게 offset이에요. 만드는 과정의 작은 비대칭 때문이에요.</p></div>\n    </div></details>\n    <details><summary>정답 확인 · 핵심만</summary><div class=\"ans\"><ul class=\"final-list\"><li><b>정전류</b> · V_H = R_H·I·B/t → 직선성 우수, 저항·온도 영향 적음 / 회로 복잡, 전류 노이즈</li><li><b>정전압</b> · V_H = μ(w/l)·V·B → 간단·저가 / 저항 변화·전원 오차·μ 온도 의존</li><li><b>재료</b> · InSb: 고이동도 → 고감도 / GaAs: 고온 안정</li><li><b>형상계수</b> · l/w > 3 → f_H ≈ 1, 십자형 실용</li></ul></div></details>\n  </div>\n<div class=\"card\" id=\"c11-C\">\n    <div class=\"card-top\"><span class=\"id\">11-C</span><span class=\"ttl\">AMR · 바버 폴 · 자성체 기초</span><span class=\"tag ess\">서술형 · 강의 범위</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">AMR</span><span class=\"kw\">cos²θ</span><span class=\"kw\">45°</span><span class=\"kw\">퍼말로이</span><span class=\"kw\">Curie</span></div><p class=\"fline\">→ I ∥ M 저항 최대, ⊥ 최소 · R = R⊥ + ΔR cos²θ · 45° 바버 폴 = 직선 영역 · 브리지 = 감도↑ drift↓</p></div>\n    <ol class=\"q\"><li>이방성 자기저항(AMR) 효과를 설명하라.</li><li>Barber pole을 45°로 형성하는 이유는?</li><li>AMR 소자 4개로 휘트스톤 브리지를 구성하는 이유는?</li><li>자성체의 종류와 큐리 온도를 설명하라.</li></ol>\n    <details class=\"deep\"><summary>풀이 보기 · 외울 것 → 답안 문장 → 쉬운 설명</summary><div class=\"dbody\">\n      <div class=\"dsec\"><div class=\"dh\"><span>1</span>외울 것 (키워드·식)</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">AMR</span><span class=\"fe\">전류와 자화가 평행이면 저항 최대, 수직이면 최소</span></div><div class=\"frow\"><span class=\"fl\">식</span><span class=\"fe\">R(θ) = R⊥ + ΔR cos²θ, θ = 45° 전후 직선 영역</span></div><div class=\"frow\"><span class=\"fl\">바버 폴</span><span class=\"fe\">Al 단락 바 45° → 유효 전류 방향 45°</span></div><div class=\"frow\"><span class=\"fl\">자성체</span><span class=\"fe\">강자성 Fe·Ni·Co / 페리 Fe₃O₄ / 상자성 Al·Pt / 반자성 Cu·Ag·Au·H₂O</span></div><div class=\"frow\"><span class=\"fl\">Curie</span><span class=\"fe\">Fe 770, Co 1127, Ni 358 °C</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>자기센서01</b> p.4 · 자성체 종류</li><li><b>자기센서01</b> p.10 · Curie 온도</li><li><b>자기센서01</b> p.11 · 자기센서 종류(약·중·강자계)</li><li><b>자기센서02</b> p.3–6 · AMR 원리·식</li><li><b>자기센서02</b> p.7–9 · barber pole · bridge</li><li><b>자기센서02</b> p.10 · 특징·한계</li></ul></div></div>\n      <div class=\"dsec\"><div class=\"dh\"><span>2</span>답안지에 이렇게 쓰세요</div><p class=\"note\" style=\"margin:0 0 8px\">【 】 = 강의자료 원문 표현 (그대로 쓰면 안전) · 〔 〕 = 작년 교수님 답안 표현</p><div class=\"xline\"><b>Q1. 이방성 자기저항(AMR) 효과를 설명하라.</b><q>【Ferromagnetic 물질에서 전류(I)의 방향과 자화(M)의 방향이 서로 평행일 때 저항이 최대로 되고, 서로 수직한 경우 최소로 되는 현상】. 원인: 【스핀–궤도 결합(SOC)에 의해 전도전자의 산란 조건이 자화 방향에 의존】. 【R(θ) = R⊥ + ΔR cos²θ】, 【θ = 45°를 전후로 직선영역이 존재】. 저항 변화는 수 %.</q></div><p class=\"easy\">쉬운 말로 → 자석 방향과 전류 방향이 나란하면 전자가 더 많이 부딪혀 저항이 커져요.</p><div class=\"xline\"><b>Q2. Barber pole을 45°로 형성하는 이유는?</b><q>【Al 단락 바를 약 45° 방향으로 형성】 → 【Al은 NiFe에 비해 전기저항이 매우 낮아】 【NiFe 내부의 유효 전류 방향이 약 45°】 → 【자화 방향과 유효 전류 방향이 약 45°를 이루도록 설정 → 자기장 변화에 대해 저항 변화가 선형적으로 나타나기 유리】.</q></div><p class=\"easy\">쉬운 말로 → cos²θ 곡선은 0° 근처가 평평해서 반응이 없고, 45° 근처가 직선이라 거기서 쓰려고 전류를 비스듬히 만들어요.</p><div class=\"xline\"><b>Q3. AMR 소자 4개로 휘트스톤 브리지를 구성하는 이유는?</b><q>【두 소자의 바버 폴 방향은 +45°, 다른 두 소자는 −45°】 → 자계에 대해 【R₁·R₃는 저항 감소, R₂·R₄는 저항 증가】 → 【센서의 온도 드리프트를 감소시키고 감도를 증가】.</q></div><p class=\"easy\">쉬운 말로 → 반대로 움직이는 저항을 짝지으면 출력이 두 배가 되고 온도는 지워져요.</p><div class=\"xline\"><b>Q4. 자성체의 종류와 큐리 온도를 설명하라.</b><q>【강자성체: Ni, Fe, Co】, 【페리자성체: ferrite(Fe₃O₄)】, 【상자성체: Al, Pt, Cr, O₂】, 【반자성체: Cu, Ag, Au, H₂O — 외부 자기장과 반대 방향으로 약간 자화】. 【온도가 상승함에 따라 자기 모멘트 배열이 흐트러져 자성이 상실되는 온도가 큐리 온도: Fe 770 ℃, Co 1127 ℃, Ni 358 ℃】.</q></div><p class=\"easy\">쉬운 말로 → 자석이 되는 세기 순서로 강자성 > 페리 > 상자성, 반자성은 반대로 약하게 밀려요.</p></div>\n    </div></details>\n    <details><summary>정답 확인 · 핵심만</summary><div class=\"ans\"><ul class=\"final-list\"><li><b>AMR</b> · 전류와 자화가 평행이면 저항 최대, 수직이면 최소</li><li><b>식</b> · R(θ) = R⊥ + ΔR cos²θ, θ = 45° 전후 직선 영역</li><li><b>바버 폴</b> · Al 단락 바 45° → 유효 전류 방향 45°</li><li><b>자성체</b> · 강자성 Fe·Ni·Co / 페리 Fe₃O₄ / 상자성 Al·Pt / 반자성 Cu·Ag·Au·H₂O</li><li><b>Curie</b> · Fe 770, Co 1127, Ni 358 °C</li></ul></div></details>\n  </div>\n<div class=\"card\" id=\"c11-D\">\n    <div class=\"card-top\"><span class=\"id\">11-D</span><span class=\"ttl\">GMR · 스핀 밸브 · SQUID</span><span class=\"tag ess\">서술형 · 강의 범위</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">GMR 70 %</span><span class=\"kw\">평행/반평행</span><span class=\"kw\">spin valve</span><span class=\"kw\">Josephson</span><span class=\"kw\">Φ₀</span></div><p class=\"fline\">→ GMR: 평행 = 산란 적음 = 저항 최소, 반평행 = 최대 · 스핀 밸브 = 고정층 + 자유층 → 비대칭 · SQUID: 전압이 Φ₀ 주기로 진동</p></div>\n    <ol class=\"q\"><li>GMR의 원리를 평행·반평행 상태로 설명하라.</li><li>다층막 GMR과 스핀 밸브 GMR의 차이는?</li><li>조셉슨 접합과 DC 조셉슨 효과를 설명하라.</li><li>DC SQUID의 동작 원리를 설명하라.</li></ol>\n    <details class=\"deep\"><summary>풀이 보기 · 외울 것 → 답안 문장 → 쉬운 설명</summary><div class=\"dbody\">\n      <div class=\"dsec\"><div class=\"dh\"><span>1</span>외울 것 (키워드·식)</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">GMR</span><span class=\"fe\">ΔR/R = (R_AP − R_P)/R_P, 다층박막 약 70 %</span></div><div class=\"frow\"><span class=\"fl\">원리</span><span class=\"fe\">spin-dependent scattering: 자화와 같은 스핀 → 산란 적음</span></div><div class=\"frow\"><span class=\"fl\">두께</span><span class=\"fe\">평균자유행정 수십 nm → 각 층 10 nm 이하</span></div><div class=\"frow\"><span class=\"fl\">스핀 밸브</span><span class=\"fe\">반강자성체로 고정층 pinning, 자유층만 회전 → 비대칭</span></div><div class=\"frow\"><span class=\"fl\">SQUID</span><span class=\"fe\">조셉슨 접합 2개 + 초전도 링, 출력 전압이 Φ₀ 주기로 진동</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>자기센서02</b> p.13 · GMR 1988 · 70 %</li><li><b>자기센서02</b> p.15–17 · Spin-dependent scattering · 두께 < 10 nm</li><li><b>자기센서02</b> p.18–21 · 다층막 · 스핀 밸브</li><li><b>자기센서02</b> p.30–32 · 초전도체 · 조셉슨 접합 · DC 조셉슨</li><li><b>자기센서02</b> p.33–37 · RF/DC SQUID · 동작</li></ul></div></div>\n      <div class=\"dsec\"><div class=\"dh\"><span>2</span>답안지에 이렇게 쓰세요</div><p class=\"note\" style=\"margin:0 0 8px\">【 】 = 강의자료 원문 표현 (그대로 쓰면 안전) · 〔 〕 = 작년 교수님 답안 표현</p><div class=\"xline\"><b>Q1. GMR의 원리를 평행·반평행 상태로 설명하라.</b><q>【비자성 금속박막이 두 개의 강자성 박막 사이에 샌드위치】. 【평행: 스핀 업 전자들은 경계에서 산란 없이 통과 → 평균자유행정이 길어지므로 저항이 작아짐】. 【반평행: 경계에서 모든 전자들이 산란 → 평균자유행정이 짧아지고 저항 증가】. 【이 현상은 스핀 의존성 산란(spin dependent scattering)에 기인】, AMR 수 %에 비해 【약 70 %】로 giant. 【각 박막의 두께는 10 nm 이하】여야 계면 산란 비중이 커짐.</q></div><p class=\"easy\">쉬운 말로 → 두 자석층이 같은 방향이면 한 종류 전자에게 지름길이 생겨 저항이 작아요.</p><div class=\"xline\"><b>Q2. 다층막 GMR과 스핀 밸브 GMR의 차이는?</b><q>다층막: 【반강자성 층간 상호결합에 의해 반평행】 → 외부 자계로 평행 → 【저항의 변화는 인가자계의 크기에만 의존하고 부호에는 무관(대칭)】, 【약한 자계에서는 감도가 매우 낮다】. 스핀 밸브: 【반강자성체에 이웃한 강자성체(고정층)의 자화는 교환 상호작용에 의해 고정】, 자유층만 회전 → 【비대칭적인 자기저항 특성】.</q></div><p class=\"easy\">쉬운 말로 → 다층막은 방향을 못 가리고, 스핀 밸브는 한 층을 고정해 방향까지 구분해요.</p><div class=\"xline\"><b>Q3. 조셉슨 접합과 DC 조셉슨 효과를 설명하라.</b><q>【2개의 초전도체를 얇은 절연막으로 분리시킨 구조】(Nb | AlOₓ | Nb). 【쿠퍼 쌍(Cooper pairs)이 절연박막을 터널링】. 【DC 조셉슨 효과: 임계전류 I_c까지는 접합 사이에 전압이 생기지 않고 전류가 흐름】, 【I_c를 초과하면 접합 양단에 전압이 발생】.</q></div><p class=\"easy\">쉬운 말로 → 초전도체 사이 얇은 벽을 전자 쌍이 통과해서, 어느 전류까지는 전압 없이 흘러요.</p><div class=\"xline\"><b>Q4. DC SQUID의 동작 원리를 설명하라.</b><q>【두 개의 조셉슨 접합을 초전도 링으로 연결】, 【바이어스 전류 I는 두 접합에 I/2씩】. 외부 자속이 증가하면 【loop 전류 J】가 생겨 【한 접합의 전류 I/2 + J가 임계전류에 도달 → 전압 발생】. 【차폐 전류는 자속이 Φ₀/2 증가할 때마다 방향을 바꾸며 임계전류도 자속의 함수로 진동】 → 【출력전압은 자속양자 Φ₀를 주기로 진동】, 【전압 변화를 모니터링해 자계 측정】. 【Calibration은 국부적인 선형 구간에서】. 【DC SQUID가 RF SQUID보다 자속 분해능이 높고 고감도】. 응용: 【MEG, MCG, 지질 탐사, NDE】.</q></div><p class=\"easy\">쉬운 말로 → 자속이 아주 조금 변할 때마다 전압이 오르내려서, fT 수준 자기장(뇌 자기장)도 잴 수 있어요. 대신 극저온이 필요해요.</p></div>\n    </div></details>\n    <details><summary>정답 확인 · 핵심만</summary><div class=\"ans\"><ul class=\"final-list\"><li><b>GMR</b> · ΔR/R = (R_AP − R_P)/R_P, 다층박막 약 70 %</li><li><b>원리</b> · spin-dependent scattering: 자화와 같은 스핀 → 산란 적음</li><li><b>두께</b> · 평균자유행정 수십 nm → 각 층 10 nm 이하</li><li><b>스핀 밸브</b> · 반강자성체로 고정층 pinning, 자유층만 회전 → 비대칭</li><li><b>SQUID</b> · 조셉슨 접합 2개 + 초전도 링, 출력 전압이 Φ₀ 주기로 진동</li></ul></div></details>\n  </div>"}, "t12": {"title": "속도센서 · 금속탐지기 계산", "pts": "강의 예제", "html": "\n  \n  <p class=\"why\">강의 예제가 그대로 계산 문제로 나오기 좋은 두 가지: 침투 깊이와 RPM·차속.</p>\n<div class=\"card\" id=\"c12-A\">\n    <div class=\"card-top\"><span class=\"id\">12-A</span><span class=\"ttl\">금속탐지 최소 두께 (skin depth)</span><span class=\"tag\">강의 Example II</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">금속탐지</span><span class=\"kw\">최소 두께</span></div><p class=\"fline\">→ δ = √(ρ/(πfμ)) · μ = 4π×10⁻⁷</p></div>\n    <div class=\"fig\" data-coil='{\"f\": \"135 kHz\", \"m\": \"Al\"}'></div>\n    <div class=\"given\">알루미늄 ρ = <b class=\"v\">2.65×10⁻⁸ Ω·m</b>, μ ≈ μ₀ = <b class=\"v\">4π×10⁻⁷ H/m</b>, δ = 1/√(πfμσ), σ = 1/ρ</div>\n    <ol class=\"q\"><li>f = 135 kHz에서 검출 가능한 최소 두께</li><li>f = 20 kHz로 낮추면? 박막 검출에는 어느 쪽이 유리한가?</li></ol>\n    <details class=\"deep\"><summary>풀이 보기 · 공식 → 순서 → 차근차근 → 답안지 문장</summary><div class=\"dbody\"><div class=\"dsec\"><div class=\"dh\"><span>1</span>이 공식에 숫자만 넣으면 돼요</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">최소 두께</span><span class=\"fe\">δ = √( ρ ÷ (π × f × μ₀) ),  μ₀ = 4π×10⁻⁷</span><span class=\"fs\">이 문제: √(2.65×10⁻⁸ ÷ (π × 135000 × 4π×10⁻⁷)) = 0.223 mm</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>속도센서·금속탐지기</b> p.25 · Detectable minimum metal depth</li><li><b>속도센서·금속탐지기</b> p.26 · Example I (구리 10 GHz)</li><li><b>속도센서·금속탐지기</b> p.27 · Example II (알루미늄 135 kHz → 0.223 mm)</li><li><b>속도센서·금속탐지기</b> p.29 · 측정 거리 · 주파수</li></ul></div></div><div class=\"dsec\"><div class=\"dh\"><span>2</span>풀이 순서 (이 순서대로만)</div><ol class=\"flow\"><li>ρ, f, μ 단위 확인</li><li>πfμ 계산</li><li>ρ ÷ πfμ → √</li><li>mm로 변환, 주파수 비교</li></ol></div><div class=\"dsec\"><div class=\"dh\"><span>3</span>차근차근 풀이 (처음 보는 사람용)</div><h4>개념</h4><p>금속탐지 코일은 교류 자기장을 뿌려요. 금속 안에는 이 자기장 변화를 방해하는 소용돌이 전류(와전류)가 생기는데, 와전류는 표면 근처 얇은 층에서만 흘러요. 그 두께가 <b>침투 깊이 δ</b>예요. 금속이 δ보다 얇으면 와전류가 충분히 생기지 않아 잘 안 잡혀요.</p><h4>기호</h4><div class=\"tw\"><table class=\"t sm\"><tr><th>기호</th><th>뜻</th><th>값</th></tr><tr><td>f</td><td>주파수</td><td>135 kHz = 135 × 10³ Hz</td></tr><tr><td>μ</td><td>투자율 (자기장이 잘 통하는 정도)</td><td>4π × 10⁻⁷ H/m</td></tr><tr><td>σ</td><td>전기전도도 = 1/ρ</td><td>1/(2.65 × 10⁻⁸) S/m</td></tr></table></div><h4>계산</h4><ol class=\"st\"><li>σ가 분모의 분모라 ρ로 바꾸면 편해요: δ = √(ρ / (πfμ))</li><li>πfμ = 3.1416 × 135,000 × 1.2566×10⁻⁶ = 0.533</li><li>ρ / 0.533 = 2.65×10⁻⁸ / 0.533 = 4.97×10⁻⁸</li><li>δ = √(4.97×10⁻⁸) = 2.23 × 10⁻⁴ m = <b>0.223 mm</b></li></ol><h4>ii) 주파수를 낮추면</h4><p>δ ∝ 1/√f라서 주파수가 135/20 = 6.75배 작아지면 δ는 √6.75 = 2.6배 커져요 → 0.579 mm. 얇은 금속을 잡으려면 δ가 작아야 하니 <b>높은 주파수</b>가 유리해요.</p><div class=\"warn\"><b>자주 하는 실수</b> · μ에 상대투자율(1)을 넣으면 안 돼요. 강의 슬라이드에도 \"not relative permeability\"라고 강조돼 있어요. μ₀ = 4π × 10⁻⁷ H/m를 넣어요.</div></div><div class=\"dsec\"><div class=\"dh\"><span>4</span>답안지에 이렇게 쓰세요 · 시험용 짧은 버전</div><div class=\"xline\"><b>i)</b><q>\"δ = √(ρ/(πfμ₀)) = √(2.65×10⁻⁸/(π × 135×10³ × 4π×10⁻⁷)) = 0.223 mm\"</q></div><div class=\"xline\"><b>ii)</b><q>\"δ ∝ 1/√f → 20 kHz에서 0.579 mm. 박막은 δ가 작은 높은 주파수가 유리\"</q></div><ul class=\"final-list\"><li>i) 0.223 mm</li><li>ii) 0.579 mm · 박막은 높은 주파수가 유리</li></ul></div></div></details>\n    <details><summary>정답 확인</summary><div class=\"ans\">\n      <p class=\"final\">i) 0.223 mm &nbsp; ii) 0.579 mm, 박막은 높은 주파수가 유리</p>\n      <ol>\n        <li>δ = √(ρ/(πfμ)) → πfμ = 3.1416 × 135×10³ × 4π×10⁻⁷ = 0.533</li>\n        <li>δ = √(2.65×10⁻⁸ / 0.533) = 2.23×10⁻⁴ m = 0.223 mm</li>\n        <li>20 kHz: δ ∝ 1/√f → 0.223 × √(135/20) = 0.579 mm</li>\n      </ol>\n      <p class=\"one\">물체가 침투 깊이보다 두꺼워야 와전류가 충분히 생겨요. 주파수를 높이면 δ가 얇아져 얇은 금속도 잡을 수 있어요.</p>\n    </div></details>\n    <details class=\"calc-in\"><summary>fx-570ES PLUS 입력 순서</summary><div class=\"kbody\"><div class=\"krow\"><div class=\"kl\">δ (m)</div><div class=\"kk\"><kbd>√■</kbd><kbd class=\"n\">2.65</kbd><kbd>×10ˣ</kbd><kbd>(−)</kbd><kbd class=\"n\">8</kbd><kbd>÷</kbd><kbd>(</kbd><kbd>π</kbd><kbd>×</kbd><kbd class=\"n\">135</kbd><kbd>×10ˣ</kbd><kbd class=\"n\">3</kbd><kbd>×</kbd><kbd class=\"n\">4</kbd><kbd>×</kbd><kbd>π</kbd><kbd>×</kbd><kbd class=\"n\">1</kbd><kbd>×10ˣ</kbd><kbd>(−)</kbd><kbd class=\"n\">7</kbd><kbd>)</kbd><kbd>=</kbd></div><div class=\"kd\">2.2298×10⁻⁴</div></div><div class=\"krow\"><div class=\"kl\">mm로</div><div class=\"kk\"><kbd>Ans</kbd><kbd>×</kbd><kbd class=\"n\">1000</kbd><kbd>=</kbd></div><div class=\"kd\">0.22298</div></div><div class=\"krow\"><div class=\"kl\">20 kHz</div><div class=\"kk\"><kbd>√■</kbd><kbd class=\"n\">2.65</kbd><kbd>×10ˣ</kbd><kbd>(−)</kbd><kbd class=\"n\">8</kbd><kbd>÷</kbd><kbd>(</kbd><kbd>π</kbd><kbd>×</kbd><kbd class=\"n\">20</kbd><kbd>×10ˣ</kbd><kbd class=\"n\">3</kbd><kbd>×</kbd><kbd class=\"n\">4</kbd><kbd>×</kbd><kbd>π</kbd><kbd>×</kbd><kbd class=\"n\">1</kbd><kbd>×10ˣ</kbd><kbd>(−)</kbd><kbd class=\"n\">7</kbd><kbd>)</kbd><kbd>=</kbd></div><div class=\"kd\">5.7933×10⁻⁴</div></div><p class=\"knote\">√■를 누른 뒤 전체 식을 넣고 바로 = 를 눌러요. 루트 안에 분수식 전체가 들어가야 해요.</p></div></details>\n  </div>\n<div class=\"card\" id=\"c12-B\">\n    <div class=\"card-top\"><span class=\"id\">12-B</span><span class=\"ttl\">펄스로 회전수·차속 구하기</span><span class=\"tag\">강의 예제</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">펄스</span><span class=\"kw\">tooth</span></div><p class=\"fline\">→ RPM = 펄스/min ÷ tooth · m/s × 3.6 = km/h</p></div>\n    <div class=\"fig\" data-tone='{\"n\": 10}'></div>\n    <div class=\"given\">분당 펄스 <b class=\"v\">10,000</b>, tooth <b class=\"v\">10개</b>, 바퀴 반지름 <b class=\"v\">0.3 m</b></div>\n    <ol class=\"q\"><li>RPM</li><li>차속 (km/h)</li><li>tooth 48개 톤휠이 6,000 펄스/min일 때 초당 회전수</li></ol>\n    <details class=\"deep\"><summary>풀이 보기 · 공식 → 순서 → 차근차근 → 답안지 문장</summary><div class=\"dbody\"><div class=\"dsec\"><div class=\"dh\"><span>1</span>이 공식에 숫자만 넣으면 돼요</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">회전수</span><span class=\"fe\">RPM = 분당 펄스 ÷ tooth 수</span><span class=\"fs\">이 문제: 10000 ÷ 10 = 1000</span></div><div class=\"frow\"><span class=\"fl\">차속</span><span class=\"fe\">km/h = 2π × R × RPM ÷ 60 × 3.6</span><span class=\"fs\">이 문제: 2π × 0.3 × 1000 ÷ 60 × 3.6 = 113.1</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>속도센서·금속탐지기</b> p.11 · Digital output: Hall magnetic sensor</li><li><b>속도센서·금속탐지기</b> p.12 · 예제 (10,000 pulse/min, 10 teeth → 1,000 rpm)</li></ul></div></div><div class=\"dsec\"><div class=\"dh\"><span>2</span>풀이 순서 (이 순서대로만)</div><ol class=\"flow\"><li>펄스 ÷ tooth = rpm</li><li>÷ 60 = 회/s</li><li>× 2πR = m/s → × 3.6</li></ol></div><div class=\"dsec\"><div class=\"dh\"><span>3</span>차근차근 풀이 (처음 보는 사람용)</div><h4>개념</h4><p>톤휠의 tooth가 센서 앞을 하나 지나갈 때마다 펄스가 하나 나와요. 바퀴가 한 바퀴 돌면 tooth 수만큼 펄스가 나와요.</p><ol class=\"st\"><li>i) 1분에 10,000 펄스 ÷ 한 바퀴당 10 펄스 = 1분에 1,000바퀴 = <b>1,000 rpm</b></li><li>ii) 1초에 1000/60 = 16.67바퀴. 한 바퀴에 바퀴 둘레 2πR = 2 × 3.1416 × 0.3 = 1.885 m 이동</li><li>속도 = 1.885 × 16.67 = 31.4 m/s → km/h로는 × 3.6 (1 m/s = 3.6 km/h) = <b>113.1 km/h</b></li><li>iii) 6,000 ÷ 48 = 125 rpm → ÷ 60 = <b>2.08 회/s</b></li></ol><div class=\"warn\"><b>자주 하는 실수</b> · m/s → km/h는 × 3.6이에요. ÷ 3.6과 헷갈리면 차가 시속 8.7 km로 기어가는 답이 나와요.</div></div><div class=\"dsec\"><div class=\"dh\"><span>4</span>답안지에 이렇게 쓰세요 · 시험용 짧은 버전</div><div class=\"xline\"><b>i)</b><q>\"10,000 ÷ 10 = 1,000 rpm\"</q></div><div class=\"xline\"><b>ii)</b><q>\"2π × 0.3 × 1000/60 = 31.4 m/s = 113.1 km/h\"</q></div><div class=\"xline\"><b>iii)</b><q>\"6,000 ÷ 48 ÷ 60 = 2.08 회/s\"</q></div><ul class=\"final-list\"><li>i) 1,000 rpm</li><li>ii) 113.1 km/h</li><li>iii) 2.08 회/s</li></ul></div></div></details>\n    <details><summary>정답 확인</summary><div class=\"ans\">\n      <p class=\"final\">i) 1,000 rpm &nbsp; ii) 113.1 km/h &nbsp; iii) 2.08 회/s</p>\n      <ol>\n        <li>10,000 / 10 = 1,000 rpm</li>\n        <li>2πR × (1000/60) = 2π × 0.3 × 16.67 = 31.4 m/s × 3.6 = 113.1 km/h</li>\n        <li>6,000 / 48 = 125 rpm → 125/60 = 2.08 회/s</li>\n      </ol>\n    </div></details>\n    <details class=\"calc-in\"><summary>fx-570ES PLUS 입력 순서</summary><div class=\"kbody\"><div class=\"krow\"><div class=\"kl\">RPM</div><div class=\"kk\"><kbd class=\"n\">10000</kbd><kbd>÷</kbd><kbd class=\"n\">10</kbd><kbd>=</kbd></div><div class=\"kd\">1000</div></div><div class=\"krow\"><div class=\"kl\">km/h</div><div class=\"kk\"><kbd class=\"n\">2</kbd><kbd>×</kbd><kbd>π</kbd><kbd>×</kbd><kbd class=\"n\">0.3</kbd><kbd>×</kbd><kbd class=\"n\">1000</kbd><kbd>÷</kbd><kbd class=\"n\">60</kbd><kbd>×</kbd><kbd class=\"n\">3.6</kbd><kbd>=</kbd></div><div class=\"kd\">113.0973…</div></div><div class=\"krow\"><div class=\"kl\">회/s</div><div class=\"kk\"><kbd class=\"n\">6000</kbd><kbd>÷</kbd><kbd class=\"n\">48</kbd><kbd>÷</kbd><kbd class=\"n\">60</kbd><kbd>=</kbd></div><div class=\"kd\">2.083333…</div></div></div></details>\n  </div>\n<div class=\"gen\" id=\"g12\">\n    <div class=\"row\"><span><b class=\"k\">새 숫자로 한 번 더</b> · 침투 깊이 · 회전수 중 하나가 나와요</span><button class=\"btn\" data-gen=\"12\">새 문제</button></div>\n    <div class=\"out\"></div>\n  </div>"}, "t13": {"title": "속도센서 · 금속탐지기 서술형", "pts": "전체", "html": "\n  \n  <p class=\"why\">유도형 vs 홀 속도센서, 금속탐지기 구성과 진폭 검출, 와전류와 침투 깊이.</p>\n<div class=\"card\" id=\"c13-A\">\n    <div class=\"card-top\"><span class=\"id\">13-A</span><span class=\"ttl\">유도형 속도센서 vs 홀 속도센서</span><span class=\"tag ess\">서술형 · 강의 범위</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">V = −nΔΦ/Δt</span><span class=\"kw\">렌츠</span><span class=\"kw\">영구자석</span><span class=\"kw\">저속</span><span class=\"kw\">Schmitt trigger</span></div><p class=\"fline\">→ 유도형 = 자속 변화율 → 저속 출력↓, 전원 불필요 · 홀 = 자계 크기 → 저속 OK, Schmitt trigger로 디지털</p></div>\n    <ol class=\"q\"><li>유도형 속도센서의 동작 원리와 영구자석의 역할은?</li><li>유도형 속도센서의 장단점과 홀 센서를 쓰는 이유는?</li><li>아날로그 속도센서의 주요 고장과 진단법 두 가지를 쓰라.</li></ol>\n    <details class=\"deep\"><summary>풀이 보기 · 외울 것 → 답안 문장 → 쉬운 설명</summary><div class=\"dbody\">\n      <div class=\"dsec\"><div class=\"dh\"><span>1</span>외울 것 (키워드·식)</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">유도기전력</span><span class=\"fe\">V = −n ΔΦ/Δt</span></div><div class=\"frow\"><span class=\"fl\">렌츠</span><span class=\"fe\">유도 전류는 자속 변화를 방해하는 방향</span></div><div class=\"frow\"><span class=\"fl\">영구자석</span><span class=\"fe\">내부 자계 형성 → tooth 이동 시 큰 자속 변화</span></div><div class=\"frow\"><span class=\"fl\">홀 디지털</span><span class=\"fe\">출력이 자계 변화율과 무관 → 저속 OK · Schmitt trigger</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>속도센서·금속탐지기</b> p.5 · Inductive speed sensor 구조</li><li><b>속도센서·금속탐지기</b> p.6–7 · 전자기 유도 · 렌츠 · 영구자석 역할</li><li><b>속도센서·금속탐지기</b> p.8 · Speed vs 출력</li><li><b>속도센서·금속탐지기</b> p.9 · 고장 진단</li><li><b>속도센서·금속탐지기</b> p.11 · Hall 디지털 속도센서</li></ul></div></div>\n      <div class=\"dsec\"><div class=\"dh\"><span>2</span>답안지에 이렇게 쓰세요</div><p class=\"note\" style=\"margin:0 0 8px\">【 】 = 강의자료 원문 표현 (그대로 쓰면 안전) · 〔 〕 = 작년 교수님 답안 표현</p><div class=\"xline\"><b>Q1. 유도형 속도센서의 동작 원리와 영구자석의 역할은?</b><q>【Pole wheel의 teeth 표면에 ferromagnetic 물질】, 【Coil 내부에서 자기장의 변화는 코일에서 전압을 유도】, 【유도된 전압은 magnetic field 변화율·세기에 비례】(V = −nΔΦ/Δt, 【− 부호: 유도 전류는 자속의 변화를 방해하는 방향】). 【Permanent magnet은 센서 내부에 자기장을 형성】, 【이 자기장이 있어야 tooth의 이동에 따른 magnetic flux 변화가 빠르게 발생】, 【없으면 자기장이 매우 약해져 유효한 자속 변화가 작아진다】.</q></div><p class=\"easy\">쉬운 말로 → 톱니가 자석 앞을 지나면 코일 속 자기장이 출렁여 전압이 생겨요. 자석이 없으면 출렁일 게 없어요.</p><div class=\"xline\"><b>Q2. 유도형 속도센서의 장단점과 홀 센서를 쓰는 이유는?</b><q>유도형: 【영구자석과 코일만을 사용하므로 전원이 불필요한 장점】이나 【저속회전에서는 출력이 현저히 작아지는 단점】(RPM↑ → 자속 변화율↑ → 유도기전력↑). 홀: 【Output signal is not affected by the rate of change of the magnetic field】 → 저속에서도 신호 → 【자동차 속도 센서에는 Hall 센서가 널리 사용】. 【Schmitt trigger converts the analog to the digital by comparing with fixed reference(hysteresis)】. 【Duty cycle이 일정하지 않아도 주기 또는 pulse frequency를 측정하면 속도를 계산】.</q></div><p class=\"easy\">쉬운 말로 → 유도형은 느리면 신호가 거의 없고, 홀은 자기장 \"크기\"를 보니 느려도 돼요.</p><div class=\"xline\"><b>Q3. 아날로그 속도센서의 주요 고장과 진단법 두 가지를 쓰라.</b><q>【코일 단락: 출력 전압이 매우 낮거나 없음 → 코일 저항 측정】. 【센서 자석 약화: 저속에서 신호 검출 불량 → 출력 파형을 정상 센서와 비교】. 【Air gap 내 금속 분말: 자기장 왜곡·노이즈 → 육안 점검·청소】. 【Tooth 파손: 특정 위치 신호 누락 → 파형 확인】. 코일 저항 【약 500~1,500 Ω】, air gap 【약 0.8~1.5 mm】.</q></div><p class=\"easy\">쉬운 말로 → 코일·자석·공극·톱니, 네 군데를 봐요.</p></div>\n    </div></details>\n    <details><summary>정답 확인 · 핵심만</summary><div class=\"ans\"><ul class=\"final-list\"><li><b>유도기전력</b> · V = −n ΔΦ/Δt</li><li><b>렌츠</b> · 유도 전류는 자속 변화를 방해하는 방향</li><li><b>영구자석</b> · 내부 자계 형성 → tooth 이동 시 큰 자속 변화</li><li><b>홀 디지털</b> · 출력이 자계 변화율과 무관 → 저속 OK · Schmitt trigger</li></ul></div></details>\n  </div>\n<div class=\"card\" id=\"c13-B\">\n    <div class=\"card-top\"><span class=\"id\">13-B</span><span class=\"ttl\">금속탐지기 구성 · 진폭 검출 · 설계 선택</span><span class=\"tag ess\">서술형 · 강의 범위</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">LC tank</span><span class=\"kw\">와전류</span><span class=\"kw\">Z = R_eff + jωL_eff</span><span class=\"kw\">진폭</span><span class=\"kw\">shielded</span></div><p class=\"fline\">→ LC 발진 → 코일 AC 자계 → 금속 와전류 → 코일 임피던스 변화 → 진폭 검출 · 저항 변화 > 주파수 변화 · 낮은 f = 멀리·큰 것</p></div>\n    <ol class=\"q\"><li>유도형 근접센서(금속탐지기)의 구성과 동작 원리를 설명하라.</li><li>금속 검출에 주파수 변화보다 진폭 검출이 유효한 이유는?</li><li>동작 주파수, 코어, 차폐를 어떻게 선택하는가?</li></ol>\n    <details class=\"deep\"><summary>풀이 보기 · 외울 것 → 답안 문장 → 쉬운 설명</summary><div class=\"dbody\">\n      <div class=\"dsec\"><div class=\"dh\"><span>1</span>외울 것 (키워드·식)</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">구성</span><span class=\"fe\">LC Tank Oscillator → Sensor Coil → Target(Eddy) → Amplitude Detection/Demodulator → Output</span></div><div class=\"frow\"><span class=\"fl\">공진</span><span class=\"fe\">f = 1/(2π√LC)</span></div><div class=\"frow\"><span class=\"fl\">검출</span><span class=\"fe\">Z = R_eff + jωL_eff 변화 → 전류 진폭 변화</span></div><div class=\"frow\"><span class=\"fl\">주파수</span><span class=\"fe\">낮음 = 큰 타깃·장거리 / 높음 = 작은 타깃</span></div><div class=\"frow\"><span class=\"fl\">차폐</span><span class=\"fe\">Shielded = 전면 집중·정확 / Unshielded = 넓은 영역·긴 거리</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>속도센서·금속탐지기</b> p.15–16 · 구성도·동작원리</li><li><b>속도센서·금속탐지기</b> p.17–18 · LC tank · 동작 주파수·코어</li><li><b>속도센서·금속탐지기</b> p.20 · EM shielding</li><li><b>속도센서·금속탐지기</b> p.23 · 임피던스 변화 · 진폭 검출이 유효</li><li><b>속도센서·금속탐지기</b> p.29–30 · 측정 거리</li></ul></div></div>\n      <div class=\"dsec\"><div class=\"dh\"><span>2</span>답안지에 이렇게 쓰세요</div><p class=\"note\" style=\"margin:0 0 8px\">【 】 = 강의자료 원문 표현 (그대로 쓰면 안전) · 〔 〕 = 작년 교수님 답안 표현</p><div class=\"xline\"><b>Q1. 유도형 근접센서(금속탐지기)의 구성과 동작 원리를 설명하라.</b><q>【LC Tank Oscillator → 고주파 AC 발진】, 【Sensor Coil → 고주파 교류 자기장 생성】, 【Target Metal → 와전류(Eddy Current) 발생 → 2차 자기장 형성 → 센서 코일의 임피던스 및 인덕턴스 변화】, 【Amplitude Detection/Demodulator → 발진 진폭 변화 검출 및 복조】, 【Output Circuit → 기준값과 비교하여 ON/OFF 또는 DC 출력】.</q></div><p class=\"easy\">쉬운 말로 → 코일이 뿌린 자기장을 금속이 빨아들이면 발진이 작아지는 걸 잡아요.</p><div class=\"xline\"><b>Q2. 금속 검출에 주파수 변화보다 진폭 검출이 유효한 이유는?</b><q>【와전류에 의한 금속의 Joule heating 발생 → 코일에서 바라본 유효저항 R_eff 증가】, 【유효 인덕턴스 L_eff 변화】 → 【임피던스 Z = R_eff + jωL_eff 변화 → 코일 전류 변화】. 【철, 알루미늄, 황동, 스테인리스강 등을 검출 대상으로 하는 경우 주파수 변화보다 저항성분의 변화가 더 크다. 따라서 발진 전압의 진폭을 검출하는 것이 발진 주파수 검출보다 훨씬 유효】.</q></div><p class=\"easy\">쉬운 말로 → 금속이 오면 에너지를 뺏겨서(저항 증가) 진폭이 줄어드는 게 가장 크게 보여요.</p><div class=\"xline\"><b>Q3. 동작 주파수, 코어, 차폐를 어떻게 선택하는가?</b><q>주파수: 【낮은 주파수 → 큰 금속 타깃 및 장거리 검출】, 【높은 주파수 → 작은 금속 타깃 및 미세한 변화】. 코어: 【Magnetic core(NiFe) → 자속 집중, 인덕턴스·감도↑, 고주파 손실↑】 / 【Air coil → 손실·포화 없어 고주파·소형 금속 검출】. 차폐: 【Shielded → 자기장을 전면으로 집중, 검출 영역 좁고 정확한 위치 검출】 / 【Unshielded → 측면으로 넓게 퍼져 더 긴 검출 거리】. 【Magnetic core, shielded 센서가 긴 리딩거리를 제공】.</q></div><p class=\"easy\">쉬운 말로 → 멀리 보려면 낮은 주파수와 코어, 작은 걸 보려면 높은 주파수예요.</p></div>\n    </div></details>\n    <details><summary>정답 확인 · 핵심만</summary><div class=\"ans\"><ul class=\"final-list\"><li><b>구성</b> · LC Tank Oscillator → Sensor Coil → Target(Eddy) → Amplitude Detection/Demodulator → Output</li><li><b>공진</b> · f = 1/(2π√LC)</li><li><b>검출</b> · Z = R_eff + jωL_eff 변화 → 전류 진폭 변화</li><li><b>주파수</b> · 낮음 = 큰 타깃·장거리 / 높음 = 작은 타깃</li><li><b>차폐</b> · Shielded = 전면 집중·정확 / Unshielded = 넓은 영역·긴 거리</li></ul></div></details>\n  </div>\n<div class=\"card\" id=\"c13-C\">\n    <div class=\"card-top\"><span class=\"id\">13-C</span><span class=\"ttl\">와전류 · 침투 깊이 · 환경 간섭</span><span class=\"tag ess\">서술형 · 강의 범위</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">eddy current</span><span class=\"kw\">skin depth</span><span class=\"kw\">μ₀</span><span class=\"kw\">비자성</span><span class=\"kw\">permeability ~1</span></div><p class=\"fline\">→ 와전류 = 변하는 자계를 방해하는 2차 자계 · δ = 1/√(πfμσ), 두께 > δ 필요 · 자기장은 흙·물·오일 그대로 통과</p></div>\n    <ol class=\"q\"><li>와전류(eddy current)란 무엇이며 어떤 방향으로 흐르는가?</li><li>검출 가능한 최소 금속 두께는 어떻게 정해지며, 박막을 검출하기 어려운 이유는?</li><li>금속 종류에 따른 감도와, 오염 환경에 강한 이유는?</li></ol>\n    <details class=\"deep\"><summary>풀이 보기 · 외울 것 → 답안 문장 → 쉬운 설명</summary><div class=\"dbody\">\n      <div class=\"dsec\"><div class=\"dh\"><span>1</span>외울 것 (키워드·식)</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">와전류</span><span class=\"fe\">변화하는 자계 → 금속 내부 순환 전류 → 변화를 방해하는 2차 자계</span></div><div class=\"frow\"><span class=\"fl\">침투 깊이</span><span class=\"fe\">δ = 1/√(π f μ σ), μ = 재료 투자율(H/m)</span></div><div class=\"frow\"><span class=\"fl\">검출 조건</span><span class=\"fe\">검출물체 두께 > δ → 박막 검출 곤란</span></div><div class=\"frow\"><span class=\"fl\">감도</span><span class=\"fe\">전도도 높을수록↑ · 비금속 불가 · 자성체는 와전류↓지만 거리 길다</span></div><div class=\"frow\"><span class=\"fl\">오염</span><span class=\"fe\">투자율 ≈ 1 → 손실 없이 통과</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>속도센서·금속탐지기</b> p.21–22 · Eddy current 방향·자속 감소</li><li><b>속도센서·금속탐지기</b> p.24 · 금속 종류에 따른 감도</li><li><b>속도센서·금속탐지기</b> p.25–27 · Detectable minimum metal depth · skin depth</li><li><b>속도센서·금속탐지기</b> p.28 · 오염 환경 간섭</li></ul></div></div>\n      <div class=\"dsec\"><div class=\"dh\"><span>2</span>답안지에 이렇게 쓰세요</div><p class=\"note\" style=\"margin:0 0 8px\">【 】 = 강의자료 원문 표현 (그대로 쓰면 안전) · 〔 〕 = 작년 교수님 답안 표현</p><div class=\"xline\"><b>Q1. 와전류(eddy current)란 무엇이며 어떤 방향으로 흐르는가?</b><q>【변화하는 외부 자기장에 의해 금속 내부에 와전류가 유도】, 【와전류는 외부 자기장의 변화에 대항하는 방향의 2차 자기장을 생성】. 【N극이 금속 타깃에 접근하면 와전류는 접근하는 N극을 밀어내는 방향(금속 표면에 N극 형성)】, 【멀어지면 감소하는 자기선속을 유지하려는 방향(S극 형성)】. 【같은 자속을 유지하려면 회로에 더 큰 전류를 흘려야 한다】.</q></div><p class=\"easy\">쉬운 말로 → 금속 속 소용돌이 전류는 언제나 변화를 방해해요. 렌츠 법칙이에요.</p><div class=\"xline\"><b>Q2. 검출 가능한 최소 금속 두께는 어떻게 정해지며, 박막을 검출하기 어려운 이유는?</b><q>【와전류가 발생하는 검출물체의 최소 두께, 즉 침투 깊이는 skin depth 식 δ = 1/√(πfμσ)】, 【μ는 재료의 permeability(H/m), relative permeability가 아님】. 【효과적인 동작을 위해서는 검출물체의 두께가 이 침투깊이보다는 두꺼워야 한다】 → 【와전류 센서는 금속박막 검출에는 사용이 곤란】. 주파수↑ → δ↓.</q></div><p class=\"easy\">쉬운 말로 → 교류 자기장은 금속 표면 근처까지만 들어가요. 그보다 얇으면 와전류가 제대로 안 생겨요.</p><div class=\"xline\"><b>Q3. 금속 종류에 따른 감도와, 오염 환경에 강한 이유는?</b><q>【Detection sensitivity depends on the target material, higher for materials with higher electrical conductivity】. 【Non-metallic objects cannot be detected】. 【Magnetic materials: eddy current itself is significantly reduced; however detection sensitivity remains good and effective detection distance is relatively long】. 【Contaminants don’t interfere: resistant to dirt, dust, smoke, oil, grease】 — 【자기장은 흙, 수분, 오일, smoke gas, 나뭇잎, 돌, non-magnetic 금속에서 손실없이 그대로 통과(permeability ~1)】.</q></div><p class=\"easy\">쉬운 말로 → 전기가 잘 통할수록 잘 잡히고, 먼지·기름은 자기장이 그냥 통과해서 상관없어요.</p></div>\n    </div></details>\n    <details><summary>정답 확인 · 핵심만</summary><div class=\"ans\"><ul class=\"final-list\"><li><b>와전류</b> · 변화하는 자계 → 금속 내부 순환 전류 → 변화를 방해하는 2차 자계</li><li><b>침투 깊이</b> · δ = 1/√(π f μ σ), μ = 재료 투자율(H/m)</li><li><b>검출 조건</b> · 검출물체 두께 > δ → 박막 검출 곤란</li><li><b>감도</b> · 전도도 높을수록↑ · 비금속 불가 · 자성체는 와전류↓지만 거리 길다</li><li><b>오염</b> · 투자율 ≈ 1 → 손실 없이 통과</li></ul></div></details>\n  </div>"}, "t14": {"title": "정전용량형 가속도센서 V_o", "pts": "기출 6번 12점", "html": "\n  \n  <p class=\"why\">V_o = −V_s + 2V_s·C₁/(C₁+C₂) = (C₁ − C₂)/(C₁ + C₂)·V_s. C를 비율로만 주면 C₂를 1로 놓고 풀면 돼요.</p>\n<div class=\"card\" id=\"c14-A\">\n    <div class=\"card-top\"><span class=\"id\">14-A</span><span class=\"ttl\">작년 중간고사 6번</span><span class=\"tag ex\">기출 원본</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">C₁ = 2C₂</span><span class=\"kw\">±V_s</span><span class=\"kw\">1 MHz</span></div><p class=\"fline\">→ V_o = (C₁ − C₂)/(C₁ + C₂) · V_s · 고주파 = 속도 무관, 저전압 = 정전기력↓</p></div>\n    <div class=\"fig\" data-acc='{\"vs\":\"3 V\",\"c1\":\"C₁ = 2C₂\",\"c2\":\"C₂\"}'></div>\n    <div class=\"given\">V_s = <b class=\"v\">3 V</b> (1 MHz), C₁ = <b class=\"v\">2C₂</b></div>\n    <ol class=\"q\"><li>(8점) V_o를 구하라.</li><li>(4점) 3 V의 작은 전압, 1 MHz의 높은 주파수를 인가하는 이유는?</li></ol>\n    <details class=\"deep\"><summary>풀이 보기 · 공식 → 순서 → 차근차근 → 답안지 문장</summary><div class=\"dbody\"><div class=\"dsec\"><div class=\"dh\"><span>1</span>이 공식에 숫자만 넣으면 돼요</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">가속도센서 출력</span><span class=\"fe\">V_o = V_s × (C₁ − C₂) ÷ (C₁ + C₂)</span><span class=\"fs\">이 문제: 3 × (2 − 1) ÷ (2 + 1) = 1 V</span></div><div class=\"frow\"><span class=\"fl\">교수님 식 (같은 값)</span><span class=\"fe\">V_o = −V_s + 2V_s × C₁ ÷ (C₁ + C₂)</span><span class=\"fs\">이 문제: −3 + 6 × 2 ÷ 3 = 1 V</span></div><div class=\"frow\"><span class=\"fl\">기호</span><span class=\"fe\">C₁ = +V_s 쪽 · C₂ = −V_s 쪽</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>가속도센서·진동센서</b> 슬라이드 · Capacitance changes (C₁ = εA/(d−x), C₂ = εA/(d+x))</li><li><b>가속도센서·진동센서</b> 슬라이드 · Convert Capacitance into Voltage (V_C2 = C_eq·2V_s/C₂)</li><li><b>가속도센서·진동센서</b> 슬라이드 · High frequency & small V_s 인가하는 이유는?</li><li><b>작년 기출</b> 6번 · 교수님 풀이 V_o = −3 + (2C₂/3C₂)·6 = 1 V</li></ul></div></div><div class=\"dsec\"><div class=\"dh\"><span>2</span>풀이 순서 (이 순서대로만)</div><ol class=\"flow\"><li>C₂ = 1, C₁ = 2로 두기</li><li>C₂ 전압 = 2V_s × C₁/(C₁+C₂)</li><li>−V_s에 더해 V₀ → 버퍼 → V_o</li><li>ii) 고주파 → dV_s/dt 항 지배, 작은 전압 → 정전기력 최소</li></ol></div><div class=\"dsec\"><div class=\"dh\"><span>3</span>차근차근 풀이 (처음 보는 사람용)</div><h4>이 문제가 묻는 것</h4><p>위 끝 +V_s, 아래 끝 −V_s 사이에 C₁, C₂가 직렬로 있어요. 가운데 노드(proof mass) 전압 V₀를 버퍼(op-amp)로 그대로 꺼낸 게 V_o예요.</p><h4>먼저 알아야 할 것</h4><p><b>커패시터</b>는 마주 보는 두 판이에요. 판 사이가 가까울수록(d가 작을수록) 용량 C = εA/d가 커져요.</p><p>가속도센서 속 <b>proof mass</b>(추)는 두 고정 전극 사이에 매달려 있어요. 가속도가 오면 추가 한쪽으로 밀려서 한쪽 간격은 좁아지고(C₁↑) 반대쪽은 넓어져요(C₂↓).</p><p><b>직렬 커패시터의 전압 분배</b>: 커패시터 두 개를 일렬로 이으면 같은 전하 Q가 쌓여요. V = Q/C이니까 <b>C가 큰 쪽이 전압을 덜 가져가요</b> (저항 분배와 반대!).</p><div class=\"eqn\">V_C2 = 2V_s × C₁ / (C₁ + C₂)   (분자에 반대편 C)</div><h4>i) 한 단계씩</h4><ol class=\"st\"><li>양 끝 전압차 = +V_s − (−V_s) = 2V_s = 6 V</li><li>C₂가 가져가는 전압 = 6 × C₁/(C₁ + C₂) = 6 × 2C₂/(3C₂) = 6 × 2/3 = 4 V</li><li>가운데 노드 = 아래 끝(−3 V)에서 C₂ 전압만큼 올라감 = −3 + 4 = <b>1 V</b></li><li>버퍼는 전압을 그대로 복사 → V_o = 1 V</li></ol><p>정리식으로 하면 V_o = (C₁ − C₂)/(C₁ + C₂) × V_s = (2 − 1)/(2 + 1) × 3 = 1 V. C₂를 1로 놓고 C₁ = 2로 넣으면 편해요.</p><h4>직관으로 확인</h4><p>C₁이 커졌다 = 추가 위쪽(+V_s 쪽) 전극에 가까워졌다 → 가운데 전압이 +V_s 쪽으로 올라가요 → V_o > 0. 부호가 맞아요.</p><h4>ii) 작은 전압 · 높은 주파수</h4><p>커패시터 전류는 i_c = C(x)·dV_s/dt + V_s·(∂C/∂x)·dx/dt 두 부분으로 나뉘어요. 앞부분은 \"전압이 얼마나 빨리 바뀌나\", 뒷부분은 \"추가 얼마나 빨리 움직이나\"에 달려 있어요.</p><p>1 MHz처럼 빠르게 전압을 바꾸면 dV_s/dt가 엄청 커져서 앞부분만 남아요. 그러면 추가 움직이는 속도와 상관없이 지금의 C(x), 즉 <b>추의 위치</b>만 출력에 나와요.</p><p>전압을 크게 걸면 두 판 사이 정전기력(끌어당기는 힘)이 커져서 그 힘 자체가 추를 움직여 버려요. 측정하려는 가속도가 아닌 힘이 끼어드니까 <b>작은 3 V</b>를 써요.</p><div class=\"warn\"><b>자주 하는 실수</b> · 저항 분배처럼 V_C2 = 2V_s × C₂/(C₁ + C₂)로 쓰면 부호가 반대(V_o = −1 V)로 나와요. 커패시터는 <b>반대편 C</b>가 분자예요.</div></div><div class=\"dsec\"><div class=\"dh\"><span>4</span>답안지에 이렇게 쓰세요 · 시험용 짧은 버전</div><div class=\"xline\"><b>i)</b><q>\"V_o = −V_s + C₁/(C₁+C₂) × 2V_s = −3 + (2/3) × 6 = 1 V\"</q></div><div class=\"xline\"><b>ii)</b><q>\"i_c = C(x)·dV_s/dt + V_s·(∂C/∂x)·dx/dt에서 주파수를 높이면 dV_s/dt 항이 지배해 proof mass 속도와 무관하게 C(x) 변화만 출력한다. 전압이 크면 정전기력이 proof mass를 흔들므로 작은 전압을 쓴다\"</q></div><ul class=\"final-list\"><li>i) V_o = 1 V</li><li>ii) 고주파: proof mass 속도와 무관하게 C(x)만 읽기 · 작은 전압: 정전기력에 의한 proof mass 흔들림 방지</li></ul></div></div></details>\n    <details><summary>정답 확인</summary><div class=\"ans\">\n      <p class=\"final\">i) V_o = 1 V</p>\n      <ol>\n        <li>V_o = −3 + 2C₂/(2C₂ + C₂) × 6 = −3 + 4 = 1 V</li>\n        <li>또는 (C₁ − C₂)/(C₁ + C₂) × V_s = (1/3) × 3 = 1 V</li>\n      </ol>\n      <p class=\"one\">ii) i_c = C(x)·dV_s/dt + V_s·(∂C/∂x)·dx/dt. 주파수를 높이면 dV_s/dt 항이 지배해 proof mass 속도와 무관하게 순수한 C(x) 변화로 V_o를 얻어요. 전압을 작게 하는 건 큰 전압의 정전기력이 proof mass를 흔드는 것을 막기 위해서예요.</p>\n    </div></details>\n    <details class=\"calc-in\"><summary>fx-570ES PLUS 입력 순서</summary><div class=\"kbody\"><div class=\"krow\"><div class=\"kl\">기출식 그대로</div><div class=\"kk\"><kbd>(−)</kbd><kbd class=\"n\">3</kbd><kbd>+</kbd><kbd class=\"n\">2</kbd><kbd>×</kbd><kbd class=\"n\">3</kbd><kbd>×</kbd><kbd class=\"n\">2</kbd><kbd>÷</kbd><kbd>(</kbd><kbd class=\"n\">2</kbd><kbd>+</kbd><kbd class=\"n\">1</kbd><kbd>)</kbd><kbd>=</kbd></div><div class=\"kd\">1</div></div><div class=\"krow\"><div class=\"kl\">정리식</div><div class=\"kk\"><kbd>(</kbd><kbd class=\"n\">2</kbd><kbd>−</kbd><kbd class=\"n\">1</kbd><kbd>)</kbd><kbd>÷</kbd><kbd>(</kbd><kbd class=\"n\">2</kbd><kbd>+</kbd><kbd class=\"n\">1</kbd><kbd>)</kbd><kbd>×</kbd><kbd class=\"n\">3</kbd><kbd>=</kbd></div><div class=\"kd\">1</div></div><p class=\"knote\">C₂ = 1로 놓고 C₁ = 2를 넣었어요.</p></div></details>\n  </div>\n<div class=\"card\" id=\"c14-B\">\n    <div class=\"card-top\"><span class=\"id\">14-B</span><span class=\"ttl\">비율·부호를 바꾼 경우</span><span class=\"tag sim\">유사 · 함정</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">C 비율</span><span class=\"kw\">부호</span></div><p class=\"fline\">→ 작은 C를 1로 · 음수면 C₂ 쪽으로 움직임</p></div>\n    <div class=\"fig\" data-acc='{\"vs\": \"2 V\", \"c1\": \"C₁ = 3C₂\", \"c2\": \"C₂\"}'></div>\n    <ol class=\"q\">\n      <li>V_s = <b class=\"v\">2 V</b>, C₁ = <b class=\"v\">3C₂</b>일 때 V_o</li>\n      <li>V_s = <b class=\"v\">3 V</b>, C₂ = <b class=\"v\">2C₁</b> (proof mass가 반대로 움직임)일 때 V_o</li>\n      <li>가속도가 0일 때 V_o</li>\n    </ol>\n    <details class=\"deep\"><summary>풀이 보기 · 공식 → 순서 → 차근차근 → 답안지 문장</summary><div class=\"dbody\"><div class=\"dsec\"><div class=\"dh\"><span>1</span>이 공식에 숫자만 넣으면 돼요</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">가속도센서 출력</span><span class=\"fe\">V_o = V_s × (C₁ − C₂) ÷ (C₁ + C₂)</span><span class=\"fs\">이 문제: i) 2 × (3 − 1) ÷ (3 + 1) = 1 V · ii) 3 × (1 − 2) ÷ (1 + 2) = −1 V</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>가속도센서·진동센서</b> 슬라이드 · Convert Capacitance into Voltage (V_C2 = C_eq·2V_s/C₂)</li></ul></div></div><div class=\"dsec\"><div class=\"dh\"><span>2</span>풀이 순서 (이 순서대로만)</div><ol class=\"flow\"><li>작은 쪽을 1로</li><li>정리식에 대입</li><li>부호로 방향 판단</li></ol></div><div class=\"dsec\"><div class=\"dh\"><span>3</span>차근차근 풀이 (처음 보는 사람용)</div><h4>요령</h4><p>V_o = (C₁ − C₂)/(C₁ + C₂) × V_s에 작은 쪽을 1로 놓고 넣어요.</p><ol class=\"st\"><li>i) C₁ = 3, C₂ = 1 → (3 − 1)/(3 + 1) × 2 = 2/4 × 2 = <b>1 V</b></li><li>ii) C₁ = 1, C₂ = 2 → (1 − 2)/(1 + 2) × 3 = −1/3 × 3 = <b>−1 V</b></li><li>iii) 가속도 0 → 추가 가운데 → C₁ = C₂ → 분자 0 → <b>0 V</b></li></ol><h4>부호의 의미</h4><p>V_o가 +면 추가 C₁(+V_s) 쪽으로, −면 C₂(−V_s) 쪽으로 움직였다는 뜻이에요. 그래서 이 회로는 가속도의 <b>크기와 방향</b>을 둘 다 알려 줘요.</p></div><div class=\"dsec\"><div class=\"dh\"><span>4</span>답안지에 이렇게 쓰세요 · 시험용 짧은 버전</div><div class=\"xline\"><b>i)</b><q>\"(3−1)/(3+1) × 2 = 1 V\"</q></div><div class=\"xline\"><b>ii)</b><q>\"(1−2)/(1+2) × 3 = −1 V (proof mass가 C₂ 쪽으로 이동)\"</q></div><div class=\"xline\"><b>iii)</b><q>\"C₁ = C₂ → 0 V\"</q></div><ul class=\"final-list\"><li>i) 1 V</li><li>ii) −1 V</li><li>iii) 0 V</li></ul></div></div></details>\n    <details><summary>정답 확인</summary><div class=\"ans\">\n      <p class=\"final\">i) 1 V &nbsp; ii) −1 V &nbsp; iii) 0 V</p>\n      <ol>\n        <li>(3 − 1)/(3 + 1) × 2 = 1 V</li>\n        <li>(1 − 2)/(1 + 2) × 3 = −1 V (부호로 방향을 알 수 있음)</li>\n        <li>C₁ = C₂ → 0 V</li>\n      </ol>\n    </div></details>\n    <details class=\"calc-in\"><summary>fx-570ES PLUS 입력 순서</summary><div class=\"kbody\"><div class=\"krow\"><div class=\"kl\">i)</div><div class=\"kk\"><kbd>(</kbd><kbd class=\"n\">3</kbd><kbd>−</kbd><kbd class=\"n\">1</kbd><kbd>)</kbd><kbd>÷</kbd><kbd>(</kbd><kbd class=\"n\">3</kbd><kbd>+</kbd><kbd class=\"n\">1</kbd><kbd>)</kbd><kbd>×</kbd><kbd class=\"n\">2</kbd><kbd>=</kbd></div><div class=\"kd\">1</div></div><div class=\"krow\"><div class=\"kl\">ii)</div><div class=\"kk\"><kbd>(</kbd><kbd class=\"n\">1</kbd><kbd>−</kbd><kbd class=\"n\">2</kbd><kbd>)</kbd><kbd>÷</kbd><kbd>(</kbd><kbd class=\"n\">1</kbd><kbd>+</kbd><kbd class=\"n\">2</kbd><kbd>)</kbd><kbd>×</kbd><kbd class=\"n\">3</kbd><kbd>=</kbd></div><div class=\"kd\">−1</div></div></div></details>\n  </div>\n<div class=\"card\" id=\"c14-C\">\n    <div class=\"card-top\"><span class=\"id\">14-C</span><span class=\"ttl\">변위로 C₁, C₂, V_o 구하기</span><span class=\"tag sim\">유사 · 응용</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">d, x 주어짐</span></div><p class=\"fline\">→ C₁ = C₀d/(d − x), C₂ = C₀d/(d + x) · 검산 V_o = (x/d)V_s</p></div>\n    <div class=\"fig\" data-acc='{\"vs\": \"3 V\", \"c1\": \"C₁ = εA/(d−x)\", \"c2\": \"C₂ = εA/(d+x)\"}'></div>\n    <div class=\"given\">정지 시 C₀ = εA/d = <b class=\"v\">1 pF</b>, 간격 d = <b class=\"v\">2 μm</b>, proof mass 변위 x = <b class=\"v\">0.2 μm</b>, V_s = <b class=\"v\">3 V</b></div>\n    <ol class=\"q\"><li>C₁ = εA/(d − x), C₂ = εA/(d + x)</li><li>V_o</li></ol>\n    <details class=\"deep\"><summary>풀이 보기 · 공식 → 순서 → 차근차근 → 답안지 문장</summary><div class=\"dbody\"><div class=\"dsec\"><div class=\"dh\"><span>1</span>이 공식에 숫자만 넣으면 돼요</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">C₁, C₂</span><span class=\"fe\">C₁ = C₀ × d ÷ (d − x) · C₂ = C₀ × d ÷ (d + x)</span><span class=\"fs\">이 문제: 2 ÷ 1.8 = 1.111 pF · 2 ÷ 2.2 = 0.909 pF</span></div><div class=\"frow\"><span class=\"fl\">출력</span><span class=\"fe\">V_o = V_s × (C₁ − C₂) ÷ (C₁ + C₂)</span><span class=\"fs\">이 문제: 3 × 0.202 ÷ 2.020 = 0.3 V</span></div><div class=\"frow\"><span class=\"fl\">검산 [AI 보충]</span><span class=\"fe\">V_o = V_s × x ÷ d</span><span class=\"fs\">이 문제: 3 × 0.2 ÷ 2 = 0.3 V</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>가속도센서·진동센서</b> 슬라이드 · Capacitance changes (C₁ = εA/(d−x), C₂ = εA/(d+x))</li><li><b>가속도센서·진동센서</b> 슬라이드 · Convert Capacitance into Voltage (V_C2 = C_eq·2V_s/C₂)</li></ul></div></div><div class=\"dsec\"><div class=\"dh\"><span>2</span>풀이 순서 (이 순서대로만)</div><ol class=\"flow\"><li>εA = C₀ d</li><li>C₁, C₂ 계산</li><li>V_o 대입</li><li>x/d · V_s로 검산 [AI 보충]</li></ol></div><div class=\"dsec\"><div class=\"dh\"><span>3</span>차근차근 풀이 (처음 보는 사람용)</div><h4>이 문제가 묻는 것</h4><p>간격과 변위가 주어졌을 때 C₁, C₂를 직접 계산하고 V_o까지 가요.</p><h4>C₁, C₂</h4><p>C = εA/d이고 정지 때 εA/d = C₀ = 1 pF예요. 그러니 εA = C₀ × d.</p><ol class=\"st\"><li>C₁ = εA/(d − x) = C₀ × d/(d − x) = 1 × 2/(2 − 0.2) = 2/1.8 = <b>1.111 pF</b> (간격이 좁아짐 → 커짐)</li><li>C₂ = C₀ × d/(d + x) = 2/2.2 = <b>0.909 pF</b> (간격이 넓어짐 → 작아짐)</li></ol><h4>V_o</h4><div class=\"eqn\">(1.111 − 0.909)/(1.111 + 0.909) × 3 = 0.202/2.020 × 3 = 0.1 × 3 = <b>0.3 V</b></div><h4>검산식 [AI 보충]</h4><p>위 식들을 정리하면 V_o = (x/d) × V_s가 돼요. 0.2/2 × 3 = 0.3 V로 같아요. 출력이 변위에 정확히 비례하니까 가속도(변위 = ma/k)에도 비례해요.</p></div><div class=\"dsec\"><div class=\"dh\"><span>4</span>답안지에 이렇게 쓰세요 · 시험용 짧은 버전</div><div class=\"xline\"><b>i)</b><q>\"C₁ = 2/1.8 = 1.111 pF, C₂ = 2/2.2 = 0.909 pF\"</q></div><div class=\"xline\"><b>ii)</b><q>\"V_o = 3 × (1.111 − 0.909)/(1.111 + 0.909) = 0.3 V\"</q></div><ul class=\"final-list\"><li>C₁ = 1.111 pF, C₂ = 0.909 pF</li><li>V_o = 0.3 V</li></ul></div></div></details>\n    <details><summary>정답 확인</summary><div class=\"ans\">\n      <p class=\"final\">C₁ = 1.111 pF, C₂ = 0.909 pF &nbsp; V_o = 0.3 V</p>\n      <ol>\n        <li>C₁ = C₀·d/(d − x) = 2/1.8 = 1.111 pF, C₂ = 2/2.2 = 0.909 pF</li>\n        <li>(1.111 − 0.909)/(1.111 + 0.909) × 3 = 0.1 × 3 = 0.3 V</li>\n      </ol>\n      <p class=\"one\">[AI 보충] 식을 정리하면 V_o = (x/d)·V_s로 정확히 변위에 비례해요 (0.2/2 × 3 = 0.3 V). 검산용으로 쓰세요.</p>\n    </div></details>\n    <details class=\"calc-in\"><summary>fx-570ES PLUS 입력 순서</summary><div class=\"kbody\"><div class=\"krow\"><div class=\"kl\">C₁</div><div class=\"kk\"><kbd class=\"n\">2</kbd><kbd>÷</kbd><kbd class=\"n\">1.8</kbd><kbd>=</kbd></div><div class=\"kd\">1.111111…</div></div><div class=\"krow\"><div class=\"kl\">C₂</div><div class=\"kk\"><kbd class=\"n\">2</kbd><kbd>÷</kbd><kbd class=\"n\">2.2</kbd><kbd>=</kbd></div><div class=\"kd\">0.909090…</div></div><div class=\"krow\"><div class=\"kl\">V_o</div><div class=\"kk\"><kbd>(</kbd><kbd class=\"n\">2</kbd><kbd>÷</kbd><kbd class=\"n\">1.8</kbd><kbd>−</kbd><kbd class=\"n\">2</kbd><kbd>÷</kbd><kbd class=\"n\">2.2</kbd><kbd>)</kbd><kbd>÷</kbd><kbd>(</kbd><kbd class=\"n\">2</kbd><kbd>÷</kbd><kbd class=\"n\">1.8</kbd><kbd>+</kbd><kbd class=\"n\">2</kbd><kbd>÷</kbd><kbd class=\"n\">2.2</kbd><kbd>)</kbd><kbd>×</kbd><kbd class=\"n\">3</kbd><kbd>=</kbd></div><div class=\"kd\">0.3</div></div><div class=\"krow\"><div class=\"kl\">검산 x/d</div><div class=\"kk\"><kbd class=\"n\">0.2</kbd><kbd>÷</kbd><kbd class=\"n\">2</kbd><kbd>×</kbd><kbd class=\"n\">3</kbd><kbd>=</kbd></div><div class=\"kd\">0.3</div></div></div></details>\n  </div>\n<div class=\"gen\" id=\"g9\">\n    <div class=\"row\"><span><b class=\"k\">새 숫자로 한 번 더</b> · 전압과 C 비율이 바뀌어요</span><button class=\"btn\" data-gen=\"9\">새 문제</button></div>\n    <div class=\"out\"></div>\n  </div>"}, "t15": {"title": "가속도·진동 파라미터 · 서술형", "pts": "전체", "html": "\n  \n  <p class=\"why\">Zero-g·노이즈 밀도 계산 하나(15-A)와 측정 원리·설계조건·파라미터·압전형·진동 분석 서술형.</p>\n<div class=\"card\" id=\"c15-A\">\n    <div class=\"card-top\"><span class=\"id\">15-A</span><span class=\"ttl\">노이즈 밀도 · Zero-g 출력</span><span class=\"tag\">강의 예제</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">noise density</span><span class=\"kw\">zero g</span></div><p class=\"fline\">→ σ ÷ 감도 ÷ √BW · Zero-g = (+1g + −1g)/2</p></div>\n    <ol class=\"q\">\n      <li>0 g 출력 노이즈 표준편차 <b class=\"v\">1 mV</b>, 감도 <b class=\"v\">1 V/g</b>, 대역폭 <b class=\"v\">100 Hz</b>일 때 노이즈 밀도</li>\n      <li>+1 g 출력 <b class=\"v\">1.85 V</b>, 180° 뒤집어 −1 g 출력 <b class=\"v\">1.45 V</b>일 때 Zero-g 출력과 감도</li>\n    </ol>\n    <details class=\"deep\"><summary>풀이 보기 · 공식 → 순서 → 차근차근 → 답안지 문장</summary><div class=\"dbody\"><div class=\"dsec\"><div class=\"dh\"><span>1</span>이 공식에 숫자만 넣으면 돼요</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">노이즈 밀도</span><span class=\"fe\">σ ÷ 감도 ÷ √BW</span><span class=\"fs\">이 문제: 1 mV ÷ 1 V/g ÷ √100 = 0.1 mg/√Hz</span></div><div class=\"frow\"><span class=\"fl\">Zero-g</span><span class=\"fe\">(V₊₁g + V₋₁g) ÷ 2</span><span class=\"fs\">이 문제: (1.85 + 1.45) ÷ 2 = 1.65 V</span></div><div class=\"frow\"><span class=\"fl\">감도</span><span class=\"fe\">(V₊₁g − V₋₁g) ÷ 2</span><span class=\"fs\">이 문제: (1.85 − 1.45) ÷ 2 = 0.2 V/g</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>가속도센서·진동센서</b> 슬라이드 · Noise Density (단위 g/√Hz) · 예시 1 V/g, 1 mV, 100 Hz</li><li><b>가속도센서·진동센서</b> 슬라이드 · Zero g output voltage</li></ul></div></div><div class=\"dsec\"><div class=\"dh\"><span>2</span>풀이 순서 (이 순서대로만)</div><ol class=\"flow\"><li>노이즈를 g로 바꾸고 √BW로 나누기</li><li>+1 g, −1 g 평균 = Zero-g</li><li>차이 ÷ 2 g = 감도</li></ol></div><div class=\"dsec\"><div class=\"dh\"><span>3</span>차근차근 풀이 (처음 보는 사람용)</div><h4>i) 노이즈 밀도</h4><ol class=\"st\"><li>0 g에서 출력이 1 mV 정도 흔들려요 (노이즈)</li><li>감도 1 V/g로 나눠 가속도로 바꿔요: 1 mV ÷ 1 V/g = 0.001 g = 1 mg (mg = 밀리 g)</li><li>대역폭이 넓을수록 노이즈가 많이 섞이니, 공정하게 비교하려고 √대역폭으로 나눠요: 1 mg ÷ √100 = <b>0.1 mg/√Hz</b></li></ol><h4>ii) Zero-g와 감도</h4><p>센서를 무중력으로 만들 수 없으니 지구 중력을 이용해요. 똑바로 두면 +1 g, 뒤집으면 −1 g가 걸려요. 0 g는 정확히 그 가운데예요.</p><ol class=\"st\"><li>Zero-g = (1.85 + 1.45)/2 = <b>1.65 V</b></li><li>감도 = 출력 변화 ÷ 입력 변화 = (1.85 − 1.45) ÷ (1 − (−1)) = 0.4 ÷ 2 = <b>0.2 V/g</b></li></ol><div class=\"warn\"><b>자주 하는 실수</b> · 감도를 0.4 V/g로 쓰는 실수가 많아요. +1 g에서 −1 g까지는 2 g 차이예요.</div></div><div class=\"dsec\"><div class=\"dh\"><span>4</span>답안지에 이렇게 쓰세요 · 시험용 짧은 버전</div><div class=\"xline\"><b>i)</b><q>\"1 mV ÷ 1 V/g = 1 mg → ÷ √100 = 0.1 mg/√Hz\"</q></div><div class=\"xline\"><b>ii)</b><q>\"Zero-g = (1.85 + 1.45)/2 = 1.65 V, 감도 = (1.85 − 1.45)/2 = 0.2 V/g\"</q></div><ul class=\"final-list\"><li>i) 0.1 mg/√Hz</li><li>ii) Zero-g 1.65 V, 감도 0.2 V/g</li></ul></div></div></details>\n    <details><summary>정답 확인</summary><div class=\"ans\">\n      <p class=\"final\">i) 0.1 mg/√Hz &nbsp; ii) 1.65 V, 0.2 V/g</p>\n      <ol>\n        <li>1 mV ÷ 1 V/g = 1 mg → ÷ √100 = 0.1 mg/√Hz</li>\n        <li>Zero-g = (1.85 + 1.45)/2 = 1.65 V</li>\n        <li>감도 = (1.85 − 1.45)/(+1 − (−1)) = 0.2 V/g</li>\n      </ol>\n    </div></details>\n    <details class=\"calc-in\"><summary>fx-570ES PLUS 입력 순서</summary><div class=\"kbody\"><div class=\"krow\"><div class=\"kl\">노이즈 밀도 (g)</div><div class=\"kk\"><kbd class=\"n\">1</kbd><kbd>×10ˣ</kbd><kbd>(−)</kbd><kbd class=\"n\">3</kbd><kbd>÷</kbd><kbd class=\"n\">1</kbd><kbd>÷</kbd><kbd>√■</kbd><kbd class=\"n\">100</kbd><kbd>=</kbd></div><div class=\"kd\">1×10⁻⁴ (= 0.1 mg)</div></div><div class=\"krow\"><div class=\"kl\">Zero-g</div><div class=\"kk\"><kbd>(</kbd><kbd class=\"n\">1.85</kbd><kbd>+</kbd><kbd class=\"n\">1.45</kbd><kbd>)</kbd><kbd>÷</kbd><kbd class=\"n\">2</kbd><kbd>=</kbd></div><div class=\"kd\">1.65</div></div><div class=\"krow\"><div class=\"kl\">감도</div><div class=\"kk\"><kbd>(</kbd><kbd class=\"n\">1.85</kbd><kbd>−</kbd><kbd class=\"n\">1.45</kbd><kbd>)</kbd><kbd>÷</kbd><kbd class=\"n\">2</kbd><kbd>=</kbd></div><div class=\"kd\">0.2</div></div></div></details>\n  </div>\n<div class=\"card\" id=\"c15-B\">\n    <div class=\"card-top\"><span class=\"id\">15-B</span><span class=\"ttl\">측정 원리 · 차동 용량식 · 설계조건</span><span class=\"tag ess\">서술형 · 강의 범위</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">F = ma</span><span class=\"kw\">x = ma/k</span><span class=\"kw\">C₁ = εA/(d−x)</span><span class=\"kw\">진공 패키징</span></div><p class=\"fline\">→ a → F = ma → x = ma/k → C₁↑ C₂↓ → ΔC = C₁ − C₂ ≈ 2εAΔx/d² → V_o · 큰 g = high k·low m, gap > 진폭, 진공</p></div>\n    <ol class=\"q\"><li>가속도센서가 가속도를 측정하는 원리를 설명하라.</li><li>차동 용량식(differential capacitive) 검출을 식으로 설명하라.</li><li>가속도센서 설계조건을 쓰라.</li></ol>\n    <details class=\"deep\"><summary>풀이 보기 · 외울 것 → 답안 문장 → 쉬운 설명</summary><div class=\"dbody\">\n      <div class=\"dsec\"><div class=\"dh\"><span>1</span>외울 것 (키워드·식)</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">원리</span><span class=\"fe\">F = ma → proof mass 변위 → 정전용량 변화 → 전압</span></div><div class=\"frow\"><span class=\"fl\">차동</span><span class=\"fe\">C₁ = εA/(d−x)↑, C₂ = εA/(d+x)↓, ΔC ≈ 2εAΔx/d²</span></div><div class=\"frow\"><span class=\"fl\">설계</span><span class=\"fe\">proof mass ≤ 0.1 g · 큰 가속도 = high k, lower m · gap > 최대 진폭 · 두꺼운 mass = 응력↓</span></div><div class=\"frow\"><span class=\"fl\">패키징</span><span class=\"fe\">진공 없으면 air damping·습도로 성능 제한</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>가속도·진동센서</b> 슬라이드 · How to measure acceleration · 단위 g</li><li><b>가속도·진동센서</b> 슬라이드 · 차동 용량식 · Capacitance changes</li><li><b>가속도·진동센서</b> 슬라이드 · 설계조건(Substrate, Proof-mass, gap, 진공 패키징)</li><li><b>가속도·진동센서</b> 슬라이드 · 제작기술 고려사항</li></ul></div></div>\n      <div class=\"dsec\"><div class=\"dh\"><span>2</span>답안지에 이렇게 쓰세요</div><p class=\"note\" style=\"margin:0 0 8px\">【 】 = 강의자료 원문 표현 (그대로 쓰면 안전) · 〔 〕 = 작년 교수님 답안 표현</p><div class=\"xline\"><b>Q1. 가속도센서가 가속도를 측정하는 원리를 설명하라.</b><q>【뉴턴의 제2법칙 F = ma】, 【가속도 a를 경험하면 질량체(proof mass)에 힘이 작용】 → 【질량체가 고정 전극에 대해 변위】 → 【전극 사이의 정전용량이 변화】 → 【전압으로 변환되며 이 전압은 가속도에 비례】. 【질량체의 변위를 감지함으로써 가속도를 간접적으로 측정】. Hooke 법칙 F = kx → x = ma/k.</q></div><p class=\"easy\">쉬운 말로 → 가속도가 생기면 매달린 추가 밀려요. 밀린 거리를 전기로 재요.</p><div class=\"xline\"><b>Q2. 차동 용량식(differential capacitive) 검출을 식으로 설명하라.</b><q>【가동전극은 두 고정전극 사이의 중심】, x = 0이면 【C₁ = C₂ = C₀ = εA/d】. 변위 x: 【C₁ = εA/(d−x), C₂ = εA/(d+x)】, Δx ≪ d이면 【ΔC = εA(2Δx)/d²】. 【질량의 변위 x는 두 정전용량의 차(C₁ − C₂)로부터 구해진다】. 【현재 MEMS 가속도 센서의 대부분은 차동 용량식】.</q></div><p class=\"easy\">쉬운 말로 → 한쪽 간격은 좁아지고 반대쪽은 넓어져요. 그 차이를 읽어요.</p><div class=\"xline\"><b>Q3. 가속도센서 설계조건을 쓰라.</b><q>【Substrate: low parasitic capacitance, low temperature coefficient of expansion】. 【Proof-mass weight is very light: no more than 0.1 g】. 【측정하려는 가속도값이 크다면 high k(stiff beam), lower m】. 【Capacitor gap은 진동의 최대 진폭보다 커야】. 【No buckling, no mechanical stress → thicker proof-mass lowers stress】. 【Vacuum packaging: 없으면 gas(air) damping effect와 humidity effect로 성능이 크게 제한】.</q></div><p class=\"easy\">쉬운 말로 → 큰 충격을 재려면 단단한 스프링과 가벼운 추, 전극은 안 부딪힐 간격, 공기는 빼요.</p></div>\n    </div></details>\n    <details><summary>정답 확인 · 핵심만</summary><div class=\"ans\"><ul class=\"final-list\"><li><b>원리</b> · F = ma → proof mass 변위 → 정전용량 변화 → 전압</li><li><b>차동</b> · C₁ = εA/(d−x)↑, C₂ = εA/(d+x)↓, ΔC ≈ 2εAΔx/d²</li><li><b>설계</b> · proof mass ≤ 0.1 g · 큰 가속도 = high k, lower m · gap > 최대 진폭 · 두꺼운 mass = 응력↓</li><li><b>패키징</b> · 진공 없으면 air damping·습도로 성능 제한</li></ul></div></details>\n  </div>\n<div class=\"card\" id=\"c15-C\">\n    <div class=\"card-top\"><span class=\"id\">15-C</span><span class=\"ttl\">주요 파라미터 · Zero-g · 대역폭 · 노이즈 밀도</span><span class=\"tag ess\">서술형 · 강의 범위</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">Sensitivity V/g</span><span class=\"kw\">full-scale</span><span class=\"kw\">Zero-g</span><span class=\"kw\">bandwidth</span><span class=\"kw\">g/√Hz</span></div><p class=\"fline\">→ Zero-g = (+1g + −1g)/2 · 대역폭 수백 Hz = 스프링 + 내부 공기 damping · 노이즈 밀도 = σ/감도/√BW</p></div>\n    <ol class=\"q\"><li>Zero-g 출력은 어떻게 측정하는가?</li><li>정전용량형 가속도센서의 대역폭이 수백 Hz로 제한되는 이유는?</li><li>노이즈 밀도의 정의와 측정 방법을 쓰라.</li><li>측정범위(full-scale range)와 범위를 벗어나면 생기는 일은?</li></ol>\n    <details class=\"deep\"><summary>풀이 보기 · 외울 것 → 답안 문장 → 쉬운 설명</summary><div class=\"dbody\">\n      <div class=\"dsec\"><div class=\"dh\"><span>1</span>외울 것 (키워드·식)</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">감도</span><span class=\"fe\">mV/g, 입력 기계적 변화당 출력 변화</span></div><div class=\"frow\"><span class=\"fl\">측정범위</span><span class=\"fe\">최소 검출 진폭 ~ 출력 왜곡 전 최대 [g]</span></div><div class=\"frow\"><span class=\"fl\">Zero-g</span><span class=\"fe\">[Out(+1g) + Out(−1g)]/2</span></div><div class=\"frow\"><span class=\"fl\">대역폭</span><span class=\"fe\">응답하는 진동 주파수 범위, 사람 동작 10~12 Hz → 40~60 Hz 충분</span></div><div class=\"frow\"><span class=\"fl\">노이즈 밀도</span><span class=\"fe\">0 g σ → ÷감도 → ÷√Hz</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>가속도·진동센서</b> 슬라이드 · 주요 파라미터</li><li><b>가속도·진동센서</b> 슬라이드 · Sensitivity, Measurement range</li><li><b>가속도·진동센서</b> 슬라이드 · Zero g output voltage</li><li><b>가속도·진동센서</b> 슬라이드 · Bandwidth 40~1000 Hz</li><li><b>가속도·진동센서</b> 슬라이드 · Noise Density 예시</li></ul></div></div>\n      <div class=\"dsec\"><div class=\"dh\"><span>2</span>답안지에 이렇게 쓰세요</div><p class=\"note\" style=\"margin:0 0 8px\">【 】 = 강의자료 원문 표현 (그대로 쓰면 안전) · 〔 〕 = 작년 교수님 답안 표현</p><div class=\"xline\"><b>Q1. Zero-g 출력은 어떻게 측정하는가?</b><q>【센서를 무중력 상태로 만드는 것이 아니라 지구의 중력 1 g를 기준으로 측정】. 【측정축을 중력 방향으로 정렬하여 +1 g 출력 측정, 180° 회전하여 −1 g 출력 측정】, 【Zero-g Output = [Output(@+1g) + Output(@−1g)]/2】. 【실제 센서는 Offset, 온도, 응력, 조립 상태 등에 의해 이상적인 값에서 벗어날 수 있음】.</q></div><p class=\"easy\">쉬운 말로 → 똑바로 한 번, 뒤집어서 한 번 재고 평균을 내요.</p><div class=\"xline\"><b>Q2. 정전용량형 가속도센서의 대역폭이 수백 Hz로 제한되는 이유는?</b><q>【Bandwidth: the range of vibration frequencies to which the accelerometer responds】. 【For a capacitive accelerometer, the bandwidth is only a few hundred Hertz because of their physical geometry (spring) and the air trapped inside the IC that acts as a damper】. 【Humans cannot create body motion beyond 10~12 Hz → 40~60 Hz면 사람 동작 감지에 충분】.</q></div><p class=\"easy\">쉬운 말로 → 스프링과 갇힌 공기가 빠른 흔들림을 못 따라가요.</p><div class=\"xline\"><b>Q3. 노이즈 밀도의 정의와 측정 방법을 쓰라.</b><q>【특정 주파수에서 센서 출력에 나타나는 노이즈의 크기를 주파수 대역으로 정규화한 값(단위 g/√Hz)】. 【0 g에서 출력 전압의 랜덤한 흔들림 측정 → 표준편차(RMS) → 감도[V/g]로 나누어 g RMS로 변환 → √Hz로 정규화】. 예: 감도 1 V/g, 노이즈 1 mV, BW 100 Hz → 0.1 mg/√Hz.</q></div><p class=\"easy\">쉬운 말로 → 출력 떨림을 g로 바꾸고 대역폭 제곱근으로 나눠 공평하게 비교해요.</p><div class=\"xline\"><b>Q4. 측정범위(full-scale range)와 범위를 벗어나면 생기는 일은?</b><q>【the range between the smallest detectable amplitude to the largest amplitude before distorting the output signal】. 【센서 범위를 벗어난 경우 응답이 왜곡되거나 정확하지 않을 수 있음】. 진동 측정 범위는 【proof mass 최대 진폭에 좌우】, 【큰 진동을 감지하는 센서의 proof mass 질량은 낮은 편】.</q></div><p class=\"easy\">쉬운 말로 → 추가 끝까지 밀리면 더 이상 못 재요.</p></div>\n    </div></details>\n    <details><summary>정답 확인 · 핵심만</summary><div class=\"ans\"><ul class=\"final-list\"><li><b>감도</b> · mV/g, 입력 기계적 변화당 출력 변화</li><li><b>측정범위</b> · 최소 검출 진폭 ~ 출력 왜곡 전 최대 [g]</li><li><b>Zero-g</b> · [Out(+1g) + Out(−1g)]/2</li><li><b>대역폭</b> · 응답하는 진동 주파수 범위, 사람 동작 10~12 Hz → 40~60 Hz 충분</li><li><b>노이즈 밀도</b> · 0 g σ → ÷감도 → ÷√Hz</li></ul></div></details>\n  </div>\n<div class=\"card\" id=\"c15-D\">\n    <div class=\"card-top\"><span class=\"id\">15-D</span><span class=\"ttl\">압전형 가속도센서 · 진동센서 · 신호 분석</span><span class=\"tag ess\">서술형 · 강의 범위</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">q = dF</span><span class=\"kw\">정적 불가</span><span class=\"kw\">진동센서 = 고주파 가속도센서</span><span class=\"kw\">FFT</span></div><p class=\"fline\">→ 압전: 힘 → 분극 → 전하 q = d·m·a, V = q/C · 정적 가속도 검출 불가 · 진동센서 = bandwidth↑ noise↓ 최적화 · 시간/주파수 영역</p></div>\n    <ol class=\"q\"><li>압전형 가속도센서의 원리와 장단점을 쓰라.</li><li>진동센서와 가속도센서의 관계를 설명하라.</li><li>진동 신호의 시간 영역 분석과 주파수 영역 분석의 차이는?</li><li>측정한 가속도에서 속도와 거리를 구하는 방법은?</li></ol>\n    <details class=\"deep\"><summary>풀이 보기 · 외울 것 → 답안 문장 → 쉬운 설명</summary><div class=\"dbody\">\n      <div class=\"dsec\"><div class=\"dh\"><span>1</span>외울 것 (키워드·식)</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">구조</span><span class=\"fe\">압전소자를 베이스와 추 사이에 고정, 종효과</span></div><div class=\"frow\"><span class=\"fl\">식</span><span class=\"fe\">q = dᵢⱼF = dᵢⱼma, V = q/C</span></div><div class=\"frow\"><span class=\"fl\">장단점</span><span class=\"fe\">구조 간단·강도 큼 → 큰 가속도·충격 / 정적 가속도 검출 불가</span></div><div class=\"frow\"><span class=\"fl\">진동센서</span><span class=\"fe\">기본구조 동일, 고주파용, bandwidth↑ noise↓</span></div><div class=\"frow\"><span class=\"fl\">분석</span><span class=\"fe\">시간 영역: 크기·지속시간·과도 / 주파수 영역(FFT): 성분·진폭·필터링</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>가속도·진동센서</b> 슬라이드 · 압전형 가속도센서 구조·장단점</li><li><b>가속도·진동센서</b> 슬라이드 · q = dᵢⱼF = dᵢⱼma</li><li><b>가속도·진동센서</b> 슬라이드 · 진동센서 정의 · 가속도센서와 관계</li><li><b>가속도·진동센서</b> 슬라이드 · 시간 영역 · 주파수 영역 분석</li><li><b>가속도·진동센서</b> 슬라이드 · 가속도 → 속도 → 거리</li></ul></div></div>\n      <div class=\"dsec\"><div class=\"dh\"><span>2</span>답안지에 이렇게 쓰세요</div><p class=\"note\" style=\"margin:0 0 8px\">【 】 = 강의자료 원문 표현 (그대로 쓰면 안전) · 〔 〕 = 작년 교수님 답안 표현</p><div class=\"xline\"><b>Q1. 압전형 가속도센서의 원리와 장단점을 쓰라.</b><q>【평판 또는 원판 모양의 압전소자를 베이스와 추 사이에 고정시킨 구조, 압전현상의 종효과를 이용】. 【압전결정에 힘을 가하면 내부에서 전기 분극이 발생하여 결정 표면에 전하】, 【q = dᵢⱼF = dᵢⱼma(dᵢⱼ: 압전계수 C/N)】, 출력전압 V = q/C. 【구조가 간단하고 기계적 강도도 커서 큰 가속도 및 충격 계측에 적합】, 【정적인 가속도를 검출할 수 없다는 결점】.</q></div><p class=\"easy\">쉬운 말로 → 누르면 전기가 나오는 결정이에요. 충격에는 좋지만 가만히 있는 가속도(중력)는 못 재요.</p><div class=\"xline\"><b>Q2. 진동센서와 가속도센서의 관계를 설명하라.</b><q>【진동: 기계 또는 구성요소의 평형 위치에 대한 움직임 또는 떨림, 단위 g】. 【진동센서는 가속도센서를 사용하여 측정: a(t) → proof mass의 움직임 → 진동의 크기와 주파수】. 【진동센서와 가속도센서는 기본구조가 동일】, 【진동센서는 고주파 가속도 센서라 볼 수 있으며 bandwidth와 frequency를 높이고 noise를 최소화하는 구조로 최적화】.</q></div><p class=\"easy\">쉬운 말로 → 같은 센서인데 빠른 떨림용으로 다듬은 거예요.</p><div class=\"xline\"><b>Q3. 진동 신호의 시간 영역 분석과 주파수 영역 분석의 차이는?</b><q>【시간 영역: 시간에 따른 진동의 패턴과 과도 현상(Transient Event)을 식별, 크기(Magnitude)와 지속 시간(Duration) 확인】. 【주파수 영역(FFT): 각 주파수 성분과 그 진폭을 시각화하여 특정 진동 패턴과 주파수를 식별, 노이즈 및 원하지 않는 진동 성분을 필터링】.</q></div><p class=\"easy\">쉬운 말로 → 언제 얼마나 흔들렸나는 시간 그래프, 무슨 주파수가 섞였나는 FFT예요.</p><div class=\"xline\"><b>Q4. 측정한 가속도에서 속도와 거리를 구하는 방법은?</b><q>【Time 1과 Time 2를 결정하고 a의 값을 평균 → 평균한 a 값에 시간차를 곱하여 속도】, 【두 시간 지점의 속도 v를 평균 → 시간을 곱하여 거리 → 앞에서 얻어진 거리에 합하여 총 이동거리】. 【두 시간대를 짧게 하여 정확도를 높인다】.</q></div><p class=\"easy\">쉬운 말로 → 구간마다 평균 × 시간을 더해 가요. 간격이 짧을수록 정확해요.</p></div>\n    </div></details>\n    <details><summary>정답 확인 · 핵심만</summary><div class=\"ans\"><ul class=\"final-list\"><li><b>구조</b> · 압전소자를 베이스와 추 사이에 고정, 종효과</li><li><b>식</b> · q = dᵢⱼF = dᵢⱼma, V = q/C</li><li><b>장단점</b> · 구조 간단·강도 큼 → 큰 가속도·충격 / 정적 가속도 검출 불가</li><li><b>진동센서</b> · 기본구조 동일, 고주파용, bandwidth↑ noise↓</li><li><b>분석</b> · 시간 영역: 크기·지속시간·과도 / 주파수 영역(FFT): 성분·진폭·필터링</li></ul></div></details>\n  </div>\n<div class=\"gen\" id=\"g15\">\n    <div class=\"row\"><span><b class=\"k\">새 숫자로 한 번 더</b> · 노이즈 밀도 · Zero-g 숫자가 바뀌어요</span><button class=\"btn\" data-gen=\"15\">새 문제</button></div>\n    <div class=\"out\"></div>\n  </div>"}};

        `δ = ${r4(d * 1000)} mm`, [`δ = √(ρ/(πfμ))`, `πfμ = π × ${sci(f)} × 4π×10⁻⁷ = ${r4(Math.PI * f * 4 * Math.PI * 1e-7)}`, `δ = √(${sci(met[1])}/${r4(Math.PI * f * 4 * Math.PI * 1e-7)}) = ${sci(d)} m = ${r4(d * 1000)} mm`], 'c12-A',
        [['δ (m)', `√■ ${fk(met[1])} ÷ ( π × ${fk(f)} × 4 × π × 1 ×10ˣ (−) 7 ) =`, disp(d)], ['mm로', 'Ans × 1000 =', disp(d * 1000)]]);
    }
    if (kind === 'rpm') {
      const teeth = pick([10, 24, 36, 48, 60]), rpm = pick([300, 600, 800, 1000, 1200]), R = pick([0.25, 0.3, 0.32, 0.35]);
      const pulses = rpm * teeth, v = 2 * Math.PI * R * rpm / 60 * 3.6;

        [['RPM', `${pulses} ÷ ${teeth} =`, String(rpm)], ['Hz', `${pulses} ÷ 60 =`, disp(pulses / 60)], ['km/h', `2 × π × ${R} × ${rpm} ÷ 60 × 3.6 =`, disp(v)]]);

      `(i) ${r4(nd * 1000)} mg/√Hz · (ii) Zero-g ${r4((up + down) / 2)} V, 감도 ${r4((up - down) / 2)} V/g`,
      [`${sig} mV ÷ ${S} V/g = ${r4(sig / S)} mg → ÷ √${BW} = ${r4(nd * 1000)} mg/√Hz`, `Zero-g = (${up} + ${down})/2 = ${r4((up + down) / 2)} V`, `감도 = (${up} − ${down})/2 = ${r4((up - down) / 2)} V/g`], 'c15-A',

  }

 dbGen(base){const mode=base?'v2db':pick(['v2db','p2db','db2v','db2p']);const r=pick([2,10,100,0.5,0.1,1000,0.01]);const dB=pick([6,20,40,-20,3,-6,60]);
  if(mode==='v2db'||mode==='p2db'){const k=mode==='v2db'?20:10;const v=k*Math.log10(r);
   return {kind:base?'기본':'유사',title:'비율 → dB',q:`${mode==='v2db'?'전압':'전력'} 비율이 ${r}배일 때 몇 {{dB}}인가?`,first:[`${mode==='v2db'?'전압·전류는 20 log':'전력은 10 log'}`,'log 10 = 1, log 2 ≈ 0.301'],
    steps:[{h:'공식',b:`<div class="ln">dB = ${k} × log(${r})</div><div class="rd">${mode==='v2db'?'전력은 전압의 제곱(P = V²/R)이라 2 × 10 = 20':'전력 비율은 10 log'}</div>`},{h:'log',b:`<div class="ln">log(${r}) = ${fx(Math.log10(r),4)}</div>`},{h:'곱하기',b:`<div class="ln">${k} × ${fx(Math.log10(r),4)} = ${fx(v,4)} dB</div>`}],
    ans:`${fx(v,4)} dB`,ansRead:`${fxR(v,4)} 데시벨`,calc:calcBlock([[[...ks(k),'log',...ks(r),')','='],casioDec(v)]],['[log]를 누르면 "log(" 괄호가 같이 열려요']),easy:'dB는 "10배를 몇 번 했나"를 세는 단위예요. 전압 10배 = 20 dB.'}}
  const k=mode==='db2v'?20:10;const v=10**(dB/k);
  return {kind:'응용',title:'dB → 비율',q:`${dB} dB는 ${mode==='db2v'?'전압':'전력'} 비율로 몇 배인가?`,first:[`비율 = 10^(dB/${k})`],
   steps:[{h:'거꾸로 풀기',b:`<div class="ln">${dB} = ${k} log(비율) → log(비율) = ${dB}/${k} = ${fx(dB/k,4)}</div>`},{h:'10의 거듭제곱',b:`<div class="ln">비율 = 10^(${fx(dB/k,4)}) = ${fx(v,4)}배</div><div class="rd">${dB<0?'− dB → 1보다 작음 (감쇠)':'+ dB → 증폭'}</div>`}],
   ans:`${fx(v,4)}배`,ansRead:`${fxR(v,4)}배`,calc:calcBlock([[['SHIFT','log',...nk(dB),'÷',...ks(k),'='],casioDec(v),'SHIFT log = 10ˣ']],[]),easy:'dB를 20(전압) 또는 10(전력)으로 나눈 만큼 10을 거듭제곱해요.'}},
 propSense(){const C=pick([
   ['C = εA/d','간격 d','2배','C','½배','d는 분모 → 반비례'],['P = V²/R','전압 V','3배','P','9배','V가 제곱 → 3² = 9'],['f = 1/(2π√(LC))','인덕턴스 L','4배','f','½배','√ 안 분모 → 1/√4 = 1/2'],
   ['δ = √(2ρ/(ωμ))','주파수 f(ω)','4배','표피 깊이 δ','½배','√ 안 분모 → 1/√4'],['F = q·v·B','자기장 B','2배','힘 F','2배','비례'],['x = ma/k','스프링 상수 k','2배','변위 x','½배','분모 → 반비례'],
   ['R = ρL/A','지름 D (A = πD²/4)','2배','저항 R','¼배','A ∝ D² → R ∝ 1/D²'],['P = εσT⁴A','절대온도 T','2배','복사 전력 P','16배','T⁴ → 2⁴ = 16']]);
  return {kind:'유사',title:'무엇이 커지면 어떻게 되나',q:`${C[0]}에서 ${C[1]}가 ${C[2]}가 되면 ${C[3]}는?`,first:['분자면 비례, 분모면 반비례','제곱·루트는 배수에도 제곱·루트'],
   steps:[{h:'위치 보기',b:`<div class="ln">${C[5]}</div>`},{h:'결과',b:`<div class="ln">${C[3]} → ${C[4]}</div>`}],ans:`${C[4]}`,ansRead:C[4],calc:'<p class="small muted">계산기 필요 없음 — 식의 모양만 봐요.</p>',
   easy:'식에서 위(분자)에 있으면 같이 커지고, 아래(분모)에 있으면 반대로 작아져요.'}},
 pythag(){const R=pick([30,40,50,60,100]),X=pick([10,15,20,30,40]);const Z=Math.hypot(R,X);
  return {kind:'유사',title:'제곱과 루트 — 크기 구하기',q:`Z = ${R} + j${X} {{ohm}}의 크기 |Z|는?`,first:['|Z| = √(R² + X²) (피타고라스)'],
   steps:[{h:'제곱',b:`<div class="ln">${R}² = ${R*R}, ${X}² = ${X*X}</div>`},{h:'더하고 루트',b:`<div class="ln">√(${R*R} + ${X*X}) = √${R*R+X*X} = ${fx(Z,4)} Ω</div>`}],
   ans:`${fx(Z,4)} Ω`,ansRead:`${fxR(Z,4)} 옴`,calc:calcBlock([[['√■',...ks(R),'x²','+',...ks(X),'x²','='],Number.isInteger(Z)?String(Z):'√ 꼴 → S⇔D'],[['S⇔D'],casioDec(Z)]],[W_SD]),easy:'가로 R, 세로 X인 직각삼각형의 빗변 길이예요.'}},
 calcSci(){const X=pick([10,20,15]),f=pick([1,2,5]),fe=pick([6,9]);const v=X/(2*Math.PI*f*10**fe);const S=sci(v,4);const e3=Math.floor(S.e/3)*3;
  return {kind:'유사',title:'계산기로 π와 지수가 섞인 식',q:`L = ${X} ÷ (2π × ${f} × 10${sup(fe)})을 계산하고 접두어로 나타내라.`,first:['분모는 괄호로 묶기','π = SHIFT ×10ˣ'],
   steps:[{h:'분모',b:`<div class="ln">2π × ${f} × 10${sup(fe)} = ${sciT(sci(2*Math.PI*f*10**fe,4))}</div>`},{h:'나누기',b:`<div class="ln">${X} ÷ ${sciT(sci(2*Math.PI*f*10**fe,4))} = ${sciT(S)}</div>`},{h:'ENG',b:`<div class="ln">= ${fx(v/10**e3,4)} × 10${sup(e3)} → ${fx(v/10**e3,4)} ${PFX[String(e3)][0]}H</div>`}],
   ans:`${fx(v/10**e3,4)} ${PFX[String(e3)][0]}H`,ansRead:`${fxR(v/10**e3,4)} ${PFX[String(e3)][1]}헨리`,
   calc:calcBlock([[[...ks(X),'÷','(','2','SHIFT','×10ˣ',...K(f,fe),')','='],casioDec(v)],[['ENG'],`${fx(v/10**e3,4)}×10${sup(e3)}`]],[W_PI,'괄호를 안 치면 ÷2 다음 ×π가 곱해져 버려요','분수 결과가 나오면 S⇔D']),
   easy:'분모 전체를 괄호로 감싸는 게 핵심이에요. 안 그러면 계산기가 앞에서부터 나누고 곱해요.'}},
 calcEqn(){const x=pick([-3,-2,1,2,3,4]),y=pick([-2,-1,1,2,5]);const a1=pick([1,2,3]),b1=pick([1,-1,2]),a2=pick([1,-1,4]),b2=pick([3,-2,1]);if(a1*b2-a2*b1===0)return GEN.calcEqn();const c1=a1*x+b1*y,c2=a2*x+b2*y;
  const tm=(a,v,first)=>(a<0?(first?'−':' − '):first?'':' + ')+(Math.abs(a)===1?'':Math.abs(a))+v;
  return {kind:'유사',title:'연립방정식 — EQN 모드',q:`${tm(a1,'x',1)}${tm(b1,'y')} = ${c1},  ${tm(a2,'x',1)}${tm(b2,'y')} = ${c2}`,first:['MODE 5 1','a₁ b₁ c₁ a₂ b₂ c₂ 순서'],
   steps:[{h:'계수 표',b:`<div class="ln">a₁ = ${a1}, b₁ = ${b1}, c₁ = ${c1}</div><div class="ln">a₂ = ${a2}, b₂ = ${b2}, c₂ = ${c2}</div><div class="rd">x 앞 숫자 = a, y 앞 숫자 = b, 등호 오른쪽 = c (없는 항은 0)</div>`},
    {h:'손으로 검산 (소거법)',b:`<div class="ln">x = (c₁b₂ − c₂b₁)/(a₁b₂ − a₂b₁) = (${c1*b2} − ${c2*b1})/(${a1*b2} − ${a2*b1}) = ${x}</div><div class="ln">y = (a₁c₂ − a₂c₁)/(a₁b₂ − a₂b₁) = ${y}</div>`}],
   ans:`x = ${x}, y = ${y}`,ansRead:`x는 ${x}, y는 ${y}`,calc:calcBlock([[['MODE','5','1'],'anX+bnY=cn 표'],[[...nk(a1),'=',...nk(b1),'=',...nk(c1),'=',...nk(a2),'=',...nk(b2),'=',...nk(c2),'='],'계수 입력 완료'],[['='],`X = ${x}`],[['='],`Y = ${y}`],[['MODE','1'],'COMP로 복귀']],[W_NEG.replace('지수 앞 ','음수 계수 ')]),
   easy:'계수만 순서대로 넣으면 계산기가 풀어줘요. 순서(a→b→c)를 틀리지 않는 게 전부예요.'}},
 calcRad(){const d=pick([30,45,60,90,120,15]);const r=d*Math.PI/180;
  return {kind:'유사',title:'도 → 라디안, 그리고 sin',q:`${d}°는 몇 {{rad}}인가? sin ${d}°의 값은?`,first:['rad = 도 × π/180','계산기 각도 모드 확인 (D/R)'],
   steps:[{h:'변환',b:`<div class="ln">${d} × π/180 = ${piForm(d,180)} = ${fx(r,4)} rad</div>`},{h:'sin',b:`<div class="ln">sin ${d}° = ${fx(Math.sin(r),4)}</div><div class="rd">화면 위 D(Deg)일 때 도로 계산 · R(Rad)이면 라디안</div>`}],
   ans:`${fx(r,4)} rad · sin = ${fx(Math.sin(r),4)}`,ansRead:`${fxR(r,4)} 라디안`,calc:calcBlock([[[...ks(d),'×','SHIFT','×10ˣ','÷','1','8','0','='],piForm(d,180)],[['S⇔D'],casioDec(r)],[['SHIFT','MODE','3'],'Deg 모드'],[['sin',...ks(d),')','='],casioDec(+Math.sin(r).toPrecision(10))]],[W_PI]),
   easy:'반 바퀴(180°)가 π 라디안이에요. 도에 π/180을 곱하면 돼요.'}}
});
