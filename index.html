><kbd>÷</kbd><kbd class=\"n\">22.71</kbd><kbd>×</kbd><kbd class=\"n\">2.02</kbd><kbd>=</kbd></div><div class=\"kd\">8.8947×10⁻⁸</div></div><div class=\"krow\"><div class=\"kl\">μg로</div><div class=\"kk\"><kbd>Ans</kbd><kbd>×</kbd><kbd class=\"n\">1</kbd><kbd>×10ˣ</kbd><kbd class=\"n\">6</kbd><kbd>=</kbd></div><div class=\"kd\">0.088947</div></div></div></details>\n  </div>\n<div class=\"gen\" id=\"g5\">\n    <div class=\"row\"><span><b class=\"k\">새 숫자로 한 번 더</b> · 기체·ppm·용기·센서 면적이 바뀌어요</span><button class=\"btn\" data-gen=\"5\">새 문제</button></div>\n    <div class=\"out\"></div>\n  </div>"}, "t5": {"title": "2선식 vs 4선식", "pts": "HW2-1", "html": "\n  \n  <p class=\"why\">2선식은 라인 저항이 센서와 직렬로 끼어요. 4선식은 전압선에 전류가 0이라 라인 전압강하가 0이에요.</p>\n<div class=\"card\" id=\"c5-A\">\n    <div class=\"card-top\"><span class=\"id\">5-A</span><span class=\"ttl\">HW2 1번</span><span class=\"tag hw\">HW2 원본 · 제출 완료</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">2 wire</span><span class=\"kw\">4 wire</span><span class=\"kw\">line 10 Ω</span><span class=\"kw\">R_in = ∞</span></div><p class=\"fline\">→ 2선: 직렬 I = V/(R + 2r) · 4선: <b>전압선 I = 0 → 강하 0</b></p></div>\n    <div class=\"fig\" data-wire='{\"v\":\"1 V\",\"rs\":\"200 Ω\",\"rl\":\"10 Ω\"}'></div>\n    <div class=\"given\">1 V 전원, 센서 <b class=\"v\">200 Ω</b>, 긴 개별 라인 저항 <b class=\"v\">10 Ω</b></div>\n    <ol class=\"q\">\n      <li>2선식: 센서 200 Ω에 걸리는 전압, 전류</li>\n      <li>2선식: 두 metal line에 걸리는 전압, 전류</li>\n      <li>4선식: 센서 200 Ω에 걸리는 전압, 전류</li>\n      <li>4선식: 각 라인에 걸리는 전압, 전류 (모든 라인)</li>\n    </ol>\n    <details class=\"deep\"><summary>풀이 보기 · 공식 → 순서 → 차근차근 → 답안지 문장</summary><div class=\"dbody\"><div class=\"dsec\"><div class=\"dh\"><span>1</span>이 공식에 숫자만 넣으면 돼요</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">2선식 전류</span><span class=\"fe\">I = V ÷ (R_센서 + 2r)</span><span class=\"fs\">이 문제: 1 ÷ (200 + 20) = 4.545 mA</span></div><div class=\"frow\"><span class=\"fl\">각 저항 전압</span><span class=\"fe\">V = I × R</span><span class=\"fs\">이 문제: 센서 0.909 V · 선 하나 0.0455 V</span></div><div class=\"frow\"><span class=\"fl\">4선식 전압선</span><span class=\"fe\">I = 0 → V = 0</span><span class=\"fs\">이 문제: 전압선 0 A · 0 V</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>가스센서01</b> p.12–13 · Why use four wires · 정전류원, 전압 측정단 고임피던스</li><li><b>가스센서01</b> p.14 · Why use three wires (read only)</li><li><b>HW2</b> 1번 · 2선식·4선식, 라인 10 Ω</li></ul></div></div><div class=\"dsec\"><div class=\"dh\"><span>2</span>풀이 순서 (이 순서대로만)</div><ol class=\"flow\"><li>2선식: 직렬 → 전체 저항 → 전류 → 각 전압</li><li>4선식: 전류선과 전압선 나누기</li><li>전압선 전류 0 → 강하 0</li></ol></div><div class=\"dsec\"><div class=\"dh\"><span>3</span>차근차근 풀이 (처음 보는 사람용)</div><h4>이 문제가 묻는 것</h4><p>같은 200 Ω 센서를 2선식과 4선식으로 잴 때, 선 저항(10 Ω) 때문에 생기는 차이를 숫자로 확인하는 문제예요.</p><h4>먼저 알아야 할 것</h4><p><b>옴의 법칙</b> V = I × R: 저항에 전류가 흐르면 그 저항 양단에 전압이 생겨요 (전압강하).</p><p><b>직렬 회로</b>: 한 줄로 이어진 저항에는 <b>같은 전류</b>가 흐르고, 전체 저항은 더하기예요. 각 저항이 가져가는 전압을 다 더하면 전원 전압이 돼요.</p><p><b>전압계의 입력저항 R_in = ∞</b>: 이상적인 전압계는 전류를 전혀 빨아들이지 않아요. 전류가 0이면 그 선에 저항이 있어도 V = 0 × R = 0, 전압강하가 없어요. 4선식의 핵심이 이거예요.</p><p>긴 선(lead wire)도 금속이라 저항이 있어요. 센서와 측정기가 멀리 떨어져 있으면 이 선 저항이 무시할 수 없을 만큼 커지고, 온도에 따라 변하기도 해요.</p><h4>2선식 생각하는 순서</h4><ol class=\"st\"><li>전원 → 선 10 Ω → 센서 200 Ω → 선 10 Ω → 전원: 전부 한 줄(직렬)</li><li>전체 저항을 더하고, 옴의 법칙으로 전류 I를 구해요</li><li>같은 I가 모든 저항에 흘러요 → 센서 전압 = I × 200, 선 하나 전압 = I × 10</li><li>검산: 선 전압 2개 + 센서 전압 = 1 V가 되어야 해요</li></ol><h4>4선식 생각하는 순서</h4><ol class=\"st\"><li>바깥 두 선 = 전류를 보내는 선, 안쪽 두 선 = 전압만 재는 선으로 나눠요</li><li>전압 재는 선은 R_in = ∞에 연결 → 그 선에 흐르는 전류는?</li><li>전류가 그렇다면 그 선의 전압강하(I × 10)는?</li><li>그래서 측정기가 보는 전압은 센서 양단 전압과 같은가?</li></ol><div class=\"warn\"><b>자주 하는 실수</b> · 4선식 전류선에는 전류가 흘러요. \"4선식은 모든 선 전류가 0\"이 아니라 <b>전압선만</b> 0이에요.</div><h4>숫자로 풀기 (제출 답안과 같음)</h4><ol class=\"st\"><li>2선식 전체 = 10 + 200 + 10 = 220 Ω → I = 1/220 = <b>4.545 mA</b></li><li>센서 V = 4.545 mA × 200 = 200/220 = <b>0.909 V</b></li><li>라인 하나 V = 4.545 mA × 10 = 10/220 = <b>0.0455 V</b> (두 라인 합 0.0909 V)</li><li>4선식: 1 V가 전류선–센서–전류선으로 흐름 → 같은 4.545 mA, 센서 0.909 V, 전류선 각 0.0455 V</li><li>전압선 2개: R_in = ∞ → I ≈ 0 → V = 0 × 10 = <b>0 V</b></li></ol><p>2선식과 4선식 모두 센서에는 0.909 V가 걸려요. 차이는 <b>측정기가 읽는 값</b>이에요: 2선식은 1 V(선 포함), 4선식은 0.909 V(센서만).</p></div><div class=\"dsec\"><div class=\"dh\"><span>4</span>답안지에 이렇게 쓰세요 · 시험용 짧은 버전</div><div class=\"xline\"><b>i)</b><q>\"직렬이므로 I = 1/(10+200+10) = 4.545 mA, V = 4.545 mA × 200 = 0.909 V\"</q></div><div class=\"xline\"><b>ii)</b><q>\"같은 전류 4.545 mA, 라인 하나 V = 4.545 mA × 10 = 0.0455 V (두 라인 0.0909 V)\"</q></div><div class=\"xline\"><b>iii)</b><q>\"I = 4.545 mA, V = 0.909 V\"</q></div><div class=\"xline\"><b>iv)</b><q>\"전류선 2개: 4.545 mA, 0.0455 V. 전압선 2개: 전압계 입력저항 ∞ → I = 0, V = 0 V\"</q></div><ul class=\"final-list\"><li>i) 0.909 V, 4.545 mA</li><li>ii) 각 라인 0.0455 V, 4.545 mA</li><li>iii) 0.909 V, 4.545 mA</li><li>iv) 전류선 각 0.0455 V·4.545 mA, 전압선 0 A·0 V</li></ul></div></div></details>\n    <details><summary>정답 확인 · 제출 답안과 일치 ✓</summary><div class=\"ans\">\n      <p class=\"final\">i) 0.909 V, 4.545 mA &nbsp; ii) 각 라인 0.0455 V, 4.545 mA (두 라인 합 0.0909 V) &nbsp; iii) 0.909 V, 4.545 mA &nbsp; iv) 전류선 각 0.0455 V·4.545 mA, 전압선 각 0 A·0 V</p>\n      <ol>\n        <li>2선식: 전체 = 10 + 200 + 10 = 220 Ω → I = 1/220 = 4.545 mA</li>\n        <li>센서 V = 4.545 mA × 200 = 0.909 V (= 200/220), 라인 하나 V = 4.545 mA × 10 = 0.0455 V</li>\n        <li>검산: 0.0455 + 0.909 + 0.0455 = 1 V</li>\n        <li>4선식: 1 V가 전류선(10 Ω) – 센서(200 Ω) – 전류선(10 Ω)으로 흐름 → 같은 4.545 mA, 센서 0.909 V</li>\n        <li>전압선 2개: R_in = ∞ → I ≈ 0 → V = 0 × 10 Ω = 0 V → 전압계는 센서 0.909 V를 그대로 읽음</li>\n      </ol>\n      <p class=\"one\">4선식 iii)은 \"1 V 전원이 전류선을 통해 센서에 걸린다\"로 해석한 답이에요. 교수님 그림 해석에 따라 다를 수 있어서, 채점 결과가 나오면 맞춰 드릴게요 (추정).</p>\n    </div></details>\n    <details class=\"calc-in\"><summary>fx-570ES PLUS 입력 순서</summary><div class=\"kbody\"><div class=\"krow\"><div class=\"kl\">전류 I</div><div class=\"kk\"><kbd class=\"n\">1</kbd><kbd>÷</kbd><kbd>(</kbd><kbd class=\"n\">10</kbd><kbd>+</kbd><kbd class=\"n\">200</kbd><kbd>+</kbd><kbd class=\"n\">10</kbd><kbd>)</kbd><kbd>=</kbd></div><div class=\"kd\">1/220 → S⇔D → 4.5454×10⁻³</div></div><div class=\"krow\"><div class=\"kl\">센서 전압</div><div class=\"kk\"><kbd>Ans</kbd><kbd>×</kbd><kbd class=\"n\">200</kbd><kbd>=</kbd></div><div class=\"kd\">10/11 → S⇔D → 0.909090…</div></div><div class=\"krow\"><div class=\"kl\">라인 전압</div><div class=\"kk\"><kbd class=\"n\">1</kbd><kbd>÷</kbd><kbd class=\"n\">220</kbd><kbd>×</kbd><kbd class=\"n\">10</kbd><kbd>=</kbd></div><div class=\"kd\">1/22 → S⇔D → 0.045454…</div></div></div></details>\n  </div>\n<div class=\"card\" id=\"c5-B\">\n    <div class=\"card-top\"><span class=\"id\">5-B</span><span class=\"ttl\">숫자를 바꾼 HW2 1번</span><span class=\"tag sim\">유사</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">2선 오차</span></div><p class=\"fline\">→ 2선은 선 저항까지 읽음 → (R + 2r) · 4선은 R만</p></div>\n    <div class=\"fig\" data-wire='{\"v\": \"2 V\", \"i\": \"4 mA\", \"rs\": \"500 Ω\", \"rl\": \"25 Ω\"}'></div>\n    <div class=\"given\">전원 <b class=\"v\">2 V</b>, 센서 <b class=\"v\">500 Ω</b>, 개별 라인 저항 <b class=\"v\">25 Ω</b>. 4선식은 정전류원 <b class=\"v\">4 mA</b>, 전압계 입력저항 ∞</div>\n    <ol class=\"q\">\n      <li>2선식: 센서 전압·전류, 라인 하나의 전압</li>\n      <li>2선식으로 전원 양단 V/I를 센서 저항이라고 하면 몇 Ω으로 읽히나? 오차는 몇 %인가?</li>\n      <li>4선식: 센서 전압, 전압선 전류와 전압강하, 계산되는 센서 저항</li>\n    </ol>\n    <details class=\"deep\"><summary>풀이 보기 · 공식 → 순서 → 차근차근 → 답안지 문장</summary><div class=\"dbody\"><div class=\"dsec\"><div class=\"dh\"><span>1</span>이 공식에 숫자만 넣으면 돼요</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">2선식 전류</span><span class=\"fe\">I = V ÷ (R_센서 + 2r)</span><span class=\"fs\">이 문제: 2 ÷ (500 + 50) = 3.636 mA</span></div><div class=\"frow\"><span class=\"fl\">2선식이 읽는 저항</span><span class=\"fe\">R_센서 + 2r</span><span class=\"fs\">이 문제: 550 Ω → 오차 50 ÷ 500 = 10 %</span></div><div class=\"frow\"><span class=\"fl\">4선식 전압</span><span class=\"fe\">V = I × R_센서</span><span class=\"fs\">이 문제: 4 mA × 500 = 2 V</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>가스센서01</b> p.12–13 · Why use four wires · 정전류원, 전압 측정단 고임피던스</li><li><b>가스센서01</b> p.14 · Why use three wires (read only)</li></ul></div></div><div class=\"dsec\"><div class=\"dh\"><span>2</span>풀이 순서 (이 순서대로만)</div><ol class=\"flow\"><li>2선식 전체 저항 → I</li><li>센서·라인 전압 = I × R, 합이 전원과 같은지 검산</li><li>2선식 읽음 V/I → 오차</li><li>4선식: 정전류 × 센서, 전압선 0</li></ol></div><div class=\"dsec\"><div class=\"dh\"><span>3</span>차근차근 풀이 (처음 보는 사람용)</div><h4>먼저 알아야 할 것</h4><p><b>옴의 법칙</b> V = I × R: 저항에 전류가 흐르면 그 저항 양단에 전압이 생겨요 (전압강하).</p><p><b>직렬 회로</b>: 한 줄로 이어진 저항에는 <b>같은 전류</b>가 흐르고, 전체 저항은 더하기예요. 각 저항이 가져가는 전압을 다 더하면 전원 전압이 돼요.</p><p><b>전압계의 입력저항 R_in = ∞</b>: 이상적인 전압계는 전류를 전혀 빨아들이지 않아요. 전류가 0이면 그 선에 저항이 있어도 V = 0 × R = 0, 전압강하가 없어요. 4선식의 핵심이 이거예요.</p><p>긴 선(lead wire)도 금속이라 저항이 있어요. 센서와 측정기가 멀리 떨어져 있으면 이 선 저항이 무시할 수 없을 만큼 커지고, 온도에 따라 변하기도 해요.</p><h4>2선식</h4><ol class=\"st\"><li>전체 저항 = 25 + 500 + 25 = 550 Ω</li><li>I = V/R = 2/550 = 0.003636 A = <b>3.636 mA</b></li><li>센서 전압 = 3.636 mA × 500 Ω = <b>1.818 V</b></li><li>선 하나 전압 = 3.636 mA × 25 Ω = <b>0.0909 V</b></li><li>검산: 0.0909 + 1.818 + 0.0909 = 2.0 V ✓</li></ol><h4>2선식으로 잴 때의 오차</h4><p>2선식은 전원(측정기) 쪽에서 V와 I를 재니까 V/I = 2 V/3.636 mA = <b>550 Ω</b>으로 읽혀요. 실제 센서는 500 Ω인데 선 저항 50 Ω이 같이 들어갔어요.</p><div class=\"eqn\">오차 = (550 − 500)/500 × 100 = <b>10 %</b></div><h4>4선식</h4><ol class=\"st\"><li>정전류원이 바깥 전류선으로 4 mA를 센서에 흘려요 (선 저항이 있어도 정전류원이 그만큼 전압을 더 내서 4 mA를 유지)</li><li>센서 전압 = 4 mA × 500 Ω = <b>2 V</b></li><li>안쪽 전압선은 R_in = ∞인 전압계로 → 전류 <b>0 A</b> → 선 전압강하 = 0 × 25 = <b>0 V</b></li><li>전압계가 읽는 값 = 센서 전압 그대로 2 V → R = 2 V/4 mA = <b>500 Ω</b> (오차 0)</li></ol><div class=\"warn\"><b>자주 하는 실수</b> · 4선식 전류선에도 4 mA × 25 Ω = 0.1 V씩 강하가 생겨요. 하지만 이 전압은 전압계가 재는 경로에 없어서 결과에 영향이 없어요.</div></div><div class=\"dsec\"><div class=\"dh\"><span>4</span>답안지에 이렇게 쓰세요 · 시험용 짧은 버전</div><div class=\"xline\"><b>i)</b><q>\"I = 2/(25+500+25) = 3.636 mA, 센서 1.818 V, 라인 0.0909 V\"</q></div><div class=\"xline\"><b>ii)</b><q>\"2선식은 V/I = 550 Ω으로 읽음 → 오차 (550−500)/500 = 10 %\"</q></div><div class=\"xline\"><b>iii)</b><q>\"4선식: 센서 4 mA × 500 = 2 V, 전압선 I = 0 → 강하 0 → 500 Ω 정확\"</q></div><ul class=\"final-list\"><li>2선식 I = 3.636 mA, 센서 1.818 V, 라인 0.0909 V</li><li>2선식 읽음 550 Ω, 오차 10 %</li><li>4선식 센서 2 V, 전압선 0 A·0 V, 500 Ω</li></ul></div></div></details>\n    <details><summary>정답 확인</summary><div class=\"ans\">\n      <p class=\"final\">i) 1.818 V, 3.636 mA, 라인 0.0909 V &nbsp; ii) 550 Ω, 10 % &nbsp; iii) 2 V, 0 A, 0 V, 500 Ω</p>\n      <ol>\n        <li>2선식 전체 = 25 + 500 + 25 = 550 Ω → I = 2/550 = 3.636 mA</li>\n        <li>센서 V = 3.636 mA × 500 = 1.818 V, 라인 하나 = 3.636 mA × 25 = 0.0909 V</li>\n        <li>V/I = 2 V / 3.636 mA = 550 Ω → (550 − 500)/500 = 10 % 오차</li>\n        <li>4선식: 센서에 4 mA → V = 4 mA × 500 = 2 V</li>\n        <li>전압선 전류 0 → 전압강하 0 → R = 2 V / 4 mA = 500 Ω (정확)</li>\n      </ol>\n    </div></details>\n    <details class=\"calc-in\"><summary>fx-570ES PLUS 입력 순서</summary><div class=\"kbody\"><div class=\"krow\"><div class=\"kl\">전류 I</div><div class=\"kk\"><kbd class=\"n\">2</kbd><kbd>÷</kbd><kbd>(</kbd><kbd class=\"n\">25</kbd><kbd>+</kbd><kbd class=\"n\">500</kbd><kbd>+</kbd><kbd class=\"n\">25</kbd><kbd>)</kbd><kbd>=</kbd></div><div class=\"kd\">3.6363×10⁻³</div></div><div class=\"krow\"><div class=\"kl\">센서 전압</div><div class=\"kk\"><kbd>Ans</kbd><kbd>×</kbd><kbd class=\"n\">500</kbd><kbd>=</kbd></div><div class=\"kd\">1.818181…</div></div><div class=\"krow\"><div class=\"kl\">라인 전압</div><div class=\"kk\"><kbd class=\"n\">2</kbd><kbd>÷</kbd><kbd class=\"n\">550</kbd><kbd>×</kbd><kbd class=\"n\">25</kbd><kbd>=</kbd></div><div class=\"kd\">0.090909…</div></div><div class=\"krow\"><div class=\"kl\">2선식 읽음</div><div class=\"kk\"><kbd class=\"n\">2</kbd><kbd>÷</kbd><kbd>(</kbd><kbd class=\"n\">2</kbd><kbd>÷</kbd><kbd class=\"n\">550</kbd><kbd>)</kbd><kbd>=</kbd></div><div class=\"kd\">550</div></div><div class=\"krow\"><div class=\"kl\">오차 %</div><div class=\"kk\"><kbd>(</kbd><kbd class=\"n\">550</kbd><kbd>−</kbd><kbd class=\"n\">500</kbd><kbd>)</kbd><kbd>÷</kbd><kbd class=\"n\">500</kbd><kbd>×</kbd><kbd class=\"n\">100</kbd><kbd>=</kbd></div><div class=\"kd\">10</div></div><div class=\"krow\"><div class=\"kl\">4선식 전압</div><div class=\"kk\"><kbd class=\"n\">4</kbd><kbd>×10ˣ</kbd><kbd>(−)</kbd><kbd class=\"n\">3</kbd><kbd>×</kbd><kbd class=\"n\">500</kbd><kbd>=</kbd></div><div class=\"kd\">2</div></div></div></details>\n  </div>\n<div class=\"card\" id=\"c5-C\">\n    <div class=\"card-top\"><span class=\"id\">5-C</span><span class=\"ttl\">라인이 데워지면?</span><span class=\"tag sim\">판단</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">선 저항 변화</span></div><p class=\"fline\">→ 2선 값은 변함, 4선은 그대로</p></div>\n    <div class=\"fig\" data-wire='{\"v\": \"2 V\", \"i\": \"4 mA\", \"rs\": \"500 Ω\", \"rl\": \"30 Ω\"}'></div>\n    <p>4-B에서 라인 온도가 올라 개별 라인 저항이 <b class=\"v\">25 → 30 Ω</b>이 됐다. 2선식과 4선식이 읽는 센서 저항은 각각 어떻게 되는가?</p>\n    <details class=\"deep\"><summary>풀이 보기 · 공식 → 순서 → 차근차근 → 답안지 문장</summary><div class=\"dbody\"><div class=\"dsec\"><div class=\"dh\"><span>1</span>이 공식에 숫자만 넣으면 돼요</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">2선식이 읽는 저항</span><span class=\"fe\">R_센서 + 2r</span><span class=\"fs\">이 문제: 500 + 60 = 560 Ω</span></div><div class=\"frow\"><span class=\"fl\">4선식이 읽는 저항</span><span class=\"fe\">R_센서</span><span class=\"fs\">이 문제: 500 Ω</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>가스센서01</b> p.12–13 · Why use four wires · 정전류원, 전압 측정단 고임피던스</li><li><b>가스센서01</b> p.14 · Why use three wires (read only)</li></ul></div></div><div class=\"dsec\"><div class=\"dh\"><span>2</span>풀이 순서 (이 순서대로만)</div><ol class=\"flow\"><li>2선식은 선+센서+선 통째로 읽음</li><li>4선식은 전압선 강하 0</li></ol></div><div class=\"dsec\"><div class=\"dh\"><span>3</span>차근차근 풀이 (처음 보는 사람용)</div><h4>풀이</h4><p>2선식: 측정기가 선 + 센서 + 선을 통째로 저항으로 봐요 → 30 + 500 + 30 = <b>560 Ω</b>. 센서는 그대로인데 선 온도 때문에 값이 60 Ω 틀려요.</p><p>4선식: 전압선에 전류가 0이라 선 저항이 25든 30이든 전압강하 0 → 여전히 <b>500 Ω</b>.</p><p>그래서 강의에서 \"Line 저항은 온도에 의해서도 변한다\"며 4선식을 쓰는 거예요. 센서와 측정기가 멀고 환경 온도가 변하는 현장일수록 중요해요.</p></div><div class=\"dsec\"><div class=\"dh\"><span>4</span>답안지에 이렇게 쓰세요 · 시험용 짧은 버전</div><div class=\"xline\"><b>답</b><q>\"2선식은 선 저항까지 더해 560 Ω으로 읽고, 4선식은 전압선에 전류가 없어 500 Ω 그대로다\"</q></div><ul class=\"final-list\"><li>2선식 560 Ω</li><li>4선식 500 Ω 그대로</li></ul></div></div></details>\n    <details><summary>정답 확인</summary><div class=\"ans\">\n      <p class=\"final\">2선식 560 Ω (센서는 그대로인데 값이 바뀜) &nbsp; 4선식 500 Ω 그대로</p>\n      <p class=\"one\">2선식은 30 + 500 + 30을 통째로 읽어요. 강의에서 \"라인 저항은 온도에 의해서도 변한다\"고 한 이유가 이거예요. 4선식은 전압선에 전류가 없어서 라인 저항이 결과에 들어가지 않아요.</p>\n    </div></details>\n  </div>\n<div class=\"gen\" id=\"g4\">\n    <div class=\"row\"><span><b class=\"k\">새 숫자로 한 번 더</b> · 전원·센서·라인 저항·정전류가 바뀌어요</span><button class=\"btn\" data-gen=\"4\">새 문제</button></div>\n    <div class=\"out\"></div>\n  </div>"}, "t6": {"title": "Pd 휘트스톤 브리지 수소센서", "pts": "기출 3번 18점 · HW1-4", "html": "\n  \n  <p class=\"why\">노출된 저항만 값이 바뀌어요. 온도는 4개 모두 똑같이 바뀌어서 상쇄돼요.</p>\n<div class=\"card\" id=\"c6-A\">\n    <div class=\"card-top\"><span class=\"id\">6-A</span><span class=\"ttl\">작년 중간고사 3번</span><span class=\"tag ex\">기출 원본</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">Pd 4개</span><span class=\"kw\">R₃만 노출</span><span class=\"kw\">감도 Ω/ppm</span></div><p class=\"fline\">→ <b>V_o = V_in × [R₃/(R₂+R₃) − R₄/(R₁+R₄)]</b> · R₃ = 100 + ppm × 감도</p></div>\n    <div class=\"fig\" data-bridge='{\"r\":[\"100\",\"100\",\"100\",\"100\"],\"hot\":[2],\"vin\":\"1 V\",\"pol\":\"L+\",\"note\":\"22 °C, R₃만 노출\"}'></div>\n    <div class=\"given\">22 °C, Pd 4개 모두 <b class=\"v\">100 Ω</b>, V_in = <b class=\"v\">1 V</b>, R₃만 외부에 노출, 감도 <b class=\"v\">10⁻³ Ω/ppm</b></div>\n    <ol class=\"q\">\n      <li>(5점) 수소가 없을 때 V_out</li>\n      <li>(10점) 수소 1000 ppm 인가 시 V_out</li>\n      <li>(3점) 브리지를 쓰는 이유와 저항 선택 시 고려사항</li>\n    </ol>\n    <details class=\"deep\"><summary>풀이 보기 · 공식 → 순서 → 차근차근 → 답안지 문장</summary><div class=\"dbody\"><div class=\"dsec\"><div class=\"dh\"><span>1</span>이 공식에 숫자만 넣으면 돼요</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">브리지 출력 (교수님 식)</span><span class=\"fe\">V_o = V_in × [ R₃ ÷ (R₂ + R₃) − R₄ ÷ (R₁ + R₄) ]</span><span class=\"fs\">이 문제: 1 × [101 ÷ 201 − 100 ÷ 200] = 0.0025 V</span></div><div class=\"frow\"><span class=\"fl\">가스 닿은 저항</span><span class=\"fe\">R₃ = R + ppm × 감도</span><span class=\"fs\">이 문제: 100 + 1000 × 0.001 = 101 Ω</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>가스센서01</b> p.24 · Wheatstone Bridge 회로 · V_o = V_i[R₃/(R₂+R₃) − R₄/(R₁+R₄)]</li><li><b>가스센서01</b> p.25 · 초기 저항 R₀ 영향 · 다른 R₀ 센서 비교</li><li><b>작년 기출</b> 3번 · 교수님 풀이 0.502 − 0.5 = 0.002 V</li></ul></div></div><div class=\"dsec\"><div class=\"dh\"><span>2</span>풀이 순서 (이 순서대로만)</div><ol class=\"flow\"><li>그림에서 가스에 닿은 저항이 R₁~R₄ 중 무엇인지 표시</li><li>닿은 저항 = R + ppm × 감도</li><li>V_o = V_in × [R₃/(R₂+R₃) − R₄/(R₁+R₄)]에 대입</li><li>그림의 +/− 위치가 반대면 부호만 바꾸기</li><li>iii) 공통 변화 상쇄 → 같은 재료·같은 R₀</li></ol></div><div class=\"dsec\"><div class=\"dh\"><span>3</span>차근차근 풀이 (처음 보는 사람용)</div><h4>이 문제가 묻는 것</h4><p>Pd 저항 4개 중 R₃만 수소에 닿아요. 수소가 있으면 Pd 저항이 커지고, 그만큼 출력 전압이 생겨요.</p><h4>교수님 공식 하나로 끝 (가스센서01 p.24)</h4><div class=\"eqn\">V_o = V_in × [ R₃ ÷ (R₂ + R₃) − R₄ ÷ (R₁ + R₄) ]</div><p>그림의 R₁~R₄ 자리는 항상 같아요: <b>R₁ 오른쪽 위, R₂ 왼쪽 위, R₃ 왼쪽 아래, R₄ 오른쪽 아래</b>. 문제에서 바뀐 저항 값만 그 자리에 넣으면 끝이에요.</p><p>왜 이 식인가: 왼쪽 길(R₂–R₃)과 오른쪽 길(R₁–R₄)에 똑같이 V_in이 걸려요. 각 길의 가운데 점 전압이 V_in × R₃/(R₂+R₃), V_in × R₄/(R₁+R₄)이고, 그 차이가 출력이에요. 네 저항이 같으면 둘 다 1/2이라 출력 0이에요.</p><h4>i) 수소 없음</h4><div class=\"eqn\">V_o = 1 × [100 ÷ 200 − 100 ÷ 200] = 0 V</div><h4>ii) 수소 1000 ppm</h4><ol class=\"st\"><li>감도 10⁻³ Ω/ppm = 1 ppm마다 0.001 Ω 증가</li><li>R₃ = 100 + 1000 × 0.001 = 101 Ω (나머지는 100 Ω 그대로)</li><li>V_o = 1 × [101 ÷ (100 + 101) − 100 ÷ (100 + 100)]</li><li>= 0.50249 − 0.5 = <b>0.0025 V = 2.5 mV</b></li></ol><p>작년 모범답안은 0.502로 반올림해서 0.002 V로 썼어요.</p><h4>iii) 왜 브리지를 쓰나</h4><p>Pd는 온도에도 저항이 변해요. 네 저항을 같은 Pd, 같은 초기 저항으로 만들면 온도가 바뀔 때 넷이 같은 비율로 변해서 식의 두 항이 계속 같아요 → 출력 0. 수소에 닿은 R₃만 추가로 변하니까 수소 효과만 남아요. 그래서 저항은 <b>같은 재료, 같은 초기 저항</b>으로 골라요.</p><div class=\"warn\"><b>자주 하는 실수</b> · 식의 두 번째 항 분모는 R₁ + R₄예요 (R₂ + R₄가 아님). 같은 쪽 길에 있는 저항끼리 더해요.</div><div class=\"calc\"><b>계산기</b> · 101 ÷ 201 − 0.5 = 을 한 줄로 넣으면 반올림 없이 0.0024876이 나와요.</div></div><div class=\"dsec\"><div class=\"dh\"><span>4</span>답안지에 이렇게 쓰세요 · 시험용 짧은 버전</div><div class=\"xline\"><b>i)</b><q>\"V_o = V_in[R₃/(R₂+R₃) − R₄/(R₁+R₄)] = 1 × [100/200 − 100/200] = 0 V\"</q></div><div class=\"xline\"><b>ii)</b><q>\"R₃ = 100 + 1000 × 10⁻³ = 101 Ω. V_o = 1 × [101/201 − 100/200] = 0.0025 V\"</q></div><div class=\"xline\"><b>iii)</b><q>\"온도·습도 같은 외부 영향을 없애고 가스에 의한 변화만 출력하기 위해 사용한다. 따라서 네 저항을 같은 재료(Pd), 같은 초기 저항으로 선택해 외부 변화에 같은 비율로 변하게 한다.\"</q></div><ul class=\"final-list\"><li>i) 0 V</li><li>ii) 0.0025 V = 2.5 mV (교수님 풀이 0.002 V, 반올림 차이)</li><li>iii) 온도·습도 등 외부 간섭 상쇄 → 동일 재료·동일 초기 저항</li></ul></div></div></details>\n    <details><summary>정답 확인</summary><div class=\"ans\">\n      <p class=\"final\">i) 0 V &nbsp; ii) 약 2.5 mV (작년 풀이 0.002 V) &nbsp; iii) 아래 설명 참고</p>\n      <ol>\n        <li>i) 양쪽 중점 모두 100/200 × 1 = 0.5 V → V_out = 0</li>\n        <li>ii) ΔR = 1000 × 10⁻³ = 1 Ω → R₃ = 101 Ω</li>\n        <li>V_o = 1 × [R₃/(R₂+R₃) − R₄/(R₁+R₄)] = 1 × [101/201 − 100/200]</li>\n        <li>= 0.5025 − 0.5 = 0.0025 V</li>\n      </ol>\n      <p class=\"one\">iii) 온도·습도 등 외부 간섭에 의한 공통 저항 변화를 상쇄하려고 써요. 그래서 4개 저항을 같은 재료(Pd), 같은 초기 저항으로 골라 환경이 바뀌면 같은 비율로 변하게 해야 해요.</p>\n    </div></details>\n    <details class=\"calc-in\"><summary>fx-570ES PLUS 입력 순서</summary><div class=\"kbody\"><div class=\"krow\"><div class=\"kl\">ΔR</div><div class=\"kk\"><kbd class=\"n\">1000</kbd><kbd>×</kbd><kbd class=\"n\">1</kbd><kbd>×10ˣ</kbd><kbd>(−)</kbd><kbd class=\"n\">3</kbd><kbd>=</kbd></div><div class=\"kd\">1</div></div><div class=\"krow\"><div class=\"kl\">V_out</div><div class=\"kk\"><kbd class=\"n\">101</kbd><kbd>÷</kbd><kbd class=\"n\">201</kbd><kbd>−</kbd><kbd class=\"n\">0.5</kbd><kbd>=</kbd></div><div class=\"kd\">2.4876×10⁻³</div></div><div class=\"krow\"><div class=\"kl\">mV로</div><div class=\"kk\"><kbd>Ans</kbd><kbd>×</kbd><kbd class=\"n\">1000</kbd><kbd>=</kbd></div><div class=\"kd\">2.4876</div></div><p class=\"knote\">한 줄로 넣으면 중간 반올림이 없어서 2.49 mV가 정확히 나와요.</p></div></details>\n  </div>\n<div class=\"card\" id=\"c6-B\">\n    <div class=\"card-top\"><span class=\"id\">6-B</span><span class=\"ttl\">HW1 4번</span><span class=\"tag hw\">HW1 원본</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">대각선 노출</span><span class=\"kw\">온도 변화</span></div><p class=\"fline\">→ 같은 식에 R₁ = R₃ = 110 · 그림이 −V_o+면 부호 반대</p></div>\n    <div class=\"fig\" data-bridge='{\"r\":[\"100\",\"100\",\"100\",\"100\"],\"hot\":[0,2],\"vin\":\"1 V\",\"pol\":\"L-\",\"note\":\"대각선 두 개 노출 (opened)\"}'></div>\n    <div class=\"given\">모든 저항 Pd. 25 °C에서 <b class=\"v\">100 Ω</b>, 80 °C에서 <b class=\"v\">105 Ω</b>. 대각선 위치 두 저항이 노출(opened).</div>\n    <ol class=\"q\">\n      <li>25 °C, 5000 ppm (노출 Pd = <b class=\"v\">110 Ω</b>)에서 V_o</li>\n      <li>80 °C, 5000 ppm (노출 Pd = <b class=\"v\">115 Ω</b>)에서 V_o</li>\n    </ol>\n    <details class=\"deep\"><summary>풀이 보기 · 공식 → 순서 → 차근차근 → 답안지 문장</summary><div class=\"dbody\"><div class=\"dsec\"><div class=\"dh\"><span>1</span>이 공식에 숫자만 넣으면 돼요</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">브리지 출력 (교수님 식)</span><span class=\"fe\">V_o = V_in × [ R₃ ÷ (R₂ + R₃) − R₄ ÷ (R₁ + R₄) ]</span><span class=\"fs\">이 문제: R₁ = R₃ = 110: 1 × [110 ÷ 210 − 100 ÷ 210] = +0.0476</span></div><div class=\"frow\"><span class=\"fl\">HW1 그림 (−V_o+, 오른쪽이 +)</span><span class=\"fe\">부호만 반대</span><span class=\"fs\">이 문제: 25 °C: −0.0476 V · 80 °C: −(115 ÷ 220 − 105 ÷ 220) = −0.0455 V</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>가스센서01</b> p.24 · Wheatstone Bridge 회로 · V_o = V_i[R₃/(R₂+R₃) − R₄/(R₁+R₄)]</li><li><b>가스센서01</b> p.25 · 초기 저항 R₀ 영향 · 다른 R₀ 센서 비교</li><li><b>HW1</b> 4번 · 대각선 두 저항 opened, −V_o+</li></ul></div></div><div class=\"dsec\"><div class=\"dh\"><span>2</span>풀이 순서 (이 순서대로만)</div><ol class=\"flow\"><li>그림에서 가스에 닿은 저항이 R₁~R₄ 중 무엇인지 표시</li><li>닿은 저항 = R + ppm × 감도</li><li>V_o = V_in × [R₃/(R₂+R₃) − R₄/(R₁+R₄)]에 대입</li><li>그림의 +/− 위치가 반대면 부호만 바꾸기</li><li>25 °C와 80 °C 결과 비교 → 온도 보상 확인</li></ol></div><div class=\"dsec\"><div class=\"dh\"><span>3</span>차근차근 풀이 (처음 보는 사람용)</div><h4>이 문제가 묻는 것</h4><p>HW1 그림은 <b>R₁(오른쪽 위)과 R₃(왼쪽 아래)</b>이 수소에 닿아요. 출력 표시가 \"−V_o+\"라서 오른쪽이 +예요.</p><h4>교수님 공식 하나로 끝 (가스센서01 p.24)</h4><div class=\"eqn\">V_o = V_in × [ R₃ ÷ (R₂ + R₃) − R₄ ÷ (R₁ + R₄) ]</div><p>그림의 R₁~R₄ 자리는 항상 같아요: <b>R₁ 오른쪽 위, R₂ 왼쪽 위, R₃ 왼쪽 아래, R₄ 오른쪽 아래</b>. 문제에서 바뀐 저항 값만 그 자리에 넣으면 끝이에요.</p><p>왜 이 식인가: 왼쪽 길(R₂–R₃)과 오른쪽 길(R₁–R₄)에 똑같이 V_in이 걸려요. 각 길의 가운데 점 전압이 V_in × R₃/(R₂+R₃), V_in × R₄/(R₁+R₄)이고, 그 차이가 출력이에요. 네 저항이 같으면 둘 다 1/2이라 출력 0이에요.</p><h4>i) 25 °C, 닿은 Pd = 110 Ω</h4><ol class=\"st\"><li>R₁ = R₃ = 110, R₂ = R₄ = 100</li><li>식 = 1 × [110 ÷ (100 + 110) − 100 ÷ (110 + 100)] = 0.5238 − 0.4762 = +0.0476</li><li>HW1 그림은 오른쪽이 + → 부호 반대 → <b>V_o = −0.0476 V</b> (크기 47.6 mV)</li></ol><h4>ii) 80 °C, 모든 Pd 105 Ω, 닿은 Pd = 115 Ω</h4><ol class=\"st\"><li>R₁ = R₃ = 115, R₂ = R₄ = 105</li><li>식 = 1 × [115 ÷ 220 − 105 ÷ 220] = +0.0455</li><li><b>V_o = −0.0455 V</b></li></ol><h4>이 결과가 말하는 것</h4><p>온도가 55 °C나 바뀌었는데 출력은 47.6 → 45.5 mV로 거의 그대로예요. 이게 브리지의 <b>온도 보상</b>이에요.</p><div class=\"warn\"><b>자주 하는 실수</b> · 부호는 그림의 +/− 위치로 정해요. 교수님 식은 왼쪽(R₂–R₃ 쪽)이 +일 때의 값이에요.</div></div><div class=\"dsec\"><div class=\"dh\"><span>4</span>답안지에 이렇게 쓰세요 · 시험용 짧은 버전</div><div class=\"xline\"><b>i)</b><q>\"R₁ = R₃ = 110 Ω: 1 × [110/210 − 100/210] = 0.0476 → 그림의 −V_o+ 기준 V_o = −47.6 mV\"</q></div><div class=\"xline\"><b>ii)</b><q>\"R₂ = R₄ = 105, R₁ = R₃ = 115: 1 × [115/220 − 105/220] = 0.0455 → V_o = −45.5 mV. 온도가 변해도 출력이 거의 같다 (온도 보상)\"</q></div><ul class=\"final-list\"><li>i) V_o = −47.6 mV</li><li>ii) V_o = −45.5 mV</li><li>(극성은 숙제 그림 판독 기준, 크기로는 47.6 / 45.5 mV)</li></ul></div></div></details>\n    <details><summary>정답 확인</summary><div class=\"ans\">\n      <p class=\"final\">i) V_o = −47.6 mV &nbsp; ii) V_o = −45.5 mV (그림의 −V_o+ 극성 기준, 크기로 답하면 47.6 / 45.5 mV)</p>\n      <ol>\n        <li>i) R₁ = R₃ = 110: 1 × [110/210 − 100/210] = +0.0476</li>\n        <li>그림이 −V_o+ (오른쪽이 +) → 부호 반대 → V_o = −0.0476 V</li>\n        <li>ii) R₁ = R₃ = 115, R₂ = R₄ = 105: −(115/220 − 105/220) = −0.0455 V</li>\n      </ol>\n      <p class=\"one\">55 °C가 바뀌어도 출력은 47.6 → 45.5 mV로 거의 그대로예요. 이게 온도 보상이에요.</p>\n    </div></details>\n    <details class=\"calc-in\"><summary>fx-570ES PLUS 입력 순서</summary><div class=\"kbody\"><div class=\"krow\"><div class=\"kl\">i) V_o</div><div class=\"kk\"><kbd class=\"n\">100</kbd><kbd>÷</kbd><kbd class=\"n\">210</kbd><kbd>−</kbd><kbd class=\"n\">110</kbd><kbd>÷</kbd><kbd class=\"n\">210</kbd><kbd>=</kbd></div><div class=\"kd\">−0.047619…</div></div><div class=\"krow\"><div class=\"kl\">ii) V_o</div><div class=\"kk\"><kbd class=\"n\">105</kbd><kbd>÷</kbd><kbd class=\"n\">220</kbd><kbd>−</kbd><kbd class=\"n\">115</kbd><kbd>÷</kbd><kbd class=\"n\">220</kbd><kbd>=</kbd></div><div class=\"kd\">−0.045454…</div></div><p class=\"knote\">V₊(오른쪽) − V₋(왼쪽) 순서로 넣어야 부호가 맞아요.</p></div></details>\n  </div>\n<div class=\"card\" id=\"c6-C\">\n    <div class=\"card-top\"><span class=\"id\">6-C</span><span class=\"ttl\">숫자를 바꾼 기출 3번</span><span class=\"tag sim\">유사</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">숫자만 바뀐 3번</span></div><p class=\"fline\">→ 같은 식 · R₃ = 200 + 5000 × 0.002</p></div>\n    <div class=\"fig\" data-bridge='{\"r\": [\"200\", \"200\", \"200\", \"200\"], \"hot\": [2], \"vin\": \"2 V\", \"pol\": \"L+\", \"note\": \"R₃만 노출, 5000 ppm\"}'></div>\n    <div class=\"given\">Pd 4개 모두 <b class=\"v\">200 Ω</b>, V_in = <b class=\"v\">2 V</b>, R₃만 노출, 감도 <b class=\"v\">2×10⁻³ Ω/ppm</b>, 수소 <b class=\"v\">5000 ppm</b></div>\n    <ol class=\"q\"><li>수소 없을 때 V_out</li><li>5000 ppm에서 V_out</li></ol>\n    <details class=\"deep\"><summary>풀이 보기 · 공식 → 순서 → 차근차근 → 답안지 문장</summary><div class=\"dbody\"><div class=\"dsec\"><div class=\"dh\"><span>1</span>이 공식에 숫자만 넣으면 돼요</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">브리지 출력 (교수님 식)</span><span class=\"fe\">V_o = V_in × [ R₃ ÷ (R₂ + R₃) − R₄ ÷ (R₁ + R₄) ]</span><span class=\"fs\">이 문제: 2 × [210 ÷ 410 − 200 ÷ 400] = 0.0244 V</span></div><div class=\"frow\"><span class=\"fl\">가스 닿은 저항</span><span class=\"fe\">R₃ = R + ppm × 감도</span><span class=\"fs\">이 문제: 200 + 5000 × 0.002 = 210 Ω</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>가스센서01</b> p.24 · Wheatstone Bridge 회로 · V_o = V_i[R₃/(R₂+R₃) − R₄/(R₁+R₄)]</li><li><b>가스센서01</b> p.25 · 초기 저항 R₀ 영향 · 다른 R₀ 센서 비교</li></ul></div></div><div class=\"dsec\"><div class=\"dh\"><span>2</span>풀이 순서 (이 순서대로만)</div><ol class=\"flow\"><li>그림에서 가스에 닿은 저항이 R₁~R₄ 중 무엇인지 표시</li><li>닿은 저항 = R + ppm × 감도</li><li>V_o = V_in × [R₃/(R₂+R₃) − R₄/(R₁+R₄)]에 대입</li><li>그림의 +/− 위치가 반대면 부호만 바꾸기</li></ol></div><div class=\"dsec\"><div class=\"dh\"><span>3</span>차근차근 풀이 (처음 보는 사람용)</div><h4>교수님 공식 하나로 끝 (가스센서01 p.24)</h4><div class=\"eqn\">V_o = V_in × [ R₃ ÷ (R₂ + R₃) − R₄ ÷ (R₁ + R₄) ]</div><p>그림의 R₁~R₄ 자리는 항상 같아요: <b>R₁ 오른쪽 위, R₂ 왼쪽 위, R₃ 왼쪽 아래, R₄ 오른쪽 아래</b>. 문제에서 바뀐 저항 값만 그 자리에 넣으면 끝이에요.</p><p>왜 이 식인가: 왼쪽 길(R₂–R₃)과 오른쪽 길(R₁–R₄)에 똑같이 V_in이 걸려요. 각 길의 가운데 점 전압이 V_in × R₃/(R₂+R₃), V_in × R₄/(R₁+R₄)이고, 그 차이가 출력이에요. 네 저항이 같으면 둘 다 1/2이라 출력 0이에요.</p><h4>대입</h4><ol class=\"st\"><li>R₃ = 200 + 5000 × 0.002 = 210 Ω</li><li>V_o = 2 × [210 ÷ (200 + 210) − 200 ÷ (200 + 200)]</li><li>= 2 × [0.51220 − 0.5] = <b>0.0244 V = 24.4 mV</b></li></ol></div><div class=\"dsec\"><div class=\"dh\"><span>4</span>답안지에 이렇게 쓰세요 · 시험용 짧은 버전</div><div class=\"xline\"><b>i)</b><q>\"네 저항이 같으므로 V_o = 0 V\"</q></div><div class=\"xline\"><b>ii)</b><q>\"R₃ = 200 + 5000 × 0.002 = 210 Ω. V_o = 2 × [210/410 − 200/400] = 0.0244 V\"</q></div><ul class=\"final-list\"><li>수소 없음 0 V</li><li>5000 ppm: V_out = 24.4 mV</li></ul></div></div></details>\n    <details><summary>정답 확인</summary><div class=\"ans\">\n      <p class=\"final\">0 V &nbsp; 24.4 mV</p>\n      <ol>\n        <li>ΔR = 5000 × 2×10⁻³ = 10 Ω → R₃ = 210 Ω</li>\n        <li>V_o = 2 × [210/410 − 200/400] = 2 × 0.0122 = 0.0244 V</li>\n      </ol>\n    </div></details>\n    <details class=\"calc-in\"><summary>fx-570ES PLUS 입력 순서</summary><div class=\"kbody\"><div class=\"krow\"><div class=\"kl\">V_out</div><div class=\"kk\"><kbd class=\"n\">2</kbd><kbd>×</kbd><kbd class=\"n\">210</kbd><kbd>÷</kbd><kbd class=\"n\">410</kbd><kbd>−</kbd><kbd class=\"n\">1</kbd><kbd>=</kbd></div><div class=\"kd\">0.024390…</div></div></div></details>\n  </div>\n<div class=\"card\" id=\"c6-D\">\n    <div class=\"card-top\"><span class=\"id\">6-D</span><span class=\"ttl\">온도가 바뀌면? 두 개가 노출되면?</span><span class=\"tag sim\">판단</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">온도 보상</span><span class=\"kw\">감도 2배</span></div><p class=\"fline\">→ 4개가 같이 변하면 식의 두 항이 같아 0 · R₁·R₃ 둘 다면 2배</p></div>\n    <div class=\"fig\" data-bridge='{\"r\": [\"104\", \"104\", \"104\", \"104\"], \"hot\": [2], \"vin\": \"1 V\", \"pol\": \"L+\", \"note\": \"60 °C, R₃ 노출\"}'></div>\n    <div class=\"given\">기출 3번 브리지(100 Ω × 4, V_in = 1 V, 감도 10⁻³ Ω/ppm, 수소 1000 ppm)</div>\n    <ol class=\"q\">\n      <li>60 °C에서 Pd 4개가 모두 <b class=\"v\">104 Ω</b>이 됐다. 수소 없을 때 V_out과 1000 ppm일 때 V_out은?</li>\n      <li>R₃ 대신 대각선 두 저항(R₁, R₃)을 노출하면 1000 ppm(22 °C)에서 V_out은 R₃만 노출할 때의 몇 배인가?</li>\n    </ol>\n    <details class=\"deep\"><summary>풀이 보기 · 공식 → 순서 → 차근차근 → 답안지 문장</summary><div class=\"dbody\"><div class=\"dsec\"><div class=\"dh\"><span>1</span>이 공식에 숫자만 넣으면 돼요</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">브리지 출력 (교수님 식)</span><span class=\"fe\">V_o = V_in × [ R₃ ÷ (R₂ + R₃) − R₄ ÷ (R₁ + R₄) ]</span><span class=\"fs\">이 문제: i) 1 × [105 ÷ 209 − 104 ÷ 208] = 0.00239 V</span></div><div class=\"frow\"><span class=\"fl\">대각선 R₁·R₃ 노출</span><span class=\"fe\">같은 식에 R₁ = R₃ = 101</span><span class=\"fs\">이 문제: ii) 1 × [101 ÷ 201 − 100 ÷ 201] = 0.00498 V</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>가스센서01</b> p.24 · Wheatstone Bridge 회로 · V_o = V_i[R₃/(R₂+R₃) − R₄/(R₁+R₄)]</li><li><b>가스센서01</b> p.25 · 초기 저항 R₀ 영향 · 다른 R₀ 센서 비교</li></ul></div></div><div class=\"dsec\"><div class=\"dh\"><span>2</span>풀이 순서 (이 순서대로만)</div><ol class=\"flow\"><li>i) 네 저항이 같이 변함 → 중점 그대로</li><li>R₃만 추가 ΔR → V_out</li><li>ii) 대각선 두 개 → 한쪽↑ 한쪽↓ → 두 배</li></ol></div><div class=\"dsec\"><div class=\"dh\"><span>3</span>차근차근 풀이 (처음 보는 사람용)</div><h4>교수님 공식 하나로 끝 (가스센서01 p.24)</h4><div class=\"eqn\">V_o = V_in × [ R₃ ÷ (R₂ + R₃) − R₄ ÷ (R₁ + R₄) ]</div><p>그림의 R₁~R₄ 자리는 항상 같아요: <b>R₁ 오른쪽 위, R₂ 왼쪽 위, R₃ 왼쪽 아래, R₄ 오른쪽 아래</b>. 문제에서 바뀐 저항 값만 그 자리에 넣으면 끝이에요.</p><p>왜 이 식인가: 왼쪽 길(R₂–R₃)과 오른쪽 길(R₁–R₄)에 똑같이 V_in이 걸려요. 각 길의 가운데 점 전압이 V_in × R₃/(R₂+R₃), V_in × R₄/(R₁+R₄)이고, 그 차이가 출력이에요. 네 저항이 같으면 둘 다 1/2이라 출력 0이에요.</p><h4>i) 온도만 바뀌면</h4><p>네 저항이 모두 104 Ω → [104 ÷ 208 − 104 ÷ 208] = 0. 온도는 출력에 안 나와요.</p><div class=\"eqn\">수소 1000 ppm → R₃ = 105: V_o = 1 × [105 ÷ 209 − 104 ÷ 208] = 0.00239 V</div><p>22 °C의 2.49 mV와 거의 같아요.</p><h4>ii) R₁, R₃ 둘 다 노출</h4><div class=\"eqn\">R₁ = R₃ = 101: V_o = 1 × [101 ÷ 201 − 100 ÷ 201] = 0.00498 V ≈ 2 × 0.00249</div><p>두 항이 반대 방향으로 움직여서 출력이 두 배가 돼요.</p></div><div class=\"dsec\"><div class=\"dh\"><span>4</span>답안지에 이렇게 쓰세요 · 시험용 짧은 버전</div><div class=\"xline\"><b>i)</b><q>\"네 저항이 같은 비율로 변하면 두 항이 같아 V_o = 0. 수소 1000 ppm이면 R₃ = 105 → 1 × [105/209 − 104/208] = 2.39 mV\"</q></div><div class=\"xline\"><b>ii)</b><q>\"R₁ = R₃ = 101 → 1 × [101/201 − 100/201] = 4.98 mV, 약 2배\"</q></div><ul class=\"final-list\"><li>i) 0 V, 2.39 mV</li><li>ii) 4.98 mV ≈ 2배</li></ul></div></div></details>\n    <details><summary>정답 확인</summary><div class=\"ans\">\n      <p class=\"final\">i) 0 V, 2.39 mV (22 °C의 2.49 mV와 거의 같음) &nbsp; ii) 약 2배 (4.98 mV)</p>\n      <ol>\n        <li>i) 4개가 같은 비율로 변하면 중점은 모두 0.5 V → 0</li>\n        <li>1000 ppm: R₃ = 105 → 105/209 − 0.5 = 0.00239 V</li>\n        <li>ii) 한쪽 중점 101/201, 다른 쪽 100/201 → 차 = 1/201 = 0.00498 V ≈ 2 × 0.00249</li>\n      </ol>\n      <p class=\"one\">대각선 두 개를 노출하면 한쪽 중점은 올라가고 다른 쪽은 내려가서 출력이 두 배가 돼요. HW1 그림이 그 구성이에요.</p>\n    </div></details>\n    <details class=\"calc-in\"><summary>fx-570ES PLUS 입력 순서</summary><div class=\"kbody\"><div class=\"krow\"><div class=\"kl\">i) 60 °C</div><div class=\"kk\"><kbd class=\"n\">105</kbd><kbd>÷</kbd><kbd class=\"n\">209</kbd><kbd>−</kbd><kbd class=\"n\">0.5</kbd><kbd>=</kbd></div><div class=\"kd\">2.3923×10⁻³</div></div><div class=\"krow\"><div class=\"kl\">ii) 대각선</div><div class=\"kk\"><kbd class=\"n\">101</kbd><kbd>÷</kbd><kbd class=\"n\">201</kbd><kbd>−</kbd><kbd class=\"n\">100</kbd><kbd>÷</kbd><kbd class=\"n\">201</kbd><kbd>=</kbd></div><div class=\"kd\">4.9751×10⁻³</div></div></div></details>\n  </div>\n<div class=\"gen\" id=\"g3\">\n    <div class=\"row\"><span><b class=\"k\">새 숫자로 한 번 더</b> · 저항·전압·감도·농도가 바뀌어요</span><button class=\"btn\" data-gen=\"3\">새 문제</button></div>\n    <div class=\"out\"></div>\n  </div>"}, "t7": {"title": "반도체 가스센서 · 캐리어와 저항 변화", "pts": "기출 4번 12점", "html": "\n  \n  <p class=\"why\">산화성 가스 = 전자를 빼앗음(acceptor), 환원성 가스 = 전자를 돌려줌. 그다음 다수 캐리어가 늘었는지 줄었는지로 저항을 판단해요.</p>\n<div class=\"card\" id=\"c7-A\">\n    <div class=\"card-top\"><span class=\"id\">7-A</span><span class=\"ttl\">작년 중간고사 4번</span><span class=\"tag ex\">기출 원본</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">p형</span><span class=\"kw\">산화성 가스</span></div><p class=\"fline\">→ 산화성 = 전자 뺏음 → p형은 정공↑ → 저항↓</p></div>\n    <p><b>p형</b> 반도체 가스센서에 <b>산화성 가스</b>(electron acceptor)가 주입되었다. 각각 증가 / 감소 / 동일 중 답하라 (각 3점).</p>\n    <ol class=\"q\"><li>전자 수</li><li>정공 수</li><li>Depletion width</li><li>저항</li></ol>\n    <details class=\"deep\"><summary>풀이 보기 · 공식 → 순서 → 차근차근 → 답안지 문장</summary><div class=\"dbody\"><div class=\"dsec\"><div class=\"dh\"><span>1</span>이 공식에 숫자만 넣으면 돼요</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">n형</span><span class=\"fe\">환원성 → 저항↓ · 산화성 → 저항↑</span></div><div class=\"frow\"><span class=\"fl\">p형 (n형과 반대)</span><span class=\"fe\">환원성 → 저항↑ · 산화성 → 저항↓</span><span class=\"fs\">이 문제: p형 + 산화성: 전자↓ 정공↑ depletion↓ 저항↓</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>가스센서02 (마이크로히터·GC)</b> p.3 · 환원성 가스 검출 (n형)</li><li><b>가스센서02 (마이크로히터·GC)</b> p.4 · 산화성 가스 검출 (n형)</li><li><b>가스센서02 (마이크로히터·GC)</b> p.6 · p-type 반도체센서의 경우</li><li><b>작년 기출</b> 4번 · 교수님 풀이: 전자↓ 정공↑ depletion↓ 저항↓</li></ul></div></div><div class=\"dsec\"><div class=\"dh\"><span>2</span>풀이 순서 (이 순서대로만)</div><ol class=\"flow\"><li>가스가 전자를 빼앗나 주나</li><li>전자 수 → 다수 캐리어(정공) 변화</li><li>통로 넓어짐/좁아짐 → depletion</li><li>다수 캐리어 → 저항</li></ol></div><div class=\"dsec\"><div class=\"dh\"><span>3</span>차근차근 풀이 (처음 보는 사람용)</div><h4>이 문제가 묻는 것</h4><p>p형 센서에 전자를 빼앗는 가스가 오면 전자 수 → 정공 수 → depletion → 저항이 차례로 어떻게 변하는지 묻는 연쇄 문제예요.</p><h4>먼저 알아야 할 것</h4><p><b>n형 반도체</b>: 전기를 나르는 주인공(다수 캐리어)이 <b>전자</b>. <b>p형</b>: 주인공이 <b>정공</b>(전자가 빠진 빈자리, + 전하처럼 행동).</p><p>다수 캐리어가 <b>많아지면 저항 감소</b>, <b>줄면 저항 증가</b>. 이것만 따라가면 돼요.</p><p><b>산화성 가스</b>(O₂, NO₂, O₃): 전자를 빼앗아요 (electron acceptor). <b>환원성 가스</b>(H₂, CO, CH₄): 표면 산소와 반응하면서 잡혀 있던 전자를 돌려줘요.</p><p><b>Depletion</b>(공핍): 표면 근처에 캐리어가 거의 없는 층. 넓어지면 전기가 지나갈 통로가 좁아져서 저항이 커져요.</p><h4>한 단계씩</h4><ol class=\"st\"><li>산화성 가스 = 전자를 잡아감 → <b>전자 감소</b></li><li>p형에서 전자를 빼앗으면 그 자리가 빈자리 = 정공이 생기는 것 → <b>정공 증가</b> (작년 풀이: \"평형을 유지하기 위해\")</li><li>p형의 주인공인 정공이 늘어 전기가 지나갈 통로가 넓어짐 → <b>depletion width 감소</b></li><li>다수 캐리어(정공) 증가 → <b>저항 감소</b>, 전류 증가</li></ol><div class=\"warn\"><b>자주 하는 실수</b> · \"전자가 줄었으니 저항 증가\"라고 쓰면 n형 답이에요. p형은 정공이 주인공이라 정공이 어떻게 됐는지로 판단해요.</div></div><div class=\"dsec\"><div class=\"dh\"><span>4</span>답안지에 이렇게 쓰세요 · 시험용 짧은 버전</div><div class=\"xline\"><b>i)</b><q>\"산화성 가스는 전자를 포획하므로 전자 수 감소\"</q></div><div class=\"xline\"><b>ii)</b><q>\"p형의 다수 캐리어인 정공은 평형 유지를 위해 증가\"</q></div><div class=\"xline\"><b>iii)</b><q>\"정공이 늘어 전도 통로가 넓어지므로 depletion width 감소\"</q></div><div class=\"xline\"><b>iv)</b><q>\"다수 캐리어 증가 → 저항 감소\"</q></div><ul class=\"final-list\"><li>전자 감소</li><li>정공 증가</li><li>depletion width 감소</li><li>저항 감소</li></ul></div></div></details>\n    <details><summary>정답 확인</summary><div class=\"ans\">\n      <p class=\"final\">전자 감소 · 정공 증가 · depletion width 감소 · 저항 감소</p>\n      <ol>\n        <li>산화성 가스는 electron acceptor → 전자 포획 → 전자 감소</li>\n        <li>p형 다수 캐리어 = 정공. 평형 유지 → 정공 증가</li>\n        <li>정공이 흐를 통로가 넓어짐 → depletion width 감소</li>\n        <li>다수 캐리어 증가 → 저항 감소 (전류 증가)</li>\n      </ol>\n    </div></details>\n  </div>\n<div class=\"card\" id=\"c7-B\">\n    <div class=\"card-top\"><span class=\"id\">7-B</span><span class=\"ttl\">나머지 세 조합을 표로 채우기</span><span class=\"tag sim\">유사 · 함정</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">n/p × 산화/환원</span></div><p class=\"fline\">→ <b>n형 + 환원성 = 저항↓</b> 기준, 하나 바뀌면 뒤집기</p></div>\n    <p>기출은 p형 + 산화성이었어요. 올해는 다른 조합이 나올 수 있어요. 빈칸을 채워 보세요.</p>\n    <div class=\"tw\"><table class=\"t\">\n      <tr><th>조합</th><th>전자 수</th><th>다수 캐리어</th><th>Depletion width</th><th>저항</th></tr>\n      <tr><td>n형 + 환원성 (H₂, CO)</td><td>?</td><td>?</td><td>?</td><td>?</td></tr>\n      <tr><td>n형 + 산화성 (NO₂, O₃)</td><td>?</td><td>?</td><td>?</td><td>?</td></tr>\n      <tr><td>p형 + 환원성 (H₂)</td><td>?</td><td>?</td><td>?</td><td>?</td></tr>\n    </table></div>\n    <details class=\"deep\"><summary>풀이 보기 · 공식 → 순서 → 차근차근 → 답안지 문장</summary><div class=\"dbody\"><div class=\"dsec\"><div class=\"dh\"><span>1</span>이 공식에 숫자만 넣으면 돼요</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">n형</span><span class=\"fe\">환원성 → 저항↓ · 산화성 → 저항↑</span></div><div class=\"frow\"><span class=\"fl\">p형 (n형과 반대)</span><span class=\"fe\">환원성 → 저항↑ · 산화성 → 저항↓</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>가스센서02 (마이크로히터·GC)</b> p.3 · 환원성 가스 검출 (n형)</li><li><b>가스센서02 (마이크로히터·GC)</b> p.4 · 산화성 가스 검출 (n형)</li><li><b>가스센서02 (마이크로히터·GC)</b> p.6 · p-type 반도체센서의 경우</li></ul></div></div><div class=\"dsec\"><div class=\"dh\"><span>2</span>풀이 순서 (이 순서대로만)</div><ol class=\"flow\"><li>n형 환원성 = 저항↓ 기준</li><li>가스 반대면 뒤집기</li><li>반도체 반대면 한 번 더 뒤집기</li></ol></div><div class=\"dsec\"><div class=\"dh\"><span>3</span>차근차근 풀이 (처음 보는 사람용)</div><h4>먼저 알아야 할 것</h4><p><b>n형 반도체</b>: 전기를 나르는 주인공(다수 캐리어)이 <b>전자</b>. <b>p형</b>: 주인공이 <b>정공</b>(전자가 빠진 빈자리, + 전하처럼 행동).</p><p>다수 캐리어가 <b>많아지면 저항 감소</b>, <b>줄면 저항 증가</b>. 이것만 따라가면 돼요.</p><p><b>산화성 가스</b>(O₂, NO₂, O₃): 전자를 빼앗아요 (electron acceptor). <b>환원성 가스</b>(H₂, CO, CH₄): 표면 산소와 반응하면서 잡혀 있던 전자를 돌려줘요.</p><p><b>Depletion</b>(공핍): 표면 근처에 캐리어가 거의 없는 층. 넓어지면 전기가 지나갈 통로가 좁아져서 저항이 커져요.</p><h4>각 행 풀이</h4><ol class=\"st\"><li><b>n형 + 환원성</b>: 가스가 전자를 돌려줌 → 전자(다수) 증가 → depletion 감소 → 저항 감소</li><li><b>n형 + 산화성</b>: 가스가 전자를 빼앗음 → 전자(다수) 감소 → depletion 증가 → 저항 증가</li><li><b>p형 + 환원성</b>: 가스가 전자를 줌 → 들어온 전자가 정공과 만나 사라짐(재결합) → 정공(다수) 감소 → depletion 증가 → 저항 증가</li></ol><h4>외우는 요령</h4><div class=\"tw\"><table class=\"t sm\"><tr><th></th><th>환원성 (H₂, CO)</th><th>산화성 (NO₂, O₃)</th></tr><tr><td>n형</td><td>저항 ↓</td><td>저항 ↑</td></tr><tr><td>p형</td><td>저항 ↑</td><td>저항 ↓</td></tr></table></div><p>n형 환원성 = 저항 ↓ 하나만 기억하고, 가스가 바뀌면 뒤집고, 반도체가 바뀌면 한 번 더 뒤집어요.</p></div><div class=\"dsec\"><div class=\"dh\"><span>4</span>답안지에 이렇게 쓰세요 · 시험용 짧은 버전</div><div class=\"xline\"><b>표</b><q>\"n형+환원성: 저항↓ · n형+산화성: 저항↑ · p형+환원성: 전자가 정공과 재결합해 정공↓ → 저항↑\"</q></div><ul class=\"final-list\"><li>n형 + 환원성: 저항 감소</li><li>n형 + 산화성: 저항 증가</li><li>p형 + 환원성: 저항 증가</li></ul></div></div></details>\n    <details><summary>정답 확인</summary><div class=\"ans\">\n      <div class=\"tw\"><table class=\"t\">\n        <tr><th>조합</th><th>전자 수</th><th>다수 캐리어</th><th>Depletion width</th><th>저항</th></tr>\n        <tr><td>n형 + 환원성</td><td>증가</td><td>전자 증가</td><td>감소</td><td>감소</td></tr>\n        <tr><td>n형 + 산화성</td><td>감소</td><td>전자 감소</td><td>증가</td><td>증가</td></tr>\n        <tr><td>p형 + 환원성</td><td>증가</td><td>정공 감소 (재결합)</td><td>증가</td><td>증가</td></tr>\n      </table></div>\n      <p class=\"one\">요령: n형과 p형은 저항 변화 방향이 반대예요. n형 기준으로 환원성 → 저항 감소만 외우고, 산화성이면 뒤집고, p형이면 한 번 더 뒤집어요.</p>\n    </div></details>\n  </div>\n<div class=\"card\" id=\"c7-C\">\n    <div class=\"card-top\"><span class=\"id\">7-C</span><span class=\"ttl\">왜 그런지 서술</span><span class=\"tag sim\">서술</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">저항 감소 이유</span></div><p class=\"fline\">→ 산소 흡착 → depletion → H₂가 전자 돌려줌 → 저항↓</p></div>\n    <p>n형 산화물반도체(SnO₂) 센서에 수소가 들어오면 저항이 감소하는 이유를 산소 흡착부터 순서대로 서술하라.</p>\n    <details class=\"deep\"><summary>풀이 보기 · 공식 → 순서 → 차근차근 → 답안지 문장</summary><div class=\"dbody\"><div class=\"dsec\"><div class=\"dh\"><span>1</span>이 공식에 숫자만 넣으면 돼요</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">n형 + 환원성</span><span class=\"fe\">O₂ 흡착 → R₀ → H₂가 전자 반환 → 저항↓</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>가스센서02 (마이크로히터·GC)</b> p.3 · 환원성 가스 검출 (산소 흡착 → 전자 반환)</li></ul></div></div><div class=\"dsec\"><div class=\"dh\"><span>2</span>풀이 순서 (이 순서대로만)</div><ol class=\"flow\"><li>산소 흡착 → depletion → R₀</li><li>H₂ + 흡착 산소 반응</li><li>전자 반환 → depletion 감소 → 저항 감소</li></ol></div><div class=\"dsec\"><div class=\"dh\"><span>3</span>차근차근 풀이 (처음 보는 사람용)</div><h4>답안 구성 요령</h4><ol class=\"st\"><li>공기 중 산소가 먼저 붙어 있다는 것부터 시작 (O₂ 흡착 → 전자 포획)</li><li>→ depletion layer, potential barrier → 초기저항 R₀</li><li>수소(환원성)가 흡착 산소와 반응 → H₂O 생성</li><li>→ 잡혀 있던 전자가 반도체로 돌아감</li><li>→ 전자 증가, depletion·barrier 감소 → 저항 감소</li></ol><p>서술형은 이 \"→\" 사슬을 빠짐없이 쓰는 게 점수예요. 산소 흡착 단계를 빼고 \"수소가 전자를 준다\"만 쓰면 감점될 수 있어요 (추정).</p></div><div class=\"dsec\"><div class=\"dh\"><span>4</span>답안지에 이렇게 쓰세요 · 시험용 짧은 버전</div><div class=\"xline\"><b>답</b><q>\"공기 중 O₂가 흡착하며 전자를 포획해 depletion layer와 barrier가 생겨 초기저항 R₀가 된다. H₂가 흡착 산소와 반응해 전자를 반도체로 돌려주면 전자 농도가 늘고 depletion·barrier가 줄어 저항이 감소한다.\"</q></div><ul class=\"final-list\"><li>산소 흡착으로 생긴 depletion이 H₂ 반응으로 전자가 돌아오며 줄어들어 저항 감소</li></ul></div></div></details>\n    <details><summary>정답 확인</summary><div class=\"ans\">\n      <p class=\"one\">공기 중 O₂가 표면에 흡착하며 전자를 포획해 electron depletion layer와 potential barrier가 생기고, 이것이 초기저항 R₀가 된다. 환원성 가스인 H₂가 흡착 산소와 반응해 H₂O를 만들면서 포획됐던 전자를 반도체로 돌려준다. 전자 농도가 늘고 depletion layer와 barrier가 줄어 저항이 감소한다.</p>\n    </div></details>\n  </div>"}, "t8": {"title": "마이크로히터", "pts": "기출 5번 9점", "html": "\n  \n  <p class=\"why\"></p>\n<div class=\"card\" id=\"c8-A\">\n    <div class=\"card-top\"><span class=\"id\">8-A</span><span class=\"ttl\">작년 중간고사 5번</span><span class=\"tag ex\">기출 원본</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">마이크로히터</span><span class=\"kw\">일정 온도</span></div><p class=\"fline\">→ <b>Joule</b>(가속 전자 충돌) · <b>발열 = 방열</b> 평형</p></div>\n    <p>마이크로히터에 전압을 인가하면 전류가 흐른다.</p>\n    <ol class=\"q\"><li>(3점) 열 생성 원인은?</li><li>(3점) 일정 전압을 계속 인가해도 온도가 그대로 유지되는 이유는?</li><li>(3점) 히터 구조가 직선이 아닌 급격히 꼬불꼬불한 구조라면 어떤 현상이 생기는가?</li></ol>\n    <details class=\"deep\"><summary>풀이 보기 · 공식 → 순서 → 차근차근 → 답안지 문장</summary><div class=\"dbody\"><div class=\"dsec\"><div class=\"dh\"><span>1</span>이 공식에 숫자만 넣으면 돼요</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">발열</span><span class=\"fe\">P = V² ÷ R = I² × R</span></div><div class=\"frow\"><span class=\"fl\">온도가 일정한 조건</span><span class=\"fe\">발열 = 방열 (전도 + 대류 + 복사)</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>가스센서02 (마이크로히터·GC)</b> p.13 · Microheater · Pt, 열 생성 원리</li><li><b>가스센서02 (마이크로히터·GC)</b> p.15 · 왜 전압에 따라 일정한 온도가 유지되는가</li><li><b>가스센서02 (마이크로히터·GC)</b> p.16 · 주변 방열량 무시 경우</li><li><b>가스센서02 (마이크로히터·GC)</b> p.19 · 주변온도 변화에도 일정 온도 유지</li><li><b>작년 기출</b> 5번 · 교수님 서술 답안</li></ul></div></div><div class=\"dsec\"><div class=\"dh\"><span>2</span>풀이 순서 (이 순서대로만)</div><ol class=\"flow\"><li>i) 전기장 → 전자 가속 → 충돌 → Joule heating</li><li>ii) 열손실 증가 → 발열 = 방열 → steady state</li><li>iii) 교수님 논리 그대로</li></ol></div><div class=\"dsec\"><div class=\"dh\"><span>3</span>차근차근 풀이 (처음 보는 사람용)</div><h4>i) 열이 생기는 이유</h4><p>금속 히터에 전압을 걸면 금속 안에 전기장이 생겨 전자가 가속돼요. 달리던 전자가 금속 원자(격자)에 부딪히면서 운동 에너지를 넘겨주고, 원자가 더 세게 진동해요. 원자 진동 = 열이에요. 이게 <b>Joule heating</b>이고 발열량은 P = I²R = VI예요.</p><h4>ii) 온도가 일정해지는 이유</h4><p>욕조에 물을 일정하게 틀어 놓고 배수구도 열어 두면, 물이 차오를수록 수압 때문에 빠지는 양도 늘어서 결국 들어오는 양 = 나가는 양이 되고 수위가 멈춰요.</p><p>히터도 같아요. 들어오는 열(VI)은 일정한데, 온도가 오를수록 주변으로 새는 열(전도·대류·복사)이 커져요. 두 값이 같아지는 순간(<b>열평형, steady state</b>)부터 온도가 더 오르지 않아요.</p><p>비유와 다른 점: 실제로는 물의 압력이 아니라 주변과의 온도차가 클수록 열이 많이 새는 거예요.</p><h4>iii) 꼬불꼬불한 구조</h4><p>교수님 풀이는 \"전자가 충분히 가속을 받은 뒤 원자와 부딪혀야 열이 잘 나는데, 급격히 꺾인 구조에서는 충분히 가속되기 전에 부딪혀서 같은 열을 내려면 더 큰 전압이 필요하다. 넓은 면적 가열에는 circular 구조가 적절하다\"예요. 시험에서는 이 논리를 그대로 쓰는 게 안전해요.</p><div class=\"warn\"><b>자주 하는 실수</b> · i)에서 \"전류가 흘러서 뜨거워진다\"로 끝내면 부족해요. 전기장 → 전자 가속 → 원자 충돌 → Joule heating 사슬을 쓰세요.</div></div><div class=\"dsec\"><div class=\"dh\"><span>4</span>답안지에 이렇게 쓰세요 · 시험용 짧은 버전</div><div class=\"xline\"><b>i)</b><q>\"전압에 의한 전기장이 전자를 가속하고, 가속된 전자가 금속 원자와 충돌하면서 Joule heating이 발생한다\"</q></div><div class=\"xline\"><b>ii)</b><q>\"온도가 오르면 전도·대류·복사 열손실이 커져 발열 = 방열인 steady state에 도달하므로 온도가 유지된다\"</q></div><div class=\"xline\"><b>iii)</b><q>\"급격히 꺾인 구조에서는 전자가 충분히 가속되기 전에 원자와 충돌해 같은 열을 내려면 더 큰 전압이 필요하다. 넓은 면적 가열에는 circular 구조가 적절하다\"</q></div><ul class=\"final-list\"><li>i) Joule heating (가속된 전자가 원자와 충돌)</li><li>ii) 발열 = 방열인 열평형</li><li>iii) 충분히 가속되기 전 충돌 → 더 큰 전압 필요 → circular 구조가 적절</li></ul></div></div></details>\n    <details><summary>정답 확인 (작년 모범답안 기준)</summary><div class=\"ans\">\n      <ol style=\"font-family:var(--f-body);font-size:14px\">\n        <li>전압 인가 → 전기장 → 전자가 가속되어 원자(격자)와 충돌 → Joule heating</li>\n        <li>온도가 오르면 conduction·convection·radiation 열손실이 증가 → 열 생성 = 열 방출인 steady state에 도달 → 온도 유지</li>\n        <li>전자가 충분히 가속되기 전에 원자와 충돌 → 같은 열을 내려면 더 큰 전압 필요 → 넓은 면적 가열에는 circular 형태가 적절</li>\n      </ol>\n    </div></details>\n  </div>\n<div class=\"card\" id=\"c8-B\">\n    <div class=\"card-top\"><span class=\"id\">8-B</span><span class=\"ttl\">같은 개념을 다르게 묻기</span><span class=\"tag sim\">유사 · 판단</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">주변 온도</span><span class=\"kw\">Pt</span></div><p class=\"fline\">→ 추우면 손실↑ → 전류↑ · Pt = 고온·내산화</p></div>\n    <ol class=\"q\">\n      <li>주변 온도가 내려갔는데 센서 표면을 같은 목표 온도로 유지하려면 히터 전류를 늘려야 하나, 줄여야 하나? 이유는?</li>\n      <li>히터 재료로 Au(녹는점 1064 °C) 대신 Pt(1768 °C)를 쓰는 이유 두 가지</li>\n      <li>마이크로히터 온도가 주변 온도보다 낮게 설정되면 어떤 문제가 생기는가?</li>\n    </ol>\n    <details class=\"deep\"><summary>풀이 보기 · 공식 → 순서 → 차근차근 → 답안지 문장</summary><div class=\"dbody\"><div class=\"dsec\"><div class=\"dh\"><span>1</span>이 공식에 숫자만 넣으면 돼요</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">온도가 일정한 조건</span><span class=\"fe\">발열 = 방열</span></div><div class=\"frow\"><span class=\"fl\">주변이 추워지면</span><span class=\"fe\">방열↑ → 전류↑</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>가스센서02 (마이크로히터·GC)</b> p.13 · Microheater · Pt, 열 생성 원리</li><li><b>가스센서02 (마이크로히터·GC)</b> p.15 · 왜 전압에 따라 일정한 온도가 유지되는가</li><li><b>가스센서02 (마이크로히터·GC)</b> p.16 · 주변 방열량 무시 경우</li><li><b>가스센서02 (마이크로히터·GC)</b> p.19 · 주변온도 변화에도 일정 온도 유지</li></ul></div></div><div class=\"dsec\"><div class=\"dh\"><span>2</span>풀이 순서 (이 순서대로만)</div><ol class=\"flow\"><li>주변 온도 ↔ 열손실 ↔ 필요한 전류</li><li>Pt 성질</li><li>열 흐름 방향</li></ol></div><div class=\"dsec\"><div class=\"dh\"><span>3</span>차근차근 풀이 (처음 보는 사람용)</div><h4>i) 주변이 추워지면</h4><p>주변 온도가 내려가면 히터와 주변의 온도차가 커져서 열이 더 많이 새요. 같은 목표 온도를 지키려면 열을 더 만들어야 하니 <b>전류를 늘려요</b>. 반대로 주변이 더우면 전류를 줄여요.</p><h4>ii) Pt를 쓰는 이유</h4><p>수백 °C에서 오래 써야 하니 녹는점이 높고(1768 °C) 산화되지 않아야 해요. 또 Pt는 온도에 따른 저항 변화가 안정적이라 히터 저항을 재서 온도를 알 수도 있어요 (온도센서 겸용).</p><h4>iii) 주변보다 낮으면</h4><p>열은 뜨거운 곳에서 차가운 곳으로 흘러요. 히터가 주변보다 차가우면 히터가 표면을 데우는 게 아니라 주변 열이 표면으로 들어와서, 센서 표면 온도를 히터가 통제할 수 없게 돼요.</p></div><div class=\"dsec\"><div class=\"dh\"><span>4</span>답안지에 이렇게 쓰세요 · 시험용 짧은 버전</div><div class=\"xline\"><b>i)</b><q>\"주변 온도가 내려가면 온도차가 커져 열손실이 늘어나므로 같은 온도를 유지하려면 전류를 늘린다\"</q></div><div class=\"xline\"><b>ii)</b><q>\"Pt는 녹는점이 높고 산화에 강하며 저항–온도 관계가 안정해 온도 측정에도 쓸 수 있다\"</q></div><div class=\"xline\"><b>iii)</b><q>\"열이 주변에서 센서로 흘러 센서 표면 온도를 히터가 통제할 수 없게 된다\"</q></div><ul class=\"final-list\"><li>i) 전류 증가</li><li>ii) 고온 안정·내산화, 저항–온도 관계 안정</li><li>iii) 표면 온도가 주변 온도에 좌우됨</li></ul></div></div></details>\n    <details><summary>정답 확인</summary><div class=\"ans\">\n      <ol style=\"font-family:var(--f-body);font-size:14px\">\n        <li>늘려야 해요. 온도차가 커져 전도·대류·복사 열손실이 늘어나므로 더 많은 Joule heat이 필요해요.</li>\n        <li>고온에서 안정하고 산화에 강해요. 저항의 온도 의존성이 안정적이라 온도 측정·제어에도 쓸 수 있어요.</li>\n        <li>열전달 방향이 바뀌어 센서 표면 온도가 주변 온도의 영향을 크게 받아요. 그래서 히터 온도는 주변보다 높아야 해요.</li>\n      </ol>\n    </div></details>\n  </div>\n<div class=\"card\" id=\"c8-C\">\n    <div class=\"card-top\"><span class=\"id\">8-C</span><span class=\"ttl\">방열 무시 온도 상승 계산</span><span class=\"tag sim\">유사 · 계산</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">ΔT</span><span class=\"kw\">방열 무시</span></div><p class=\"fline\">→ <b>VIt = C_p m ΔT</b> · 치수는 m로</p></div>\n    <div class=\"given\">Pt 히터: 폭 <b class=\"v\">0.55 mm</b>, 길이 <b class=\"v\">15.95 mm</b>, 두께 <b class=\"v\">220 nm</b> (강의 예제 치수), Pt 밀도 <b class=\"v\">21,450 kg/m³</b>, C_p = <b class=\"v\">133 J/kg·K</b>, R = <b class=\"v\">100 Ω</b>, V = <b class=\"v\">2 V</b>, t = <b class=\"v\">1 ms</b></div>\n    <ol class=\"q\"><li>히터 질량 m</li><li>방열을 무시할 때 1 ms 동안의 ΔT (VI·t = C_p m ΔT)</li></ol>\n    <details class=\"deep\"><summary>풀이 보기 · 공식 → 순서 → 차근차근 → 답안지 문장</summary><div class=\"dbody\"><div class=\"dsec\"><div class=\"dh\"><span>1</span>이 공식에 숫자만 넣으면 돼요</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">온도 상승 (방열 무시)</span><span class=\"fe\">ΔT = V² × t ÷ (R × C_p × m)</span><span class=\"fs\">이 문제: 2² × 0.001 ÷ (100 × 133 × 4.14×10⁻⁸) = 7.3 K</span></div><div class=\"frow\"><span class=\"fl\">질량</span><span class=\"fe\">m = 밀도 × 폭 × 길이 × 두께</span><span class=\"fs\">이 문제: 21450 × 0.55×10⁻³ × 15.95×10⁻³ × 220×10⁻⁹ = 4.14×10⁻⁸ kg</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>가스센서02 (마이크로히터·GC)</b> p.16 · 주변 방열량 무시 경우</li><li><b>가스센서02 (마이크로히터·GC)</b> p.18 · 예제 (Pt 히터 0.550 mm × 15.9472 mm × 220 nm)</li></ul></div></div><div class=\"dsec\"><div class=\"dh\"><span>2</span>풀이 순서 (이 순서대로만)</div><ol class=\"flow\"><li>치수를 m로</li><li>부피 × 밀도 = 질량</li><li>P = V²/R, 에너지 = P t</li><li>ΔT = 에너지 / (C_p m)</li></ol></div><div class=\"dsec\"><div class=\"dh\"><span>3</span>차근차근 풀이 (처음 보는 사람용)</div><h4>이 문제가 묻는 것</h4><p>히터 크기로 질량을 구하고, 1 ms 동안 넣은 전기 에너지가 전부 히터를 데운다고 보고(방열 무시) 온도가 몇 도 오르는지 구해요.</p><h4>1단계 · 단위를 m로 통일</h4><ol class=\"st\"><li>폭 0.55 mm = 0.55 × 10⁻³ m</li><li>길이 15.95 mm = 15.95 × 10⁻³ m</li><li>두께 220 nm = 220 × 10⁻⁹ m</li></ol><h4>2단계 · 질량</h4><div class=\"eqn\">부피 = 0.55×10⁻³ × 15.95×10⁻³ × 220×10⁻⁹ = 1.93 × 10⁻¹² m³<br>질량 = 밀도 × 부피 = 21,450 × 1.93×10⁻¹² = 4.14 × 10⁻⁸ kg</div><h4>3단계 · 넣은 에너지</h4><div class=\"eqn\">P = V²/R = 2²/100 = 0.04 W (1초에 0.04 J)<br>에너지 = P × t = 0.04 × 0.001 s = 4 × 10⁻⁵ J</div><h4>4단계 · 온도 상승</h4><p><b>C_p (비열)</b> = 1 kg을 1 K 올리는 데 필요한 에너지. 그래서 에너지 = C_p × m × ΔT.</p><div class=\"eqn\">ΔT = 4×10⁻⁵ / (133 × 4.14×10⁻⁸) = 4×10⁻⁵ / 5.51×10⁻⁶ = <b>7.3 K</b></div><div class=\"warn\"><b>자주 하는 실수</b> · nm를 m로 바꿀 때 10⁻⁹, mm는 10⁻³. 밀도는 kg/m³이라 부피를 반드시 m³로 넣어야 kg이 나와요.</div></div><div class=\"dsec\"><div class=\"dh\"><span>4</span>답안지에 이렇게 쓰세요 · 시험용 짧은 버전</div><div class=\"xline\"><b>i)</b><q>\"m = 21450 × 0.55×10⁻³ × 15.95×10⁻³ × 220×10⁻⁹ = 4.14×10⁻⁸ kg\"</q></div><div class=\"xline\"><b>ii)</b><q>\"VIt = C_p m ΔT → ΔT = (2²/100 × 0.001)/(133 × 4.14×10⁻⁸) = 7.3 K\"</q></div><ul class=\"final-list\"><li>m = 4.14×10⁻⁸ kg</li><li>ΔT ≈ 7.3 K</li></ul></div></div></details>\n    <details><summary>정답 확인</summary><div class=\"ans\">\n      <p class=\"final\">m = 4.14×10⁻⁸ kg &nbsp; ΔT ≈ 7.3 K</p>\n      <ol>\n        <li>부피 = 0.55×10⁻³ × 15.95×10⁻³ × 220×10⁻⁹ = 1.93×10⁻¹² m³</li>\n        <li>m = 1.93×10⁻¹² × 21,450 = 4.14×10⁻⁸ kg</li>\n        <li>P = V²/R = 4/100 = 0.04 W → 1 ms 에너지 = 4×10⁻⁵ J</li>\n        <li>ΔT = 4×10⁻⁵ / (133 × 4.14×10⁻⁸) = 7.3 K</li>\n      </ol>\n      <p class=\"one\">질량이 아주 작아서(열용량 mC_p가 작아서) 1 ms만에 7 K가 올라요. \"MEMS 히터는 작은 전력으로 빠르게 가열된다\"의 숫자 버전이에요.</p>\n    </div></details>\n    <details class=\"calc-in\"><summary>fx-570ES PLUS 입력 순서</summary><div class=\"kbody\"><div class=\"krow\"><div class=\"kl\">질량 kg</div><div class=\"kk\"><kbd class=\"n\">0.55</kbd><kbd>×10ˣ</kbd><kbd>(−)</kbd><kbd class=\"n\">3</kbd><kbd>×</kbd><kbd class=\"n\">15.95</kbd><kbd>×10ˣ</kbd><kbd>(−)</kbd><kbd class=\"n\">3</kbd><kbd>×</kbd><kbd class=\"n\">220</kbd><kbd>×10ˣ</kbd><kbd>(−)</kbd><kbd class=\"n\">9</kbd><kbd>×</kbd><kbd class=\"n\">21450</kbd><kbd>=</kbd></div><div class=\"kd\">4.1397×10⁻⁸</div></div><div class=\"krow\"><div class=\"kl\">ΔT</div><div class=\"kk\"><kbd class=\"n\">2</kbd><kbd>x²</kbd><kbd>÷</kbd><kbd class=\"n\">100</kbd><kbd>×</kbd><kbd class=\"n\">1</kbd><kbd>×10ˣ</kbd><kbd>(−)</kbd><kbd class=\"n\">3</kbd><kbd>÷</kbd><kbd>(</kbd><kbd class=\"n\">133</kbd><kbd>×</kbd><kbd>Ans</kbd><kbd>)</kbd><kbd>=</kbd></div><div class=\"kd\">7.2650</div></div><p class=\"knote\">Ans에는 바로 앞에서 구한 질량이 들어 있어요.</p></div></details>\n  </div>\n<div class=\"gen\" id=\"g8\">\n    <div class=\"row\"><span><b class=\"k\">새 숫자로 한 번 더</b> · 질량·전압·저항·시간이 바뀌어요</span><button class=\"btn\" data-gen=\"8\">새 문제</button></div>\n    <div class=\"out\"></div>\n  </div>"}, "t9": {"title": "가스센서 서술형", "pts": "전체", "html": "\n  \n  <p class=\"why\">Pd 수소센서·4-wire·브리지 설계·drift·선택성·반도체식·히터·GC. 작년 기출 4·5번이 여기서 나왔듯 올해도 서술형이 나올 가능성이 높아요.</p>\n<div class=\"card\" id=\"c9-A\">\n    <div class=\"card-top\"><span class=\"id\">9-A</span><span class=\"ttl\">Pd 수소센서 원리 · Pd–Ni 합금</span><span class=\"tag ess\">서술형 · 강의 범위</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">Pd</span><span class=\"kw\">PdHₓ</span><span class=\"kw\">격자 팽창</span><span class=\"kw\">Ni 4~8 %</span></div><p class=\"fline\">→ H₂ 흡착 → 해리 → Pd 내부 확산 → PdHₓ → 전도도 변화 → 저항 변화 · Ni 합금 = 팽창·상전이 억제</p></div>\n    <ol class=\"q\"><li>Pd 저항형 수소센서의 감지 원리를 순서대로 설명하라.</li><li>순수 Pd의 문제점과 Pd–Ni 합금을 쓰는 이유는?</li><li>구동온도를 높이면 생기는 trade-off와 마이크로히터를 쓰는 이유는?</li><li>습도가 수소센서에 미치는 영향은?</li></ol>\n    <details class=\"deep\"><summary>풀이 보기 · 외울 것 → 답안 문장 → 쉬운 설명</summary><div class=\"dbody\">\n      <div class=\"dsec\"><div class=\"dh\"><span>1</span>외울 것 (키워드·식)</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">감지 흐름</span><span class=\"fe\">H₂ 표면 흡착 → 해리 → 원자 H 확산·흡수 → PdHₓ → 전기전도도 변화 → 저항 변화</span></div><div class=\"frow\"><span class=\"fl\">Pd 문제</span><span class=\"fe\">부피 최대 약 10.9 % 팽창 → 비선형·히스테리시스·crack</span></div><div class=\"frow\"><span class=\"fl\">해결</span><span class=\"fe\">Pd–Ni (Ni 4~8 %) → 팽창·상전이 억제, 단 감도 감소</span></div><div class=\"frow\"><span class=\"fl\">온도</span><span class=\"fe\">흡착↑ vs 탈착↑ trade-off → 최적 구동온도, 마이크로히터로 유지</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>가스센서01</b> p.7 · 수소 특성(4~75 % 폭발), 응용</li><li><b>가스센서01</b> p.9 · Pd 감지 흐름</li><li><b>가스센서01</b> p.10 · Pd 팽창 10.9 %, Pd–Ni 합금</li><li><b>가스센서01</b> p.16–18 · 표면적/부피비, 구동온도, 습도</li></ul></div></div>\n      <div class=\"dsec\"><div class=\"dh\"><span>2</span>답안지에 이렇게 쓰세요</div><p class=\"note\" style=\"margin:0 0 8px\">【 】 = 강의자료 원문 표현 (그대로 쓰면 안전) · 〔 〕 = 작년 교수님 답안 표현</p><div class=\"xline\"><b>Q1. Pd 저항형 수소센서의 감지 원리를 순서대로 설명하라.</b><q>【H₂ 표면 흡착 → H₂ 해리 → 원자상 H의 Pd 내부 확산·흡수 → PdHₓ 형성 → 전자구조 및 전기전도도 변화 → 전기저항 변화】. Pd는 【수소에 대한 높은 흡수능 및 용해도를 가지며 상온에서 수소 감지가 가능】하다.</q></div><p class=\"easy\">쉬운 말로 → 팔라듐은 수소를 스펀지처럼 빨아들여요. 수소가 들어가면 전기가 흐르는 성질이 변해서 저항으로 읽어요.</p><div class=\"xline\"><b>Q2. 순수 Pd의 문제점과 Pd–Ni 합금을 쓰는 이유는?</b><q>수소가 Pd의 【interstitial site에 들어가면서 격자상수가 증가하고 부피가 최대 약 10.9 %까지 팽창】 → 반복 팽창/수축으로 【비선형성, 히스테리시스, 장기 신뢰성 저하, crack·blistering·delamination】. 【Pd에 소량의 Ni(약 4~8 %)를 첨가】하면 【격자 팽창 및 상전이를 억제】하여 히스테리시스와 기계적 손상이 줄고 안정성이 향상되지만 【감도가 감소할 수 있음】.</q></div><p class=\"easy\">쉬운 말로 → 부풀었다 줄었다를 반복하면 갈라져요. 니켈을 조금 섞으면 덜 부풀지만 민감도는 조금 떨어져요.</p><div class=\"xline\"><b>Q3. 구동온도를 높이면 생기는 trade-off와 마이크로히터를 쓰는 이유는?</b><q>온도↑ → 【H₂ dissociation and adsorption kinetics↑, H diffusion↑】 그러나 【동시에 H₂ desorption rate↑】 → 【adsorption/infiltration과 desorption 사이의 trade-off】 → 【Optimal operating temperature가 필요】. 【Microheater를 이용하여 일정한 operating temperature 유지】, 【operating temperature는 ambient temperature보다 높게 설정】해 【ambient 변화에 관계없이 stable and reproducible sensor response 확보】.</q></div><p class=\"easy\">쉬운 말로 → 뜨거우면 수소가 잘 들어가지만 잘 빠져나가기도 해요. 딱 좋은 온도를 히터로 고정해요.</p><div class=\"xline\"><b>Q4. 습도가 수소센서에 미치는 영향은?</b><q>【H₂O molecules can adsorb on the sensor surface and form hydroxyl (OH) species】 → 【상대습도↑ → H₂O/OH surface coverage↑ → fewer active sites available for H₂ adsorption】 → 【Reduced H₂ infiltration → Decreased sensitivity and increased baseline drift】.</q></div><p class=\"easy\">쉬운 말로 → 물 분자가 자리를 먼저 차지해서 수소가 붙을 자리가 줄어요.</p></div>\n    </div></details>\n    <details><summary>정답 확인 · 핵심만</summary><div class=\"ans\"><ul class=\"final-list\"><li><b>감지 흐름</b> · H₂ 표면 흡착 → 해리 → 원자 H 확산·흡수 → PdHₓ → 전기전도도 변화 → 저항 변화</li><li><b>Pd 문제</b> · 부피 최대 약 10.9 % 팽창 → 비선형·히스테리시스·crack</li><li><b>해결</b> · Pd–Ni (Ni 4~8 %) → 팽창·상전이 억제, 단 감도 감소</li><li><b>온도</b> · 흡착↑ vs 탈착↑ trade-off → 최적 구동온도, 마이크로히터로 유지</li></ul></div></details>\n  </div>\n<div class=\"card\" id=\"c9-B\">\n    <div class=\"card-top\"><span class=\"id\">9-B</span><span class=\"ttl\">4-wire 이유 · 브리지 설계 · 제작</span><span class=\"tag ess\">서술형 · 강의 범위</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">4-wire</span><span class=\"kw\">전압강하</span><span class=\"kw\">R₀</span><span class=\"kw\">Al₂O₃</span></div><p class=\"fline\">→ 4선 = 전류선/전압선 분리, 전압선 I = 0 → 선 저항 영향 제거 · 브리지 = 같은 재료·같은 R₀ · Al₂O₃ = 비감지 영역 수소 차단</p></div>\n    <ol class=\"q\"><li>저항형 센서에서 4-wire 방식을 쓰는 이유와 원리는?</li><li>Wheatstone bridge의 역할과 저항 설계 조건은?</li><li>초기 저항 R₀가 다른 센서들의 감도는 어떻게 비교하는가?</li><li>센서 제작에서 Al₂O₃ passivation층을 넣는 이유와 Pd를 마지막에 증착하는 이유는?</li></ol>\n    <details class=\"deep\"><summary>풀이 보기 · 외울 것 → 답안 문장 → 쉬운 설명</summary><div class=\"dbody\">\n      <div class=\"dsec\"><div class=\"dh\"><span>1</span>외울 것 (키워드·식)</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">4-wire 목적</span><span class=\"fe\">긴 Line 저항에 의한 전압강하 제거</span></div><div class=\"frow\"><span class=\"fl\">방법</span><span class=\"fe\">정전류원 + 고입력임피던스 전압 측정 → Rₛ = Vₛ/Iₛ</span></div><div class=\"frow\"><span class=\"fl\">브리지</span><span class=\"fe\">공통 변화 보상 · ΔR → 차동 출력</span></div><div class=\"frow\"><span class=\"fl\">R₀ 다른 센서 비교</span><span class=\"fe\">Normalized response ΔR/R₀ × 100 %</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>가스센서01</b> p.12–13 · Why use four wires</li><li><b>가스센서01</b> p.24–25 · Wheatstone Bridge · R₀ 영향</li><li><b>가스센서01</b> p.26–27 · 센서의 제작 · Al₂O₃ 삽입</li><li><b>가스센서01</b> p.29 · 초기화</li></ul></div></div>\n      <div class=\"dsec\"><div class=\"dh\"><span>2</span>답안지에 이렇게 쓰세요</div><p class=\"note\" style=\"margin:0 0 8px\">【 】 = 강의자료 원문 표현 (그대로 쓰면 안전) · 〔 〕 = 작년 교수님 답안 표현</p><div class=\"xline\"><b>Q1. 저항형 센서에서 4-wire 방식을 쓰는 이유와 원리는?</b><q>【긴 Line의 저항에 의한 전압강하를 제거(최소화)하기 위함】. 【전류 공급선과 전압 측정선을 분리】하고 【정전류원으로 일정한 전류 I를 인가】, 【센서 양단의 전압 V를 측정】해 【Rₛ = Vₛ/Iₛ】로 계산. 【전압 측정단은 매우 높은 입력 임피던스를 가지므로 전류가 거의 흐르지 않고 전압 측정선의 저항에 의한 전압강하가 거의 발생하지 않는다】. 【Line 저항은 온도에 의해서도 변화】하므로 중요.</q></div><p class=\"easy\">쉬운 말로 → 전압을 재는 선에는 전류가 안 흐르니까, 그 선이 길어도 손해가 없어요.</p><div class=\"xline\"><b>Q2. Wheatstone bridge의 역할과 저항 설계 조건은?</b><q>【환경 변화(특히 temperature)에 의한 공통 저항 변화를 보상】하고 【작은 저항 변화 ΔR를 차동 출력으로 변환하여 높은 sensitivity 확보】. 【Sensing resistor와 reference resistor를 동일/유사한 재료 및 저항 특성으로 설계 → 최대 temperature compensation】. 【두 저항이 동일한 비율로 변화하면 bridge ratio가 유지되어 V_out의 temperature dependence가 최소화】.</q></div><p class=\"easy\">쉬운 말로 → 〔온도, 습도 등 외부 간섭요소에 의한 변화분을 최소화〕가 작년 교수님 표현이에요.</p><div class=\"xline\"><b>Q3. 초기 저항 R₀가 다른 센서들의 감도는 어떻게 비교하는가?</b><q>【세 센서는 서로 다른 R₀을 가지므로 absolute output[V]만으로 직접 비교하기 어려움】 → 【Normalized response(ΔR/R₀×100 %)를 사용하여 상대적인 저항 변화율을 비교】.</q></div><p class=\"easy\">쉬운 말로 → 출력 전압 크기는 R₀에 따라 달라지니 비율로 비교해요.</p><div class=\"xline\"><b>Q4. 센서 제작에서 Al₂O₃ passivation층을 넣는 이유와 Pd를 마지막에 증착하는 이유는?</b><q>【수소는 매우 작은 원자이므로 일부 재료 내부로 확산·침투할 수 있음】 → 【원하지 않는 영역으로의 H₂/H 확산을 방지하기 위해 Al₂O₃ passivation layer를 적용】 → 【비감지 영역의 수소 침투를 최소화하고 sensing area를 선택적으로 정의】. Pd는 【외부 간섭 및 공정 영향을 최소화하기 위해 마지막 단계에 증착】.</q></div><p class=\"easy\">쉬운 말로 → 수소는 어디든 스며드니 감지할 곳만 열어 두고 나머지는 덮어요.</p></div>\n    </div></details>\n    <details><summary>정답 확인 · 핵심만</summary><div class=\"ans\"><ul class=\"final-list\"><li><b>4-wire 목적</b> · 긴 Line 저항에 의한 전압강하 제거</li><li><b>방법</b> · 정전류원 + 고입력임피던스 전압 측정 → Rₛ = Vₛ/Iₛ</li><li><b>브리지</b> · 공통 변화 보상 · ΔR → 차동 출력</li><li><b>R₀ 다른 센서 비교</b> · Normalized response ΔR/R₀ × 100 %</li></ul></div></details>\n  </div>\n<div class=\"card\" id=\"c9-C\">\n    <div class=\"card-top\"><span class=\"id\">9-C</span><span class=\"ttl\">Baseline drift · 선택성 · 표면적/부피비</span><span class=\"tag ess\">서술형 · 강의 범위</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">baseline drift</span><span class=\"kw\">selectivity</span><span class=\"kw\">cross-sensitivity</span><span class=\"kw\">surface/volume</span></div><p class=\"fline\">→ drift 원인 4종(환경·표면·탈착·전자) → 보상·재교정·보정 알고리즘 · 선택성 ↑ 4가지 · 표면적↑ = 감도↑·응답↑ but 균일성↓</p></div>\n    <ol class=\"q\"><li>Baseline drift의 정의, 원인, 해결 방법은?</li><li>선택성(selectivity)이란 무엇이며 어떻게 평가하는가?</li><li>선택성을 높이는 방법 4가지를 쓰라.</li><li>감지물질의 표면적/부피비가 클 때 장단점은?</li></ol>\n    <details class=\"deep\"><summary>풀이 보기 · 외울 것 → 답안 문장 → 쉬운 설명</summary><div class=\"dbody\">\n      <div class=\"dsec\"><div class=\"dh\"><span>1</span>외울 것 (키워드·식)</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">drift 정의</span><span class=\"fe\">기준 출력(baseline)이 시간에 따라 점진적으로 변함</span></div><div class=\"frow\"><span class=\"fl\">원인</span><span class=\"fe\">환경(온·습·압) / 표면(오염·노화) / 불완전 탈착 / 전자회로(ADC offset 등)</span></div><div class=\"frow\"><span class=\"fl\">선택성 향상</span><span class=\"fe\">감지물질 선택 · 구동온도 최적화 · 선택성 필터 · 센서 어레이+패턴인식</span></div><div class=\"frow\"><span class=\"fl\">표면적/부피비↑</span><span class=\"fe\">active site↑, 응답↑, 감도↑ / 대량생산·균일성·노이즈·안정성 문제</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>가스센서01</b> p.19–21 · Baseline drift 원인·해결·보정법</li><li><b>가스센서01</b> p.32–33 · 선택성 · 향상 방법 4가지</li><li><b>가스센서01</b> p.16 · Large surface to volume ratio</li></ul></div></div>\n      <div class=\"dsec\"><div class=\"dh\"><span>2</span>답안지에 이렇게 쓰세요</div><p class=\"note\" style=\"margin:0 0 8px\">【 】 = 강의자료 원문 표현 (그대로 쓰면 안전) · 〔 〕 = 작년 교수님 답안 표현</p><div class=\"xline\"><b>Q1. Baseline drift의 정의, 원인, 해결 방법은?</b><q>【센서의 기준 출력(baseline)이 시간에 따라 점진적으로 변하는 현상】. 원인: 【환경적 요인(온도·습도·압력)】, 【표면/재료적 요인(오염, 잔류 가스, aging)】, 【탈착 불완전】, 【전자적 요인(전원 불안정, ADC offset, circuit drift)】. 해결: 【Temperature/Humidity compensation, Periodic calibration, Baseline correction 알고리즘, aging/pre-conditioning, 재료·회로 개선】.</q></div><p class=\"easy\">쉬운 말로 → 가스가 없어도 기준값이 슬금슬금 움직여요. 측정 전 N₂에서 초기화하고, 주기적으로 교정하고, 소프트웨어로 보정해요.</p><div class=\"xline\"><b>Q2. 선택성(selectivity)이란 무엇이며 어떻게 평가하는가?</b><q>【다양한 가스 및 환경 요인 중 target gas에 선택적으로 반응하는 센서의 특성】. 【실제 사용환경에서 공존할 가능성이 있는 interfering gases와의 교차감응(cross-sensitivity)을 평가】. H₂ 센서는 【O₂, N₂뿐만 아니라 CO, CO₂, CH₄, NH₃, H₂O 등의 영향】을 고려.</q></div><p class=\"easy\">쉬운 말로 → 우리 가스에만 반응하고 다른 가스에는 반응 안 하는 정도예요.</p><div class=\"xline\"><b>Q3. 선택성을 높이는 방법 4가지를 쓰라.</b><q>① 【Optimal sensing material selection】 ② 【Operating temperature optimization(온도에 따라 각 가스의 adsorption·dissociation·reaction kinetics가 다름)】 ③ 【Selective porous membrane / filter】 ④ 【Sensor Array + Pattern Recognition(여러 센서의 response pattern 분석)】.</q></div><p class=\"easy\">쉬운 말로 → 재료·온도·필터·여러 개 묶기, 네 가지예요.</p><div class=\"xline\"><b>Q4. 감지물질의 표면적/부피비가 클 때 장단점은?</b><q>장점: 【Large gas-accessible surface area, More active sites, Fast response/recovery, High sensitivity】. 단점: 【Difficult mass production, Poor device-to-device uniformity, Increased noise, Long-term stability issues】.</q></div><p class=\"easy\">쉬운 말로 → 나노구조처럼 표면이 넓으면 민감하지만 똑같이 만들기 어렵고 노이즈가 커요.</p></div>\n    </div></details>\n    <details><summary>정답 확인 · 핵심만</summary><div class=\"ans\"><ul class=\"final-list\"><li><b>drift 정의</b> · 기준 출력(baseline)이 시간에 따라 점진적으로 변함</li><li><b>원인</b> · 환경(온·습·압) / 표면(오염·노화) / 불완전 탈착 / 전자회로(ADC offset 등)</li><li><b>선택성 향상</b> · 감지물질 선택 · 구동온도 최적화 · 선택성 필터 · 센서 어레이+패턴인식</li><li><b>표면적/부피비↑</b> · active site↑, 응답↑, 감도↑ / 대량생산·균일성·노이즈·안정성 문제</li></ul></div></details>\n  </div>\n<div class=\"card\" id=\"c9-D\">\n    <div class=\"card-top\"><span class=\"id\">9-D</span><span class=\"ttl\">반도체식 가스센서 · 고온 · 나노파티클</span><span class=\"tag ess\">서술형 · 강의 범위</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">n형 산화물</span><span class=\"kw\">depletion</span><span class=\"kw\">200~400 °C</span><span class=\"kw\">Schottky</span></div><p class=\"fline\">→ n형: 환원성 → 전자 반환 → 저항↓ · 산화성 → 전자 포획 → 저항↑ · 고온 = 반응 활성화 · NP = 전기적+화학적 증감</p></div>\n    <ol class=\"q\"><li>n형 산화물반도체 센서가 환원성 가스를 검출하는 메커니즘을 설명하라.</li><li>산화성 가스(NO₂)일 때는 어떻게 되는가?</li><li>반도체식 가스센서에 200~400 °C의 높은 구동온도가 필요한 이유는?</li><li>산화물반도체 표면에 금속 나노파티클을 증착하는 이유 두 가지는?</li></ol>\n    <details class=\"deep\"><summary>풀이 보기 · 외울 것 → 답안 문장 → 쉬운 설명</summary><div class=\"dbody\">\n      <div class=\"dsec\"><div class=\"dh\"><span>1</span>외울 것 (키워드·식)</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">재료</span><span class=\"fe\">ZnO, WO₃, SnO₂ 등 대부분 n형</span></div><div class=\"frow\"><span class=\"fl\">n형+환원성</span><span class=\"fe\">흡착 산소와 반응 → 전자 반환 → depletion↓ → 저항↓</span></div><div class=\"frow\"><span class=\"fl\">n형+산화성</span><span class=\"fe\">전자 포획 → depletion↑ → 저항↑</span></div><div class=\"frow\"><span class=\"fl\">고온 이유</span><span class=\"fe\">산소 흡착 활성화 · 반응 촉진 · 흡탈착 속도↑</span></div><div class=\"frow\"><span class=\"fl\">NP</span><span class=\"fe\">electrical(Schottky) + chemical(촉매) sensitization</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>가스센서02</b> p.2 · 반도체식 가스센서 개요</li><li><b>가스센서02</b> p.3–4 · 환원성/산화성 가스 검출 메커니즘</li><li><b>가스센서02</b> p.5 · 높은 구동온도가 필요한 이유</li><li><b>가스센서02</b> p.7 · 나노파티클 증착 이유</li></ul></div></div>\n      <div class=\"dsec\"><div class=\"dh\"><span>2</span>답안지에 이렇게 쓰세요</div><p class=\"note\" style=\"margin:0 0 8px\">【 】 = 강의자료 원문 표현 (그대로 쓰면 안전) · 〔 〕 = 작년 교수님 답안 표현</p><div class=\"xline\"><b>Q1. n형 산화물반도체 센서가 환원성 가스를 검출하는 메커니즘을 설명하라.</b><q>【n-type 산화물반도체가 공기 중 산소에 노출되면 산소 분자가 표면에 흡착하면서 전자를 포획 → electron depletion layer 형성】 → 【potential barrier 증가 → 초기 저항 R₀】. 【환원성 가스가 흡착된 산소종과 반응하여 CO₂, H₂O 등을 생성하면서 포획되어 있던 전자를 되돌려줌 → 전자 농도 증가 → depletion layer 감소 → potential barrier 감소 → 전기저항 감소】.</q></div><p class=\"easy\">쉬운 말로 → 산소가 전자를 잡아 두고 있다가, 수소가 와서 산소와 반응하면 전자가 풀려나 저항이 내려가요.</p><div class=\"xline\"><b>Q2. 산화성 가스(NO₂)일 때는 어떻게 되는가?</b><q>【NO₂: 산화성 가스 → electron acceptor】. 【표면에 흡착되면 전자를 포획하여 n-type의 전자 농도를 감소 → depletion region 증가 → potential barrier 증가 → 센서 저항 증가】.</q></div><p class=\"easy\">쉬운 말로 → 전자를 더 빼앗아 가니 저항이 올라가요. p형이면 반대예요.</p><div class=\"xline\"><b>Q3. 반도체식 가스센서에 200~400 °C의 높은 구동온도가 필요한 이유는?</b><q>【표면에서 산소 흡착 활성화】, 【타깃 가스–흡착 산소 반응 촉진】, 【흡착/탈착 속도 향상】 → 【Active site 증가 → 감도 향상】. 따라서 【소형화된 센서에서는 마이크로히터 집적이 필요】.</q></div><p class=\"easy\">쉬운 말로 → 뜨거워야 표면 반응이 빨라져요.</p><div class=\"xline\"><b>Q4. 산화물반도체 표면에 금속 나노파티클을 증착하는 이유 두 가지는?</b><q>【Electrical sensitization: Metal NP 증착 → Schottky junction 형성 → depletion region/barrier 형성 → 전기적 신호 변화 증폭】. 【Chemical sensitization: NP의 catalytic activity↑ → reactive oxygen species↑ → gas–oxygen reaction↑ → 감도↑】.</q></div><p class=\"easy\">쉬운 말로 → 금속 알갱이가 전기 신호를 키우고(전기적), 반응을 도와요(화학적).</p></div>\n    </div></details>\n    <details><summary>정답 확인 · 핵심만</summary><div class=\"ans\"><ul class=\"final-list\"><li><b>재료</b> · ZnO, WO₃, SnO₂ 등 대부분 n형</li><li><b>n형+환원성</b> · 흡착 산소와 반응 → 전자 반환 → depletion↓ → 저항↓</li><li><b>n형+산화성</b> · 전자 포획 → depletion↑ → 저항↑</li><li><b>고온 이유</b> · 산소 흡착 활성화 · 반응 촉진 · 흡탈착 속도↑</li><li><b>NP</b> · electrical(Schottky) + chemical(촉매) sensitization</li></ul></div></details>\n  </div>\n<div class=\"card\" id=\"c9-E\">\n    <div class=\"card-top\"><span class=\"id\">9-E</span><span class=\"ttl\">마이크로히터 Pt · 열평형 · GC 원리</span><span class=\"tag ess\">서술형 · 강의 범위</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">Pt</span><span class=\"kw\">Joule</span><span class=\"kw\">열평형</span><span class=\"kw\">GC retention time</span></div><p class=\"fline\">→ Pt = 고온 안정·내산화·저항 안정 · 발열 = 방열 → 온도 일정 · GC = stationary phase 상호작용 차이로 분리</p></div>\n    <ol class=\"q\"><li>마이크로히터 재료로 Pt를 쓰는 이유와 히터 온도 조건은?</li><li>일정 전압에서 온도가 일정해지는 이유와, 주변 온도가 변할 때 어떻게 목표 온도를 유지하는가?</li><li>Gas chromatography의 분리 원리를 설명하라.</li><li>Carrier gas 유량이 너무 빠르거나 느리면 어떤 문제가 생기는가?</li></ol>\n    <details class=\"deep\"><summary>풀이 보기 · 외울 것 → 답안 문장 → 쉬운 설명</summary><div class=\"dbody\">\n      <div class=\"dsec\"><div class=\"dh\"><span>1</span>외울 것 (키워드·식)</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">히터 조건</span><span class=\"fe\">히터 온도 > 주변 온도</span></div><div class=\"frow\"><span class=\"fl\">Pt 이유</span><span class=\"fe\">고온 안정 · 내산화 · 저항–온도 관계 안정</span></div><div class=\"frow\"><span class=\"fl\">일정 온도</span><span class=\"fe\">발열(VI) = 방열(전도+대류+복사)</span></div><div class=\"frow\"><span class=\"fl\">GC</span><span class=\"fe\">상호작용 강 = 느림, 약 = 빠름 → retention time으로 식별</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>가스센서02</b> p.13 · Microheater 요구사항 · Pt · 열 생성</li><li><b>가스센서02</b> p.15 · 열평형</li><li><b>가스센서02</b> p.19 · 주변온도 변화 시 전류 조절</li><li><b>가스센서02</b> p.30–35 · GC 동작원리 · flow 최적화</li></ul></div></div>\n      <div class=\"dsec\"><div class=\"dh\"><span>2</span>답안지에 이렇게 쓰세요</div><p class=\"note\" style=\"margin:0 0 8px\">【 】 = 강의자료 원문 표현 (그대로 쓰면 안전) · 〔 〕 = 작년 교수님 답안 표현</p><div class=\"xline\"><b>Q1. 마이크로히터 재료로 Pt를 쓰는 이유와 히터 온도 조건은?</b><q>【높은 온도에서 안정성이 높음】, 【고온에서도 산화에 대한 내성이 우수】, 【전기저항의 온도 의존성이 비교적 안정적이어서 온도 측정/제어에도 활용 가능】(Pt 녹는점 1768 °C). 【마이크로히터의 온도는 주변 온도보다 높게 유지되어야 함】, 그렇지 않으면 【열전달 방향이 달라져 센서 표면 온도가 주변 온도의 영향을 크게 받음】.</q></div><p class=\"easy\">쉬운 말로 → 오래 뜨겁게 써야 하니 안 녹고 안 녹슬고 저항이 믿을 만한 백금을 써요.</p><div class=\"xline\"><b>Q2. 일정 전압에서 온도가 일정해지는 이유와, 주변 온도가 변할 때 어떻게 목표 온도를 유지하는가?</b><q>【온도가 상승하면 열전도·대류·복사에 의한 열손실이 증가】 → 【발열량과 방열량이 같아지는 지점 → 열평형 → 온도 일정】. 【주변 온도가 낮아지면 온도차가 증가하여 열손실이 증가 → 더 많은 열을 생성해야 하므로 히터 전류를 증가】, 반대면 감소. 〔열의 생성 = 열의 방사가 평형을 이루는 steady-state〕.</q></div><p class=\"easy\">쉬운 말로 → 욕조에 물을 틀어 두면 넘치는 양과 들어오는 양이 같아지며 수위가 멈추는 것과 같아요.</p><div class=\"xline\"><b>Q3. Gas chromatography의 분리 원리를 설명하라.</b><q>【시료가 carrier gas에 실려 column을 통과하며 성분마다 stationary phase와 상호작용이 다름】. 【강하게 상호작용하는 가스는 느리게, 약하게 상호작용하는 가스는 빠르게 이동】 → 【각 가스가 다른 속도로 이동해 분리】 → 【retention time으로 검출·식별】. 상호작용은 【화학 반응이 아닌 물리적 흡착·탈착 평형】.</q></div><p class=\"easy\">쉬운 말로 → 긴 관에 섞인 가스를 흘리면 성분마다 나오는 시간이 달라 하나씩 분리돼요.</p><div class=\"xline\"><b>Q4. Carrier gas 유량이 너무 빠르거나 느리면 어떤 문제가 생기는가?</b><q>빠름: 【analyte와 stationary phase의 상호작용 시간이 부족 → 분리능(resolution) 감소】. 느림: 【longitudinal diffusion 증가 → peak broadening, 분석 시간 증가】. 【최적 flow rate에서 column efficiency가 최대】.</q></div><p class=\"easy\">쉬운 말로 → 너무 빠르면 안 갈라지고, 너무 느리면 봉우리가 퍼져요.</p></div>\n    </div></details>\n    <details><summary>정답 확인 · 핵심만</summary><div class=\"ans\"><ul class=\"final-list\"><li><b>히터 조건</b> · 히터 온도 > 주변 온도</li><li><b>Pt 이유</b> · 고온 안정 · 내산화 · 저항–온도 관계 안정</li><li><b>일정 온도</b> · 발열(VI) = 방열(전도+대류+복사)</li><li><b>GC</b> · 상호작용 강 = 느림, 약 = 빠름 → retention time으로 식별</li></ul></div></details>\n  </div>"}, "t10": {"title": "홀 센서 · 극성과 V_H", "pts": "HW2-3", "html": "\n  \n  <p class=\"why\">F = q(v × B). 전자는 q가 음수이고 전류와 반대로 움직여요. 그래서 n형과 p형은 같은 쪽으로 휘지만 쌓이는 전하 부호가 달라요.</p>\n<div class=\"card\" id=\"c10-A\">\n    <div class=\"card-top\"><span class=\"id\">10-A</span><span class=\"ttl\">HW2 3번</span><span class=\"tag hw\">HW2 원본 · 제출 완료</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">n형 GaAs</span><span class=\"kw\">−z 자기장</span><span class=\"kw\">V_H 극성</span></div><p class=\"fline\">→ <b>캐리어는 I × B 방향 면으로 몰림</b> (+x × −z = +y) · n형이면 그 면 (−)</p></div>\n    <div class=\"fig\" data-hall='{\"I\": \"+x\", \"B\": \"−z\", \"vs\": true, \"note\": \"n형 GaAs · 전류 +x (제출 답안 기준)\"}'></div>\n    <p>n형 GaAs에 전압을 인가한 뒤 <b class=\"v\">−z 방향</b>으로 자기장을 인가했다 (그림은 HW2 참고).</p>\n    <ol class=\"q\"><li>V_H의 극성 표기 (전하 축적 상태 포함)</li><li>자기장을 계속 걸어도 V_H가 일정한 이유</li><li>p형 GaAs로 바꾸면 V_H 극성은?</li></ol>\n    <details class=\"deep\"><summary>풀이 보기 · 공식 → 순서 → 차근차근 → 답안지 문장</summary><div class=\"dbody\"><div class=\"dsec\"><div class=\"dh\"><span>1</span>이 공식에 숫자만 넣으면 돼요</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">캐리어가 몰리는 면</span><span class=\"fe\">I × B 방향 (n형·p형 같음)</span><span class=\"fs\">이 문제: I(+x) × B(−z) = +y 면</span></div><div class=\"frow\"><span class=\"fl\">극성</span><span class=\"fe\">n형: 그 면 (−) · p형: 그 면 (+)</span><span class=\"fs\">이 문제: n형: +y (−), −y (+) · p형: +y (+)</span></div><div class=\"frow\"><span class=\"fl\">일정한 이유</span><span class=\"fe\">qE_H = qvB</span><span class=\"fs\">이 문제: 전기력 = 자기력 → 더 안 쌓임</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>자기센서01</b> p.15 · Hall sensor · 로렌츠 힘으로 전자 휨</li><li><b>자기센서01</b> p.16 · Charge(e⁻, h⁺) 휨의 방향</li><li><b>자기센서01</b> p.17 · 왜 V_H가 일정하게 유지되는가</li><li><b>자기센서01</b> p.19–20 · Hall voltage (V_H) 식 · p형</li><li><b>HW2</b> 3번 · n형 GaAs, −z 자기장</li></ul></div></div><div class=\"dsec\"><div class=\"dh\"><span>2</span>풀이 순서 (이 순서대로만)</div><ol class=\"flow\"><li>그림에서 전류 방향 읽기</li><li>캐리어 속도 방향 정하기 (n형은 전류 반대)</li><li>v × B → q 부호 → 쌓이는 면</li><li>정상상태 설명</li><li>p형 비교</li></ol></div><div class=\"dsec\"><div class=\"dh\"><span>3</span>차근차근 풀이 (처음 보는 사람용)</div><h4>이 문제가 묻는 것</h4><p>HW2 그림의 n형 GaAs 홀 소자에 −z 자기장을 걸었을 때 어느 면에 전자가 쌓이는지(V_H 극성), V_H가 왜 일정한지, p형이면 어떻게 되는지 묻는 문제예요.</p><h4>먼저 알아야 할 것</h4><p><b>로렌츠 힘</b>: 자기장 B 속에서 움직이는 전하 q는 옆으로 밀려요. 방향은 F = q(v × B)로 정해요. v는 전하가 움직이는 방향이에요.</p><p><b>오른손 규칙</b>(v × B): 오른손 네 손가락을 v 방향으로 펴고, B 방향으로 감아쥐면 엄지가 v × B 방향이에요. 그다음 q의 부호를 곱해요. q가 −(전자)면 방향을 뒤집어요.</p><div class=\"tw\"><table class=\"t sm\"><tr><th></th><th>n형</th><th>p형</th></tr><tr><td>움직이는 캐리어</td><td>전자 (−e)</td><td>정공 (+e)</td></tr><tr><td>캐리어 속도 v</td><td>전류와 <b>반대</b> 방향</td><td>전류와 <b>같은</b> 방향</td></tr></table></div><p>그래서 n형과 p형은 <b>같은 쪽으로 휘어요</b>(속도도 반대, 부호도 반대라 두 번 뒤집힘). 하지만 쌓이는 전하가 −냐 +냐가 달라서 V_H 극성이 반대예요.</p><h4>극성을 정하는 순서</h4><ol class=\"st\"><li>그림에서 V_s의 + → − 방향으로 전류 방향을 축(±x, ±y)으로 적기</li><li>n형이니 전자 속도 v = 전류의 반대 방향</li><li>v × B를 오른손으로 구하기 (B = −z)</li><li>전자는 q < 0 → 방향 뒤집기 → 그 면에 전자가 쌓여 (−), 반대 면 (+)</li><li>답안에 소자 그림을 그리고 −−− / +++ 를 면에 표시</li></ol><h4>ii) 왜 일정한가 생각하는 법</h4><p>전자가 한쪽에 쌓이면 양 면 사이에 전기장이 생겨요. 이 전기장은 다음에 오는 전자를 반대쪽으로 밀어요. 자기력과 이 전기력이 어떻게 되면 더 이상 안 쌓일까요? 10-C 해설을 보세요.</p><h4>iii) p형 생각하는 법</h4><p>위 표처럼 p형은 정공(+)이 전류 방향으로 움직여요. 휘는 쪽은 같지만 쌓이는 전하가 +예요.</p><h4>숫자 대신 방향으로 풀기 (제출 답안과 같음)</h4><ol class=\"st\"><li>전류 I = +x (V_s 연결 방향), B = −z</li><li>n형 전자 속도 v = −x → v × B = (−x̂) × (−ẑ) = x̂ × ẑ = −ŷ</li><li>q = −e → F = +ŷ → 전자가 <b>+y면</b>에 쌓임 → +y (−), −y (+)</li><li>p형: 정공 v = +x → v × B = x̂ × (−ẑ) = +ŷ → F = +ŷ → 정공도 +y면 → +y (+), −y (−) → <b>극성 반대</b></li></ol><div class=\"warn\"><b>자주 하는 실수</b> · 답안에 \"전류가 +x인 이유(그림의 V_s + → −)\"를 한 줄 적어 두세요. 방향 가정이 틀리면 극성 전체가 뒤집혀서, 근거가 있어야 부분 점수를 받을 수 있어요 (추정).</div></div><div class=\"dsec\"><div class=\"dh\"><span>4</span>답안지에 이렇게 쓰세요 · 시험용 짧은 버전</div><div class=\"xline\"><b>i)</b><q>\"전류 +x, B −z이므로 캐리어는 I×B = +y 방향으로 밀린다. n형은 전자가 +y면에 쌓여 +y면 (−), −y면 (+)\"</q></div><div class=\"xline\"><b>ii)</b><q>\"쌓인 전하가 홀 전기장 E_H를 만들고, 전기력 qE_H가 자기력 qvB와 같아지면 캐리어가 더 휘지 않아 V_H가 일정하다\"</q></div><div class=\"xline\"><b>iii)</b><q>\"p형은 정공(+)이 같은 +y면에 쌓이므로 극성이 반대: +y면 (+), −y면 (−)\"</q></div><ul class=\"final-list\"><li>i) 전자 +y면 → +y (−), −y (+)</li><li>ii) qE_H = qvB 평형 → 더 안 쌓임</li><li>iii) p형: +y (+), −y (−), 극성 반대</li></ul></div></div></details>\n    <details><summary>정답 확인 · 제출 답안과 일치 ✓</summary><div class=\"ans\">\n      <p class=\"final\">i) 전자가 +y면에 축적 → +y면 (−), −y면 (+) &nbsp; ii) 전기력 qE_H = 자기력 qvB 평형 &nbsp; iii) p형: +y면 (+), −y면 (−) → 극성 반대</p>\n      <ol>\n        <li>그림의 V_s 연결로 전류 I = +x 방향으로 읽음 (제출 답안 기준)</li>\n        <li>n형 전자 속도 v = −x, B = −z → v × B = (−x̂) × (−ẑ) = x̂ × ẑ = −ŷ</li>\n        <li>전자 q = −e → F = −e × (−ŷ) = +ŷ → 전자가 +y면에 쌓임 → +y (−), −y (+)</li>\n        <li>p형: 정공 v = +x → v × B = x̂ × (−ẑ) = +ŷ → F = +e × ŷ = +ŷ → 정공도 +y면 → +y (+), −y (−)</li>\n      </ol>\n      <p class=\"one\">보충하면 좋은 점: i)에 \"전류가 왜 +x인지(V_s의 + → − 방향)\"와 \"F = q(v × B) = +y\"를 한 줄 적으면 과정 점수에 안전해요. ii)는 \"축적된 전하가 홀 전기장 E_H를 만들고, qE_H = qvB가 되면 캐리어가 직진\"까지 쓰면 완벽해요.</p>\n    </div></details>\n  </div>\n<div class=\"card\" id=\"c10-B\">\n    <div class=\"card-top\"><span class=\"id\">10-B</span><span class=\"ttl\">방향을 정해 준 n형 · p형</span><span class=\"tag sim\">유사</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">n형 vs p형</span></div><p class=\"fline\">→ I × B = x̂ × ẑ = −y 면 · n형 (−), p형 (+) · 몰리는 면은 같고 부호만 반대</p></div>\n    <div class=\"fig\" data-hall='{\"I\":\"+x\",\"B\":\"+z\"}'></div>\n    <div class=\"given\">전류 I: <b class=\"v\">+x 방향</b>, 자기장 B: <b class=\"v\">+z 방향</b></div>\n    <ol class=\"q\">\n      <li>n형일 때 전자는 +y면과 −y면 중 어디에 쌓이는가? 어느 면이 (+)인가?</li>\n      <li>p형일 때 정공은 어디에 쌓이는가? 어느 면이 (+)인가?</li>\n      <li>B를 −z로 바꾸면 n형의 극성은?</li>\n    </ol>\n    <div class=\"hintbox\"><b>힌트</b> · x̂ × ẑ = −ŷ (ẑ × x̂ = +ŷ)</div>\n    <details class=\"deep\"><summary>풀이 보기 · 공식 → 순서 → 차근차근 → 답안지 문장</summary><div class=\"dbody\"><div class=\"dsec\"><div class=\"dh\"><span>1</span>이 공식에 숫자만 넣으면 돼요</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">캐리어가 몰리는 면</span><span class=\"fe\">I × B 방향 (n형·p형 같음)</span><span class=\"fs\">이 문제: I(+x) × B(+z) = −y 면</span></div><div class=\"frow\"><span class=\"fl\">극성</span><span class=\"fe\">n형: 그 면 (−) · p형: 그 면 (+)</span><span class=\"fs\">이 문제: n형 −y (−) · p형 −y (+) · B = −z면 +y로</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>자기센서01</b> p.15 · Hall sensor · 로렌츠 힘으로 전자 휨</li><li><b>자기센서01</b> p.16 · Charge(e⁻, h⁺) 휨의 방향</li><li><b>자기센서01</b> p.17 · 왜 V_H가 일정하게 유지되는가</li><li><b>자기센서01</b> p.19–20 · Hall voltage (V_H) 식 · p형</li></ul></div></div><div class=\"dsec\"><div class=\"dh\"><span>2</span>풀이 순서 (이 순서대로만)</div><ol class=\"flow\"><li>캐리어 속도
