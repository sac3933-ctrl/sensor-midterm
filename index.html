5×84 = -252. 왼쪽 행렬의 가로줄과 오른쪽 세로줄을 짝지어 곱해 더해요.</div><h4>감도</h4><p>감도 = 입력이 1 변할 때 출력 변화 = 기울기 a = <b>5.5</b></p><h4>정확도 (입력 기준)</h4><p>교정 직선을 \"참\"으로 봐요. 측정 출력을 직선에 넣어 센서가 \"읽은\" 입력을 구하고, 실제 넣은 입력과 비교해요.</p><div class=\"eqn\">30 = 5.5x − 10.5 → x읽음 = (30 + 10.5) / 5.5 = 7.3636</div><ol class=\"st\"><li>오차율 = |7.3636 − 7| / 7 × 100 = 5.19 %</li><li>정확도 = 100 − 오차율 = 94.81 %</li></ol><div class=\"warn\"><b>자주 하는 실수</b> · 출력끼리(28 vs 30) 비교하면 다른 숫자가 나와요. 교수님 풀이는 <b>입력 기준</b>(7.36 vs 7)이에요. 7.36으로 반올림하면 5.14 %, 94.86 %가 나오고 이게 작년 모범답안이에요.</div><h4>검산</h4><p>잔차: 16 − 17 = −1, 30 − 28 = +2, 38 − 39 = −1. 합이 0이면 직선이 맞아요.</p></div><div class=\"dsec\"><div class=\"dh\"><span>4</span>답안지에 이렇게 쓰세요 · 시험용 짧은 버전</div><div class=\"xline\"><b>i) 직선</b><q>\"XᵀXp = Xᵀy 에서 p = (XᵀX)⁻¹Xᵀy. XᵀX = [[155,21],[21,3]], Xᵀy = [632,84], det = 24 → a = 5.5, b = −10.5. ∴ y = 5.5x − 10.5\"</q></div><div class=\"xline\"><b>ii) 감도</b><q>\"감도는 교정 직선의 기울기이므로 5.5\"</q></div><div class=\"xline\"><b>iii) 정확도</b><q>\"출력 30을 직선에 넣으면 x = 7.36. 오차율 = |7.36 − 7|/7 × 100 = 5.14 %, 정확도 = 100 − 5.14 = 94.86 %\"</q></div><ul class=\"final-list\"><li>y = 5.5x − 10.5</li><li>감도 = 5.5</li><li>오차율 5.14 %, 정확도 94.86 % (교수님 풀이, 7.36 반올림) · 반올림 없이 5.19 %, 94.81 %</li></ul></div></div></details>\n    <details><summary>정답 확인</summary><div class=\"ans\">\n      <p class=\"final\">i) y = 5.5x − 10.5 &nbsp; ii) 감도 5.5 &nbsp; iii) 오차율 5.14 %, 정확도 94.86 %</p>\n      <ol>\n        <li>X = [[5,1],[7,1],[9,1]], y = [16,30,38]</li>\n        <li>XᵀX = [[155, 21],[21, 3]], Xᵀy = [632, 84]</li>\n        <li>det = 155·3 − 21·21 = 24 → (XᵀX)⁻¹ = (1/24)[[3, −21],[−21, 155]]</li>\n        <li>a = (3·632 − 21·84)/24 = 132/24 = 5.5</li>\n        <li>b = (−21·632 + 155·84)/24 = −252/24 = −10.5</li>\n        <li>감도 = 기울기 = 5.5</li>\n        <li>b점 출력 30 → 30 = 5.5x − 10.5 → xₘ = 40.5/5.5 = 7.36</li>\n        <li>오차율 = |7.36 − 7|/7 × 100 = 5.14 %, 정확도 = 100 − 5.14 = 94.86 %</li>\n      </ol>\n      <p class=\"one\">검산: 세 점의 잔차 (16−17), (30−28), (38−39) → −1, +2, −1, 합이 0이면 최소자승 직선이 맞아요. 반올림 없이 계산하면 7.3636 → 5.19 %, 94.81 %도 같은 답이에요.</p>\n    </div></details>\n    <details class=\"calc-in\"><summary>fx-570ES PLUS 입력 순서</summary><div class=\"kbody\"><div class=\"krow\"><div class=\"kl\">a (기울기)</div><div class=\"kk\"><kbd>(</kbd><kbd class=\"n\">3</kbd><kbd>×</kbd><kbd class=\"n\">632</kbd><kbd>−</kbd><kbd class=\"n\">21</kbd><kbd>×</kbd><kbd class=\"n\">84</kbd><kbd>)</kbd><kbd>÷</kbd><kbd class=\"n\">24</kbd><kbd>=</kbd></div><div class=\"kd\">5.5</div></div><div class=\"krow\"><div class=\"kl\">b (절편)</div><div class=\"kk\"><kbd>(</kbd><kbd>(−)</kbd><kbd class=\"n\">21</kbd><kbd>×</kbd><kbd class=\"n\">632</kbd><kbd>+</kbd><kbd class=\"n\">155</kbd><kbd>×</kbd><kbd class=\"n\">84</kbd><kbd>)</kbd><kbd>÷</kbd><kbd class=\"n\">24</kbd><kbd>=</kbd></div><div class=\"kd\">−10.5</div></div><div class=\"krow\"><div class=\"kl\">읽은 입력 xₘ</div><div class=\"kk\"><kbd>(</kbd><kbd class=\"n\">30</kbd><kbd>+</kbd><kbd class=\"n\">10.5</kbd><kbd>)</kbd><kbd>÷</kbd><kbd class=\"n\">5.5</kbd><kbd>=</kbd></div><div class=\"kd\">7.363636…</div></div><div class=\"krow\"><div class=\"kl\">오차율 %</div><div class=\"kk\"><kbd>(</kbd><kbd>Ans</kbd><kbd>−</kbd><kbd class=\"n\">7</kbd><kbd>)</kbd><kbd>÷</kbd><kbd class=\"n\">7</kbd><kbd>×</kbd><kbd class=\"n\">100</kbd><kbd>=</kbd></div><div class=\"kd\">5.1948 (7.36으로 반올림하면 5.14)</div></div><div class=\"krow\"><div class=\"kl\">정확도 %</div><div class=\"kk\"><kbd class=\"n\">100</kbd><kbd>−</kbd><kbd>Ans</kbd><kbd>=</kbd></div><div class=\"kd\">94.805</div></div><div class=\"krow\"><div class=\"kl\">STAT 검산</div><div class=\"kk\"><kbd>MODE</kbd><kbd class=\"n\">3</kbd><kbd class=\"n\">2</kbd><kbd class=\"n\">5</kbd><kbd>=</kbd><kbd class=\"n\">7</kbd><kbd>=</kbd><kbd class=\"n\">9</kbd><kbd>=</kbd><kbd>▶</kbd><kbd>▲</kbd><kbd>▲</kbd><kbd>▲</kbd><kbd class=\"n\">16</kbd><kbd>=</kbd><kbd class=\"n\">30</kbd><kbd>=</kbd><kbd class=\"n\">38</kbd><kbd>=</kbd><kbd>AC</kbd></div><div class=\"kd\">x열에 5·7·9, y열에 16·30·38 (▶ ▲로 y열 첫 칸 이동)</div></div><div class=\"krow\"><div class=\"kl\"></div><div class=\"kk\"><kbd>SHIFT</kbd><kbd class=\"n\">1</kbd><kbd class=\"n\">5</kbd><kbd class=\"n\">1</kbd><kbd>=</kbd></div><div class=\"kd\">A = −10.5 (절편)</div></div><div class=\"krow\"><div class=\"kl\"></div><div class=\"kk\"><kbd>SHIFT</kbd><kbd class=\"n\">1</kbd><kbd class=\"n\">5</kbd><kbd class=\"n\">2</kbd><kbd>=</kbd></div><div class=\"kd\">B = 5.5 (기울기)</div></div><div class=\"krow\"><div class=\"kl\">일반 계산으로 복귀</div><div class=\"kk\"><kbd>MODE</kbd><kbd class=\"n\">1</kbd></div><div class=\"kd\">COMP</div></div><p class=\"knote\">회귀(STAT) 검산: 계산기의 <b>A가 절편, B가 기울기</b>예요. 우리 식 y = ax + b와 글자가 반대라 조심하세요. MODE 3 2를 다시 누르면 이전 데이터가 지워지고 새 표가 열려요.</p></div></details>\n  </div>\n<div class=\"card\" id=\"c1-B\">\n    <div class=\"card-top\"><span class=\"id\">1-B</span><span class=\"ttl\">HW1 1·2번</span><span class=\"tag hw\">HW1 원본</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">점 3개</span><span class=\"kw\">R²</span><span class=\"kw\">정확도</span></div><p class=\"fline\">→ 같은 행렬 풀이 + R² = 1 − SS_res/SS_tot</p></div>\n    <div class=\"fig\" data-plot='{\"pts\": [[4, 18], [6, 30], [8, 39]], \"lab\": [\"a\", \"b\", \"c\"]}'></div>\n    <div class=\"given\">측정데이터 a(<b class=\"v\">4, 18</b>), b(<b class=\"v\">6, 30</b>), c(<b class=\"v\">8, 39</b>)</div>\n    <ol class=\"q\">\n      <li>y = ax + b를 행렬방정식으로 구하라.</li>\n      <li>결정계수 R²를 구하라 (Excel 대신 손으로: R² = 1 − SS_res/SS_tot).</li>\n      <li>구한 직선을 참값으로 보고 b(6, 30)의 정확도를 구하라.</li>\n    </ol>\n    <details class=\"deep\"><summary>풀이 보기 · 공식 → 순서 → 차근차근 → 답안지 문장</summary><div class=\"dbody\"><div class=\"dsec\"><div class=\"dh\"><span>1</span>이 공식에 숫자만 넣으면 돼요</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">행렬방정식 (시험 답안 형식)</span><span class=\"fe\">p = (XᵀX)⁻¹ Xᵀ y,  p = [a, b]ᵀ</span></div><div class=\"frow\"><span class=\"fl\">XᵀX · Xᵀy (점 N개)</span><span class=\"fe\">XᵀX = [[Σx², Σx], [Σx, N]],  Xᵀy = [[Σxy], [Σy]]</span></div><div class=\"frow\"><span class=\"fl\">2×2 역행렬</span><span class=\"fe\">[[p, q], [r, s]]⁻¹ = (1/(ps − qr)) × [[s, −q], [−r, p]]</span></div><div class=\"frow\"><span class=\"fl\">R²</span><span class=\"fe\">R² = 1 − Σ(y − ŷ)² ÷ Σ(y − ȳ)²</span><span class=\"fs\">이 문제: 1 − 1.5 ÷ 222 = 0.9932</span></div><div class=\"frow\"><span class=\"fl\">정확도</span><span class=\"fe\">100 − |(y측정 − b) ÷ a − x참| ÷ x참 × 100</span><span class=\"fs\">이 문제: x읽음 = 32.5 ÷ 5.25 = 6.19 → 96.83 %</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>센서의 기초</b> p.11 · 감도 (sensitivity)</li><li><b>센서의 기초</b> p.16–18 · 최소자승법 (least square method) · 방법2 행렬방정식</li><li><b>센서의 기초</b> p.19 · 예제 ((1,4),(2,6),(3,7))</li><li><b>센서의 기초</b> p.22–24 · 결정계수 R² · Linearity vs R²</li><li><b>센서의 기초</b> p.26 · 정확도</li></ul></div></div><div class=\"dsec\"><div class=\"dh\"><span>2</span>풀이 순서 (이 순서대로만)</div><ol class=\"flow\"><li>표로 Σx, Σx², Σy, Σxy 구하기</li><li>X, y 행렬 쓰기 → XᵀX = [[Σx², Σx],[Σx, N]], Xᵀy = [[Σxy],[Σy]]</li><li>det → 역행렬 → p = (XᵀX)⁻¹Xᵀy 곱하기 → a, b</li><li>ŷ, ȳ 표로 SS_res, SS_tot 구해 R² 계산</li><li>측정 출력 y를 직선에 넣어 읽은 입력 xₘ 구하기</li><li>xₘ과 실제 입력 비교 → 오차율 → 정확도</li></ol></div><div class=\"dsec\"><div class=\"dh\"><span>3</span>차근차근 풀이 (처음 보는 사람용)</div><h4>이 문제가 묻는 것</h4><p>센서에 입력 x를 넣고 출력 y를 잰 점들이 <b>정확히 한 직선 위에 있지 않아요</b>. \"모든 점에 가장 가까운 직선 하나\"를 행렬방정식으로 구하라는 문제예요.</p><h4>먼저 알아야 할 것</h4><p><b>오차 eᵢ</b> = 측정 yᵢ − 직선 값(axᵢ + b). <b>최소자승법</b>은 오차를 제곱해 더한 값이 가장 작아지는 a, b를 찾는 방법이에요. 그 답이 공식 한 줄로 나와요:</p><div class=\"eqn\">p = (XᵀX)⁻¹ Xᵀ y   (p = [a, b]ᵀ)</div><p>Xᵀ는 X의 가로·세로를 바꾼 것(전치), ⁻¹은 역행렬이에요. 둘 다 아래 풀이에서 숫자로 보여 드려요.</p><h4>1단계 · 표</h4><div class=\"tw\"><table class=\"t sm\"><tr><th>x</th><th>y</th><th>x²</th><th>xy</th></tr><tr><td>4</td><td>18</td><td>16</td><td>72</td></tr><tr><td>6</td><td>30</td><td>36</td><td>180</td></tr><tr><td>8</td><td>39</td><td>64</td><td>312</td></tr><tr><td><b>Σx = 18</b></td><td><b>Σy = 87</b></td><td><b>Σx² = 116</b></td><td><b>Σxy = 564</b></td></tr></table></div><h4>답안지에 쓰는 행렬방정식 풀이</h4><p>교수님 풀이 형식이에요. 시험에서는 이 다섯 줄을 그대로 쓰면 돼요.</p><div class=\"eqn\">① 식 세우기: Xp = y<br>X = <span class=\"mx\" style=\"grid-template-columns:repeat(2,auto)\"><i>4</i><i>1</i><i>6</i><i>1</i><i>8</i><i>1</i></span>,  p = <span class=\"mx\" style=\"grid-template-columns:repeat(1,auto)\"><i>a</i><i>b</i></span>,  y = <span class=\"mx\" style=\"grid-template-columns:repeat(1,auto)\"><i>18</i><i>30</i><i>39</i></span></div><p>점마다 \"a·x + b = y\" 한 줄씩이라 X의 각 행이 [x, 1]이에요. 식은 3개, 미지수는 2개라 딱 맞는 답이 없어서 ②로 가요.</p><div class=\"eqn\">② 양변에 Xᵀ 곱하기: XᵀXp = Xᵀy<br>Xᵀ = <span class=\"mx\" style=\"grid-template-columns:repeat(3,auto)\"><i>4</i><i>6</i><i>8</i><i>1</i><i>1</i><i>1</i></span></div><div class=\"eqn\">③ XᵀX = <span class=\"mx\" style=\"grid-template-columns:repeat(2,auto)\"><i>4² + 6² + 8²</i><i>4 + 6 + 8</i><i>4 + 6 + 8</i><i>3</i></span> = <span class=\"mx\" style=\"grid-template-columns:repeat(2,auto)\"><i>116</i><i>18</i><i>18</i><i>3</i></span><br>Xᵀy = <span class=\"mx\" style=\"grid-template-columns:repeat(1,auto)\"><i>4·18 + 6·30 + 8·39</i><i>18 + 30 + 39</i></span> = <span class=\"mx\" style=\"grid-template-columns:repeat(1,auto)\"><i>564</i><i>87</i></span></div><p>XᵀX는 항상 [[Σx², Σx], [Σx, N]], Xᵀy는 [[Σxy], [Σy]]예요. 1단계 표의 합계가 그대로 들어가요.</p><div class=\"eqn\">④ 역행렬: det = 116×3 − 18×18 = 24<br>(XᵀX)⁻¹ = (1/24) × <span class=\"mx\" style=\"grid-template-columns:repeat(2,auto)\"><i>3</i><i>-18</i><i>-18</i><i>116</i></span></div><p>2×2 역행렬: 대각선 두 수는 자리를 바꾸고, 나머지 두 수는 부호만 바꾼 뒤 det로 나눠요.</p><div class=\"eqn\">⑤ p = (XᵀX)⁻¹Xᵀy = (1/24) × <span class=\"mx\" style=\"grid-template-columns:repeat(2,auto)\"><i>3</i><i>-18</i><i>-18</i><i>116</i></span> × <span class=\"mx\" style=\"grid-template-columns:repeat(1,auto)\"><i>564</i><i>87</i></span><br>= (1/24) × <span class=\"mx\" style=\"grid-template-columns:repeat(1,auto)\"><i>126</i><i>-60</i></span> = <span class=\"mx\" style=\"grid-template-columns:repeat(1,auto)\"><i>5.25</i><i>-2.5</i></span></div><p>∴ <b>a = 5.25, b = -2.5 → y = 5.25x − 2.5</b></p><div class=\"calc\"><b>계산기</b> · 행렬 곱: 윗줄 = 3×564 + (-18)×87 = 126, 아랫줄 = (-18)×564 + 116×87 = -60. 왼쪽 행렬의 가로줄과 오른쪽 세로줄을 짝지어 곱해 더해요.</div><h4>R²가 뭔지</h4><p>데이터가 평균에서 흩어진 정도 전체가 <b>SS_tot</b>, 직선이 설명 못 하고 남은 흩어짐이 <b>SS_res</b>. R² = 1 − SS_res/SS_tot는 \"직선이 흩어짐의 몇 %를 설명하나\"예요. 1에 가까울수록 점이 직선에 잘 붙어요.</p><h4>R² 계산</h4><div class=\"tw\"><table class=\"t sm\"><tr><th>x</th><th>측정 y</th><th>직선 ŷ</th><th>잔차 y − ŷ</th><th>잔차²</th><th>y − ȳ (ȳ = 29)</th><th>(y − ȳ)²</th></tr><tr><td>4</td><td>18</td><td>18.5</td><td>-0.5</td><td>0.25</td><td>-11</td><td>121</td></tr><tr><td>6</td><td>30</td><td>29</td><td>1</td><td>1</td><td>1</td><td>1</td></tr><tr><td>8</td><td>39</td><td>39.5</td><td>-0.5</td><td>0.25</td><td>10</td><td>100</td></tr><tr><td></td><td></td><td></td><td>합</td><td><b>1.5</b></td><td>합</td><td><b>222</b></td></tr></table></div><div class=\"eqn\">R² = 1 − 1.5/222 = <b>0.9932</b></div><h4>정확도 (입력 기준)</h4><p>교정 직선을 \"참\"으로 봐요. 측정 출력을 직선에 넣어 센서가 \"읽은\" 입력을 구하고, 실제 넣은 입력과 비교해요.</p><div class=\"eqn\">30 = 5.25x − 2.5 → x읽음 = (30 + 2.5) / 5.25 = 6.1905</div><ol class=\"st\"><li>오차율 = |6.1905 − 6| / 6 × 100 = 3.17 %</li><li>정확도 = 100 − 오차율 = 96.83 %</li></ol><div class=\"warn\"><b>자주 하는 실수</b> · ȳ는 y 3개의 평균 (18 + 30 + 39)/3 = 29예요. x 평균과 헷갈리지 마세요.</div></div><div class=\"dsec\"><div class=\"dh\"><span>4</span>답안지에 이렇게 쓰세요 · 시험용 짧은 버전</div><div class=\"xline\"><b>i)</b><q>\"p = (XᵀX)⁻¹Xᵀy, det = 24 → a = 5.25, b = −2.5. y = 5.25x − 2.5\"</q></div><div class=\"xline\"><b>ii) R²</b><q>\"R² = 1 − SS_res/SS_tot = 1 − 1.5/222 = 0.9932\"</q></div><div class=\"xline\"><b>iii)</b><q>\"30 → x = 6.19, 오차율 3.17 %, 정확도 96.83 %\"</q></div><ul class=\"final-list\"><li>y = 5.25x − 2.5</li><li>R² = 0.9932</li><li>정확도 96.83 % (오차율 3.17 %)</li></ul></div></div></details>\n    <details><summary>정답 확인</summary><div class=\"ans\">\n      <p class=\"final\">y = 5.25x − 2.5 &nbsp; R² = 0.9932 &nbsp; 정확도 96.83 %</p>\n      <ol>\n        <li>XᵀX = [[116, 18],[18, 3]], Xᵀy = [564, 87], det = 24</li>\n        <li>a = (3·564 − 18·87)/24 = 126/24 = 5.25, b = (−18·564 + 116·87)/24 = −60/24 = −2.5</li>\n        <li>예측값 18.5, 29, 39.5 → 잔차 −0.5, +1, −0.5 → SS_res = 1.5</li>\n        <li>ȳ = 29 → SS_tot = 121 + 1 + 100 = 222 → R² = 1 − 1.5/222 = 0.9932</li>\n        <li>30 = 5.25x − 2.5 → xₘ = 6.190 → 오차율 = 0.190/6 × 100 = 3.17 % → 정확도 96.83 %</li>\n      </ol>\n    </div></details>\n    <details class=\"calc-in\"><summary>fx-570ES PLUS 입력 순서</summary><div class=\"kbody\"><div class=\"krow\"><div class=\"kl\">a</div><div class=\"kk\"><kbd>(</kbd><kbd class=\"n\">3</kbd><kbd>×</kbd><kbd class=\"n\">564</kbd><kbd>−</kbd><kbd class=\"n\">18</kbd><kbd>×</kbd><kbd class=\"n\">87</kbd><kbd>)</kbd><kbd>÷</kbd><kbd class=\"n\">24</kbd><kbd>=</kbd></div><div class=\"kd\">5.25</div></div><div class=\"krow\"><div class=\"kl\">b</div><div class=\"kk\"><kbd>(</kbd><kbd>(−)</kbd><kbd class=\"n\">18</kbd><kbd>×</kbd><kbd class=\"n\">564</kbd><kbd>+</kbd><kbd class=\"n\">116</kbd><kbd>×</kbd><kbd class=\"n\">87</kbd><kbd>)</kbd><kbd>÷</kbd><kbd class=\"n\">24</kbd><kbd>=</kbd></div><div class=\"kd\">−2.5</div></div><div class=\"krow\"><div class=\"kl\">R²</div><div class=\"kk\"><kbd class=\"n\">1</kbd><kbd>−</kbd><kbd class=\"n\">1.5</kbd><kbd>÷</kbd><kbd class=\"n\">222</kbd><kbd>=</kbd></div><div class=\"kd\">0.993243…</div></div><div class=\"krow\"><div class=\"kl\">xₘ</div><div class=\"kk\"><kbd>(</kbd><kbd class=\"n\">30</kbd><kbd>+</kbd><kbd class=\"n\">2.5</kbd><kbd>)</kbd><kbd>÷</kbd><kbd class=\"n\">5.25</kbd><kbd>=</kbd></div><div class=\"kd\">6.190476…</div></div><div class=\"krow\"><div class=\"kl\">오차율 %</div><div class=\"kk\"><kbd>(</kbd><kbd>Ans</kbd><kbd>−</kbd><kbd class=\"n\">6</kbd><kbd>)</kbd><kbd>÷</kbd><kbd class=\"n\">6</kbd><kbd>×</kbd><kbd class=\"n\">100</kbd><kbd>=</kbd></div><div class=\"kd\">3.1746</div></div><div class=\"krow\"><div class=\"kl\">정확도 %</div><div class=\"kk\"><kbd class=\"n\">100</kbd><kbd>−</kbd><kbd>Ans</kbd><kbd>=</kbd></div><div class=\"kd\">96.825</div></div><div class=\"krow\"><div class=\"kl\">STAT 검산</div><div class=\"kk\"><kbd>MODE</kbd><kbd class=\"n\">3</kbd><kbd class=\"n\">2</kbd><kbd class=\"n\">4</kbd><kbd>=</kbd><kbd class=\"n\">6</kbd><kbd>=</kbd><kbd class=\"n\">8</kbd><kbd>=</kbd><kbd>▶</kbd><kbd>▲</kbd><kbd>▲</kbd><kbd>▲</kbd><kbd class=\"n\">18</kbd><kbd>=</kbd><kbd class=\"n\">30</kbd><kbd>=</kbd><kbd class=\"n\">39</kbd><kbd>=</kbd><kbd>AC</kbd></div><div class=\"kd\">표 입력 후 계산 화면</div></div><div class=\"krow\"><div class=\"kl\">r</div><div class=\"kk\"><kbd>SHIFT</kbd><kbd class=\"n\">1</kbd><kbd class=\"n\">5</kbd><kbd class=\"n\">3</kbd><kbd>=</kbd></div><div class=\"kd\">r = 0.99661</div></div><div class=\"krow\"><div class=\"kl\">R² = r²</div><div class=\"kk\"><kbd>x²</kbd><kbd>=</kbd></div><div class=\"kd\">0.993243 (같으면 정답)</div></div><p class=\"knote\">회귀(STAT) 검산: 계산기의 <b>A가 절편, B가 기울기</b>예요. 우리 식 y = ax + b와 글자가 반대라 조심하세요. MODE 3 2를 다시 누르면 이전 데이터가 지워지고 새 표가 열려요.</p></div></details>\n  </div>\n<div class=\"card\" id=\"c1-C\">\n    <div class=\"card-top\"><span class=\"id\">1-C</span><span class=\"ttl\">b가 0으로 나오는 경우</span><span class=\"tag sim\">유사</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">b = 0</span></div><p class=\"fline\">→ b가 0이어도 정답. 원점을 지나는 직선일 뿐</p></div>\n    <div class=\"fig\" data-plot='{\"pts\": [[2, 7], [4, 12], [6, 20]]}'></div>\n    <div class=\"given\">측정데이터 (<b class=\"v\">2, 7</b>), (<b class=\"v\">4, 12</b>), (<b class=\"v\">6, 20</b>)</div>\n    <ol class=\"q\"><li>y = ax + b와 감도</li><li>R²</li><li>(4, 12) 점의 오차율과 정확도</li></ol>\n    <details class=\"deep\"><summary>풀이 보기 · 공식 → 순서 → 차근차근 → 답안지 문장</summary><div class=\"dbody\"><div class=\"dsec\"><div class=\"dh\"><span>1</span>이 공식에 숫자만 넣으면 돼요</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">행렬방정식 (시험 답안 형식)</span><span class=\"fe\">p = (XᵀX)⁻¹ Xᵀ y,  p = [a, b]ᵀ</span></div><div class=\"frow\"><span class=\"fl\">XᵀX · Xᵀy (점 N개)</span><span class=\"fe\">XᵀX = [[Σx², Σx], [Σx, N]],  Xᵀy = [[Σxy], [Σy]]</span></div><div class=\"frow\"><span class=\"fl\">2×2 역행렬</span><span class=\"fe\">[[p, q], [r, s]]⁻¹ = (1/(ps − qr)) × [[s, −q], [−r, p]]</span></div><div class=\"frow\"><span class=\"fl\">R²</span><span class=\"fe\">R² = 1 − Σ(y − ŷ)² ÷ Σ(y − ȳ)²</span><span class=\"fs\">이 문제: 1 − 1.5 ÷ 86 = 0.9826</span></div><div class=\"frow\"><span class=\"fl\">정확도</span><span class=\"fe\">100 − |x읽음 − x참| ÷ x참 × 100</span><span class=\"fs\">이 문제: x읽음 = 12 ÷ 3.25 = 3.69 → 92.31 %</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>센서의 기초</b> p.11 · 감도 (sensitivity)</li><li><b>센서의 기초</b> p.16–18 · 최소자승법 (least square method) · 방법2 행렬방정식</li><li><b>센서의 기초</b> p.19 · 예제 ((1,4),(2,6),(3,7))</li><li><b>센서의 기초</b> p.22 · 결정계수 R²</li><li><b>센서의 기초</b> p.26 · 정확도</li></ul></div></div><div class=\"dsec\"><div class=\"dh\"><span>2</span>풀이 순서 (이 순서대로만)</div><ol class=\"flow\"><li>표로 Σx, Σx², Σy, Σxy 구하기</li><li>X, y 행렬 쓰기 → XᵀX = [[Σx², Σx],[Σx, N]], Xᵀy = [[Σxy],[Σy]]</li><li>det → 역행렬 → p = (XᵀX)⁻¹Xᵀy 곱하기 → a, b</li><li>감도 = a</li><li>R² 계산</li><li>(4, 12)에서 xₘ → 오차율 → 정확도</li></ol></div><div class=\"dsec\"><div class=\"dh\"><span>3</span>차근차근 풀이 (처음 보는 사람용)</div><h4>이 문제의 포인트</h4><p>b가 0이 나와요. 틀린 게 아니라 직선이 원점을 지난다는 뜻이에요.</p><h4>이 문제가 묻는 것</h4><p>센서에 입력 x를 넣고 출력 y를 잰 점들이 <b>정확히 한 직선 위에 있지 않아요</b>. \"모든 점에 가장 가까운 직선 하나\"를 행렬방정식으로 구하라는 문제예요.</p><h4>먼저 알아야 할 것</h4><p><b>오차 eᵢ</b> = 측정 yᵢ − 직선 값(axᵢ + b). <b>최소자승법</b>은 오차를 제곱해 더한 값이 가장 작아지는 a, b를 찾는 방법이에요. 그 답이 공식 한 줄로 나와요:</p><div class=\"eqn\">p = (XᵀX)⁻¹ Xᵀ y   (p = [a, b]ᵀ)</div><p>Xᵀ는 X의 가로·세로를 바꾼 것(전치), ⁻¹은 역행렬이에요. 둘 다 아래 풀이에서 숫자로 보여 드려요.</p><h4>1단계 · 표</h4><div class=\"tw\"><table class=\"t sm\"><tr><th>x</th><th>y</th><th>x²</th><th>xy</th></tr><tr><td>2</td><td>7</td><td>4</td><td>14</td></tr><tr><td>4</td><td>12</td><td>16</td><td>48</td></tr><tr><td>6</td><td>20</td><td>36</td><td>120</td></tr><tr><td><b>Σx = 12</b></td><td><b>Σy = 39</b></td><td><b>Σx² = 56</b></td><td><b>Σxy = 182</b></td></tr></table></div><h4>답안지에 쓰는 행렬방정식 풀이</h4><p>교수님 풀이 형식이에요. 시험에서는 이 다섯 줄을 그대로 쓰면 돼요.</p><div class=\"eqn\">① 식 세우기: Xp = y<br>X = <span class=\"mx\" style=\"grid-template-columns:repeat(2,auto)\"><i>2</i><i>1</i><i>4</i><i>1</i><i>6</i><i>1</i></span>,  p = <span class=\"mx\" style=\"grid-template-columns:repeat(1,auto)\"><i>a</i><i>b</i></span>,  y = <span class=\"mx\" style=\"grid-template-columns:repeat(1,auto)\"><i>7</i><i>12</i><i>20</i></span></div><p>점마다 \"a·x + b = y\" 한 줄씩이라 X의 각 행이 [x, 1]이에요. 식은 3개, 미지수는 2개라 딱 맞는 답이 없어서 ②로 가요.</p><div class=\"eqn\">② 양변에 Xᵀ 곱하기: XᵀXp = Xᵀy<br>Xᵀ = <span class=\"mx\" style=\"grid-template-columns:repeat(3,auto)\"><i>2</i><i>4</i><i>6</i><i>1</i><i>1</i><i>1</i></span></div><div class=\"eqn\">③ XᵀX = <span class=\"mx\" style=\"grid-template-columns:repeat(2,auto)\"><i>2² + 4² + 6²</i><i>2 + 4 + 6</i><i>2 + 4 + 6</i><i>3</i></span> = <span class=\"mx\" style=\"grid-template-columns:repeat(2,auto)\"><i>56</i><i>12</i><i>12</i><i>3</i></span><br>Xᵀy = <span class=\"mx\" style=\"grid-template-columns:repeat(1,auto)\"><i>2·7 + 4·12 + 6·20</i><i>7 + 12 + 20</i></span> = <span class=\"mx\" style=\"grid-template-columns:repeat(1,auto)\"><i>182</i><i>39</i></span></div><p>XᵀX는 항상 [[Σx², Σx], [Σx, N]], Xᵀy는 [[Σxy], [Σy]]예요. 1단계 표의 합계가 그대로 들어가요.</p><div class=\"eqn\">④ 역행렬: det = 56×3 − 12×12 = 24<br>(XᵀX)⁻¹ = (1/24) × <span class=\"mx\" style=\"grid-template-columns:repeat(2,auto)\"><i>3</i><i>-12</i><i>-12</i><i>56</i></span></div><p>2×2 역행렬: 대각선 두 수는 자리를 바꾸고, 나머지 두 수는 부호만 바꾼 뒤 det로 나눠요.</p><div class=\"eqn\">⑤ p = (XᵀX)⁻¹Xᵀy = (1/24) × <span class=\"mx\" style=\"grid-template-columns:repeat(2,auto)\"><i>3</i><i>-12</i><i>-12</i><i>56</i></span> × <span class=\"mx\" style=\"grid-template-columns:repeat(1,auto)\"><i>182</i><i>39</i></span><br>= (1/24) × <span class=\"mx\" style=\"grid-template-columns:repeat(1,auto)\"><i>78</i><i>0</i></span> = <span class=\"mx\" style=\"grid-template-columns:repeat(1,auto)\"><i>3.25</i><i>0</i></span></div><p>∴ <b>a = 3.25, b = 0 → y = 3.25x + 0</b></p><div class=\"calc\"><b>계산기</b> · 행렬 곱: 윗줄 = 3×182 + (-12)×39 = 78, 아랫줄 = (-12)×182 + 56×39 = 0. 왼쪽 행렬의 가로줄과 오른쪽 세로줄을 짝지어 곱해 더해요.</div><h4>R²</h4><p>ŷ = 6.5, 13, 19.5 → 잔차 0.5, −1, 0.5 → SS_res = 1.5. ȳ = 13 → SS_tot = 36 + 1 + 49 = 86</p><div class=\"eqn\">R² = 1 − 1.5/86 = <b>0.9826</b></div><h4>정확도 (입력 기준)</h4><p>교정 직선을 \"참\"으로 봐요. 측정 출력을 직선에 넣어 센서가 \"읽은\" 입력을 구하고, 실제 넣은 입력과 비교해요.</p><div class=\"eqn\">12 = 3.25x + 0 → x읽음 = (12 − 0) / 3.25 = 3.6923</div><ol class=\"st\"><li>오차율 = |3.6923 − 4| / 4 × 100 = 7.69 %</li><li>정확도 = 100 − 오차율 = 92.31 %</li></ol></div><div class=\"dsec\"><div class=\"dh\"><span>4</span>답안지에 이렇게 쓰세요 · 시험용 짧은 버전</div><div class=\"xline\"><b>i)</b><q>\"a = 3.25, b = 0 → y = 3.25x, 감도 3.25\"</q></div><div class=\"xline\"><b>ii)</b><q>\"R² = 1 − 1.5/86 = 0.9826\"</q></div><div class=\"xline\"><b>iii)</b><q>\"12 → x = 3.69, 오차율 7.69 %, 정확도 92.31 %\"</q></div><ul class=\"final-list\"><li>y = 3.25x (b = 0)</li><li>감도 3.25</li><li>R² = 0.9826</li><li>오차율 7.69 %, 정확도 92.31 %</li></ul></div></div></details>\n    <details><summary>정답 확인</summary><div class=\"ans\">\n      <p class=\"final\">y = 3.25x (b = 0) &nbsp; 감도 3.25 &nbsp; R² = 0.9826 &nbsp; 오차율 7.69 %, 정확도 92.31 %</p>\n      <ol>\n        <li>Σx = 12, Σx² = 56, Σy = 39, Σxy = 182, N = 3 → det = 56·3 − 144 = 24</li>\n        <li>a = (3·182 − 12·39)/24 = 78/24 = 3.25, b = (−12·182 + 56·39)/24 = 0/24 = 0</li>\n        <li>예측 6.5, 13, 19.5 → SS_res = 0.25 + 1 + 0.25 = 1.5, ȳ = 13 → SS_tot = 36 + 1 + 49 = 86 → R² = 0.9826</li>\n        <li>12 = 3.25x → xₘ = 3.692 → |3.692 − 4|/4 = 7.69 % → 정확도 92.31 %</li>\n      </ol>\n      <p class=\"one\">b = 0이 나와도 계산이 틀린 게 아니에요. 원점을 지나는 직선일 뿐이에요.</p>\n    </div></details>\n    <details class=\"calc-in\"><summary>fx-570ES PLUS 입력 순서</summary><div class=\"kbody\"><div class=\"krow\"><div class=\"kl\">a</div><div class=\"kk\"><kbd>(</kbd><kbd class=\"n\">3</kbd><kbd>×</kbd><kbd class=\"n\">182</kbd><kbd>−</kbd><kbd class=\"n\">12</kbd><kbd>×</kbd><kbd class=\"n\">39</kbd><kbd>)</kbd><kbd>÷</kbd><kbd class=\"n\">24</kbd><kbd>=</kbd></div><div class=\"kd\">3.25</div></div><div class=\"krow\"><div class=\"kl\">b</div><div class=\"kk\"><kbd>(</kbd><kbd>(−)</kbd><kbd class=\"n\">12</kbd><kbd>×</kbd><kbd class=\"n\">182</kbd><kbd>+</kbd><kbd class=\"n\">56</kbd><kbd>×</kbd><kbd class=\"n\">39</kbd><kbd>)</kbd><kbd>÷</kbd><kbd class=\"n\">24</kbd><kbd>=</kbd></div><div class=\"kd\">0</div></div><div class=\"krow\"><div class=\"kl\">R²</div><div class=\"kk\"><kbd class=\"n\">1</kbd><kbd>−</kbd><kbd class=\"n\">1.5</kbd><kbd>÷</kbd><kbd class=\"n\">86</kbd><kbd>=</kbd></div><div class=\"kd\">0.982558…</div></div><div class=\"krow\"><div class=\"kl\">xₘ</div><div class=\"kk\"><kbd class=\"n\">12</kbd><kbd>÷</kbd><kbd class=\"n\">3.25</kbd><kbd>=</kbd></div><div class=\"kd\">3.692307…</div></div><div class=\"krow\"><div class=\"kl\">오차율 %</div><div class=\"kk\"><kbd>(</kbd><kbd class=\"n\">4</kbd><kbd>−</kbd><kbd>Ans</kbd><kbd>)</kbd><kbd>÷</kbd><kbd class=\"n\">4</kbd><kbd>×</kbd><kbd class=\"n\">100</kbd><kbd>=</kbd></div><div class=\"kd\">7.6923</div></div></div></details>\n  </div>\n<div class=\"card\" id=\"c1-D\">\n    <div class=\"card-top\"><span class=\"id\">1-D</span><span class=\"ttl\">점이 4개 + MDL까지</span><span class=\"tag sim\">유사 · 응용</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">점 4개</span><span class=\"kw\">MDL</span></div><p class=\"fline\">→ 점 4개여도 XᵀX는 2×2 (N = 4) · MDL = 3σ/a</p></div>\n    <div class=\"fig\" data-plot='{\"pts\": [[1, 2.1], [2, 3.9], [3, 6.2], [4, 7.8]]}'></div>\n    <div class=\"given\">측정데이터 (<b class=\"v\">1, 2.1</b>), (<b class=\"v\">2, 3.9</b>), (<b class=\"v\">3, 6.2</b>), (<b class=\"v\">4, 7.8</b>) &nbsp;·&nbsp; 입력 0일 때 출력 노이즈 표준편차 σ = <b class=\"v\">0.05</b></div>\n    <ol class=\"q\"><li>y = ax + b (행렬이 4×2가 돼요)</li><li>(3, 6.2) 점의 정확도</li><li>측정하한치 MDL</li></ol>\n    <div class=\"hintbox\"><b>힌트</b> · 점이 늘어도 XᵀX는 2×2: [[Σx², Σx],[Σx, N]], Xᵀy = [Σxy, Σy]</div>\n    <details class=\"deep\"><summary>풀이 보기 · 공식 → 순서 → 차근차근 → 답안지 문장</summary><div class=\"dbody\"><div class=\"dsec\"><div class=\"dh\"><span>1</span>이 공식에 숫자만 넣으면 돼요</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">행렬방정식 (시험 답안 형식)</span><span class=\"fe\">p = (XᵀX)⁻¹ Xᵀ y,  p = [a, b]ᵀ</span></div><div class=\"frow\"><span class=\"fl\">XᵀX · Xᵀy (점 N개)</span><span class=\"fe\">XᵀX = [[Σx², Σx], [Σx, N]],  Xᵀy = [[Σxy], [Σy]]</span></div><div class=\"frow\"><span class=\"fl\">2×2 역행렬</span><span class=\"fe\">[[p, q], [r, s]]⁻¹ = (1/(ps − qr)) × [[s, −q], [−r, p]]</span></div><div class=\"frow\"><span class=\"fl\">측정하한치</span><span class=\"fe\">MDL = 3σ ÷ a</span><span class=\"fs\">이 문제: 3 × 0.05 ÷ 1.94 = 0.0773</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>센서의 기초</b> p.11 · 감도 (sensitivity)</li><li><b>센서의 기초</b> p.16–18 · 최소자승법 (least square method) · 방법2 행렬방정식</li><li><b>센서의 기초</b> p.19 · 예제 ((1,4),(2,6),(3,7))</li><li><b>센서의 기초</b> p.20 · 측정하한치 (MDL)</li><li><b>센서의 기초</b> p.26 · 정확도</li></ul></div></div><div class=\"dsec\"><div class=\"dh\"><span>2</span>풀이 순서 (이 순서대로만)</div><ol class=\"flow\"><li>점 4개 표로 합계 (N = 4)</li><li>a, b 계산</li><li>(3, 6.2)의 정확도</li><li>MDL = 3σ ÷ 감도</li></ol></div><div class=\"dsec\"><div class=\"dh\"><span>3</span>차근차근 풀이 (처음 보는 사람용)</div><h4>이 문제의 포인트</h4><p>점이 4개예요. X는 4×2가 되지만 <b>XᵀX는 그대로 2×2</b>라 풀이가 똑같아요. N = 4만 바뀌어요.</p><h4>이 문제가 묻는 것</h4><p>센서에 입력 x를 넣고 출력 y를 잰 점들이 <b>정확히 한 직선 위에 있지 않아요</b>. \"모든 점에 가장 가까운 직선 하나\"를 행렬방정식으로 구하라는 문제예요.</p><h4>먼저 알아야 할 것</h4><p><b>오차 eᵢ</b> = 측정 yᵢ − 직선 값(axᵢ + b). <b>최소자승법</b>은 오차를 제곱해 더한 값이 가장 작아지는 a, b를 찾는 방법이에요. 그 답이 공식 한 줄로 나와요:</p><div class=\"eqn\">p = (XᵀX)⁻¹ Xᵀ y   (p = [a, b]ᵀ)</div><p>Xᵀ는 X의 가로·세로를 바꾼 것(전치), ⁻¹은 역행렬이에요. 둘 다 아래 풀이에서 숫자로 보여 드려요.</p><h4>1단계 · 표</h4><div class=\"tw\"><table class=\"t sm\"><tr><th>x</th><th>y</th><th>x²</th><th>xy</th></tr><tr><td>1</td><td>2.1</td><td>1</td><td>2.1</td></tr><tr><td>2</td><td>3.9</td><td>4</td><td>7.8</td></tr><tr><td>3</td><td>6.2</td><td>9</td><td>18.6</td></tr><tr><td>4</td><td>7.8</td><td>16</td><td>31.2</td></tr><tr><td><b>Σx = 10</b></td><td><b>Σy = 20.0</b></td><td><b>Σx² = 30</b></td><td><b>Σxy = 59.7</b></td></tr></table></div><h4>답안지에 쓰는 행렬방정식 풀이</h4><p>교수님 풀이 형식이에요. 시험에서는 이 다섯 줄을 그대로 쓰면 돼요.</p><div class=\"eqn\">① 식 세우기: Xp = y<br>X = <span class=\"mx\" style=\"grid-template-columns:repeat(2,auto)\"><i>1</i><i>1</i><i>2</i><i>1</i><i>3</i><i>1</i><i>4</i><i>1</i></span>,  p = <span class=\"mx\" style=\"grid-template-columns:repeat(1,auto)\"><i>a</i><i>b</i></span>,  y = <span class=\"mx\" style=\"grid-template-columns:repeat(1,auto)\"><i>2.1</i><i>3.9</i><i>6.2</i><i>7.8</i></span></div><p>점마다 \"a·x + b = y\" 한 줄씩이라 X의 각 행이 [x, 1]이에요. 식은 4개, 미지수는 2개라 딱 맞는 답이 없어서 ②로 가요.</p><div class=\"eqn\">② 양변에 Xᵀ 곱하기: XᵀXp = Xᵀy<br>Xᵀ = <span class=\"mx\" style=\"grid-template-columns:repeat(4,auto)\"><i>1</i><i>2</i><i>3</i><i>4</i><i>1</i><i>1</i><i>1</i><i>1</i></span></div><div class=\"eqn\">③ XᵀX = <span class=\"mx\" style=\"grid-template-columns:repeat(2,auto)\"><i>1² + 2² + 3² + 4²</i><i>1 + 2 + 3 + 4</i><i>1 + 2 + 3 + 4</i><i>4</i></span> = <span class=\"mx\" style=\"grid-template-columns:repeat(2,auto)\"><i>30</i><i>10</i><i>10</i><i>4</i></span><br>Xᵀy = <span class=\"mx\" style=\"grid-template-columns:repeat(1,auto)\"><i>1·2.1 + 2·3.9 + 3·6.2 + 4·7.8</i><i>2.1 + 3.9 + 6.2 + 7.8</i></span> = <span class=\"mx\" style=\"grid-template-columns:repeat(1,auto)\"><i>59.7</i><i>20.0</i></span></div><p>XᵀX는 항상 [[Σx², Σx], [Σx, N]], Xᵀy는 [[Σxy], [Σy]]예요. 1단계 표의 합계가 그대로 들어가요.</p><div class=\"eqn\">④ 역행렬: det = 30×4 − 10×10 = 20<br>(XᵀX)⁻¹ = (1/20) × <span class=\"mx\" style=\"grid-template-columns:repeat(2,auto)\"><i>4</i><i>-10</i><i>-10</i><i>30</i></span></div><p>2×2 역행렬: 대각선 두 수는 자리를 바꾸고, 나머지 두 수는 부호만 바꾼 뒤 det로 나눠요.</p><div class=\"eqn\">⑤ p = (XᵀX)⁻¹Xᵀy = (1/20) × <span class=\"mx\" style=\"grid-template-columns:repeat(2,auto)\"><i>4</i><i>-10</i><i>-10</i><i>30</i></span> × <span class=\"mx\" style=\"grid-template-columns:repeat(1,auto)\"><i>59.7</i><i>20.0</i></span><br>= (1/20) × <span class=\"mx\" style=\"grid-template-columns:repeat(1,auto)\"><i>38.8</i><i>3</i></span> = <span class=\"mx\" style=\"grid-template-columns:repeat(1,auto)\"><i>1.94</i><i>0.15</i></span></div><p>∴ <b>a = 1.94, b = 0.15 → y = 1.94x + 0.15</b></p><div class=\"calc\"><b>계산기</b> · 행렬 곱: 윗줄 = 4×59.7 + (-10)×20.0 = 38.8, 아랫줄 = (-10)×59.7 + 30×20.0 = 3. 왼쪽 행렬의 가로줄과 오른쪽 세로줄을 짝지어 곱해 더해요.</div><h4>정확도 (입력 기준)</h4><p>교정 직선을 \"참\"으로 봐요. 측정 출력을 직선에 넣어 센서가 \"읽은\" 입력을 구하고, 실제 넣은 입력과 비교해요.</p><div class=\"eqn\">6.2 = 1.94x + 0.15 → x읽음 = (6.2 − 0.15) / 1.94 = 3.1186</div><ol class=\"st\"><li>오차율 = |3.1186 − 3| / 3 × 100 = 3.95 %</li><li>정확도 = 100 − 오차율 = 96.05 %</li></ol><h4>MDL이 뭔지</h4><p>입력 0인데 출력이 노이즈로 흔들려요. 그 표준편차가 σ. \"노이즈의 3배를 넘어야 진짜 신호\"라는 기준이 3σ예요. 3σ는 출력 단위라서 감도(출력/입력)로 나눠 입력 단위로 바꿔요.</p><div class=\"eqn\">MDL = 3σ / S = 3 × 0.05 / 1.94 = <b>0.0773</b></div><div class=\"warn\"><b>자주 하는 실수</b> · MDL을 3σ = 0.15로 끝내면 안 돼요. 감도로 나눠야 입력 단위예요.</div></div><div class=\"dsec\"><div class=\"dh\"><span>4</span>답안지에 이렇게 쓰세요 · 시험용 짧은 버전</div><div class=\"xline\"><b>i)</b><q>\"N = 4, det = 20 → y = 1.94x + 0.15\"</q></div><div class=\"xline\"><b>ii)</b><q>\"6.2 → x = 3.12, 정확도 96.05 %\"</q></div><div class=\"xline\"><b>iii) MDL</b><q>\"MDL = 3σ/S = 3 × 0.05 / 1.94 = 0.0773 (입력 단위)\"</q></div><ul class=\"final-list\"><li>y = 1.94x + 0.15</li><li>정확도 96.05 %</li><li>MDL = 0.0773 (입력 단위)</li></ul></div></div></details>\n    <details><summary>정답 확인</summary><div class=\"ans\">\n      <p class=\"final\">y = 1.94x + 0.15 &nbsp; 정확도 96.05 % &nbsp; MDL = 0.0773</p>\n      <ol>\n        <li>Σx = 10, Σx² = 30, Σy = 20, Σxy = 59.7, N = 4 → det = 30·4 − 100 = 20</li>\n        <li>a = (4·59.7 − 10·20)/20 = 38.8/20 = 1.94</li>\n        <li>b = (−10·59.7 + 30·20)/20 = 3/20 = 0.15</li>\n        <li>6.2 = 1.94x + 0.15 → xₘ = 3.119 → 오차율 3.95 % → 정확도 96.05 %</li>\n        <li>MDL = 3σ/S = 3 × 0.05 / 1.94 = 0.0773 (입력 단위)</li>\n      </ol>\n    </div></details>\n    <details class=\"calc-in\"><summary>fx-570ES PLUS 입력 순서</summary><div class=\"kbody\"><div class=\"krow\"><div class=\"kl\">a</div><div class=\"kk\"><kbd>(</kbd><kbd class=\"n\">4</kbd><kbd>×</kbd><kbd class=\"n\">59.7</kbd><kbd>−</kbd><kbd class=\"n\">10</kbd><kbd>×</kbd><kbd class=\"n\">20</kbd><kbd>)</kbd><kbd>÷</kbd><kbd class=\"n\">20</kbd><kbd>=</kbd></div><div class=\"kd\">1.94</div></div><div class=\"krow\"><div class=\"kl\">b</div><div class=\"kk\"><kbd>(</kbd><kbd>(−)</kbd><kbd class=\"n\">10</kbd><kbd>×</kbd><kbd class=\"n\">59.7</kbd><kbd>+</kbd><kbd class=\"n\">30</kbd><kbd>×</kbd><kbd class=\"n\">20</kbd><kbd>)</kbd><kbd>÷</kbd><kbd class=\"n\">20</kbd><kbd>=</kbd></div><div class=\"kd\">0.15</div></div><div class=\"krow\"><div class=\"kl\">xₘ</div><div class=\"kk\"><kbd>(</kbd><kbd class=\"n\">6.2</kbd><kbd>−</kbd><kbd class=\"n\">0.15</kbd><kbd>)</kbd><kbd>÷</kbd><kbd class=\"n\">1.94</kbd><kbd>=</kbd></div><div class=\"kd\">3.118556…</div></div><div class=\"krow\"><div class=\"kl\">오차율 %</div><div class=\"kk\"><kbd>(</kbd><kbd>Ans</kbd><kbd>−</kbd><kbd class=\"n\">3</kbd><kbd>)</kbd><kbd>÷</kbd><kbd class=\"n\">3</kbd><kbd>×</kbd><kbd class=\"n\">100</kbd><kbd>=</kbd></div><div class=\"kd\">3.9519</div></div><div class=\"krow\"><div class=\"kl\">MDL</div><div class=\"kk\"><kbd class=\"n\">3</kbd><kbd>×</kbd><kbd class=\"n\">0.05</kbd><kbd>÷</kbd><kbd class=\"n\">1.94</kbd><kbd>=</kbd></div><div class=\"kd\">0.077319…</div></div><div class=\"krow\"><div class=\"kl\">STAT 검산</div><div class=\"kk\"><kbd>MODE</kbd><kbd class=\"n\">3</kbd><kbd class=\"n\">2</kbd><kbd class=\"n\">1</kbd><kbd>=</kbd><kbd class=\"n\">2</kbd><kbd>=</kbd><kbd class=\"n\">3</kbd><kbd>=</kbd><kbd class=\"n\">4</kbd><kbd>=</kbd><kbd>▶</kbd><kbd>▲</kbd><kbd>▲</kbd><kbd>▲</kbd><kbd>▲</kbd><kbd class=\"n\">2.1</kbd><kbd>=</kbd><kbd class=\"n\">3.9</kbd><kbd>=</kbd><kbd class=\"n\">6.2</kbd><kbd>=</kbd><kbd class=\"n\">7.8</kbd><kbd>=</kbd><kbd>AC</kbd></div><div class=\"kd\">표 입력 (점 4개라 ▲ 4번)</div></div><div class=\"krow\"><div class=\"kl\">B (기울기)</div><div class=\"kk\"><kbd>SHIFT</kbd><kbd class=\"n\">1</kbd><kbd class=\"n\">5</kbd><kbd class=\"n\">2</kbd><kbd>=</kbd></div><div class=\"kd\">B = 1.94</div></div><div class=\"krow\"><div class=\"kl\">A (절편)</div><div class=\"kk\"><kbd>SHIFT</kbd><kbd class=\"n\">1</kbd><kbd class=\"n\">5</kbd><kbd class=\"n\">1</kbd><kbd>=</kbd></div><div class=\"kd\">A = 0.15</div></div><p class=\"knote\">회귀(STAT) 검산: 계산기의 <b>A가 절편, B가 기울기</b>예요. 우리 식 y = ax + b와 글자가 반대라 조심하세요. MODE 3 2를 다시 누르면 이전 데이터가 지워지고 새 표가 열려요.</p></div></details>\n  </div>\n<div class=\"gen\" id=\"g1\">\n    <div class=\"row\"><span><b class=\"k\">새 숫자로 한 번 더</b> · 누를 때마다 다른 데이터 3점</span><button class=\"btn\" data-gen=\"1\">새 문제</button></div>\n    <div class=\"out\"></div>\n  </div>"}, "t2": {"title": "임피던스 매칭", "pts": "HW1-3", "html": "\n  \n  <p class=\"why\">허수부 부호를 보고 반대 소자를 직렬로: −jX(용량성)면 인덕터 L, +jX(유도성)면 커패시터 C.</p>\n<div class=\"card\" id=\"c2-A\">\n    <div class=\"card-top\"><span class=\"id\">2-A</span><span class=\"ttl\">HW1 3번</span><span class=\"tag hw\">HW1 원본</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">Z_L = R − jX</span><span class=\"kw\">maximum power</span></div><p class=\"fline\">→ <b>−j는 L로 지운다</b>: ωL = X, ω = 2πf</p></div>\n    <div class=\"fig\" data-imp='{\"rs\": \"50 Ω\", \"f\": \"1 GHz\", \"zl\": \"50 − j10 Ω\"}'></div>\n    <div class=\"given\">R_S = <b class=\"v\">50 Ω</b>, f₀ = <b class=\"v\">1 GHz</b>, Z_L = <b class=\"v\">50 − j10 Ω</b></div>\n    <ol class=\"q\"><li>|Z_L|을 구하라.</li><li>허수 성분을 없애려면 어떤 소자를 직렬로 연결하고, 그 값은?</li></ol>\n    <details class=\"deep\"><summary>풀이 보기 · 공식 → 순서 → 차근차근 → 답안지 문장</summary><div class=\"dbody\"><div class=\"dsec\"><div class=\"dh\"><span>1</span>이 공식에 숫자만 넣으면 돼요</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">크기</span><span class=\"fe\">|Z| = √(R² + X²)</span><span class=\"fs\">이 문제: √(50² + 10²) = 50.99 Ω</span></div><div class=\"frow\"><span class=\"fl\">−jX를 지우는 코일</span><span class=\"fe\">L = X ÷ (2π × f)</span><span class=\"fs\">이 문제: 10 ÷ (2π × 10⁹) = 1.59 nH</span></div><div class=\"frow\"><span class=\"fl\">(+jX면 커패시터)</span><span class=\"fe\">C = 1 ÷ (2π × f × X)</span><span class=\"fs\">이 문제: 이 문제는 −j라 코일</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>센서의 기초</b> p.31–32 · 임피던스 매칭 · R_S = R_L 유도</li><li><b>센서의 기초</b> p.33 · 예제 (Z_L = 50 + j20 → −j20 커패시터)</li></ul></div></div><div class=\"dsec\"><div class=\"dh\"><span>2</span>풀이 순서 (이 순서대로만)</div><ol class=\"flow\"><li>|Z_L| = 피타고라스</li><li>허수부 부호 확인 (−j → 용량성)</li><li>반대 부호(+j) 소자 = 코일 선택</li><li>ωL = 10으로 L 계산</li></ol></div><div class=\"dsec\"><div class=\"dh\"><span>3</span>차근차근 풀이 (처음 보는 사람용)</div><h4>이 문제가 묻는 것</h4><p>부하 Z_L = 50 − j10 Ω에 −j10이라는 허수 성분이 남아 있어요. 이걸 0으로 만들 소자를 직렬로 하나 붙이라는 문제예요.</p><h4>먼저 알아야 할 것</h4><p>저항은 전류를 방해하는 정도예요. 교류(AC)에서는 코일(L)과 커패시터(C)도 전류를 방해하는데, 그 정도가 주파수에 따라 달라지고 \"타이밍(위상)이 90° 어긋나는\" 방식이라 <b>허수 j</b>를 붙여 따로 적어요. 이걸 합친 게 <b>임피던스 Z = R + jX</b>예요.</p><div class=\"tw\"><table class=\"t sm\"><tr><th>소자</th><th>임피던스</th><th>허수부 부호</th></tr><tr><td>저항 R</td><td>R</td><td>없음 (실수)</td></tr><tr><td>코일 L</td><td>+jωL</td><td>+ (유도성)</td></tr><tr><td>커패시터 C</td><td>−j/(ωC)</td><td>− (용량성)</td></tr></table></div><p>ω(오메가) = 2πf, 주파수 f를 \"초당 각도\"로 바꾼 값이에요. f = 1 GHz면 ω = 2π × 10⁹ = 6.283 × 10⁹ rad/s.</p><p><b>최대 전력 전달 조건</b>: 부하 저항이 전원 내부저항과 같고(R_L = R_S), 허수부가 0이어야 부하로 전력이 가장 많이 가요. 그래서 허수부를 반대 부호 소자로 지우는 거예요.</p><h4>i) 크기 |Z_L|</h4><p>실수부와 허수부를 직각삼각형의 두 변으로 보고 빗변 길이를 구해요 (피타고라스).</p><div class=\"eqn\">|Z_L| = √(50² + 10²) = √(2500 + 100) = √2600 = <b>50.99 Ω</b></div><h4>ii) 어떤 소자를 붙이나</h4><ol class=\"st\"><li>지금 허수부 = −j10 (용량성)</li><li>지우려면 +j10이 필요 → 허수부가 +인 소자 = <b>코일(인덕터)</b></li><li>직렬로 붙이면 임피던스가 그냥 더해져요: (50 − j10) + (+j10) = 50</li></ol><h4>ii) 값 계산</h4><div class=\"eqn\">ωL = 10 → L = 10 / ω = 10 / (2π × 10⁹) = 10 / 6.283×10⁹ = 1.59 × 10⁻⁹ H</div><p>10⁻⁹ = 나노(n)라서 <b>L = 1.59 nH</b></p><div class=\"warn\"><b>자주 하는 실수</b> · −j를 보고 \"마이너스니까 커패시터\"라고 고르면 반대예요. <b>지금 있는 것과 반대 부호</b>를 붙여야 지워져요.</div><div class=\"calc\"><b>계산기</b> · 2 × π × 1 × 10⁹ 를 먼저 계산(6.283E9)한 뒤 10 ÷ 그 값. EXP(또는 ×10ˣ) 키로 지수를 넣어요.</div></div><div class=\"dsec\"><div class=\"dh\"><span>4</span>답안지에 이렇게 쓰세요 · 시험용 짧은 버전</div><div class=\"xline\"><b>i)</b><q>\"|Z_L| = √(50² + 10²) = 50.99 Ω\"</q></div><div class=\"xline\"><b>ii)</b><q>\"허수부 −j10을 없애려면 +j10인 인덕터를 직렬 연결. ωL = 10 → L = 10/(2π×10⁹) = 1.59 nH\"</q></div><ul class=\"final-list\"><li>|Z_L| = 50.99 Ω</li><li>인덕터 직렬, L = 1.59 nH</li></ul></div></div></details>\n    <details><summary>정답 확인</summary><div class=\"ans\">\n      <p class=\"final\">|Z_L| = 50.99 Ω &nbsp; 인덕터 L = 1.59 nH 직렬</p>\n      <ol>\n        <li>|Z_L| = √(50² + 10²) = √2600 = 50.99 Ω</li>\n        <li>−j10을 지우려면 +j10 → 인덕터 (Z = jωL)</li>\n        <li>ωL = 10 → L = 10/(2π × 10⁹) = 1.59 × 10⁻⁹ H</li>\n      </ol>\n      <p class=\"one\">검산: 50 − j10 + j10 = 50 Ω = R_S → maximum power transfer</p>\n    </div></details>\n    <details class=\"calc-in\"><summary>fx-570ES PLUS 입력 순서</summary><div class=\"kbody\"><div class=\"krow\"><div class=\"kl\">|Z_L|</div><div class=\"kk\"><kbd>√■</kbd><kbd class=\"n\">50</kbd><kbd>x²</kbd><kbd>+</kbd><kbd class=\"n\">10</kbd><kbd>x²</kbd><kbd>=</kbd></div><div class=\"kd\">10√26 → S⇔D → 50.990195…</div></div><div class=\"krow\"><div class=\"kl\">L</div><div class=\"kk\"><kbd class=\"n\">10</kbd><kbd>÷</kbd><kbd>(</kbd><kbd class=\"n\">2</kbd><kbd>×</kbd><kbd>π</kbd><kbd>×</kbd><kbd class=\"n\">1</kbd><kbd>×10ˣ</kbd><kbd class=\"n\">9</kbd><kbd>)</kbd><kbd>=</kbd></div><div class=\"kd\">1.5915×10⁻⁹</div></div><div class=\"krow\"><div class=\"kl\">단위 읽기</div><div class=\"kk\"><kbd>ENG</kbd></div><div class=\"kd\">1.5915×10⁻⁹ → 1.59 nH</div></div><p class=\"knote\">π는 SHIFT ×10ˣ예요. ×10ˣ 앞에는 반드시 숫자(1)를 먼저 넣어요.</p></div></details>\n  </div>\n<div class=\"card\" id=\"c2-B\">\n    <div class=\"card-top\"><span class=\"id\">2-B</span><span class=\"ttl\">부호가 반대인 경우</span><span class=\"tag sim\">유사</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">+jX</span></div><p class=\"fline\">→ <b>+j는 C로 지운다</b>: 1/(ωC) = X → C = 1/(ωX)</p></div>\n    <div class=\"fig\" data-imp='{\"rs\": \"R_S\", \"f\": \"2 GHz\", \"zl\": \"30 + j15 Ω\"}'></div>\n    <div class=\"given\">f₀ = <b class=\"v\">2 GHz</b>, Z_L = <b class=\"v\">30 + j15 Ω</b></div>\n    <ol class=\"q\"><li>|Z_L|</li><li>직렬로 연결할 소자와 값</li></ol>\n    <details class=\"deep\"><summary>풀이 보기 · 공식 → 순서 → 차근차근 → 답안지 문장</summary><div class=\"dbody\"><div class=\"dsec\"><div class=\"dh\"><span>1</span>이 공식에 숫자만 넣으면 돼요</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">크기</span><span class=\"fe\">|Z| = √(R² + X²)</span><span class=\"fs\">이 문제: √(30² + 15²) = 33.54 Ω</span></div><div class=\"frow\"><span class=\"fl\">+jX를 지우는 커패시터</span><span class=\"fe\">C = 1 ÷ (2π × f × X)</span><span class=\"fs\">이 문제: 1 ÷ (2π × 2×10⁹ × 15) = 5.31 pF</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>센서의 기초</b> p.31–32 · 임피던스 매칭 · R_S = R_L 유도</li><li><b>센서의 기초</b> p.33 · 예제 (Z_L = 50 + j20 → −j20 커패시터)</li></ul></div></div><div class=\"dsec\"><div class=\"dh\"><span>2</span>풀이 순서 (이 순서대로만)</div><ol class=\"flow\"><li>|Z_L| 계산</li><li>+j → 커패시터 선택</li><li>1/(ωC) = 15로 C 계산</li></ol></div><div class=\"dsec\"><div class=\"dh\"><span>3</span>차근차근 풀이 (처음 보는 사람용)</div><h4>이 문제의 포인트</h4><p>이번엔 허수부가 <b>+j15 (유도성)</b>예요. 지우려면 −j15가 필요하니 <b>커패시터</b>를 붙여요.</p><h4>계산</h4><div class=\"eqn\">커패시터 임피던스 = −j/(ωC) → 1/(ωC) = 15</div><ol class=\"st\"><li>ω = 2π × 2×10⁹ = 1.2566 × 10¹⁰</li><li>C = 1 / (ω × 15) = 1 / (1.2566×10¹⁰ × 15) = 1 / 1.885×10¹¹</li><li>= 5.31 × 10⁻¹² F = <b>5.31 pF</b> (10⁻¹² = 피코 p)</li></ol><h4>크기</h4><div class=\"eqn\">|Z_L| = √(30² + 15²) = √1125 = 33.54 Ω</div><div class=\"warn\"><b>자주 하는 실수</b> · C = 15/ω로 쓰는 실수가 많아요. 커패시터는 1/(ωC)이니 C는 분모에 있어요 → C = 1/(15ω).</div></div><div class=\"dsec\"><div class=\"dh\"><span>4</span>답안지에 이렇게 쓰세요 · 시험용 짧은 버전</div><div class=\"xline\"><b>i)</b><q>\"|Z_L| = √(30² + 15²) = 33.54 Ω\"</q></div><div class=\"xline\"><b>ii)</b><q>\"+j15를 없애려면 −j15인 커패시터를 직렬 연결. 1/(ωC) = 15 → C = 5.31 pF\"</q></div><ul class=\"final-list\"><li>|Z_L| = 33.54 Ω</li><li>커패시터 직렬, C = 5.31 pF</li></ul></div></div></details>\n    <details><summary>정답 확인</summary><div class=\"ans\">\n      <p class=\"final\">|Z_L| = 33.54 Ω &nbsp; 커패시터 C = 5.31 pF 직렬</p>\n      <ol>\n        <li>|Z_L| = √(30² + 15²) = 33.54 Ω</li>\n        <li>+j15 → −j15 필요 → 커패시터 (Z = −j/ωC)</li>\n        <li>1/(ωC) = 15 → C = 1/(2π × 2×10⁹ × 15) = 5.31 × 10⁻¹² F</li>\n      </ol>\n    </div></details>\n    <details class=\"calc-in\"><summary>fx-570ES PLUS 입력 순서</summary><div class=\"kbody\"><div class=\"krow\"><div class=\"kl\">|Z_L|</div><div class=\"kk\"><kbd>√■</kbd><kbd class=\"n\">30</kbd><kbd>x²</kbd><kbd>+</kbd><kbd class=\"n\">15</kbd><kbd>x²</kbd><kbd>=</kbd></div><div class=\"kd\">15√5 → S⇔D → 33.541019…</div></div><div class=\"krow\"><div class=\"kl\">C</div><div class=\"kk\"><kbd class=\"n\">1</kbd><kbd>÷</kbd><kbd>(</kbd><kbd class=\"n\">2</kbd><kbd>×</kbd><kbd>π</kbd><kbd>×</kbd><kbd class=\"n\">2</kbd><kbd>×10ˣ</kbd><kbd class=\"n\">9</kbd><kbd>×</kbd><kbd class=\"n\">15</kbd><kbd>)</kbd><kbd>=</kbd></div><div class=\"kd\">5.3052×10⁻¹² (5.31 pF)</div></div></div></details>\n  </div>\n<div class=\"card\" id=\"c2-C\">\n    <div class=\"card-top\"><span class=\"id\">2-C</span><span class=\"ttl\">허수부만 없애면 끝일까?</span><span class=\"tag sim\">함정 · 판단</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">R_L ≠ R_S</span></div><p class=\"fline\">→ 최대 전력 = <b>허수부 0 + R_L = R_S</b> 두 조건</p></div>\n    <div class=\"fig\" data-imp='{\"rs\": \"50 Ω\", \"f\": \"500 MHz\", \"zl\": \"75 − j25 Ω\"}'></div>\n    <div class=\"given\">R_S = <b class=\"v\">50 Ω</b>, f₀ = <b class=\"v\">500 MHz</b>, Z_L = <b class=\"v\">75 − j25 Ω</b></div>\n    <ol class=\"q\"><li>허수부를 없앨 직렬 소자와 값</li><li>허수부를 없앤 뒤에도 maximum power transfer가 되는가? 이유는?</li></ol>\n    <details class=\"deep\"><summary>풀이 보기 · 공식 → 순서 → 차근차근 → 답안지 문장</summary><div class=\"dbody\"><div class=\"dsec\"><div class=\"dh\"><span>1</span>이 공식에 숫자만 넣으면 돼요</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">−jX를 지우는 코일</span><span class=\"fe\">L = X ÷ (2π × f)</span><span class=\"fs\">이 문제: 25 ÷ (2π × 5×10⁸) = 7.96 nH</span></div><div class=\"frow\"><span class=\"fl\">최대 전력 조건</span><span class=\"fe\">허수부 = 0 그리고 R_L = R_S</span><span class=\"fs\">이 문제: 75 Ω ≠ 50 Ω → 아직 아님</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>센서의 기초</b> p.31–32 · 임피던스 매칭 · R_S = R_L 유도</li><li><b>센서의 기초</b> p.33 · 예제 (Z_L = 50 + j20 → −j20 커패시터)</li></ul></div></div><div class=\"dsec\"><div class=\"dh\"><span>2</span>풀이 순서 (이 순서대로만)</div><ol class=\"flow\"><li>−j25 → 코일, L 계산</li><li>허수부 제거 후 실수부 75 Ω과 R_S 50 Ω 비교</li></ol></div><div class=\"dsec\"><div class=\"dh\"><span>3</span>차근차근 풀이 (처음 보는 사람용)</div><h4>이 문제의 포인트</h4><p>허수부를 지운 뒤에도 끝이 아니에요. 최대 전력 조건은 <b>두 가지</b>예요: 허수부 = 0, 그리고 R_L = R_S.</p><h4>i) 소자</h4><p>−j25 → +j25 필요 → 코일</p><div class=\"eqn\">L = 25 / (2π × 5×10⁸) = 25 / 3.1416×10⁹ = 7.96 × 10⁻⁹ H = 7.96 nH</div><h4>ii) 판단</h4><p>허수부를 지우면 Z_L = 75 Ω만 남아요. 전원 쪽 R_S는 50 Ω이라 <b>같지 않아요</b>. 그래서 아직 최대 전력 전달이 아니에요. 실수부까지 맞추려면 별도의 매칭 회로(변압기, L 매칭 등)가 더 필요해요 [AI 보충].</p><p>강의 식으로 확인: P_L = V²/(R_S²/R_L + 2R_S + R_L)에서 분모가 가장 작아지는 건 R_L = R_S일 때예요.</p></div><div class=\"dsec\"><div class=\"dh\"><span>4</span>답안지에 이렇게 쓰세요 · 시험용 짧은 버전</div><div class=\"xline\"><b>i)</b><q>\"인덕터 L = 25/(2π×5×10⁸) = 7.96 nH 직렬\"</q></div><div class=\"xline\"><b>ii)</b><q>\"아니다. 최대 전력 전달은 허수부 = 0 과 R_L = R_S 를 모두 만족해야 하는데 R_L = 75 Ω ≠ R_S = 50 Ω\"</q></div><ul class=\"final-list\"><li>인덕터 L = 7.96 nH</li><li>최대 전력 전달 아님 (R_L 75 Ω ≠ R_S 50 Ω)</li></ul></div></div></details>\n    <details><summary>정답 확인</summary><div class=\"ans\">\n      <p class=\"final\">인덕터 L = 7.96 nH &nbsp; 아니요, R_L = 75 Ω ≠ R_S = 50 Ω</p>\n      <ol>\n        <li>ωL = 25 → L = 25/(2π × 5×10⁸) = 7.96 × 10⁻⁹ H</li>\n        <li>최대 전력 조건은 R_L = R_S. 실수부 75 Ω이 50 Ω과 달라 아직 매칭되지 않음</li>\n      </ol>\n      <p class=\"one\">강의 식 P_L = V²/(R_S²/R_L + 2R_S + R_L)은 R_L = R_S일 때 최대예요. 허수부 제거는 필요조건일 뿐이에요.</p>\n    </div></details>\n    <details class=\"calc-in\"><summary>fx-570ES PLUS 입력 순서</summary><div class=\"kbody\"><div class=\"krow\"><div class=\"kl\">L</div><div class=\"kk\"><kbd class=\"n\">25</kbd><kbd>÷</kbd><kbd>(</kbd><kbd class=\"n\">2</kbd><kbd>×</kbd><kbd>π</kbd><kbd>×</kbd><kbd class=\"n\">5</kbd><kbd>×10ˣ</kbd><kbd class=\"n\">8</kbd><kbd>)</kbd><kbd>=</kbd></div><div class=\"kd\">7.9577×10⁻⁹ (7.96 nH)</div></div></div></details>\n  </div>\n<div class=\"gen\" id=\"g2\">\n    <div class=\"row\"><span><b class=\"k\">새 숫자로 한 번 더</b> · 주파수·부하 임피던스가 바뀌어요</span><button class=\"btn\" data-gen=\"2\">새 문제</button></div>\n    <div class=\"out\"></div>\n  </div>"}, "t3": {"title": "센서 기초 개념 서술형", "pts": "전체", "html": "\n  \n  <p class=\"why\">감도·분해능·MDL·선형성·R²·반복성·드리프트·응답시간. 숙제·기출엔 없지만 범위 안이라 서술형으로 나올 수 있어요. 【 】 안 표현을 그대로 쓰세요.</p>\n<div class=\"card\" id=\"c3-A\">\n    <div class=\"card-top\"><span class=\"id\">3-A</span><span class=\"ttl\">감도 · 분해능 · 측정하한치(MDL)</span><span class=\"tag ess\">서술형 · 강의 범위</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">감도</span><span class=\"kw\">분해능</span><span class=\"kw\">MDL</span><span class=\"kw\">3σ</span></div><p class=\"fline\">→ 감도 = 교정 직선 기울기 · 분해능 = Noise ÷ 감도 · MDL = 3σ ÷ 감도 (둘 다 입력 단위)</p></div>\n    <ol class=\"q\"><li>감도(sensitivity)를 정의하라.</li><li>분해능(resolution)을 정의하고 단위를 말하라.</li><li>측정하한치(MDL)를 정의하고 평가 과정을 설명하라.</li><li>비선형 센서는 왜 감도를 한 값으로 쓸 수 없는가? 대안 세 가지는?</li></ol>\n    <details class=\"deep\"><summary>풀이 보기 · 외울 것 → 답안 문장 → 쉬운 설명</summary><div class=\"dbody\">\n      <div class=\"dsec\"><div class=\"dh\"><span>1</span>외울 것 (키워드·식)</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">감도 S</span><span class=\"fe\">S = Δy/Δx = 교정 직선의 기울기</span></div><div class=\"frow\"><span class=\"fl\">분해능</span><span class=\"fe\">Noise ÷ Sensitivity → 입력 단위</span></div><div class=\"frow\"><span class=\"fl\">MDL</span><span class=\"fe\">3σ ÷ S → 입력 단위</span></div><div class=\"frow\"><span class=\"fl\">비선형 센서</span><span class=\"fe\">순간 감도(접선 기울기) · 평균 감도(구간) · 선형화 감도(전체 직선 근사)</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>센서의 기초</b> p.11–12 · 감도 · 순간/평균/선형화 감도</li><li><b>센서의 기초</b> p.14 · 분해능 = Noise/Sensitivity</li><li><b>센서의 기초</b> p.20 · MDL = 3σ/S, 평가과정</li></ul></div></div>\n      <div class=\"dsec\"><div class=\"dh\"><span>2</span>답안지에 이렇게 쓰세요</div><p class=\"note\" style=\"margin:0 0 8px\">【 】 = 강의자료 원문 표현 (그대로 쓰면 안전) · 〔 〕 = 작년 교수님 답안 표현</p><div class=\"xline\"><b>Q1. 감도(sensitivity)를 정의하라.</b><q>【입력신호의 미소 변화에 대한 출력신호의 미소 변화의 비율】이며, 【Calibration plot에서 기울기 S】가 감도이다. S = Δy/Δx.</q></div><p class=\"easy\">쉬운 말로 → 입력을 조금 바꿨을 때 출력이 얼마나 많이 바뀌나예요. 그래프가 가파를수록 민감한 센서예요.</p><div class=\"xline\"><b>Q2. 분해능(resolution)을 정의하고 단위를 말하라.</b><q>【센서가 검출할 수 있는 최소 입력 변화량】이며 【분해능 = Noise/Sensitivity】로 구한다. 노이즈는 출력 단위, 감도는 출력/입력 단위이므로 【분해능의 단위는 입력량의 단위】이다.</q></div><p class=\"easy\">쉬운 말로 → 출력이 노이즈만큼 흔들리면 그보다 작은 변화는 구별 못 해요. 그 노이즈를 입력 크기로 바꾼 게 분해능이에요.</p><div class=\"xline\"><b>Q3. 측정하한치(MDL)를 정의하고 평가 과정을 설명하라.</b><q>【센서가 배경잡음과 구별하여 검출할 수 있는 최소 입력값】. 【입력이 없는 상태에서 측정한 출력 노이즈의 표준편차 σ】와 감도로 【MDL = 3σ/S】. 평가: 【배경 노이즈 측정 → 반복 분석 → 노이즈 크기의 약 3배에 해당하는 출력값을 detection limit으로 정의】.</q></div><p class=\"easy\">쉬운 말로 → \"노이즈의 3배는 넘어야 진짜 신호\"라는 약속이에요. 3σ가 출력 단위라 감도로 나눠 입력 단위로 바꿔요.</p><div class=\"xline\"><b>Q4. 비선형 센서는 왜 감도를 한 값으로 쓸 수 없는가? 대안 세 가지는?</b><q>【비선형 센서에서는 감도가 일정하지 않기 때문에 한 개의 값으로 표현할 수 없다】. 【순간 감도(특정 지점 접선 기울기)】, 【평균 감도(특정 구간 평균 기울기)】, 【선형화 감도(전체 범위를 직선으로 근사한 기울기)】로 표현한다.</q></div><p class=\"easy\">쉬운 말로 → 곡선은 위치마다 기울기가 달라요. 한 점에서 재거나, 구간으로 재거나, 통째로 직선 하나로 보거나 셋 중 하나를 골라요.</p></div>\n    </div></details>\n    <details><summary>정답 확인 · 핵심만</summary><div class=\"ans\"><ul class=\"final-list\"><li><b>감도 S</b> · S = Δy/Δx = 교정 직선의 기울기</li><li><b>분해능</b> · Noise ÷ Sensitivity → 입력 단위</li><li><b>MDL</b> · 3σ ÷ S → 입력 단위</li><li><b>비선형 센서</b> · 순간 감도(접선 기울기) · 평균 감도(구간) · 선형화 감도(전체 직선 근사)</li></ul></div></details>\n  </div>\n<div class=\"card\" id=\"c3-B\">\n    <div class=\"card-top\"><span class=\"id\">3-B</span><span class=\"ttl\">선형성 · R² · 반복성 · 재현성 · 정확도</span><span class=\"tag ess\">서술형 · 강의 범위</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">선형성 %FS</span><span class=\"kw\">R²</span><span class=\"kw\">repeatability</span><span class=\"kw\">정확도</span></div><p class=\"fline\">→ 선형성 = 최대편차/정격 × 100 [%FS] · R² = 1 − SS_res/SS_tot [단위 없음] · 정확도 = 100 − 오차율</p></div>\n    <ol class=\"q\"><li>선형성(linearity)을 정의하고 단위를 쓰라.</li><li>선형성과 결정계수 R²의 차이는?</li><li>반복성(repeatability)과 재현성(reproducibility)의 차이는?</li><li>정확도(accuracy)를 정의하고 참값은 어떻게 얻는가?</li></ol>\n    <details class=\"deep\"><summary>풀이 보기 · 외울 것 → 답안 문장 → 쉬운 설명</summary><div class=\"dbody\">\n      <div class=\"dsec\"><div class=\"dh\"><span>1</span>외울 것 (키워드·식)</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">선형성</span><span class=\"fe\">최대출력편차 ÷ 정격출력 × 100 [%FS]</span></div><div class=\"frow\"><span class=\"fl\">R²</span><span class=\"fe\">1 − SS_res/SS_tot, 1에 가까울수록 직선에 잘 맞음</span></div><div class=\"frow\"><span class=\"fl\">오차율</span><span class=\"fe\">|xₘ − xₜ| ÷ xₜ × 100</span></div><div class=\"frow\"><span class=\"fl\">반복성/재현성</span><span class=\"fe\">단기·동일조건 / 장기·다른 사람·다른 실험실</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>센서의 기초</b> p.21 · 선형성 %FS</li><li><b>센서의 기초</b> p.22–24 · R² · Linearity vs R²</li><li><b>센서의 기초</b> p.25 · Repeatability, Reproducibility</li><li><b>센서의 기초</b> p.26 · 정확도 = 100 − 오차율</li></ul></div></div>\n      <div class=\"dsec\"><div class=\"dh\"><span>2</span>답안지에 이렇게 쓰세요</div><p class=\"note\" style=\"margin:0 0 8px\">【 】 = 강의자료 원문 표현 (그대로 쓰면 안전) · 〔 〕 = 작년 교수님 답안 표현</p><div class=\"xline\"><b>Q1. 선형성(linearity)을 정의하고 단위를 쓰라.</b><q>【센서의 특성 곡선이 이상적인 직선관계(기준직선)로부터 벗어남의 정도】. 【선형성 = 최대출력편차/정격출력 × 100 %】, 단위는 【%FS (full scale)】.</q></div><p class=\"easy\">쉬운 말로 → 이상적인 직선에서 가장 많이 벗어난 곳이 전체 범위의 몇 %인지예요.</p><div class=\"xline\"><b>Q2. 선형성과 결정계수 R²의 차이는?</b><q>【Linearity → 이상적인 기준직선을 기준으로 실제 측정값들이 그 관계를 얼마나 잘 따르는지 평가 [%FS]】. 【R² → 실제 데이터로 얻어진 회귀직선이 실제 Y의 변동을 얼마나 잘 설명하는지 평가 [no unit], 값이 1에 가까울수록 일치도가 높음】.</q></div><p class=\"easy\">쉬운 말로 → 선형성은 \"이상 직선\" 기준, R²은 \"데이터로 구한 직선\" 기준이에요. 하나는 %, 하나는 단위 없는 0~1 숫자예요.</p><div class=\"xline\"><b>Q3. 반복성(repeatability)과 재현성(reproducibility)의 차이는?</b><q>【Repeatability: 동일조건하에서 동일방법으로 단기간에 연속 측정할 때 측정값들이 서로 얼마나 일치하는가】. 【Reproducibility: 장기간에 걸쳐 측정하거나 다른 사람·다른 실험실에서 측정될 때 측정값 사이에 일치하는 정도】.</q></div><p class=\"easy\">쉬운 말로 → 반복성은 \"내가 지금 연속으로 재도 같나\", 재현성은 \"남이 다른 날 다른 곳에서 재도 같나\"예요.</p><div class=\"xline\"><b>Q4. 정확도(accuracy)를 정의하고 참값은 어떻게 얻는가?</b><q>【센서 측정값이 참값에 얼마나 가까운가를 나타내는 척도】, 【정확도[%] = 100 − 오차율】, 오차율 = |xₘ − xₜ|/xₜ × 100. 참값은 【상업용 최고의 센서 측정값】이나 【신뢰할 수 있는 reference value(GC 등)】, 또는 교정 직선과 비교해 얻는다.</q></div><p class=\"easy\">쉬운 말로 → 기출 1-iii에서는 교정 직선을 참값으로 보고 입력 기준(7.36 vs 7)으로 비교했어요.</p></div>\n    </div></details>\n    <details><summary>정답 확인 · 핵심만</summary><div class=\"ans\"><ul class=\"final-list\"><li><b>선형성</b> · 최대출력편차 ÷ 정격출력 × 100 [%FS]</li><li><b>R²</b> · 1 − SS_res/SS_tot, 1에 가까울수록 직선에 잘 맞음</li><li><b>오차율</b> · |xₘ − xₜ| ÷ xₜ × 100</li><li><b>반복성/재현성</b> · 단기·동일조건 / 장기·다른 사람·다른 실험실</li></ul></div></details>\n  </div>\n<div class=\"card\" id=\"c3-C\">\n    <div class=\"card-top\"><span class=\"id\">3-C</span><span class=\"ttl\">감도 드리프트 · 응답시간 · 주파수 특성</span><span class=\"tag ess\">서술형 · 강의 범위</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">sensitivity drift</span><span class=\"kw\">90 %</span><span class=\"kw\">상대 변화율</span></div><p class=\"fline\">→ 드리프트 = 기울기가 시간·환경에 따라 변함 → 재교정 · 응답시간 = 포화값 90 % 도달 시간 · 출력은 초기값 대비 %로 비교</p></div>\n    <ol class=\"q\"><li>Sensitivity drift란 무엇이며 원인과 제거 방법은?</li><li>응답시간(response time)의 정의는?</li><li>센서 출력을 비교할 때 절대 변화량이 아니라 %를 쓰는 이유는?</li></ol>\n    <details class=\"deep\"><summary>풀이 보기 · 외울 것 → 답안 문장 → 쉬운 설명</summary><div class=\"dbody\">\n      <div class=\"dsec\"><div class=\"dh\"><span>1</span>외울 것 (키워드·식)</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">드리프트 원인</span><span class=\"fe\">감지물질 열화(상변화·poison gas·산화·부식·노화) / 회로 열화(증폭기·ADC·기준전압) / 열팽창·패키지 응력</span></div><div class=\"frow\"><span class=\"fl\">제거</span><span class=\"fe\">정기적 re-calibration</span></div><div class=\"frow\"><span class=\"fl\">응답시간</span><span class=\"fe\">포화값의 90 % 도달 시간</span></div><div class=\"frow\"><span class=\"fl\">비교 기준</span><span class=\"fe\">절대 변화량 ✗ → 초기값 대비 상대 변화량(%) ○</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>센서의 기초</b> p.13 · Sensitivity drift 원인·제거</li><li><b>센서의 기초</b> p.29 · 응답시간 90 %</li><li><b>센서의 기초</b> p.30 · 주파수 특성 · 왜 %를 쓰는가</li></ul></div></div>\n      <div class=\"dsec\"><div class=\"dh\"><span>2</span>답안지에 이렇게 쓰세요</div><p class=\"note\" style=\"margin:0 0 8px\">【 】 = 강의자료 원문 표현 (그대로 쓰면 안전) · 〔 〕 = 작년 교수님 답안 표현</p><div class=\"xline\"><b>Q1. Sensitivity drift란 무엇이며 원인과 제거 방법은?</b><q>【센서의 입력–출력 변환 특성에서 감도(Slope)가 시간 또는 환경 조건에 따라 변화하는 현상】으로 【Calibration curve의 기울기가 변화】한다. 원인: 【감지 물질 내 상변화, poison gas의 흡착, 산화, 부식, 노화】, 【증폭기·ADC·기준전압 등 전자회로의 장기적 열화】, 【열팽창이나 패키지 응력】. 제거: 【정기적인 re-calibration을 통해 현재 감도 특성을 재평가하고 calibration plot을 갱신】.</q></div><p class=\"easy\">쉬운 말로 → 센서가 늙으면 같은 입력에도 출력이 예전과 달라져요. 그래서 가끔 다시 교정해요.</p><div class=\"xline\"><b>Q2. 응답시간(response time)의 정의는?</b><q>【Saturation 값의 90 %에 도달하는 시간】. 회복시간은 자극 제거 후 원래 수준으로 돌아오는 시간.</q></div><p class=\"easy\">쉬운 말로 → 가스를 넣고 출력이 거의 다(90 %) 올라올 때까지 걸리는 시간이에요.</p><div class=\"xline\"><b>Q3. 센서 출력을 비교할 때 절대 변화량이 아니라 %를 쓰는 이유는?</b><q>【센서의 출력값은 절대적인 변화량만 비교하면 안 되고, 초기값에 대한 상대적인 변화량(%)으로 비교해야 한다】. 【서로 다른 센서나 서로 다른 측정 조건에서도 센서의 성능을 공정하게 비교하기 위해서】이다. A/cm², C/cm²를 쓰는 것도 같은 이유.</q></div><p class=\"easy\">쉬운 말로 → 초기 저항이 100 Ω인 센서와 1000 Ω인 센서는 같은 가스에도 ΔR 크기가 달라요. 비율로 봐야 공평해요.</p></div>\n    </div></details>\n    <details><summary>정답 확인 · 핵심만</summary><div class=\"ans\"><ul class=\"final-list\"><li><b>드리프트 원인</b> · 감지물질 열화(상변화·poison gas·산화·부식·노화) / 회로 열화(증폭기·ADC·기준전압) / 열팽창·패키지 응력</li><li><b>제거</b> · 정기적 re-calibration</li><li><b>응답시간</b> · 포화값의 90 % 도달 시간</li><li><b>비교 기준</b> · 절대 변화량 ✗ → 초기값 대비 상대 변화량(%) ○</li></ul></div></details>\n  </div>\n<div class=\"card\" id=\"c3-D\">\n    <div class=\"card-top\"><span class=\"id\">3-D</span><span class=\"ttl\">센서 정의 · 임피던스 매칭 이유</span><span class=\"tag ess\">서술형 · 강의 범위</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">transducer</span><span class=\"kw\">maximum power</span><span class=\"kw\">R_L = R_S</span></div><p class=\"fline\">→ 센서 = 외부 자극 → 전기 신호 변환 소자(transducer) · 부하에 최대 전력 = R_L = R_S + 허수부 0</p></div>\n    <ol class=\"q\"><li>센서를 정의하라.</li><li>임피던스 매칭이 왜 필요하며 조건은?</li></ol>\n    <details class=\"deep\"><summary>풀이 보기 · 외울 것 → 답안 문장 → 쉬운 설명</summary><div class=\"dbody\">\n      <div class=\"dsec\"><div class=\"dh\"><span>1</span>외울 것 (키워드·식)</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">센서</span><span class=\"fe\">외부 자극(stimulus) → 전기 신호</span></div><div class=\"frow\"><span class=\"fl\">자극</span><span class=\"fe\">검출하려는 양·특성·상태</span></div><div class=\"frow\"><span class=\"fl\">최대 전력 전달</span><span class=\"fe\">P_L = V²/(R_S²/R_L + 2R_S + R_L) 최대 ⇔ R_L = R_S</span></div><div class=\"frow\"><span class=\"fl\">허수부</span><span class=\"fe\">반대 부호 소자를 직렬로 상쇄</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>센서의 기초</b> p.8 · 센서의 정의 · 센서는 transducer</li><li><b>센서의 기초</b> p.9 · 센서시스템 구조</li><li><b>센서의 기초</b> p.31–32 · 임피던스 매칭 · R_L = R_S 유도</li></ul></div></div>\n      <div class=\"dsec\"><div class=\"dh\"><span>2</span>답안지에 이렇게 쓰세요</div><p class=\"note\" style=\"margin:0 0 8px\">【 】 = 강의자료 원문 표현 (그대로 쓰면 안전) · 〔 〕 = 작년 교수님 답안 표현</p><div class=\"xline\"><b>Q1. 센서를 정의하라.</b><q>【외부 자극(stimulus)을 받아 이를 전기 신호로 변환하는 소자(센서는 transducer이다)】. 【외부 자극: 검출 또는 측정하고자 하는 양(Quantity), 특성(Property), 상태(Condition)】.</q></div><p class=\"easy\">쉬운 말로 → 온도·가스·자기장처럼 사람이 정확히 못 느끼는 것을 전기 신호로 바꿔 주는 부품이에요.</p><div class=\"xline\"><b>Q2. 임피던스 매칭이 왜 필요하며 조건은?</b><q>【전력공급을 최대로 하려면 임피던스 매칭이 요구된다】. P_L = V²/(R_S²/R_L + 2R_S + R_L)에서 분모가 최소일 때 P_L이 최대이고, R_L로 미분해 0이 되는 조건이 【R_S = R_L】이다. 부하에 허수부가 있으면 반대 부호의 리액턴스를 직렬 연결해 0으로 만든다.</q></div><p class=\"easy\">쉬운 말로 → 전원 쪽 저항과 부하 저항이 같을 때 부하가 전력을 가장 많이 받아요. 허수부는 먼저 지워야 해요.</p></div>\n    </div></details>\n    <details><summary>정답 확인 · 핵심만</summary><div class=\"ans\"><ul class=\"final-list\"><li><b>센서</b> · 외부 자극(stimulus) → 전기 신호</li><li><b>자극</b> · 검출하려는 양·특성·상태</li><li><b>최대 전력 전달</b> · P_L = V²/(R_S²/R_L + 2R_S + R_L) 최대 ⇔ R_L = R_S</li><li><b>허수부</b> · 반대 부호 소자를 직렬로 상쇄</li></ul></div></details>\n  </div>"}, "t4": {"title": "ppm → 질량 → 원자 수 → 표면 원자 수", "pts": "기출 2번 25점 · HW2-2", "html": "\n  \n  <p class=\"why\">작년 배점이 가장 컸던 유형이에요. 부피비 → 몰 → 질량 → 개수 → (개/cm³)^(2/3) × 면적.</p>\n<div class=\"card\" id=\"c4-A\">\n    <div class=\"card-top\"><span class=\"id\">4-A</span><span class=\"ttl\">작년 중간고사 2번</span><span class=\"tag ex\">기출 원본</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">ppm</span><span class=\"kw\">1 L</span><span class=\"kw\">He</span><span class=\"kw\">표면 개수</span></div><p class=\"fline\">→ ppm × V ÷ 22.4 → 몰 → ×M g → ×N_A 개 → ÷cm³ → ^(2/3) → ×cm²</p></div>\n    <div class=\"fig\" data-box='{\"gas\":\"He 5 ppm\",\"vol\":\"1 L\",\"s\":\"1 mm × 1 mm\"}'></div>\n    <div class=\"given\">1 L 용기, He <b class=\"v\">5 ppm</b>. M = <b class=\"v\">4 g/mol</b>, V_m = <b class=\"v\">22.4 L/mol</b>, N_A = <b class=\"v\">6×10²³ /mol</b>, 1 L = 10³ cm³</div>\n    <ol class=\"q\">\n      <li>(5점) He은 몇 %인가</li>\n      <li>(5점) 총 몇 g의 He이 들어 있는가</li>\n      <li>(5점) He 원자는 몇 개인가</li>\n      <li>(10점) 바닥의 <b class=\"v\">1 mm × 1 mm</b> 센서 표면에 붙는 He 원자 수 (힌트: (개/cm³)^(2/3) = 개/cm²)</li>\n    </ol>\n    <details class=\"deep\"><summary>풀이 보기 · 공식 → 순서 → 차근차근 → 답안지 문장</summary><div class=\"dbody\"><div class=\"dsec\"><div class=\"dh\"><span>1</span>이 공식에 숫자만 넣으면 돼요</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">질량 [g]</span><span class=\"fe\">ppm × 10⁻⁶ × V[L] ÷ 22.4 × M</span><span class=\"fs\">이 문제: 5×10⁻⁶ × 1 ÷ 22.4 × 4 = 8.93×10⁻⁷ g</span></div><div class=\"frow\"><span class=\"fl\">개수</span><span class=\"fe\">ppm × 10⁻⁶ × V[L] ÷ 22.4 × 6×10²³</span><span class=\"fs\">이 문제: 1.34×10¹⁷ 개</span></div><div class=\"frow\"><span class=\"fl\">표면 개수</span><span class=\"fe\">(개수 ÷ V[cm³])^(2/3) × 면적[cm²]</span><span class=\"fs\">이 문제: (1.34×10¹⁷ ÷ 1000)^(2/3) × 0.01 = 2.62×10⁷</span></div><div class=\"frow\"><span class=\"fl\">%</span><span class=\"fe\">ppm × 10⁻⁴</span><span class=\"fs\">이 문제: 5 × 10⁻⁴ = 0.0005 %</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>가스센서01</b> p.4 · 가스농도 단위 (ppm, ppb, %)</li><li><b>가스센서01</b> p.5 · ppm 의미 · H₂ 1 ppm = 0.0889 μg/L · 4 % = 40,000 ppm</li><li><b>가스센서01</b> p.15 · 감도 · Pd atoms/cm³ (원자 밀도 개념)</li><li><b>작년 기출</b> 2번 · 교수님 풀이: 0.89 μg → 1.335×10¹⁷ → 2.61×10⁷</li></ul></div></div><div class=\"dsec\"><div class=\"dh\"><span>2</span>풀이 순서 (이 순서대로만)</div><ol class=\"flow\"><li>ppm → % 변환</li><li>ppm × 용기 부피 = 기체 부피</li><li>÷ 22.4 → 몰 → × M → 질량</li><li>몰 × N_A → 개수</li><li>개수 ÷ 용기 cm³ → 개/cm³ → ^(2/3) → 개/cm²</li><li>× 센서 면적(cm²)</li></ol></div><div class=\"dsec\"><div class=\"dh\"><span>3</span>차근차근 풀이 (처음 보는 사람용)</div><h4>이 문제가 묻는 것</h4><p>1 L 용기 안 He 5 ppm이 몇 %인지, 몇 g인지, 원자가 몇 개인지, 바닥 1 mm² 센서 위에 몇 개가 올라가는지 차례로 구해요. 앞 답을 다음 문제에 쓰는 연쇄 문제라 순서가 중요해요.</p><h4>먼저 알아야 할 것</h4><p><b>ppm</b> = parts per million = 백만분의 1 = 10⁻⁶. 단위가 없는 \"비율\"이에요. 기체에서는 부피 비율로 봐요: 1 L 중 5 ppm이면 He이 5 × 10⁻⁶ L(= 5 μL) 들어 있다는 뜻이에요.</p><p><b>몰(mol)</b> = 원자·분자를 세는 묶음 단위. 1 mol = 6 × 10²³개 (아보가드로 수 N_A).</p><p><b>몰 부피 V_m = 22.4 L/mol</b>: 이상기체는 종류와 상관없이 1 mol이 22.4 L를 차지해요. 그래서 부피 ÷ 22.4 = 몰수.</p><p><b>몰 질량 M</b>: He은 1 mol이 4 g. 그래서 몰수 × 4 = 질량(g).</p><div class=\"eqn\">부피(L) ─÷V_m→ 몰 ─×M→ 질량(g)<br>몰 ─×N_A→ 개수</div><h4>i) %로 바꾸기</h4><p>1 % = 1/100 = 10⁻². 1 ppm = 10⁻⁶ = 10⁻⁴ %.</p><div class=\"eqn\">5 ppm = 5 × 10⁻⁶ × 100 % = <b>0.0005 %</b></div><h4>ii) 질량</h4><ol class=\"st\"><li>He 부피 = 5 × 10⁻⁶ × 1 L = 5 × 10⁻⁶ L</li><li>몰수 = 5 × 10⁻⁶ L ÷ 22.4 L/mol = 2.232 × 10⁻⁷ mol</li><li>질량 = 2.232 × 10⁻⁷ mol × 4 g/mol = 8.93 × 10⁻⁷ g = <b>0.89 μg</b> (μ = 10⁻⁶)</li></ol><h4>iii) 원자 수</h4><div class=\"eqn\">2.232 × 10⁻⁷ mol × 6 × 10²³ 개/mol = <b>1.34 × 10¹⁷ 개</b></div><p>작년 풀이처럼 질량에서 가도 같아요: 0.89 μg ÷ (4 g/mol) × 6×10²³.</p><h4>표면에 붙는 개수: (개/cm³)^(2/3)이 왜 개/cm²인가</h4><p>원자들이 용기 안에 바둑판처럼 같은 간격 a로 퍼져 있다고 상상해요. 1 cm³ 안에 n개가 있으면, 한 변(1 cm)에는 n^(1/3)개가 줄지어 있어요.</p><p>바닥 같은 평면 1 cm² 위에는 가로 n^(1/3)개 × 세로 n^(1/3)개 = <b>n^(2/3)개</b>가 있어요. 그래서 (개/cm³)^(2/3) = 개/cm²예요. 여기에 센서 면적(cm²)을 곱하면 끝.</p><h4>iv) 표면 개수</h4><ol class=\"st\"><li>부피 밀도 = 1.34 × 10¹⁷ 개 ÷ 1000 cm³ (1 L = 10³ cm³) = 1.34 × 10¹⁴ 개/cm³</li><li>면 밀도 = (1.34 × 10¹⁴)^(2/3) = 2.62 × 10⁹ 개/cm²</li><li>면적: 1 mm = 0.1 cm → 1 mm × 1 mm = 0.1 × 0.1 = 0.01 cm²</li><li>개수 = 2.62 × 10⁹ × 0.01 = <b>2.62 × 10⁷ 개</b></li></ol><div class=\"warn\"><b>자주 하는 실수</b> · 1 mm² = 0.1 cm²로 착각하기 쉬워요. 길이를 먼저 cm로 바꾼 뒤 곱하세요: 0.1 cm × 0.1 cm = 0.01 cm².</div><div class=\"calc\"><b>계산기</b> · (1.34E14)^(2/3): x^y 키에 지수로 (2÷3)을 괄호째 넣어요. 지수 키가 불편하면 손으로 쪼개요: 1.34×10¹⁴ = 134×10¹² → 세제곱근 = 5.12×10⁴ → 제곱 = 2.62×10⁹.</div></div><div class=\"dsec\"><div class=\"dh\"><span>4</span>답안지에 이렇게 쓰세요 · 시험용 짧은 버전</div><div class=\"xline\"><b>i)</b><q>\"5 ppm = 5×10⁻⁶ = 0.0005 %\"</q></div><div class=\"xline\"><b>ii)</b><q>\"5×10⁻⁶ L ÷ 22.4 L/mol × 4 g/mol = 8.93×10⁻⁷ g = 0.89 μg\"</q></div><div class=\"xline\"><b>iii)</b><q>\"8.93×10⁻⁷ g ÷ 4 × 6×10²³ = 1.34×10¹⁷ 개\"</q></div><div class=\"xline\"><b>iv)</b><q>\"밀도 = 1.34×10¹⁷/10³ = 1.34×10¹⁴ 개/cm³ → ^(2/3) = 2.62×10⁹ 개/cm² × 0.01 cm² = 2.62×10⁷ 개\"</q></div><ul class=\"final-list\"><li>i) 0.0005 %</li><li>ii) 0.89 μg (8.93×10⁻⁷ g)</li><li>iii) 1.34×10¹⁷ 개</li><li>iv) 2.62×10⁷ 개 (교수님 2.61×10⁷)</li></ul></div></div></details>\n    <details><summary>정답 확인</summary><div class=\"ans\">\n      <p class=\"final\">i) 0.0005 % &nbsp; ii) 0.89 μg &nbsp; iii) 1.34 × 10¹⁷ 개 &nbsp; iv) 2.62 × 10⁷ 개</p>\n      <ol>\n        <li>5 ppm = 5×10⁻⁶ × 100 % = 0.0005 %</li>\n        <li>질량 = 5×10⁻⁶ × 1 L × (4 g/mol ÷ 22.4 L/mol) = 8.93×10⁻⁷ g = 0.89 μg</li>\n        <li>개수 = 8.93×10⁻⁷ g × 6×10²³ / 4 = 1.34×10¹⁷ 개</li>\n        <li>밀도 = 1.34×10¹⁷ / 10³ cm³ = 1.34×10¹⁴ 개/cm³</li>\n        <li>(1.34×10¹⁴)^(2/3) = 2.62×10⁹ 개/cm²</li>\n        <li>1 mm × 1 mm = 0.1 cm × 0.1 cm = 0.01 cm² → 2.62×10⁷ 개 (작년 풀이 2.61×10⁷)</li>\n      </ol>\n      <p class=\"one\">계산기에서 ^(2/3)는 x^y 키에 (2÷3)을 넣거나, 세제곱근을 구한 뒤 제곱해요.</p>\n    </div></details>\n    <details class=\"calc-in\"><summary>fx-570ES PLUS 입력 순서</summary><div class=\"kbody\"><div class=\"krow\"><div class=\"kl\">%</div><div class=\"kk\"><kbd class=\"n\">5</kbd><kbd>×10ˣ</kbd><kbd>(−)</kbd><kbd class=\"n\">6</kbd><kbd>×</kbd><kbd class=\"n\">100</kbd><kbd>=</kbd></div><div class=\"kd\">5×10⁻⁴</div></div><div class=\"krow\"><div class=\"kl\">질량 g</div><div class=\"kk\"><kbd class=\"n\">5</kbd><kbd>×10ˣ</kbd><kbd>(−)</kbd><kbd class=\"n\">6</kbd><kbd>÷</kbd><kbd class=\"n\">22.4</kbd><kbd>×</kbd><kbd class=\"n\">4</kbd><kbd>=</kbd></div><div class=\"kd\">8.9285×10⁻⁷</div></div><div class=\"krow\"><div class=\"kl\">개수</div><div class=\"kk\"><kbd>Ans</kbd><kbd>÷</kbd><kbd class=\"n\">4</kbd><kbd>×</kbd><kbd class=\"n\">6</kbd><kbd>×10ˣ</kbd><kbd class=\"n\">23</kbd><kbd>=</kbd></div><div class=\"kd\">1.3392×10¹⁷</div></div><div class=\"krow\"><div class=\"kl\">개/cm³</div><div class=\"kk\"><kbd>Ans</kbd><kbd>÷</kbd><kbd class=\"n\">1000</kbd><kbd>=</kbd></div><div class=\"kd\">1.3392×10¹⁴</div></div><div class=\"krow\"><div class=\"kl\">개/cm²</div><div class=\"kk\"><kbd>Ans</kbd><kbd>x■</kbd><kbd class=\"n\">2</kbd><kbd>÷</kbd><kbd class=\"n\">3</kbd><kbd>→</kbd><kbd>=</kbd></div><div class=\"kd\">2.6176×10⁹</div></div><div class=\"krow\"><div class=\"kl\">표면 개수</div><div class=\"kk\"><kbd>Ans</kbd><kbd>×</kbd><kbd class=\"n\">0.01</kbd><kbd>=</kbd></div><div class=\"kd\">2.6176×10⁷</div></div><p class=\"knote\">x■를 누르면 커서가 지수 칸으로 올라가요. 2 ÷ 3을 넣고 →로 빠져나온 뒤 = 를 눌러요. 분수 키로 2/3을 넣어도 같아요.</p></div></details>\n  </div>\n<div class=\"card\" id=\"c4-B\">\n    <div class=\"card-top\"><span class=\"id\">4-B</span><span class=\"ttl\">HW2 2번</span><span class=\"tag hw\">HW2 원본 · 제출 완료</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">원자 1개 질량</span></div><p class=\"fline\">→ M ÷ N_A · mm² → cm² (2 mm = 0.2 cm)</p></div>\n    <div class=\"fig\" data-box='{\"gas\": \"He 2 ppm\", \"vol\": \"1 L\", \"s\": \"2 mm × 2 mm\"}'></div>\n    <div class=\"given\">1 L 용기, He <b class=\"v\">2 ppm</b>, 같은 상수. 센서 <b class=\"v\">2 mm × 2 mm</b></div>\n    <ol class=\"q\"><li>총 질량 (g)</li><li>He 원자 하나의 질량 (g)</li><li>원자 수</li><li>센서 표면에 붙는 원자 수</li></ol>\n    <details class=\"deep\"><summary>풀이 보기 · 공식 → 순서 → 차근차근 → 답안지 문장</summary><div class=\"dbody\"><div class=\"dsec\"><div class=\"dh\"><span>1</span>이 공식에 숫자만 넣으면 돼요</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">질량 [g]</span><span class=\"fe\">ppm × 10⁻⁶ × V[L] ÷ 22.4 × M</span><span class=\"fs\">이 문제: 2×10⁻⁶ × 1 ÷ 22.4 × 4 = 3.57×10⁻⁷ g</span></div><div class=\"frow\"><span class=\"fl\">원자 1개</span><span class=\"fe\">M ÷ 6×10²³</span><span class=\"fs\">이 문제: 4 ÷ 6×10²³ = 6.67×10⁻²⁴ g</span></div><div class=\"frow\"><span class=\"fl\">개수</span><span class=\"fe\">ppm × 10⁻⁶ × V[L] ÷ 22.4 × 6×10²³</span><span class=\"fs\">이 문제: 5.36×10¹⁶ 개</span></div><div class=\"frow\"><span class=\"fl\">표면 개수</span><span class=\"fe\">(개수 ÷ V[cm³])^(2/3) × 면적[cm²]</span><span class=\"fs\">이 문제: (5.36×10¹⁶ ÷ 1000)^(2/3) × 0.04 = 5.68×10⁷</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>가스센서01</b> p.4 · 가스농도 단위 (ppm, ppb, %)</li><li><b>가스센서01</b> p.5 · ppm 의미 · H₂ 1 ppm = 0.0889 μg/L · 4 % = 40,000 ppm</li><li><b>가스센서01</b> p.15 · 감도 · Pd atoms/cm³ (원자 밀도 개념)</li><li><b>HW2</b> 2번 · 2 ppm He, 2 mm × 2 mm</li></ul></div></div><div class=\"dsec\"><div class=\"dh\"><span>2</span>풀이 순서 (이 순서대로만)</div><ol class=\"flow\"><li>ppm → % 변환</li><li>ppm × 용기 부피 = 기체 부피</li><li>÷ 22.4 → 몰 → × M → 질량</li><li>몰 × N_A → 개수</li><li>개수 ÷ 용기 cm³ → 개/cm³ → ^(2/3) → 개/cm²</li><li>× 센서 면적(cm²)</li></ol></div><div class=\"dsec\"><div class=\"dh\"><span>3</span>차근차근 풀이 (처음 보는 사람용)</div><h4>이 문제가 묻는 것</h4><p>5-A와 완전히 같은 구조예요. 다른 점은 ppm(2), 센서 크기(2 mm × 2 mm), 그리고 \"원자 하나의 질량\"을 묻는 ii)예요.</p><h4>먼저 알아야 할 것</h4><p><b>ppm</b> = parts per million = 백만분의 1 = 10⁻⁶. 단위가 없는 \"비율\"이에요. 기체에서는 부피 비율로 봐요: 1 L 중 5 ppm이면 He이 5 × 10⁻⁶ L(= 5 μL) 들어 있다는 뜻이에요.</p><p><b>몰(mol)</b> = 원자·분자를 세는 묶음 단위. 1 mol = 6 × 10²³개 (아보가드로 수 N_A).</p><p><b>몰 부피 V_m = 22.4 L/mol</b>: 이상기체는 종류와 상관없이 1 mol이 22.4 L를 차지해요. 그래서 부피 ÷ 22.4 = 몰수.</p><p><b>몰 질량 M</b>: He은 1 mol이 4 g. 그래서 몰수 × 4 = 질량(g).</p><div class=\"eqn\">부피(L) ─÷V_m→ 몰 ─×M→ 질량(g)<br>몰 ─×N_A→ 개수</div><h4>ii) 원자 하나의 질량 생각하는 법</h4><p>1 mol(6 × 10²³개)이 4 g이에요. 그럼 1개는? 4 g을 6 × 10²³으로 나누면 돼요. 아주 작은 숫자(10⁻²⁴ 근처)가 나와야 정상이에요.</p><h4>표면에 붙는 개수: (개/cm³)^(2/3)이 왜 개/cm²인가</h4><p>원자들이 용기 안에 바둑판처럼 같은 간격 a로 퍼져 있다고 상상해요. 1 cm³ 안에 n개가 있으면, 한 변(1 cm)에는 n^(1/3)개가 줄지어 있어요.</p><p>바닥 같은 평면 1 cm² 위에는 가로 n^(1/3)개 × 세로 n^(1/3)개 = <b>n^(2/3)개</b>가 있어요. 그래서 (개/cm³)^(2/3) = 개/cm²예요. 여기에 센서 면적(cm²)을 곱하면 끝.</p><h4>스스로 검산하기</h4><ol class=\"st\"><li>2 ppm은 5 ppm의 0.4배 → 질량과 원자 수도 4-A 답의 0.4배여야 해요</li><li>2 mm × 2 mm = 0.2 cm × 0.2 cm = 0.04 cm²</li><li>표면 개수는 밀도의 2/3 제곱이라 정확히 0.4배가 아니에요 (0.4^(2/3) ≈ 0.54배) — 그리고 면적이 4배</li></ol><h4>숫자로 풀기 (제출 답안과 같음)</h4><ol class=\"st\"><li>몰 = 2×10⁻⁶ L ÷ 22.4 = 8.93×10⁻⁸ mol → 질량 = × 4 = <b>3.57×10⁻⁷ g</b></li><li>원자 1개 = 4 ÷ 6×10²³ = <b>6.67×10⁻²⁴ g</b></li><li>개수 = 8.93×10⁻⁸ × 6×10²³ = <b>5.36×10¹⁶ 개</b></li><li>밀도 = 5.36×10¹⁶ ÷ 1000 = 5.36×10¹³ 개/cm³ → ^(2/3) = 1.42×10⁹ 개/cm²</li><li>× 0.04 cm² = <b>5.68×10⁷ 개</b></li></ol></div><div class=\"dsec\"><div class=\"dh\"><span>4</span>답안지에 이렇게 쓰세요 · 시험용 짧은 버전</div><div class=\"xline\"><b>i)</b><q>\"2×10⁻⁶ L ÷ 22.4 × 4 = 3.57×10⁻⁷ g\"</q></div><div class=\"xline\"><b>ii)</b><q>\"4 g/mol ÷ 6×10²³ = 6.67×10⁻²⁴ g\"</q></div><div class=\"xline\"><b>iii)</b><q>\"8.93×10⁻⁸ mol × 6×10²³ = 5.36×10¹⁶ 개\"</q></div><div class=\"xline\"><b>iv)</b><q>\"(5.36×10¹⁶/10³)^(2/3) × 0.04 cm² = 5.68×10⁷ 개\"</q></div><ul class=\"final-list\"><li>i) 3.57×10⁻⁷ g</li><li>ii) 6.67×10⁻²⁴ g</li><li>iii) 5.36×10¹⁶ 개</li><li>iv) 5.68×10⁷ 개</li></ul></div></div></details>\n    <details><summary>정답 확인 · 제출 답안과 일치 ✓</summary><div class=\"ans\">\n      <p class=\"final\">i) 3.57×10⁻⁷ g &nbsp; ii) 6.67×10⁻²⁴ g &nbsp; iii) 5.36×10¹⁶ 개 &nbsp; iv) 5.68×10⁷ 개</p>\n      <ol>\n        <li>He 부피 = 2×10⁻⁶ × 1 L → 몰 = 2×10⁻⁶ / 22.4 = 8.93×10⁻⁸ mol → × 4 = 3.57×10⁻⁷ g</li>\n        <li>원자 1개 = M / N_A = 4 / (6×10²³) = 6.67×10⁻²⁴ g</li>\n        <li>개수 = 8.93×10⁻⁸ × 6×10²³ = 5.36×10¹⁶ 개</li>\n        <li>밀도 = 5.36×10¹⁶ / 10³ cm³ = 5.36×10¹³ 개/cm³ → ^(2/3) = 1.42×10⁹ 개/cm²</li>\n        <li>2 mm × 2 mm = 0.04 cm² → 1.42×10⁹ × 0.04 = 5.68×10⁷ 개</li>\n      </ol>\n    </div></details>\n    <details class=\"calc-in\"><summary>fx-570ES PLUS 입력 순서</summary><div class=\"kbody\"><div class=\"krow\"><div class=\"kl\">질량 g</div><div class=\"kk\"><kbd class=\"n\">2</kbd><kbd>×10ˣ</kbd><kbd>(−)</kbd><kbd class=\"n\">6</kbd><kbd>÷</kbd><kbd class=\"n\">22.4</kbd><kbd>×</kbd><kbd class=\"n\">4</kbd><kbd>=</kbd></div><div class=\"kd\">3.5714×10⁻⁷</div></div><div class=\"krow\"><div class=\"kl\">원자 1개 g</div><div class=\"kk\"><kbd class=\"n\">4</kbd><kbd>÷</kbd><kbd class=\"n\">6</kbd><kbd>×10ˣ</kbd><kbd class=\"n\">23</kbd><kbd>=</kbd></div><div class=\"kd\">6.6666×10⁻²⁴</div></div><div class=\"krow\"><div class=\"kl\">개수</div><div class=\"kk\"><kbd class=\"n\">2</kbd><kbd>×10ˣ</kbd><kbd>(−)</kbd><kbd class=\"n\">6</kbd><kbd>÷</kbd><kbd class=\"n\">22.4</kbd><kbd>×</kbd><kbd class=\"n\">6</kbd><kbd>×10ˣ</kbd><kbd class=\"n\">23</kbd><kbd>=</kbd></div><div class=\"kd\">5.3571×10¹⁶</div></div><div class=\"krow\"><div class=\"kl\">개/cm³</div><div class=\"kk\"><kbd>Ans</kbd><kbd>÷</kbd><kbd class=\"n\">1000</kbd><kbd>=</kbd></div><div class=\"kd\">5.3571×10¹³</div></div><div class=\"krow\"><div class=\"kl\">개/cm²</div><div class=\"kk\"><kbd>Ans</kbd><kbd>x■</kbd><kbd class=\"n\">2</kbd><kbd>÷</kbd><kbd class=\"n\">3</kbd><kbd>→</kbd><kbd>=</kbd></div><div class=\"kd\">1.4211×10⁹</div></div><div class=\"krow\"><div class=\"kl\">표면 개수</div><div class=\"kk\"><kbd>Ans</kbd><kbd>×</kbd><kbd class=\"n\">0.04</kbd><kbd>=</kbd></div><div class=\"kd\">5.6844×10⁷</div></div></div></details>\n  </div>\n<div class=\"card\" id=\"c4-C\">\n    <div class=\"card-top\"><span class=\"id\">4-C</span><span class=\"ttl\">기체·용기·센서 크기를 모두 바꾸면</span><span class=\"tag sim\">유사</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">2 L</span><span class=\"kw\">Ar</span></div><p class=\"fline\">→ 용기 2 L = <b>2000 cm³</b>로 나누기 · M = 40</p></div>\n    <div class=\"fig\" data-box='{\"gas\":\"Ar 10 ppm\",\"vol\":\"2 L\",\"s\":\"3 mm × 3 mm\"}'></div>\n    <div class=\"given\"><b class=\"v\">2 L</b> 용기, Ar <b class=\"v\">10 ppm</b>. M = <b class=\"v\">40 g/mol</b>, V_m = 22.4 L/mol, N_A = 6×10²³. 센서 <b class=\"v\">3 mm × 3 mm</b></div>\n    <ol class=\"q\"><li>Ar은 몇 %</li><li>총 질량</li><li>원자 수</li><li>센서 표면 원자 수</li></ol>\n    <details class=\"deep\"><summary>풀이 보기 · 공식 → 순서 → 차근차근 → 답안지 문장</summary><div class=\"dbody\"><div class=\"dsec\"><div class=\"dh\"><span>1</span>이 공식에 숫자만 넣으면 돼요</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">질량 [g]</span><span class=\"fe\">ppm × 10⁻⁶ × V[L] ÷ 22.4 × M</span><span class=\"fs\">이 문제: 10×10⁻⁶ × 2 ÷ 22.4 × 40 = 3.57×10⁻⁵ g</span></div><div class=\"frow\"><span class=\"fl\">개수</span><span class=\"fe\">ppm × 10⁻⁶ × V[L] ÷ 22.4 × 6×10²³</span><span class=\"fs\">이 문제: 5.36×10¹⁷ 개</span></div><div class=\"frow\"><span class=\"fl\">표면 개수</span><span class=\"fe\">(개수 ÷ V[cm³])^(2/3) × 면적[cm²]</span><span class=\"fs\">이 문제: (5.36×10¹⁷ ÷ 2000)^(2/3) × 0.09 = 3.74×10⁸</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>가스센서01</b> p.4 · 가스농도 단위 (ppm, ppb, %)</li><li><b>가스센서01</b> p.5 · ppm 의미 · H₂ 1 ppm = 0.0889 μg/L · 4 % = 40,000 ppm</li><li><b>가스센서01</b> p.15 · 감도 · Pd atoms/cm³ (원자 밀도 개념)</li></ul></div></div><div class=\"dsec\"><div class=\"dh\"><span>2</span>풀이 순서 (이 순서대로만)</div><ol class=\"flow\"><li>ppm → % 변환</li><li>ppm × 용기 부피 = 기체 부피</li><li>÷ 22.4 → 몰 → × M → 질량</li><li>몰 × N_A → 개수</li><li>개수 ÷ 용기 cm³ → 개/cm³ → ^(2/3) → 개/cm²</li><li>× 센서 면적(cm²)</li></ol></div><div class=\"dsec\"><div class=\"dh\"><span>3</span>차근차근 풀이 (처음 보는 사람용)</div><h4>달라진 점 세 가지</h4><ol class=\"st\"><li>기체가 Ar → M = 40 g/mol</li><li>용기가 2 L → 부피 2배, 그리고 cm³로 바꾸면 <b>2000 cm³</b></li><li>센서가 3 mm × 3 mm → 0.3 cm × 0.3 cm = 0.09 cm²</li></ol><h4>풀이</h4><ol class=\"st\"><li>% = 10 × 10⁻⁶ × 100 = 0.001 %</li><li>Ar 부피 = 10 × 10⁻⁶ × 2 L = 2 × 10⁻⁵ L</li><li>몰수 = 2 × 10⁻⁵ ÷ 22.4 = 8.93 × 10⁻⁷ mol</li><li>질량 = 8.93 × 10⁻⁷ × 40 = 3.57 × 10⁻⁵ g</li><li>개수 = 8.93 × 10⁻⁷ × 6 × 10²³ = 5.36 × 10¹⁷ 개</li><li>밀도 = 5.36 × 10¹⁷ ÷ 2000 cm³ = 2.68 × 10¹⁴ 개/cm³</li><li>(2.68 × 10¹⁴)^(2/3) = 4.16 × 10⁹ 개/cm² → × 0.09 = <b>3.74 × 10⁸ 개</b></li></ol><div class=\"warn\"><b>자주 하는 실수</b> · 개수를 1000 cm³로 나누는 습관이 있으면 여기서 틀려요. 용기가 2 L면 2000 cm³로 나눠요.</div></div><div class=\"dsec\"><div class=\"dh\"><span>4</span>답안지에 이렇게 쓰세요 · 시험용 짧은 버전</div><div class=\"xline\"><b>i)</b><q>\"10 ppm = 0.001 %\"</q></div><div class=\"xline\"><b>ii)</b><q>\"10×10⁻⁶ × 2 L ÷ 22.4 × 40 = 3.57×10⁻⁵ g\"</q></div><div class=\"xline\"><b>iii)</b><q>\"5.36×10¹⁷ 개\"</q></div><div class=\"xline\"><b>iv)</b><q>\"(5.36×10¹⁷/2000)^(2/3) × 0.09 = 3.74×10⁸ 개\"</q></div><ul class=\"final-list\"><li>i) 0.001 %</li><li>ii) 3.57×10⁻⁵ g</li><li>iii) 5.36×10¹⁷ 개</li><li>iv) 3.74×10⁸ 개</li></ul></div></div></details>\n    <details><summary>정답 확인</summary><div class=\"ans\">\n      <p class=\"final\">i) 0.001 % &nbsp; ii) 3.57×10⁻⁵ g &nbsp; iii) 5.36×10¹⁷ 개 &nbsp; iv) 3.74×10⁸ 개</p>\n      <ol>\n        <li>10×10⁻⁶ × 100 % = 0.001 %</li>\n        <li>Ar 부피 = 10×10⁻⁶ × 2 L = 2×10⁻⁵ L → 몰 = 2×10⁻⁵/22.4 = 8.93×10⁻⁷ mol → × 40 = 3.57×10⁻⁵ g</li>\n        <li>8.93×10⁻⁷ × 6×10²³ = 5.36×10¹⁷ 개</li>\n        <li>밀도 = 5.36×10¹⁷ / 2000 cm³ = 2.68×10¹⁴ 개/cm³ (용기가 2 L = 2000 cm³인 점 주의)</li>\n        <li>(2.68×10¹⁴)^(2/3) = 4.16×10⁹ 개/cm² × 0.09 cm² = 3.74×10⁸ 개</li>\n      </ol>\n    </div></details>\n    <details class=\"calc-in\"><summary>fx-570ES PLUS 입력 순서</summary><div class=\"kbody\"><div class=\"krow\"><div class=\"kl\">몰</div><div class=\"kk\"><kbd class=\"n\">10</kbd><kbd>×10ˣ</kbd><kbd>(−)</kbd><kbd class=\"n\">6</kbd><kbd>×</kbd><kbd class=\"n\">2</kbd><kbd>÷</kbd><kbd class=\"n\">22.4</kbd><kbd>=</kbd></div><div class=\"kd\">8.9285×10⁻⁷</div></div><div class=\"krow\"><div class=\"kl\">질량 g</div><div class=\"kk\"><kbd>Ans</kbd><kbd>×</kbd><kbd class=\"n\">40</kbd><kbd>=</kbd></div><div class=\"kd\">3.5714×10⁻⁵</div></div><div class=\"krow\"><div class=\"kl\">개수</div><div class=\"kk\"><kbd class=\"n\">10</kbd><kbd>×10ˣ</kbd><kbd>(−)</kbd><kbd class=\"n\">6</kbd><kbd>×</kbd><kbd class=\"n\">2</kbd><kbd>÷</kbd><kbd class=\"n\">22.4</kbd><kbd>×</kbd><kbd class=\"n\">6</kbd><kbd>×10ˣ</kbd><kbd class=\"n\">23</kbd><kbd>=</kbd></div><div class=\"kd\">5.3571×10¹⁷</div></div><div class=\"krow\"><div class=\"kl\">개/cm³</div><div class=\"kk\"><kbd>Ans</kbd><kbd>÷</kbd><kbd class=\"n\">2000</kbd><kbd>=</kbd></div><div class=\"kd\">2.6785×10¹⁴</div></div><div class=\"krow\"><div class=\"kl\">개/cm²</div><div class=\"kk\"><kbd>Ans</kbd><kbd>x■</kbd><kbd class=\"n\">2</kbd><kbd>÷</kbd><kbd class=\"n\">3</kbd><kbd>→</kbd><kbd>=</kbd></div><div class=\"kd\">4.1552×10⁹</div></div><div class=\"krow\"><div class=\"kl\">표면 개수</div><div class=\"kk\"><kbd>Ans</kbd><kbd>×</kbd><kbd class=\"n\">0.09</kbd><kbd>=</kbd></div><div class=\"kd\">3.7397×10⁸</div></div></div></details>\n  </div>\n<div class=\"card\" id=\"c4-D\">\n    <div class=\"card-top\"><span class=\"id\">4-D</span><span class=\"ttl\">수소 1 ppm의 의미 (강의 예제)</span><span class=\"tag sim\">유사 · 기본</span></div>\n    <div class=\"first\"><div class=\"fhead\"><span class=\"flabel\">먼저 떠올릴 것</span><span class=\"fsig\">문제 신호</span><span class=\"kw\">1 ppm H₂</span><span class=\"kw\">%</span></div><p class=\"fline\">→ 1 ppm = 1 μL/L · 1 % = 10⁴ ppm</p></div>\n    <div class=\"given\">H₂: M = <b class=\"v\">2.02 g/mol</b>, V_m = <b class=\"v\">22.71 L/mol</b></div>\n    <ol class=\"q\"><li>1 L 안에 몇 μg의 H₂가 있으면 1 ppm인가?</li><li>4 %는 몇 ppm인가?</li></ol>\n    <details class=\"deep\"><summary>풀이 보기 · 공식 → 순서 → 차근차근 → 답안지 문장</summary><div class=\"dbody\"><div class=\"dsec\"><div class=\"dh\"><span>1</span>이 공식에 숫자만 넣으면 돼요</div><div class=\"fbox\"><div class=\"frow\"><span class=\"fl\">질량 [g]</span><span class=\"fe\">ppm × 10⁻⁶ × V[L] ÷ V_m × M</span><span class=\"fs\">이 문제: 1×10⁻⁶ × 1 ÷ 22.71 × 2.02 = 0.0889 μg</span></div><div class=\"frow\"><span class=\"fl\">% ↔ ppm</span><span class=\"fe\">1 % = 10⁴ ppm</span><span class=\"fs\">이 문제: 4 % = 40,000 ppm</span></div></div><div class=\"srcbox\"><b>강의자료 위치</b><ul><li><b>가스센서01</b> p.5 · ppm 의미 · H₂ 예제 (V_m = 22.71 L/mol)</li></ul></div></div><div class=\"dsec\"><div class=\"dh\"><span>2</span>풀이 순서 (이 순서대로만)</div><ol class=\"flow\"><li>1 ppm = 1 μL/L</li><li>÷ 22.71 → 몰 → × 2.02 → 질량</li><li>% ↔ ppm 변환</li></ol></div><div class=\"dsec\"><div class=\"dh\"><span>3</span>차근차근 풀이 (처음 보는 사람용)</div><h4>풀이</h4><p>1 ppm = 백만 분의 1 → 1 L 중 1 μL (1 × 10⁻⁶ L)가 H₂예요.</p><ol class=\"st\"><li>몰수 = 1 × 10⁻⁶ L ÷ 22.71 L/mol = 4.40 × 10⁻⁸ mol</li><li>질량 = 4.40 × 10⁻⁸ × 2.02 g/mol = 8.89 × 10⁻⁸ g = <b>0.0889 μg</b></li></ol><p>4 %: 1 % = 10⁻² = 10,000 ppm이니까 4 % = <b>40,000 ppm</b>. 수소 폭발 하한(4 %)을 ppm으로 말할 때 써요.</p></div><div class=\"dsec\"><div class=\"dh\"><span>4</span>답안지에 이렇게 쓰세요 · 시험용 짧은 버전</div><div class=\"xline\"><b>i)</b><q>\"1 ppm = 1 μL/L → 10⁻⁶ L ÷ 22.71 × 2.02 = 0.0889 μg\"</q></div><div class=\"xline\"><b>ii)</b><q>\"1 % = 10⁴ ppm → 4 % = 40,000 ppm\"</q></div><ul class=\"final-list\"><li>0.0889 μg</li><li>4 % = 40,000 ppm</li></ul></div></div></details>\n    <details><summary>정답 확인</summary><div class=\"ans\">\n      <p class=\"final\">0.0889 μg &nbsp; 40,000 ppm</p>\n      <ol><li>1 ppm = 1 μL/L → (1×10⁻⁶ L ÷ 22.71) × 2.02 = 8.89×10⁻⁸ g = 0.0889 μg</li><li>1 % = 10⁴ ppm → 4 % = 4×10⁴ = 40,000 ppm</li></ol>\n    </div></details>\n    <details class=\"calc-in\"><summary>fx-570ES PLUS 입력 순서</summary><div class=\"kbody\"><div class=\"krow\"><div class=\"kl\">질량 g</div><div class=\"kk\"><kbd class=\"n\">1</kbd><kbd>×10ˣ</kbd><kbd>(−)</kbd><kbd class=\"n\">6</kbd
