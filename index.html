ANIM.pyramid=host=>{const LV=[['Level 4','ERP','경영·계획','일·월'],['Level 3','MES · Historian','생산 실행·이력','분·시간'],['Level 2','SCADA · HMI','감시·알람','초'],['Level 1','PLC · DCS','제어','ms'],['Level 0','센서 · 구동기','측정·동작','μs~ms']];
  host.innerHTML=`<figure class="figs"><svg viewBox="0 0 340 250" role="img" aria-label="ISA-95 자동화 피라미드"></svg><figcaption>센서 값(점)이 아래에서 위로 올라가며 점점 요약돼요. 아래는 빠르고 많고, 위는 느리고 넓어요. 오른쪽은 대표 시간 단위.</figcaption></figure>`;
  const svg=host.querySelector('svg');
  const L=loop(tp=>{let s='';LV.forEach((l,i)=>{const y=14+i*44,w=120+i*44,x=170-w/2;s+=`<rect x="${x}" y="${y}" width="${w}" height="38" rx="6" style="fill:${i===4?'var(--warn-soft)':'var(--surface2)'};stroke:var(--line)"/><text x="170" y="${y+16}" text-anchor="middle" class="b2">${l[1]}</text><text x="170" y="${y+31}" text-anchor="middle" class="small2">${l[2]}</text><text x="${x-4}" y="${y+24}" text-anchor="end" class="small2">${l[0].replace('Level ','L')}</text><text x="${x+w+4}" y="${y+24}" class="small2">${l[3]}</text>`});
   for(let k=0;k<6;k++){const ph=((tp*0.35+k/6)%1);const y=228-ph*214;const x=170+Math.sin(k*1.7)*(40-ph*30);s+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(4-ph*2.2).toFixed(1)}" style="fill:var(--accent);opacity:${(1-ph*0.6).toFixed(2)}"/>`}
   svg.innerHTML=s});return L.stop};

ANIM.vtrend=host=>{let day=60;const base=1.2,sd=0.12;const data=Array.from({length:121},(_,d)=>{const deg=d<55?0:0.0009*(d-55)**2;return +(base+deg+Math.sin(d*1.3)*sd*0.9+Math.cos(d*2.9)*sd*0.5).toFixed(3)});const thr=+(base+3*sd).toFixed(2),alarm=4.5;
  host.innerHTML=`<figure class="figs"><svg viewBox="0 0 340 220" role="img" aria-label="진동 추세와 이상 탐지"></svg><div class="figctl"><label class="small">운전 일수 <input type="range" min="10" max="120" step="1" value="60" data-d style="width:170px"> <b data-dv>60일</b></label></div>
   <div class="tofcalc small" data-o></div><figcaption>평소 진동(기준선)의 평균 + 3σ를 넘으면 "이상 징후"(P), 정해 둔 위험 수준(예: 4.5 mm/s)에 닿기 전에 정비 계획을 세워요. [AI 보충: 가상 데이터]</figcaption></figure>`;
  const svg=host.querySelector('svg'),q=s=>host.querySelector(s);const X=d=>30+d*2.4,Y=v=>190-v/6*170;
  const draw=()=>{let p='';for(let d=0;d<=day;d++)p+=(d?'L':'M')+X(d).toFixed(1)+' '+Y(data[d]).toFixed(1);const first=data.findIndex((v,d)=>d>20&&v>thr);
   const k=day>=first&&first>0?(data[day]-data[Math.max(first,day-10)])/(day-Math.max(first,day-10)||1):0;const rul=k>0?(alarm-data[day])/k:null;
   svg.innerHTML=`<line x1="30" y1="190" x2="322" y2="190" style="stroke:var(--ink)"/><line x1="30" y1="20" x2="30" y2="190" style="stroke:var(--ink)"/>${[0,2,4,6].map(v=>`<text x="26" y="${Y(v)+4}" text-anchor="end" class="small2">${v}</text>`).join('')}${tx(34,16,'진동 속도 RMS (mm/s)','small2')}${tx(322,206,'운전 일수 →','small2','end')}
    <line x1="30" y1="${Y(thr)}" x2="322" y2="${Y(thr)}" style="stroke:var(--warn);stroke-dasharray:4 3"/>${tx(320,Y(thr)-4,'평균+3σ '+thr,'w small2','end')}<line x1="30" y1="${Y(alarm)}" x2="322" y2="${Y(alarm)}" style="stroke:var(--bad);stroke-dasharray:4 3"/>${tx(320,Y(alarm)-4,'위험 '+alarm,'b small2','end')}
    <path d="${p}" style="fill:none;stroke:var(--accent);stroke-width:2"/>${first>0&&day>=first?`<circle cx="${X(first)}" cy="${Y(data[first])}" r="5" style="fill:none;stroke:var(--warn);stroke-width:2"/>${tx(X(first),Y(data[first])+18,'P (징후)','w small2','middle')}`:''}`;
   q('[data-o]').innerHTML=day<first||first<0?`현재 ${data[day]} mm/s — 정상 범위`:`현재 ${data[day]} mm/s — <b>이상 징후</b> (${first}일째부터)${rul&&data[day]<alarm?` · 최근 추세로 위험 수준까지 약 <b>${rul.toFixed(0)}일</b> (선형 외삽)`:data[day]>=alarm?' · <b>위험 수준 도달 — 즉시 점검</b>':''}`;q('[data-dv]').textContent=day+'일'};
  q('[data-d]').oninput=e=>{day=+e.target.value;draw()};draw();return null};

 rulLin(base){const d1=base?30:pick([20,30,40]),v1=base?2.0:pick([1.8,2.0,2.4]),d2=d1+(base?20:pick([10,20,30])),v2=+(v1+(base?0.8:pick([0.4,0.8,1.2]))).toFixed(1),lim=4.5;const k=(v2-v1)/(d2-d1);const rul=(lim-v2)/k;

   steps:[{h:'기울기',b:`<div class="ln">(${v2} − ${v1}) ÷ (${d2} − ${d1}) = ${fx(k,4)} mm/s/일</div>`},{h:'RUL',b:`<div class="ln">(${lim} − ${v2}) ÷ ${fx(k,4)} = ${fx(rul,4)}일</div><div class="rd">실제 열화는 대개 가속(지수형) → 선형은 낙관적 추정 · 범위로 보고 [AI 보충]</div>`}],
   ans:`약 ${fx(rul,3)}일`,ansRead:`${fxR(rul,3)}일`,calc:calcBlock([[['(',...ks(lim),'−',...ks(v2),')','÷','(','(',...ks(v2),'−',...ks(v1),')','÷','(',...ks(d2),'−',...ks(d1),')',')','='],casioDec(rul)]],[]),easy:'지금까지 나빠진 속도로 계속 가면 언제 한계선에 닿는지 계산해요.'}},
 nyqFs(base){const fmax=base?1000:pick([500,1000,5000,10000]),N=base?2048:pick([1024,2048,4096]);const fs=2.56*fmax,df=fs/N;
  return {kind:base?'기본':'유사',title:'샘플링 주파수와 FFT 분해능',q:`최대 ${fmax} Hz까지 보고 싶다. 실무 기준 샘플링 주파수와, ${N}점 FFT의 주파수 분해능은?`,first:['나이퀴스트: f_s > 2f_max (실무 2.56배)','Δf = f_s/N'],
   steps:[{h:'f_s',b:`<div class="ln">2.56 × ${fmax} = ${fx(fs,5)} Hz</div><div class="rd">이론 최소 2배 · 안티앨리어싱 필터 여유로 2.56배</div>`},{h:'Δf',b:`<div class="ln">${fx(fs,5)} ÷ ${N} = ${fx(df,4)} Hz</div><div class="rd">측정 시간 = N/f_s = ${fx(N/fs,4)} s · 분해능을 높이려면 더 오래 측정</div>`}],
   ans:`f_s ${fx(fs,5)} Hz · Δf ${fx(df,4)} Hz`,ansRead:`${fxR(df,4)} 헤르츠`,calc:calcBlock([[['2','.','5','6','×',...ks(fmax),'÷',...ks(N),'='],casioDec(df)]],[]),easy:'보고 싶은 가장 빠른 떨림보다 2배 넘게 자주 찍어야 해요. 오래 찍을수록 주파수를 더 촘촘히 구분해요.'}}
});

const IDB={db:null,open(){return new Promise((res,rej)=>{if(this.db)return res(this.db);try{const r=indexedDB.open('skn-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('p',{keyPath:'id'});r.onsuccess=()=>{this.db=r.result;res(this.db)};r.onerror=()=>rej(r.error)}catch(e){rej(e)}})},
  async all(page){const db=await this.open();return new Promise(res=>{const out=[];const c=db.transaction('p').objectStore('p').openCursor();c.onsuccess=()=>{const cur=c.result;if(cur){if(!page||cur.value.page===page)out.push(cur.value);cur.continue()}else res(out)}})},
  async put(v){const db=await this.open();return new Promise((res,rej)=>{const tx=db.transaction('p','readwrite');tx.objectStore('p').put(v);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})},
  async del(id){const db=await this.open();return new Promise(res=>{const tx=db.transaction('p','readwrite');tx.objectStore('p').delete(id);tx.oncomplete=res})}};
function shrink(file){return new Promise((res,rej)=>{const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const M=1280,s=Math.min(1,M/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.82))};im.onerror=rej;im.src=fr.result};fr.onerror=rej;fr.readAsDataURL(file)})}

   <label class="ghost filebtn" style="text-align:center">📷 사진 추가<input type="file" accept="image/*" id="pin"></label>
   <div class="eyebrow">백업</div>
   <div class="btnrow"><button class="tbtn" id="exp">백업 내보내기</button><label class="tbtn filebtn">백업 불러오기<input type="file" accept="application/json,.json" id="imp"></label></div>
   <p class="small muted" id="pmsg">노트·내 카드·사진·암기 기록을 한 파일로 저장해요. 이 파일을 채팅에 보내 주면 앱 본문에 정식으로 넣어 드릴 수도 있어요.</p>`,h=>{
    const ta=h.querySelector('#nt');let tm;ta.oninput=()=>{clearTimeout(tm);h.querySelector('#ntst').textContent='저장 중…';tm=setTimeout(()=>{MY.setNote(page,ta.value);h.querySelector('#ntst').textContent='저장했어요';if(cur.v==='page')refreshNote()},400)};
    h.querySelector('#nt2c').onclick=()=>{MY.setNote(page,ta.value);const sel=(ta.value.substring(ta.selectionStart,ta.selectionEnd)||'').trim();cardForm({id:'my'+Date.now(),f:sel,a:'',e:'',page},page)};
    h.querySelector('#pin').onchange=async e=>{MY.setNote(page,ta.value);const f=e.target.files[0];if(!f)return;try{const img=await shrink(f);await IDB.put({id:'p'+Date.now(),page,img,memo:'',at:Date.now()});noteSheet(page)}catch(err){h.querySelector('#pmsg').textContent='사진을 저장하지 못했어요. 브라우저 저장 공간이 꺼져 있을 수 있어요.'}};
    h.querySelectorAll('[data-ph]').forEach(b=>b.onclick=()=>{MY.setNote(page,ta.value);photoView(list.find(x=>x.id===b.dataset.ph))});
    h.querySelector('#exp').onclick=async()=>{try{const all=await IDB.all();const blob=new Blob([JSON.stringify({app:'sensor-notes',v:2,notes:MY.notes(),mycards:MY.cards(),srs:LS.get('srs',{}),ustat:LS.get('ustat',{}),photos:all})],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='센서노트-백업.json';document.body.appendChild(a);a.click();a.remove();h.querySelector('#pmsg').textContent='저장을 시도했어요. 시안(미리보기)에서는 파일 저장이 막혀 있고, 폰 앱 버전에서 동작해요.'}catch(e){h.querySelector('#pmsg').textContent='내보내기에 실패했어요.'}};
    h.querySelector('#imp').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const d=JSON.parse(await f.text());if(d.app!=='sensor-notes')throw 0;for(const p of d.photos||[])await IDB.put(p);
      if(d.srs)LS.set('srs',d.srs);if(d.ustat)LS.set('ustat',d.ustat);if(d.notes)LS.set('notes',{...MY.notes(),...d.notes});
      if(d.mycards){const ids=new Set(MY.cards().map(c=>c.id));MY.setCards(MY.cards().concat(d.mycards.filter(c=>!ids.has(c.id))))}
      deck=null;noteSheet(page);if(cur.v==='page')refreshNote()}catch(err){h.querySelector('#pmsg').textContent='센서노트 백업 파일이 아니에요. 내보내기로 만든 .json 파일을 골라 주세요.'}};
  });
}
function refreshNote(){const box=V.querySelector('#myNoteBox');if(box)box.outerHTML=noteBox(cur.arg.id);wireNoteBox()}
function noteBox(id){const t=MY.note(id);return t?`<button class="mynote" id="myNoteBox"><span class="lb">✎ 내 노트</span><span class="nt-tx">${esc(t.length>220?t.slice(0,220)+'…':t)}</span></button>`:`<button class="mynote empty" id="myNoteBox">✎ 이 장에 내 노트·사진 붙이기</button>`}
function wireNoteBox(){const b=V.querySelector('#myNoteBox');if(b)b.onclick=()=>noteSheet(cur.arg.id)}
function photoView(p){openSheet(`<div class="phfull"><img src="${p.img}" alt="내 사진"></div><label class="small muted" for="memo">메모</label><textarea id="memo" placeholder="이 사진에서 기억할 점">${esc(p.memo||'')}</textarea>
  <div class="btnrow"><button class="tbtn" id="save">메모 저장</button><button class="tbtn" id="del" style="color:var(--bad)">사진 삭제</button></div><p class="small muted" id="vmsg"></p>`,h=>{
  h.querySelector('#save').onclick=async()=>{p.memo=h.querySelector('#memo').value;await IDB.put(p);h.querySelector('#vmsg').textContent='저장했어요'};
  let armed=false;h.querySelector('#del').onclick=async e=>{if(!armed){armed=true;e.target.textContent='한 번 더 누르면 삭제';return}await IDB.del(p.id);noteSheet(p.page)}})}

/* 시작 */
const h=(location.hash||'').slice(1);
if(PAGES[h])cur={v:'page',arg:{id:h,i:0}};else if(['dict','cards','practice'].includes(h))cur={v:h};
THEME.apply();render();
})();
</script>

<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }
</script>
</body>
</html>
