const SYMS=(()=>{const st='fill:none;stroke:var(--ink);stroke-width:2;stroke-linecap:round;stroke-linejoin:round';

   ['ac','교류 전원','AC source',circ(P('M50 30 C54 20 58 20 60 30 C62 40 66 40 70 30')),'원 안에 사인파. 와전류·초음파 구동 신호.'],

  ['수동 소자',[

   ['thm','서미스터','Thermistor',box+P('M34 46 L44 46 L76 12')+T(92,52,'t°',11),'꺾인 사선 + t° = 온도로 저항이 변함 (NTC·PTC).'],
   ['ldr','포토레지스터 (CdS)','Photoresistor (LDR)',box+arr(36,4,48,17)+arr(50,2,62,15),'들어오는 화살표 = 빛을 받음 → 저항 감소.'],
   ['cap','커패시터','Capacitor',cap,'평행한 두 판 = 평행판 콘덴서 C = εA/d 그대로. 정전용량 센서·필터.'],

   ['led','LED (발광 다이오드)','Light-emitting diode',diode+arr(66,12,80,0)+arr(76,16,90,4),'나가는 화살표 = 빛을 냄. 광전센서의 송광부.'],
   ['pd','포토다이오드','Photodiode',diode+arr(82,0,68,13)+arr(94,4,80,17),'들어오는 화살표 = 빛을 받아 전류. 보통 역방향으로 연결 (광도전 모드).'],
   ['npn','NPN 트랜지스터','NPN transistor',bjt(true)+T(30,24,'B',10)+T(86,8,'C',10)+T(86,58,'E',10),'이미터 화살표가 밖으로 (Not Pointing iN). 근접센서 NPN 출력.'],
   ['pnp','PNP 트랜지스터','PNP transistor',bjt(false)+T(30,24,'B',10)+T(86,8,'E',10)+T(86,58,'C',10),'이미터 화살표가 안으로 (Pointing iN Proudly). PNP 출력.'],

  ['스위치·계측·센서',[

   ['vm','전압계','Voltmeter',circ(T(60,35,'V',14)),'두 점 사이에 병렬로 연결. 입력 저항이 아주 커야 함.'],

   ['tc','열전대','Thermocouple',P('M10 18 H50 L70 40 M10 42 H50 L70 40')+`<circle cx="70" cy="40" r="3" style="fill:var(--ink)"/>`+T(30,14,'+',11)+T(30,56,'−',11),'두 금속(선 두 개)이 한 점에서 만남 = 측정 접점.'],
   ['hallS','홀 소자','Hall element',`<rect x="38" y="16" width="44" height="28" style="${st}"/>`+P('M10 30 H38 M82 30 H110 M60 4 V16 M60 44 V56')+T(60,35,'H',12),'네 단자: 한 쌍은 구동 전류, 다른 한 쌍은 홀 전압 V_H.']]]

});

/* ── 움직이는 그림: 최소자승 직접 맞춰 보기 ── */
ANIM.lsq=host=>{const P=[[1,4],[2,6],[3,7]];let a=1,b=3;
  host.innerHTML=`<figure class="figs"><svg viewBox="0 0 340 220" role="img" aria-label="최소자승 직선 맞추기"></svg>
   <div class="figctl"><label class="small">기울기 a <input type="range" min="0" max="3" step="0.05" value="1" data-a style="width:110px"></label><label class="small">절편 b <input type="range" min="0" max="6" step="0.05" value="3" data-b style="width:110px"></label><button class="tbtn" data-best>최적 직선</button></div>
   <div class="tofcalc mono small" data-o></div>
   <figcaption>슬라이더로 직선을 움직여 보세요. 빨간 선(오차)의 <b>제곱의 합</b>이 가장 작아지는 a, b가 최소자승 답이에요 (a = 1.5, b ≈ 2.667).</figcaption></figure>`;
  const svg=host.querySelector('svg'),q=s=>host.querySelector(s);
  const X=x=>40+x*80,Y=y=>200-y*22;
  const draw=()=>{let sse=0;const segs=P.map(([x,y])=>{const yf=a*x+b;sse+=(y-yf)**2;return `<line x1="${X(x)}" y1="${Y(y)}" x2="${X(x)}" y2="${Y(yf)}" style="stroke:var(--bad);stroke-width:2.4"/>`}).join('');
   svg.innerHTML=`<line x1="40" y1="200" x2="330" y2="200" style="stroke:var(--ink)"/><line x1="40" y1="200" x2="40" y2="10" style="stroke:var(--ink)"/>
    ${[1,2,3].map(x=>`<text x="${X(x)}" y="214" text-anchor="middle" class="small2">${x}</text>`).join('')}${[2,4,6,8].map(y=>`<text x="34" y="${Y(y)+4}" text-anchor="end" class="small2">${y}</text>`).join('')}
    <line x1="${X(0)}" y1="${Y(b)}" x2="${X(3.6)}" y2="${Y(a*3.6+b)}" style="stroke:var(--accent);stroke-width:2.4"/>${segs}
    ${P.map(([x,y])=>`<circle cx="${X(x)}" cy="${Y(y)}" r="6" style="fill:var(--ink)"/>`).join('')}`;
   q('[data-o]').innerHTML=`y = ${a.toFixed(2)}x + ${b.toFixed(2)}<br>오차 제곱합 Σe² = <b>${sse.toFixed(3)}</b>${sse<0.1675?' ✓ 최소':''}`};
  q('[data-a]').oninput=e=>{a=+e.target.value;draw()};q('[data-b]').oninput=e=>{b=+e.target.value;draw()};
  q('[data-best]').onclick=()=>{a=1.5;b=8/3;q('[data-a]').value=a;q('[data-b]').value=b;draw()};draw();return null};

const W_STAT='통계 모드: [MODE] [3](STAT) [2](A+BX) → x, y 입력 → [AC] → [SHIFT] [1](STAT) [5](Reg)';
Object.assign(GEN,{
 sensAvg(base){let x1,x2,k;if(base){k=2;x1=2;x2=4}else{k=pick([1,2,3,0.5]);x1=pick([1,2,3]);x2=x1+pick([1,2,3])}const y1=k*x1*x1,y2=k*x2*x2,Sa=(y2-y1)/(x2-x1),xi=x2;
  return {kind:base?'기본':'유사',title:'평균 감도와 순간 감도',
   q:`비선형 센서의 출력이 Y = ${k}X² 이다. (1) X = ${x1} ~ ${x2} 구간의 평균 감도, (2) X = ${xi}에서의 순간 감도를 구하라.`,
   first:['평균 = ΔY/ΔX','순간 = 접선 기울기 dY/dX = 2kX'],
   steps:[{h:'두 점의 Y',b:`<div class="ln">X = ${x1} → Y = ${k} × ${x1}² = ${y1}</div><div class="ln">X = ${x2} → Y = ${k} × ${x2}² = ${y2}</div>`},
    {h:'평균 감도',b:`<div class="ln">S = (${y2} − ${y1}) ÷ (${x2} − ${x1}) = ${fx(Sa,4)}</div><div class="rd">두 점을 이은 직선의 기울기</div>`},
    {h:'순간 감도',b:`<div class="ln">dY/dX = 2 × ${k} × X = ${2*k}X</div><div class="ln">X = ${xi} → ${fx(2*k*xi,4)}</div><div class="rd">X²을 미분하면 2X (그 점에서 접선의 기울기)</div>`},
    {h:'검산',b:`<div class="rd">곡선이 위로 휘니까 오른쪽 끝의 순간 감도(${fx(2*k*xi,4)})가 평균(${fx(Sa,4)})보다 큼 ✓</div>`}],
   ans:`평균 ${fx(Sa,4)} · 순간 ${fx(2*k*xi,4)}`,ansRead:`평균 감도 ${fxR(Sa,4)}`,
   calc:calcBlock([[['(',...ks(y2),'−',...ks(y1),')','÷','(',...ks(x2),'−',...ks(x1),')','='],casioDec(Sa),'평균 감도']],['분자·분모를 각각 괄호로']),
   easy:'곡선은 곳마다 기울기가 달라요. 두 점 사이를 자로 이으면 평균, 한 점에 자를 딱 대면 순간 기울기예요.'}},
 resol(){const S=pick([0.5,1.2,2,5,8]),noise=pick([0.1,0.2,0.5,1,2]),unitOut=pick(['mV','μA']),inU=pick(['ppm','°C','kPa']);const R=noise/S,M=3*noise/S;
  return {kind:'응용',title:'분해능과 측정하한치',
   q:`감도가 ${S} ${unitOut}/${inU}인 센서의 출력 잡음(표준편차)이 ${noise} ${unitOut}이다. (1) 분해능 (2) [[mdl|측정하한치 MDL]]은?`,
   first:['분해능 = Noise ÷ S','MDL = 3σ ÷ S','답의 단위 = 입력 단위'],
   steps:[{h:'단위부터 보기',b:`<div class="ln">${unitOut} ÷ (${unitOut}/${inU}) = ${inU}</div><div class="rd">출력 단위끼리 지워지고 입력 단위(${inU})가 남아요</div>`},
    {h:'분해능',b:`<div class="ln">${noise} ÷ ${S} = ${fx(R,3)} ${inU}</div>`},
    {h:'MDL',b:`<div class="ln">3 × ${noise} ÷ ${S} = ${fx(M,3)} ${inU}</div><div class="rd">잡음의 3배는 넘어야 "진짜 신호"로 인정</div>`},
    {h:'검산',b:`<div class="rd">MDL = 분해능 × 3 ✓ · 감도가 클수록, 잡음이 작을수록 더 작은 값까지 잼</div>`}],
   ans:`분해능 ${fx(R,3)} ${inU} · MDL ${fx(M,3)} ${inU}`,ansRead:`${fxR(M)} ${inU}`,
   calc:calcBlock([[[...ks(noise),'÷',...ks(S),'='],casioDec(R),'분해능'],[['×','3','='],casioDec(M),'MDL']],['분수로 나오면 [S⇔D]']),
   easy:'잡음이 0.5만큼 늘 흔들리면, 그보다 작은 변화는 잡음에 묻혀 안 보여요. 확실히 보려면 잡음의 3배는 돼야 해요.'}},
 accur(base){const xt=base?10:pick([5,10,20,50,100]),dev=base?0.5:pick([0.2,0.4,0.5,1,1.5,2])*(Math.random()<.5?1:-1)*xt/10;const xm=+(xt+dev).toFixed(2),er=Math.abs(xm-xt)/xt*100;
  return {kind:base?'기본':'유사',title:'오차율과 정확도',
   q:`${xt} ppm 가스를 넣었는데 센서가 ${xm} ppm을 표시했다(교정 곡선 = 참값). 오차율과 정확도는?`,
   first:['오차율 = |xₘ − xₜ| ÷ xₜ × 100','정확도 = 100 − 오차율'],
   steps:[{h:'참값과 측정값 구분',b:`<div class="ln">xₜ(참값) = ${xt} ppm · xₘ(측정값) = ${xm} ppm</div>`},
    {h:'차이',b:`<div class="ln">|${xm} − ${xt}| = ${fx(Math.abs(xm-xt),3)} ppm</div>`},
    {h:'오차율',b:`<div class="ln">${fx(Math.abs(xm-xt),3)} ÷ ${xt} × 100 = ${fx(er,3)} %</div><div class="rd">⚠ 나누는 값은 참값 xₜ</div>`},
    {h:'정확도',b:`<div class="ln">100 − ${fx(er,3)} = ${fx(100-er,4)} %</div>`}],
   ans:`오차율 ${fx(er,3)} % · 정확도 ${fx(100-er,4)} %`,ansRead:`정확도 ${fxR(100-er,4)} 퍼센트`,
   calc:calcBlock([[['Abs','(',...ks(xm),'−',...ks(xt),')','÷',...ks(xt),'×','1','0','0','='],casioDec(er),'Abs = [SHIFT] [hyp] 또는 그냥 큰 값에서 작은 값 빼기']],['절댓값 키가 헷갈리면 큰 수 − 작은 수로 계산']),
   easy:'10을 재야 하는데 10.5가 나오면 0.5만큼(5 %) 틀린 거예요. 100점에서 5점 깎여 95점.'}},
 linear(){const FS=pick([100,200,500,1000]),dev=pick([0.5,1,1.2,2,3,4]);const L=dev/FS*100;const u=pick(['mV','kPa','ppm']);
  return {kind:'응용',title:'선형성 %FS',q:`정격 출력(풀 스케일)이 ${FS} ${u}인 센서에서 기준직선과의 최대 출력 편차가 ${dev} ${u}였다. 선형성은 몇 {{FSu}}인가?`,
   first:['선형성 = 최대 편차 ÷ 정격 × 100'],
   steps:[{h:'공식',b:`<div class="ln">선형성 = 최대 출력 편차 ÷ 정격 출력 × 100 [%FS]</div>`},{h:'계산',b:`<div class="ln">${dev} ÷ ${FS} × 100 = ${fx(L,3)} %FS</div><div class="rd">같은 단위(${u})끼리 나눠서 단위가 지워져요</div>`},{h:'해석',b:`<div class="rd">작을수록 직선에 가까움. R²(단위 없음)과 달리 %FS로 표시</div>`}],
   ans:`${fx(L,3)} %FS`,ansRead:`${fxR(L)} 퍼센트 풀스케일`,calc:calcBlock([[[...ks(dev),'÷',...ks(FS),'×','1','0','0','='],casioDec(L)]],[]),
   easy:'100 cm 자에서 1 cm 휘어 있으면 1 %FS예요.'}},
 t90(){const tau=pick([2,3,5,8,12,20]);const t=tau*Math.log(10);
  return {kind:'응용',title:'시정수로 응답시간 구하기 [AI 보충]',q:`센서 응답이 y = 1 − e^(−t/τ) 모양이고 시정수 τ = ${tau} {{s}}이다. 응답시간 t₉₀(90 % 도달)은?`,
   first:['0.9 = 1 − e^(−t/τ)','t₉₀ = τ × ln 10 ≈ 2.303τ'],
   steps:[{h:'90 % 조건',b:`<div class="ln">0.9 = 1 − e^(−t/τ) → e^(−t/τ) = 0.1</div>`},{h:'ln 씌우기',b:`<div class="ln">−t/τ = ln 0.1 = −2.303 → t = 2.303 τ</div><div class="rd">ln(자연로그)은 e의 지수를 꺼내는 도구</div>`},
    {h:'계산',b:`<div class="ln">t₉₀ = 2.303 × ${tau} = ${fx(t,4)} s</div>`},{h:'검산',b:`<div class="rd">τ에서는 63 %, 2.3τ에서 90 % ✓</div>`}],
   ans:`t₉₀ ≈ ${fx(t,4)} s`,ansRead:`${fxR(t,4)} 초`,calc:calcBlock([[[...ks(tau),'×','ln','1','0',')','='],casioDec(t),'ln 키 사용']],['[ln]은 자연로그, [log]는 상용로그(밑 10) — 다른 키']),
   easy:'시정수 τ 하나만 알면 90 %까지 걸리는 시간은 τ의 약 2.3배예요.'}},
 adc(){const n=pick([8,10,12,16]),Vr=pick([3.3,5]),Vin=+(Vr*pick([0.13,0.25,0.4,0.62,0.87])).toFixed(2);const L=Vr/2**n,code=Math.floor(Vin/L);
  return {kind:'응용',title:'ADC 한 칸 크기 [AI 보충]',q:`기준전압 ${Vr} {{V}}, ${n}{{bit}} ADC가 있다. (1) 한 칸(LSB)은 몇 {{mV}}? (2) 입력 ${Vin} V는 몇 번째 칸(코드)으로 읽히나?`,
   first:['칸 수 = 2ⁿ','LSB = Vref ÷ 2ⁿ','V → mV: × 1000'],
   steps:[{h:'칸 수',b:`<div class="ln">2^${n} = ${2**n}</div>`},{h:'한 칸 크기',b:`<div class="ln">${Vr} ÷ ${2**n} = ${sciT(sci(L,3))} V = ${fx(L*1000,4)} mV</div>`},
    {h:'코드',b:`<div class="ln">${Vin} ÷ ${sciT(sci(L,3))} = ${fx(Vin/L,5)} → 소수 버림 → ${code}</div>`},{h:'검산',b:`<div class="rd">비트가 1 늘면 칸이 절반 → 더 세밀 ✓</div>`}],
   ans:`LSB ≈ ${fx(L*1000,4)} mV · 코드 ${code}`,ansRead:`${fxR(L*1000,4)} 밀리볼트`,
   calc:calcBlock([[[...ks(Vr),'÷','2','x■',...ks(n),'▶','='],casioDec(L),'V'],[['×','1','0','0','0','='],casioDec(L*1000),'mV']],['[x■]로 지수를 넣고 [▶]로 나오기']),
   easy:`${Vr} V 자를 ${2**n}칸으로 나눈 것 중 한 칸의 크기예요.`}},
 lsq(base){let P;if(base)P=[[1,4],[2,6],[3,7]];else{for(;;){const x0=pick([1,2,3]),dx=pick([1,2]),a=pick([1,1.5,2,2.5,3]),b=pick([0,1,2,3,5]);P=[0,1,2].map(i=>{const x=x0+dx*i;return [x,+(a*x+b+pick([-1,-0.5,0,0.5,1])).toFixed(1)]});const xs=P.map(p=>p[0]);if(new Set(P.map(p=>p[1])).size===3)break}}
  const N=P.length,sx=P.reduce((s,p)=>s+p[0],0),sy=+P.reduce((s,p)=>s+p[1],0).toFixed(4),sxx=P.reduce((s,p)=>s+p[0]**2,0),sxy=+P.reduce((s,p)=>s+p[0]*p[1],0).toFixed(4);
  const det=N*sxx-sx*sx,a=(N*sxy-sx*sy)/det,b=(sxx*sy-sx*sxy)/det,yb=sy/N,res=P.reduce((s,p)=>s+(p[1]-a*p[0]-b)**2,0),tot=P.reduce((s,p)=>s+(p[1]-yb)**2,0),R2=1-res/tot;
  const mx=r=>`<span class="mx2">${r.map(row=>`<span>${row.join('&nbsp;&nbsp;')}</span>`).join('')}</span>`;
  return {kind:base?'기본':'유사',title:'최소자승법 — 행렬로 a, b 구하기',fig:FIG.pLsq(P),
   q:`센서 측정값 ${P.map(p=>`(${p[0]}, ${p[1]})`).join(', ')}에 대해 [[lsq|최소자승법]]으로 y = ax + b를 구하고 R²를 구하라.`,
   first:['Xp = y','p = (XᵀX)⁻¹Xᵀy','XᵀX = [[Σx², Σx],[Σx, N]]'],
   steps:[{h:'행렬로 쓰기',b:`<div class="ln">X = ${mx(P.map(p=>[p[0],1]))}  p = ${mx([['a'],['b']])}  y = ${mx(P.map(p=>[p[1]]))}</div>`},
    {h:'합 구하기',b:`<div class="ln">Σx = ${sx}, Σy = ${sy}, Σx² = ${sxx}, Σxy = ${sxy}, N = ${N}</div>`},
    {h:'XᵀX 와 Xᵀy',b:`<div class="ln">XᵀX = ${mx([[sxx,sx],[sx,N]])}  Xᵀy = ${mx([[sxy],[sy]])}</div>`},
    {h:'역행렬',b:`<div class="ln">det = ${sxx}×${N} − ${sx}×${sx} = ${det}</div><div class="ln">(XᵀX)⁻¹ = (1/${det}) × ${mx([[N,-sx],[-sx,sxx]])}</div><div class="rd">2×2 역행렬: 대각선 자리 바꾸고, 나머지 부호 바꾸고, det로 나누기</div>`},
    {h:'p 계산',b:`<div class="ln">a = (${N}×${sxy} − ${sx}×${sy}) ÷ ${det} = ${fx(a,4)}</div><div class="ln">b = (${sxx}×${sy} − ${sx}×${sxy}) ÷ ${det} = ${fx(b,4)}</div>`},
    {h:'R²',b:`<div class="ln">ȳ = ${fx(yb,4)} · Σ(y−ŷ)² = ${fx(res,4)} · Σ(y−ȳ)² = ${fx(tot,4)}</div><div class="ln">R² = 1 − ${fx(res,4)} ÷ ${fx(tot,4)} = ${R2.toFixed(4)}</div>`}],
   ans:`y = ${fx(a,4)}x ${b<0?'−':'+'} ${fx(Math.abs(b),4)} · 감도 ${fx(a,4)} · R² = ${R2.toFixed(4)}`,ansRead:`기울기 ${fxR(a,4)}`,
   calc:calcBlock([[['MODE','3','2'],'STAT A+BX','통계 모드'],[[...P.flatMap(p=>[...ks(p[0]),'='])],'x 열 입력'],[['▶','▲','▲'],'y 열 맨 위로','커서 이동'],[[...P.flatMap(p=>[...ks(p[1]),'='])],'y 열 입력'],[['AC','SHIFT','1','5','1','='],casioDec(b),'A = 절편 b !'],[['AC','SHIFT','1','5','2','='],casioDec(a),'B = 기울기 a !'],[['AC','SHIFT','1','5','3','x²','='],R2.toFixed(9).replace(/0+$/,''),'r² = R²']],[W_STAT,'⚠ 카시오의 A+BX에서 A는 절편, B는 기울기 — 강의의 a, b와 이름이 반대!']),
   easy:'세 점 사이로 자를 놓되, 점마다 자까지의 세로 거리를 제곱해서 더한 값이 가장 작게 놓는 거예요.'}}
});
Object.assign(FIG,{pLsq(P){const xs=P.map(p=>p[0]),ys=P.map(p=>p[1]);const x1=Math.min(...xs)-1,x2=Math.max(...xs)+1,y1=0,y2=Math.max(...ys)+2;const X=x=>40+(x-x1)/(x2-x1)*280,Y=y=>140-(y-y1)/(y2-y1)*120;
  return svgFig(340,160,`<line x1="40" y1="140" x2="326" y2="140" style="stroke:var(--ink)"/><line x1="40" y1="140" x2="40" y2="12" style="stroke:var(--ink)"/>${P.map(([x,y])=>`<circle cx="${X(x).toFixed(1)}" cy="${Y(y).toFixed(1)}" r="5" style="fill:var(--ink)"/><text x="${X(x).toFixed(1)}" y="${(Y(y)-9).toFixed(1)}" text-anchor="middle" class="small2">(${x}, ${y})</text>`).join('')}${tx(320,156,'x','small2','end')}${tx(46,14,'y','small2')}`,'측정점 그림')}});

  src:'【입력신호의 미소 변화에 대한 출력신호의 미소 변화의 비율】 【Calibration plot에서 기울기(S)는 감도이다】'},
 {k:'드리프트',h:'감도 변동 (드리프트)',b:`<p>[[drift]]: 시간·환경에 따라 교정 곡선의 <b>기울기가 변하는</b> 현상 → 신뢰성 저하</p>
   <div class="f4"><div><div class="h">원인</div><ul class="clean"><li>감지 물질: 상변화, 피독(poison gas) 흡착, 산화, 부식, 노화</li><li>회로: 증폭기·ADC·기준전압의 장기 열화</li><li>패키지: 열팽창, 응력</li></ul></div><div><div class="h">해결</div>정기적인 <b>재교정(re-calibration)</b>으로 현재 감도를 다시 재고 교정 곡선을 갱신</div></div>`,
  easy:'오래 쓴 체중계가 조금씩 틀어지듯, 센서도 늙어요. 그래서 가끔 다시 맞춰 줘야 해요.',
  src:'【Sensitivity Drift는 정기적인 Re-calibration을 통해 센서의 현재 감도 특성을 재평가】'},
 {k:'분해능·MDL',h:'분해능과 측정하한치',b:`<div class="f4"><div><div class="h">[[resolution]]</div><div class="ln">분해능 = Noise ÷ Sensitivity</div><div class="rd">단위 = 입력 단위 · 예: 0.01 °C까지 구분하면 분해능 0.01 °C</div></div>
    <div><div class="h">[[mdl]]</div><div class="ln">MDL = 3σ ÷ S</div><div class="rd">입력이 없을 때 출력 잡음 표준편차 σ의 3배 · 예: 가스센서 1 ppb</div></div></div>

  easy:'잡음이 늘 조금씩 흔들리면 그보다 작은 변화는 묻혀서 안 보여요. 확실히 "있다"고 하려면 잡음의 3배는 넘어야 해요.',
  src:'【분해능 = Noise/Sensitivity → 분해능의 단위는 input(입력량)의 단위를 갖는다】 【노이즈 크기의 약 3배 정도에 해당하는 출력값을 detection limit으로 정의】'},
 {k:'선형성·R²',h:'선형성 %FS vs 결정계수 R²',b:`<div class="tblwrap"><table><tr><th></th><th>[[linearity|선형성]]</th><th>[[r2|R²]]</th></tr><tr><td>기준</td><td>이상적 기준직선(참값 관계)</td><td>데이터로 구한 회귀직선</td></tr><tr><td>계산</td><td>최대 편차 ÷ 정격 × 100</td><td>1 − Σ(y−ŷ)² ÷ Σ(y−ȳ)²</td></tr><tr><td>단위</td><td>%FS</td><td>없음 (0~1)</td></tr><tr><td>좋은 값</td><td>작을수록</td><td>1에 가까울수록 (0.999↑ 매우 우수)</td></tr></table></div>`,
  easy:'선형성은 "정답 직선에서 얼마나 벗어났나", R²는 "점들이 내가 그은 직선에 얼마나 잘 붙어 있나"예요.',
  src:'【선형성 = 최대출력편차 / 정격출력 × 100 %】 【R² → 회귀직선이 Y의 변동을 얼마나 잘 설명하는지를 나타내는 값】'},
 {k:'정확도',h:'정확도·정밀도·반복성',b:`<div class="eqn">오차율 = |xₘ − xₜ| ÷ xₜ × 100<small>정확도 [%] = 100 − 오차율</small></div>

   ${FIG.accPrec()}
   <p>[[repeat|반복성]]: 같은 조건 단기간 반복 (예: 평균 ±3 % 이내) · 재현성: 장기간·다른 사람·다른 실험실 (예: ±3.7 %)</p>
   <p class="small">참값은 상업용 최고 센서나 GC(가스 크로마토그래피)로 얻은 신뢰할 수 있는 기준값을 써요.</p>`,
  easy:'정확도는 과녁 한가운데에 맞힌 정도, 정밀도는 화살끼리 모인 정도예요.',
  src:'【정확도 [%] = 100 – 오차율】 【10ppm 가스농도 인가 시 센서가 10.5ppm … 정확도: 95%】'},
 {k:'응답시간',h:'응답시간·회복시간·주파수 특성',b:`${FIG.respCurve()}
   <ul class="clean"><li>[[response|응답시간]] = 포화값의 <b>90 %</b>에 도달하는 시간</li><li>주파수 특성: 구동 주파수에 따라 출력이 달라짐 → 절대 변화량이 아니라 <b>초기값 대비 % 변화</b>로 비교 (A/cm², C/cm²로 쓰는 것도 같은 이유)</li><li>[[hysteresis|히스테리시스]]: 올라갈 때와 내려갈 때 출력이 다름 [AI 보충]</li></ul>`,
  easy:'불을 켜도 방이 바로 환해지지 않듯, 센서도 반응하는 데 시간이 걸려요. 90 %까지 온 시간을 응답시간이라고 해요.',
  src:'【Saturation 값의 90%에 도달하는 시간을 응답시간(response time)으로 정의】 【초기값에 대한 상대적인 변화량(%)으로 비교해야 한다】'},
 {k:'문제',h:'',b:'__PROBS__'},
 {k:'기출·숙제',h:'',b:'__MT:t3__'},
 {k:'외울 것',h:'이것만은 외우기',b:`<ol class="clean"><li>감도 = Δy/Δx (교정 곡선 기울기)</li><li>분해능 = Noise/S, MDL = 3σ/S (단위 = 입력 단위)</li><li>정확도 = 100 − |xₘ−xₜ|/xₜ×100 · 응답시간 = 90 % 도달 시간</li></ol>

PAGES.calib={title:'오차와 보정 — 최소자승',part:'제1편 3장',secs:[
 {k:'교정',h:'교정과 교정 곡선',b:`<p>[[calibration]]: 알고 있는 입력을 넣어 입력-출력 관계를 세우는 일. 그 결과가 <b>교정 곡선</b> y = ax + b.</p>
   <div class="key">점을 여러 개 잡아 오차가 가장 작은 직선(best-fit)을 [[lsq|최소자승법]]으로 구해요. 기울기 a가 감도.</div>`,
  easy:'새 저울에 1 kg, 2 kg, 3 kg 추를 올려 보고 눈금이 어떻게 나오는지 직선으로 정리하는 거예요.',
  src:'【일반적으로 최소자승법(least squares method)을 이용하여 오차가 가장 적은 일직선(best fit straight line)을 구한다】'},
 {k:'원리',h:'최소자승 — 직접 맞춰 보기',b:`<div data-anim="lsq"></div>
   <div class="eqn">Σ eᵢ² = Σ (yᵢ − (axᵢ + b))² → 최소<small>오차의 제곱을 모두 더한 값이 가장 작은 a, b</small></div>`,
  easy:'오차를 그냥 더하면 +와 −가 지워져서 제곱해서 더해요.'},
 {k:'행렬 풀이',h:'행렬방정식으로 a, b 구하기',b:`<div class="f4"><div><div class="h">① 식을 행렬로</div><div class="ln">axᵢ + b = yᵢ (식 N개, 미지수 2개)</div><div class="ln">X·p = y,  X = [xᵢ 1],  p = [a; b]</div></div>
    <div><div class="h">② 양쪽에 Xᵀ 곱하기</div><div class="ln">XᵀX·p = Xᵀy</div><div class="ln">XᵀX = [[Σx², Σx],[Σx, N]],  Xᵀy = [[Σxy],[Σy]]</div></div>
    <div><div class="h">③ 역행렬</div><div class="ln">p = (XᵀX)⁻¹Xᵀy,  det = NΣx² − (Σx)²</div><div class="ln">a = (NΣxy − ΣxΣy)/det,  b = (Σx²Σy − ΣxΣxy)/det</div></div>
    <div><div class="h">예: (1,4), (2,6), (3,7)</div><div class="ln">Σx=6, Σy=17, Σx²=14, Σxy=37, N=3, det=6</div><div class="ln">a = (111 − 102)/6 = 1.5,  b = (238 − 222)/6 = 2.667</div></div></div>`,
  easy:'식이 3개인데 모르는 게 2개라 딱 맞는 답이 없어요. 그래서 "가장 덜 틀리는" 답을 행렬 공식으로 구해요.',
  src:'【Xp = y → XᵀXp = Xᵀy → p = (XᵀX)⁻¹Xᵀy】 【((xi, yi) = (1,4), (2,6), (3,7))】'},
 {k:'계산기',h:'계산기 통계 모드로 바로 구하기',b:`${calcBlock([[['MODE','3','2'],'STAT · A+BX','통계 모드, 직선'],[['1','=','2','=','3','='],'x 열'],[['▶','▲','▲'],'y 열 맨 위'],[['4','=','6','=','7','='],'y 열'],[['AC','SHIFT','1','5','1','='],'2.666666667','A = 절편 b'],[['AC','SHIFT','1','5','2','='],'1.5','B = 기울기 a'],[['AC','SHIFT','1','5','3','='],'0.9819805061','r (상관계수) → x²하면 R²']],[W_STAT,'⚠ 카시오 A+BX의 A = 절편, B = 기울기 (강의 y = ax + b와 글자가 반대)','시험에서는 행렬 풀이 과정을 쓰고, 계산기로 답만 확인'])}`,
  easy:'계산기에 점만 넣으면 기울기와 절편을 바로 알려줘요. 다만 이름(A, B)이 반대라 조심!'},
 {k:'문제',h:'',b:'__PROBS__'},
 {k:'기출·숙제',h:'',b:'__MT:t1__'}
]};

ANIM.strainG=host=>{let e=0;
  host.innerHTML=`<figure class="figs"><svg viewBox="0 0 340 190" role="img" aria-label="스트레인 게이지"></svg><div class="figctl"><label class="small">당기기 ε <input type="range" min="-1000" max="2000" step="50" value="0" data-e style="width:160px"> <b data-ev>0 με</b></label></div>
   <div class="tofcalc mono small" data-o></div><figcaption>당기면(+) 금속선이 길고 가늘어져 R↑, 누르면(−) 짧고 굵어져 R↓. 실제 변화는 아주 작아 그림은 과장했어요.</figcaption></figure>`;
  const svg=host.querySelector('svg'),q=s=>host.querySelector(s);
  const draw=()=>{const k=e/2000*0.18;const W=220*(1+k),H=60*(1-k*0.4),x0=170-W/2;let g='';const n=7;for(let i=0;i<n;i++){const y=70+i*(H/(n-1))-H/2+30;g+=(i?'L':'M')+(x0+10)+' '+y+' L'+(x0+W-10)+' '+y}
   const R=120*(1+2*e*1e-6);
   svg.innerHTML=`<rect x="${x0-20}" y="40" width="${W+40}" height="${H+20}" rx="4" style="fill:var(--surface2);stroke:var(--line)"/><path d="${g}" style="fill:none;stroke:var(--warn);stroke-width:${2.4*(1-k*0.6)}"/>
    ${e!==0?ar(x0-24,80,x0-60*(e>0?1:-0.3)-24,80,'b',2)+ar(x0+W+24,80,x0+W+24+60*(e>0?1:-0.3),80,'b',2):''}${tx(170,150,e>0?'인장 → 길이↑ 단면↓ → R↑':e<0?'압축 → 길이↓ 단면↑ → R↓':'변형 없음','b2','middle')}${tx(170,176,'게이지 R₀ = 120 Ω, GF = 2','small2','middle')}`;
   q('[data-o]').innerHTML=`ΔR/R = GF·ε = 2 × ${e}×10⁻⁶ = ${(2*e*1e-6*100).toFixed(3)} % → R = <b>${R.toFixed(3)} Ω</b>`;q('[data-ev]').textContent=e+' με'};
  q('[data-e]').oninput=ev=>{e=+ev.target.value;draw()};draw();return null};

Object.assign(FIG,{
 resKinds(){const r=[['스트레인 게이지','변형'],['RTD·서미스터','온도'],['포토레지스터','빛'],['반도체 가스','가스'],['습도센서','습도'],['포텐셔미터','위치']];
  return svgFig(340,170,r.map((x,i)=>{const cx=i%2?250:90,cy=24+Math.floor(i/2)*50;return `<rect x="${cx-78}" y="${cy-14}" width="156" height="36" rx="8" style="fill:var(--surface);stroke:var(--line)"/>${tx(cx,cy+2,x[0],'b2','middle')}${tx(cx,cy+17,x[1]+' → R 변화','small2','middle')}`}).join(''),'저항형 센서 가족','측정량은 달라도 결과는 모두 "저항 변화". 그래서 읽는 회로(분배·브리지)는 같아요.')},
 loadcell(){return svgFig(340,160,`<rect x="20" y="40" width="40" height="80" style="fill:var(--muted)"/><rect x="60" y="66" width="220" height="28" style="fill:var(--surface2);stroke:var(--ink)"/>${ar(270,30,270,62,'b',2.4)}${tx(276,40,'F','b b2')}
   <rect x="110" y="58" width="40" height="8" style="fill:var(--warn)"/>${tx(130,52,'R₁ 인장(위)','small2','middle')}<rect x="110" y="94" width="40" height="8" style="fill:var(--unit)"/>${tx(130,118,'R₂ 압축(아래)','small2','middle')}
   ${tx(190,146,'위 +ε · 아래 −ε → 하프 브리지 (출력 2배)','small2','middle')}`,'외팔보 로드셀','보의 윗면과 아랫면에 게이지를 붙이면 반대 부호로 변해 브리지 출력이 커지고, 온도 영향은 같이 변해서 상쇄돼요. [AI 보충]')}
});

Object.assign(GEN,{
 strainR(base){const GF=base?2:pick([2,2.1,2.05]),R=base?120:pick([120,350,1000]),ue=base?500:pick([200,500,1000,1500,-400]);const dR=R*GF*ue*1e-6;
  return {kind:base?'기본':'유사',title:'변형률 → 저항 변화',q:`R₀ = ${R} {{ohm}}, GF = ${GF}인 스트레인 게이지에 ${ue} {{ue}}의 변형이 생겼다. ΔR과 변한 저항은?`,first:['με → × 10⁻⁶','ΔR = R·GF·ε'],
   steps:[{h:'단위',b:`<div class="ln">ε = ${ue} με = ${ue} × 10⁻⁶</div>`},{h:'저항 변화율',b:`<div class="ln">ΔR/R = ${GF} × ${ue}×10⁻⁶ = ${sciT(sci(GF*ue*1e-6))} (${fx(GF*ue*1e-4,4)} %)</div>`},{h:'ΔR',b:`<div class="ln">ΔR = ${R} × ${sciT(sci(GF*ue*1e-6))} = ${fx(dR,4)} Ω → R = ${fx(R+dR,6)} Ω</div><div class="rd">0.1 % 수준의 아주 작은 변화 → 브리지·증폭 필요</div>`}],
   ans:`ΔR = ${fx(dR,4)} Ω (R = ${fx(R+dR,6)} Ω)`,ansRead:`${fxR(dR,4)} 옴`,calc:calcBlock([[[...ks(R),'×',...ks(GF),'×',...K(Math.abs(ue),-6),'='],casioDec(Math.abs(dR)),ue<0?'부호 − (압축)':'']],[W_NEG]),
   easy:'1000 με에 GF 2면 저항이 0.2 % 변해요. 아주 작아서 그대로는 잘 안 보여요.'}},
 strainV(base){const V=base?5:pick([2.5,5,10]),GF=2,ue=base?1000:pick([100,250,500,1000,2000]);const cfg=base?1:pick([1,2,4]);const Vo=V*GF*ue*1e-6/4*cfg;
  return {kind:base?'기본':'응용',title:'스트레인 브리지 출력',fig:cfg===2?FIG.loadcell():FIG.wheat(),q:`V_in = ${V} V, GF = 2, 변형 ${ue} με. 게이지 ${cfg}개를 쓴 ${cfg===1?'1/4':cfg===2?'하프':'풀'} 브리지의 출력은 대략 몇 mV인가?`,first:['1/4: V·GF·ε/4','하프: ×2 · 풀: ×4 (게이지 수에 비례)'],
   steps:[{h:'1/4 브리지 기본',b:`<div class="ln">V·GF·ε/4 = ${V} × 2 × ${ue}×10⁻⁶ ÷ 4 = ${fx(V*GF*ue*1e-6/4*1e3,4)} mV</div>`},{h:'게이지 수',b:`<div class="ln">× ${cfg} = ${fx(Vo*1e3,4)} mV</div><div class="rd">하프·풀 브리지: 인장(+ε)·압축(−ε) 게이지를 서로 더해지는 자리에 배치 · 온도 영향 상쇄</div>`},{h:'감도로',b:`<div class="ln">${fx(Vo*1e3/V,4)} mV/V (공급 1 V당)</div>`}],
   ans:`약 ${fx(Vo*1e3,4)} mV`,ansRead:`${fxR(Vo*1e3,4)} 밀리볼트`,calc:calcBlock([[[...ks(V),'×','2','×',...K(ue,-6),'÷','4','×',...ks(cfg),'='],casioDec(Vo)]],[W_NEG]),
   easy:'게이지를 많이 붙여 서로 돕게 하면 출력이 2배, 4배로 커져요.'}},
 gfCalc(){const R=pick([120,350]),ue=pick([500,1000]),dR=+(R*pick([2,2.1,1.9,120])*ue*1e-6).toFixed(4);const GF=dR/R/(ue*1e-6);
  return {kind:'응용',title:'게이지율 구하기',q:`R₀ = ${R} Ω 게이지에 ${ue} με를 줬더니 ΔR = ${dR} Ω이었다. GF는? 금속형인가 반도체형인가?`,first:['GF = (ΔR/R)/ε'],
   steps:[{h:'ΔR/R',b:`<div class="ln">${dR} ÷ ${R} = ${sciT(sci(dR/R,4))}</div>`},{h:'÷ ε',b:`<div class="ln">${sciT(sci(dR/R,4))} ÷ ${ue}×10⁻⁶ = ${fx(GF,4)}</div><div class="rd">${GF>20?'GF 수십~수백 → 반도체(압저항)':'GF ≈ 2 → 금속박'}</div>`}],
   ans:`GF ≈ ${fx(GF,3)} (${GF>20?'반도체형':'금속형'})`,ansRead:`${fxR(GF,3)}`,calc:calcBlock([[[...ks(dR),'÷',...ks(R),'÷',...K(ue,-6),'='],casioDec(GF)]],[W_NEG]),easy:'같은 변형에 저항이 훨씬 크게 변하면 반도체 게이지예요.'}},
 potPos(base){const V=base?5:pick([3.3,5,10]),L=base?100:pick([50,100,300]),x=base?30:pick([12,25,40,75,200].filter(v=>v<L));const Vo=V*x/L;const back=!base&&Math.random()<.5;
  return {kind:base?'기본':'유사',title:'포텐셔미터 위치',q:back?`길이 ${L} mm 선형 포텐셔미터(V_in = ${V} V)의 출력이 ${fx(Vo,4)} V이다. 와이퍼 위치는?`:`길이 ${L} {{mm}} 선형 포텐셔미터에 ${V} V를 걸었다. 와이퍼가 ${x} mm에 있으면 출력은?`,first:['V_out = V_in·x/L'],
   steps:[{h:back?'거꾸로':'비례',b:back?`<div class="ln">x = L·V_out/V_in = ${L} × ${fx(Vo,4)} ÷ ${V} = ${fx(x,4)} mm</div>`:`<div class="ln">${V} × ${x}/${L} = ${fx(Vo,4)} V</div>`},{h:'주의',b:`<div class="rd">측정기 입력 저항이 작으면 부하 효과로 비선형 [AI 보충]</div>`}],
   ans:back?`${fx(x,4)} mm`:`${fx(Vo,4)} V`,ansRead:back?`${fxR(x,4)} 밀리미터`:`${fxR(Vo,4)} 볼트`,calc:calcBlock([[back?[...ks(L),'×',...ks(+Vo.toFixed(4)),'÷',...ks(V),'=']:[...ks(V),'×',...ks(x),'÷',...ks(L),'='],casioDec(back?x:Vo)]],[]),easy:'전체 길이 중 몇 %에 있나 = 전체 전압 중 몇 %가 나오나.'}},
 selfHeat(){const I=pick([0.5,1,2,5]),R=pick([100,1000]),th=pick([2,5,10]);const P=(I*1e-3)**2*R,dT=P*1e3/th;
  return {kind:'응용',title:'자기발열 오차',q:`${R} Ω 온도센서에 ${I} mA를 흘린다. 열 방산 상수가 ${th} mW/°C이면 자기발열로 생기는 온도 오차는?`,first:['P = I²R','ΔT = P ÷ 방산 상수'],
   steps:[{h:'전력',b:`<div class="ln">(${I}×10⁻³)² × ${R} = ${sciT(sci(P))} W = ${fx(P*1e3,4)} mW</div>`},{h:'온도 상승',b:`<div class="ln">${fx(P*1e3,4)} mW ÷ ${th} mW/°C = ${fx(dT,4)} °C</div><div class="rd">전류를 반으로 → 오차는 ¼ (I²)</div>`}],
   ans:`${fx(dT,4)} °C`,ansRead:`${fxR(dT,4)} 도`,calc:calcBlock([[['(',...K(I,-3),')','x²','×',...ks(R),'='],casioDec(P)],[['Ans','×',...K(1,3),'÷',...ks(th),'='],casioDec(dT)]],[W_NEG]),easy:'재려고 흘린 전기가 센서를 데워요. 전류가 작을수록 오차가 확 줄어요.'}}
});

Object.assign(TERM,{

 lenz:{ko:'렌츠 법칙',en:"Lenz's law",gen:'유도 전류는 변화를 방해하는 방향으로 흐른다.',tech:'패러데이 식의 − 부호. 자속이 늘면 줄이는 방향, 줄면 유지하는 방향의 자기장을 만들도록 전류가 흐른다. N극이 다가오면 코일 끝에 N극, 멀어지면 S극.',easy:'코일은 변화를 싫어하는 고집쟁이예요. 다가오면 밀고, 멀어지면 당겨요.'},
 eddy:{ko:'와전류',en:'Eddy current',gen:'금속 속에 소용돌이처럼 도는 전류.',tech:'변하는 자기장이 금속 내부에 유도하는 순환 전류. 원래 자기장 변화를 방해하는 2차 자기장을 만들고, 줄 가열로 손실(유효저항↑)을 만든다.',easy:'금속판에 생기는 작은 전기 소용돌이예요.'},

ANIM.faraday=host=>{let auto=true,pos=0;
  host.innerHTML=`<figure class="figs"><svg viewBox="0 0 340 210" role="img" aria-label="패러데이 유도"></svg><div class="figctl"><button class="tbtn" data-a aria-pressed="true">자동으로 움직이기</button><label class="small">자석 위치 <input type="range" min="0" max="1" step="0.01" value="0" data-p style="width:120px"></label></div>
   <div class="tofcalc small" data-o></div></figure>`;
  const svg=host.querySelector('svg'),q=s=>host.querySelector(s);let prev=0,emf=0;
  const L=loop(tp=>{if(auto){pos=0.5-0.5*Math.cos(tp*1.6);q('[data-p]').value=pos}const v=(pos-prev);prev=pos;emf+= (v*60-emf)*0.3;
    const mx=20+pos*120;const coil=[0,1,2,3,4,5].map(k=>`<ellipse cx="${200+k*14}" cy="80" rx="7" ry="34" style="fill:none;stroke:var(--warn);stroke-width:3"/>`).join('');
    const near=emf>0.05,away=emf<-0.05;
    const ang=Math.max(-1,Math.min(1,emf*1.5))*60*Math.PI/180;
    svg.innerHTML=`<rect x="${mx}" y="64" width="40" height="32" style="fill:var(--surface);stroke:var(--ink);stroke-width:1.6"/><rect x="${mx+40}" y="64" width="40" height="32" style="fill:var(--bad)"/>${tx(mx+20,85,'S','b2','middle')}${tx(mx+60,85,'N','b2','middle').replace('class="b2"','class="b2" style="fill:#fff"')}
     ${coil}${tx(196,40,'코일 끝','small2','middle')}${near?tx(196,128,'N극 생김 → 밀어냄','b b2','middle'):away?tx(196,128,'S극 생김 → 당김','u b2','middle'):tx(196,128,'변화 없음 → 0','m small2','middle')}
     <path d="M200 114 V170 H290 V114" style="fill:none;stroke:var(--ink);stroke-width:1.6"/><circle cx="245" cy="170" r="20" style="fill:var(--surface);stroke:var(--ink);stroke-width:1.6"/>
     <line x1="245" y1="174" x2="${(245+16*Math.sin(ang)).toFixed(1)}" y2="${(174-16*Math.cos(ang)).toFixed(1)}" style="stroke:var(--bad);stroke-width:2.4"/>${tx(245,204,'검류계','small2','middle')}`;
    q('[data-o]').innerHTML=`유도 기전력 e = −N·dΦ/dt ∝ <b>${Math.abs(emf).toFixed(2)}</b> ${near?'(다가옴: 자속 증가 → 막는 방향)':away?'(멀어짐: 자속 감소 → 유지하는 방향)':'(정지: 자속 일정 → 0)'}<br>빠르게 움직일수록 바늘이 크게 움직여요.`});
  q('[data-a]').onclick=e=>{auto=!auto;e.target.setAttribute('aria-pressed',String(auto));e.target.textContent=auto?'자동으로 움직이기':'손으로 움직이기'};q('[data-p]').oninput=e=>{auto=false;q('[data-a]').setAttribute('aria-pressed','false');q('[data-a]').textContent='손으로 움직이기';pos=+e.target.value};return L.stop};

ANIM.skin=host=>{const MET={Al:['알루미늄',2.65e-8],Cu:['구리',1.68e-8],Au:['금',2.44e-8],SS:['스테인리스(비자성)',7.2e-7]};let m='Al',f=135e3;
  host.innerHTML=`<figure class="figs"><svg viewBox="0 0 340 170" role="img" aria-label="표피 깊이"></svg><div class="figctl"><label class="small">금속 <select data-m style="width:auto;padding:4px 6px">${Object.entries(MET).map(([k,v])=>`<option value="${k}">${v[0]}</option>`).join('')}</select></label>
   <label class="small">주파수 <input type="range" min="3" max="7" step="0.05" value="${Math.log10(135e3)}" data-f style="width:120px"> <b data-fv></b></label></div><div class="tofcalc mono small" data-o></div>
   <figcaption>주파수를 올리면 자기장이 금속 속으로 <b>얕게</b>만 들어가요. 금속이 표피 깊이보다 얇으면 와전류가 충분히 안 생겨 검출이 어려워요. [AI 보충: Cu·Au·스테인리스 비저항 값]</figcaption></figure>`;
  const svg=host.querySelector('svg'),q=s=>host.querySelector(s);
  const draw=()=>{const rho=MET[m][1],mu=4*Math.PI*1e-7,d=Math.sqrt(rho/(Math.PI*f*mu));const mm=d*1000;const px=Math.min(220,Math.max(3,Math.log10(mm*1000)/Math.log10(5000)*220));
   let g='';for(let i=0;i<24;i++){const x=60+i*10;const a=Math.exp(-(i*10)/Math.max(3,px));g+=`<rect x="${x}" y="40" width="10" height="90" style="fill:var(--unit);opacity:${(a*0.85).toFixed(2)}"/>`}
   svg.innerHTML=`<rect x="60" y="40" width="240" height="90" style="fill:var(--surface2);stroke:var(--ink);stroke-width:1.4"/>${g}${ar(20,85,56,85,'i',2)}${tx(16,74,'교류 자기장','small2')}
    <line x1="${60+Math.min(240,px)}" y1="30" x2="${60+Math.min(240,px)}" y2="140" style="stroke:var(--bad);stroke-width:2;stroke-dasharray:4 3"/>${tx(60+Math.min(232,px),26,'δ','b b2','middle')}${tx(180,158,'금속 속 깊이 → (색이 진할수록 와전류 많음)','small2','middle')}`;
   q('[data-o]').innerHTML=`δ = √(ρ ÷ (π f μ₀)) = √(${sciT(sci(rho))} ÷ (π × ${sciT(sci(f,3))} × 4π×10⁻⁷)) = <b>${mm>=0.1?fx(mm,3)+' mm':fx(mm*1000,3)+' μm'}</b>`;q('[data-fv]').textContent=f>=1e6?fx(f/1e6,3)+' MHz':fx(f/1e3,3)+' kHz'};
  q('[data-m]').onchange=e=>{m=e.target.value;draw()};q('[data-f]').oninput=e=>{f=10**(+e.target.value);draw()};draw();return null};

Object.assign(GEN,{
 faradayE(){const N=pick([50,100,200,500]),B1=pick([0.01,0.02,0.05,0.1]),A=pick([1,2,4]),dtms=pick([2,5,10,20]);const dPhi=B1*A*1e-4,e=N*dPhi/(dtms*1e-3);
  return {kind:'유사',title:'유도 기전력 크기',q:`감은 수 N = ${N}회, 단면적 ${A} {{cm2}}인 코일을 지나는 자속밀도가 0에서 ${B1} {{T}}로 ${dtms} {{ms}} 동안 고르게 변했다. 유도 기전력의 크기는?`,
   first:['|e| = N·ΔΦ/Δt','Φ = B·A','cm² → m²: × 10⁻⁴'],
   steps:[{h:'단위 먼저',b:`<div class="ln">A = ${A} cm² = ${A} × 10⁻⁴ m² · Δt = ${dtms} ms = ${dtms} × 10⁻³ s</div><div class="rd">⚠ cm²는 10⁻⁴ (지수 2배)</div>`},{h:'자속 변화',b:`<div class="ln">ΔΦ = ΔB × A = ${B1} × ${A}×10⁻⁴ = ${sciT(sci(dPhi))} Wb</div>`},
    {h:'기전력',b:`<div class="ln">|e| = ${N} × ${sciT(sci(dPhi))} ÷ (${dtms}×10⁻³) = ${fx(e,3)} V</div>`},{h:'방향 (렌츠)',b:`<div class="rd">자속이 늘었으니 줄이는 방향의 자기장을 만들도록 전류가 흐름</div>`}],
   ans:`|e| ≈ ${fx(e,3)} V`,ansRead:`${fxR(e)} 볼트`,calc:calcBlock([[[...ks(N),'×',...ks(B1),'×',...K(A,-4),'÷',...K(dtms,-3),'='],casioDec(e)]],[W_NEG]),
   easy:'코일을 많이 감을수록, 자석이 셀수록, 빨리 변할수록 전압이 커져요.'}},
 lcF(){const L=pick([['100 μH',100e-6],['1 mH',1e-3],['470 μH',470e-6],['10 mH',10e-3]]),C=pick([['10 nF',10e-9],['100 nF',100e-9],['1 nF',1e-9],['470 pF',470e-12]]);const f=1/(2*Math.PI*Math.sqrt(L[1]*C[1]));
  return {kind:'유사',title:'LC 발진 주파수',q:`금속탐지기 발진기의 L = ${L[0]}, C = ${C[0]}이다. 공진 주파수는 몇 kHz인가?`,first:['f = 1/(2π√(LC))','μH·mH, nF·pF → H, F'],
   steps:[{h:'단위 먼저',b:`<div class="ln">L = ${sciT(sci(L[1]))} H · C = ${sciT(sci(C[1]))} F</div><div class="rd">μ = 10⁻⁶, m = 10⁻³, n = 10⁻⁹, p = 10⁻¹²</div>`},
    {h:'LC와 루트',b:`<div class="ln">LC = ${sciT(sci(L[1]*C[1]))} → √ = ${sciT(sci(Math.sqrt(L[1]*C[1])))} s</div>`},
    {h:'주파수',b:`<div class="ln">f = 1 ÷ (2π × ${sciT(sci(Math.sqrt(L[1]*C[1])))}) = ${fx(f,4)} Hz = ${fx(f/1e3,4)} kHz</div>`},{h:'검산',b:`<div class="rd">금속탐지기는 보통 수십~수백 kHz ✓</div>`}],
   ans:`f ≈ ${fx(f/1e3,4)} kHz`,ansRead:`${fxR(f/1e3,4)} 킬로헤르츠`,
   calc:calcBlock([[['1','÷','(','2','×','SHIFT','×10ˣ','×','√■',...K(+sci(L[1]).m,sci(L[1]).e),'×',...K(+sci(C[1]).m,sci(C[1]).e),'▶',')','='],casioDec(f),'Hz']],[W_PI,'√ 안에 L×C를 넣고 [▶] · 분모 전체 괄호']),
   easy:'코일이 크거나 콘덴서가 크면 그네가 느리게 흔들려서 주파수가 낮아져요.'}},
 skinD(base){const M=base?['알루미늄',2.65e-8]:pick([['알루미늄',2.65e-8],['구리',1.68e-8]]),f=base?135e3:pick([20e3,50e3,135e3,500e3,1e6]);const d=Math.sqrt(M[1]/(Math.PI*f*4*Math.PI*1e-7));
  return {kind:base?'기본':'유사',title:'검출 가능 최소 두께 (표피 깊이)',q:`${M[0]}(ρ = ${sciT(sci(M[1]))} {{ohmm}}, μ ≈ μ₀ = 4π × 10⁻⁷ {{Hm}})을 ${f>=1e6?fx(f/1e6,3)+' MHz':fx(f/1e3,4)+' kHz'}로 탐지할 때 표피 깊이 δ는?`,
   first:['δ = √(ρ/(π f μ))','μ는 투자율(H/m)','kHz → Hz'],
   steps:[{h:'단위',b:`<div class="ln">f = ${sciT(sci(f))} Hz · μ = 4π × 10⁻⁷ H/m</div><div class="rd">비투자율(단위 없음)이 아니라 투자율 μ = μᵣμ₀</div>`},
    {h:'분모',b:`<div class="ln">π × ${sciT(sci(f))} × 4π×10⁻⁷ = ${sciT(sci(Math.PI*f*4*Math.PI*1e-7,4))}</div>`},
    {h:'루트',b:`<div class="ln">δ = √(${sciT(sci(M[1]))} ÷ ${sciT(sci(Math.PI*f*4*Math.PI*1e-7,4))}) = ${sciT(sci(d))} m</div><div class="ln">= ${d>=1e-4?fx(d*1000,3)+' mm':fx(d*1e6,3)+' μm'}</div>`},
    {h:'해석',b:`<div class="rd">주파수를 낮추면 δ↑(더 깊이), 높이면 δ↓ · 강의 예: Al 135 kHz → 0.223 mm</div>`}],
   ans:`δ ≈ ${d>=1e-4?fx(d*1000,3)+' mm':fx(d*1e6,3)+' μm'}`,ansRead:`${d>=1e-4?fxR(d*1000)+' 밀리미터':fxR(d*1e6)+' 마이크로미터'}`,
   calc:calcBlock([[['√■',...K(+sci(M[1]).m,sci(M[1]).e),'÷','(','SHIFT','×10ˣ','×',...K(+sci(f).m,sci(f).e),'×','4','×','SHIFT','×10ˣ','×','1','×10ˣ','(−)','7',')','▶','='],casioDec(d),'m']],[W_PI,W_NEG,'√ 안 분모 전체를 괄호로']),
   easy:'흔들림이 빠를수록(주파수↑) 금속 겉만 살짝 건드려요. 그래서 얇은 금속은 높은 주파수로 찾아요.'}}
});

ANIM.hallfx=host=>{let type='n',Bdir=1,Bmag=1,acc=0;const N=26;const P=Array.from({length:N},(_,i)=>({x:Math.random(),y:0.15+Math.random()*0.7}));
  host.innerHTML=`<figure class="figs"><svg viewBox="0 0 340 235" role="img" aria-label="홀 효과"></svg>
   <div class="figctl"><button class="tbtn" data-ty="n" aria-pressed="true">n형 (전자)</button><button class="tbtn" data-ty="p" aria-pressed="false">p형 (정공)</button>
    <button class="tbtn" data-bd aria-pressed="false">B: +z (⊙)</button><label class="small">B 크기 <input type="range" min="0" max="2" step="0.1" value="1" data-bm style="width:90px"></label></div>
   <div class="tofcalc small" data-o></div></figure>`;
  const svg=host.querySelector('svg'),q=s=>host.querySelector(s);
  const L=loop(tp=>{const target=Bmag;acc+= (target-acc)*0.02;const side=-Bdir; // I(+x) × B(+z) = −y → 화면 아래(+y 화면) 쪽이 −y? 화면 위 = +y
    // 화면 좌표: 위 = +y. I×B 방향 = (Bdir>0 ? −y : +y) → 몰리는 면: Bdir>0 아래쪽, Bdir<0 위쪽
    const pileTop=Bdir<0;let s=`<rect x="40" y="50" width="260" height="120" style="fill:var(--surface2);stroke:var(--ink);stroke-width:1.8"/>
     ${tx(14,114,'+x →','small2')}${ar(14,124,36,124,'i',1.6)}${tx(170,40,'전류 I (+x 방향)','b2','middle')}`;
    for(let i=0;i<5;i++)for(let j=0;j<3;j++){const cx=70+i*50,cy=74+j*38;s+=Bdir>0?`<circle cx="${cx}" cy="${cy}" r="5" style="fill:none;stroke:var(--muted)"/><circle cx="${cx}" cy="${cy}" r="1.6" style="fill:var(--muted)"/>`:`<path d="M${cx-4} ${cy-4}L${cx+4} ${cy+4}M${cx+4} ${cy-4}L${cx-4} ${cy+4}" style="stroke:var(--muted);stroke-width:1.4"/>`}
    const nPile=Math.round(acc*7);const sign=type==='n'?'−':'+';const opp=type==='n'?'+':'−';
    for(let k=0;k<nPile;k++){const x=56+k*34;s+=`<text x="${x}" y="${pileTop?66:166}" class="b2" text-anchor="middle" style="fill:${type==='n'?'var(--unit)':'var(--bad)'}">${sign}</text><text x="${x}" y="${pileTop?166:66}" class="b2" text-anchor="middle" style="fill:var(--muted)">${opp}</text>`}
    P.forEach(p=>{const vx=(type==='n'?-1:1)*0.004;p.x+=vx;if(p.x<0)p.x=1;if(p.x>1)p.x=0;const drift=(acc>0.05?1:0)*(0.012*acc)*(pileTop?-1:1)*Math.max(0,1-acc*0.55);p.y=Math.min(0.88,Math.max(0.12,p.y+drift*0.2+(0.5-p.y)*0.004*acc));
      const X=40+p.x*260,Y=50+p.y*120;s+=type==='n'?`<circle cx="${X.toFixed(1)}" cy="${Y.toFixed(1)}" r="3.6" style="fill:var(--unit)"/>`:`<text x="${X.toFixed(1)}" y="${(Y+4).toFixed(1)}" class="b2" text-anchor="middle" style="fill:var(--bad)">+</text>`});
    const VH=acc*(type==='n'?1:-1)*(Bdir>0?1:-1);
    s+=`<line x1="320" y1="50" x2="320" y2="170" style="stroke:var(--ink)"/><circle cx="320" cy="110" r="14" style="fill:var(--surface);stroke:var(--ink);stroke-width:1.4"/>${tx(320,114,'V','b2','middle')}${tx(336,46,'+y면','small2','end')}${tx(336,186,'−y면','small2','end')}
     ${tx(170,200,`B = ${Bdir>0?'+z (종이 밖 ⊙)':'−z (종이 안 ⊗)'} · ${Bmag.toFixed(1)} 단위`,'small2','middle')}${tx(170,222,`V_H 크기 ∝ ${(Math.abs(VH)).toFixed(2)} (B에 비례)`,'b2','middle')}`;
    svg.innerHTML=s});
  const upd=()=>{const face=Bdir>0?'−y':'+y';q('[data-o]').innerHTML=`I(+x) × B(${Bdir>0?'+z':'−z'}) = <b>${face} 방향</b> → 캐리어가 ${face}면으로 몰림<br>${type==='n'?'n형: 전자(−)가 쌓여 '+face+'면이 (−), 반대면 (+)':'p형: 정공(+)이 쌓여 '+face+'면이 (+), 반대면 (−)'}<br>몰리는 면은 n·p 같고 <b>부호만 반대</b> → 극성으로 반도체 종류를 알 수 있어요. 쌓인 전하의 전기력 qE_H가 자기력 qvB와 같아지면 더 안 쌓여서 V_H가 일정해요.`;
   host.querySelectorAll('[data-ty]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.ty===type)));q('[data-bd]').textContent=Bdir>0?'B: +z (⊙)':'B: −z (⊗)';acc=0};
  host.querySelectorAll('[data-ty]').forEach(b=>b.onclick=()=>{type=b.dataset.ty;upd()});q('[data-bd]').onclick=()=>{Bdir=-Bdir;upd()};q('[data-bm]').oninput=e=>{Bmag=+e.target.value};upd();return L.stop};

 pdni:{ko:'팔라듐-니켈 합금',en:'Pd–Ni alloy',gen:'Pd에 니켈을 조금 섞은 것.',tech:'Ni 약 4~8 % 첨가로 격자 팽창·상전이를 억제 → 히스테리시스·기계적 손상 감소, 안정성·신뢰성 향상. 대신 감도는 감소할 수 있음.',easy:'잘 부풀어 금이 가던 Pd에 니켈을 섞어 덜 부풀게 만든 것.'},
 fourwire:{ko:'4선식 측정',en:'4-wire (Kelvin) measurement',gen:'전류선과 전압선을 따로 쓰는 측정.',tech:'정전류원으로 전류선에 I를 흘리고, 입력 임피던스가 매우 큰 전압계로 별도 전압선에서 센서 양단 V를 잰다. 전압선에는 전류가 거의 흐르지 않아 선 저항 전압강하가 없다. Rs = Vs/Is.',easy:'긴 전선 저항 때문에 틀리지 않도록, 전기를 보내는 줄과 재는 줄을 따로 쓰는 방법.'},
 bridge:{ko:'휘트스톤 브리지',en:'Wheatstone bridge',gen:'저항 4개로 아주 작은 저항 변화를 재는 회로.',tech:'두 전압 분배기의 중간점 전위차를 출력으로 하는 회로. 평형 조건 R₁R₃ = R₂R₄. 같은 재료의 기준 저항을 써서 온도에 의한 공통 변화를 상쇄하고 작은 ΔR을 차동 출력으로 바꾼다.',easy:'시소 양쪽에 같은 무게를 올려 두면, 한쪽에 아주 작은 무게만 더해도 기울어지는 것을 보는 회로.'},
 depletion:{ko:'공핍층',en:'Depletion layer',gen:'전자가 빠져 텅 빈 층.',tech:'n형 산화물 표면에 흡착한 산소가 전자를 포획해 생기는 전자 결핍 영역. 두꺼워지면 전위장벽↑, 저항↑.',easy:'전자가 지나가는 길 위에 생긴 "빈 땅". 넓어질수록 지나가기 어려워요.'},

 retention:{ko:'머무름 시간',en:'Retention time',gen:'컬럼을 빠져나오는 데 걸린 시간.',tech:'시료 주입부터 검출 피크까지의 시간. 고정상과 강하게 상호작용할수록 길다. 성분 식별에 사용.',easy:'결승선 도착 시간. 시간으로 누구인지 알아봐요.'},
 baseline:{ko:'기준선 드리프트',en:'Baseline drift',gen:'가스가 없을 때 값이 슬금슬금 변함.',tech:'기준 출력이 시간에 따라 점진적으로 변하는 현상. 원인: 온습도·압력, 오염·잔류가스·노화, 불완전 탈착, 전원·회로·ADC offset. 해결: 온습도 보상, 주기 교정, baseline 보정 알고리즘, aging.',easy:'아무것도 안 올린 저울 숫자가 조금씩 변하는 것.'},
 selectivity:{ko:'선택성',en:'Selectivity',gen:'원하는 가스에만 반응하나.',tech:'여러 가스 중 목표 가스에 선택적으로 반응하는 특성. 방해 가스와의 교차감응(cross-sensitivity) 평가. 향상: 감지물질 선택, 동작온도 최적화, 다공성 막·필터, 센서 어레이 + 패턴 인식.',easy:'여러 냄새 속에서 커피 냄새만 골라 맡는 능력.'},
 dga:{ko:'유중가스 분석',en:'DGA (Dissolved Gas Analysis)',gen:'변압기 기름 속 가스 검사.',tech:'변압기 절연유(미네랄오일)에 녹은 수소 등 가스를 분석해 내부 이상(방전·과열)을 진단.',easy:'변압기 기름에 수소가 생기면 속이 아프다는 신호예요.'}
});

ANIM.pdH=host=>{let ni=false,cnt=0,mols=[];
  host.innerHTML=`<figure class="figs"><svg viewBox="0 0 340 230" role="img" aria-label="Pd 수소 흡수"></svg>
   <div class="figctl"><button class="tbtn" data-ni aria-pressed="false">Pd–Ni 합금으로</button><button class="tbtn" data-rs>처음부터</button></div>
   <figcaption>H₂가 표면에 붙음 → <b>H 원자 2개로 해리</b> → Pd 격자 틈으로 확산 → PdHₓ → 격자가 늘어나고 <b>저항이 변해요</b>. Pd–Ni는 덜 늘어나서 금이 덜 가지만 변화(감도)도 작아요.</figcaption></figure>`;
  const svg=host.querySelector('svg');const q=s=>host.querySelector(s);
  const sites=[];for(let r=0;r<4;r++)for(let c=0;c<6;c++)sites.push([c,r]);
  const filled=new Set();
  const L=loop(tp=>{if(Math.random()<0.04&&mols.length<3&&filled.size<20)mols.push({x:60+Math.random()*220,y:0,ph:0});
    const exp=1+(ni?0.025:0.07)*filled.size/20;const gx=46*exp,gy=30*exp,ox=170-2.5*gx,oy=90;
    let mh='';mols=mols.filter(m=>{m.y+=1.2;if(m.y<70){mh+=`<circle cx="${m.x-5}" cy="${m.y}" r="5" style="fill:var(--unit)"/><circle cx="${m.x+5}" cy="${m.y}" r="5" style="fill:var(--unit)"/>`;return true}
      m.ph+=1;const sp=Math.min(14,m.ph);mh+=`<circle cx="${m.x-5-sp}" cy="76" r="4" style="fill:var(--unit)"/><circle cx="${m.x+5+sp}" cy="76" r="4" style="fill:var(--unit)"/>`;
      if(m.ph>30){for(let k=0;k<2;k++){const free=sites.map((s,i)=>i).filter(i=>!filled.has(i));if(free.length)filled.add(free[Math.floor(Math.random()*free.length)])}return false}return true});
    let lat='';for(let r=0;r<4;r++)for(let c=0;c<6;c++){const x=ox+c*gx,y=oy+r*gy;const isNi=ni&&((r*6+c)%7===3);lat+=`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="9" style="fill:${isNi?'var(--accent)':'var(--muted)'}"/>`}
    let hs='';filled.forEach(i=>{const [c,r]=sites[i];hs+=`<circle cx="${(ox+(c+.5)*gx).toFixed(1)}" cy="${(oy+(r+.5)*gy).toFixed(1)}" r="3.5" style="fill:var(--unit)"/>`});
    const R=100+filled.size*(ni?0.6:1.5);
    svg.innerHTML=`<line x1="20" y1="82" x2="320" y2="82" style="stroke:var(--line);stroke-dasharray:4 3"/>${tx(318,78,'표면','m small2','end')}${mh}${lat}${hs}
     ${tx(10,214,`흡수된 H: ${filled.size}개 · 격자 팽창 ${((exp-1)*100).toFixed(1)} % · 저항 ${R.toFixed(1)} Ω`,'b2')}${tx(10,18,ni?'Pd–Ni (초록 = Ni)':'순수 Pd','b2')}`;
    if(filled.size>=20&&!mols.length&&Math.random()<0.01)filled.clear()});
  q('[data-ni]').onclick=e=>{ni=!ni;e.target.setAttribute('aria-pressed',String(ni));e.target.textContent=ni?'순수 Pd로':'Pd–Ni 합금으로';filled.clear();mols=[]};
  q('[data-rs]').onclick=()=>{filled.clear();mols=[]};return L.stop};

 ppmMass(base){const g=base?'H2':pick(Object.keys(GASM));const [nm,M]=GASM[g];const p=base?1:pick([1,5,10,50,100]);const V=base?1:pick([1,2,10]);const Vm=base?22.71:pick([22.71,22.4]);

   ans:`${fx(m*1e6,3)} μg · ${sciT(sci(N))} 개`,ansRead:`${fxR(m*1e6)} 마이크로그램`,
   calc:calcBlock([[[...ks(p),'×10ˣ','(−)','6','×',...ks(V),'÷',...ks(Vm),'×',...ks(M),'='],casioDec(m),'g'],[['×','1','×10ˣ','6','='],casioDec(m*1e6),'μg'],[[...ks(p),'×10ˣ','(−)','6','×',...ks(V),'÷',...ks(Vm),'×','6','.','0','2','2','×10ˣ','2','3','='],casioDec(N),'분자 수 (몰에 N_A 곱하기)']],[W_NEG,'Vm 값은 문제에서 준 것 사용 (22.71 또는 22.4)']),

 bridgeV(base){const Vin=base?5:pick([3.3,5,10]),R=base?100:pick([100,350,1000]),d=base?2:pick([0.5,1,2,3,5]);const R1=R*(1+d/100);const vl=Vin*R/(2*R),vr=Vin*R/(R1+R),Vo=vl-vr;
  return {kind:base?'기본':'유사',title:'브리지 출력 전압',fig:FIG.bridgeP?FIG.bridgeP(R,d):'',

   easy:'시소가 평형일 때 한쪽만 아주 조금 무거워지면 기울어지죠. 그 기울어진 만큼이 V_o예요.'}},
 fourW(){const Rs=pick([50,100,250,500]),r=pick([2,5,10,20]),I=pick([1,2,5]);const V=Rs*I/1000,R2=Rs+2*r,err=2*r/Rs*100;
  return {kind:'응용',title:'2선식 오차 vs 4선식',fig:FIG.fourWire(),
   q:`센서 저항 ${Rs} {{ohm2}}을 정전류 ${I} {{mA}}로 잰다. 리드선 한 가닥의 저항은 ${r} Ω이다. (1) 4선식으로 잰 전압과 저항, (2) 2선식으로 쟀을 때의 저항과 오차율은?`,
   first:['4선식: Rs = Vs/Is','2선식: 선 2가닥 저항이 더해짐','mA → A'],
   steps:[{h:'단위 먼저',b:`<div class="ln">I = ${I} mA = ${I/1000} A</div>`},{h:'4선식',b:`<div class="ln">V = I × Rs = ${I/1000} × ${Rs} = ${fx(V,4)} V → R = V/I = ${Rs} Ω</div><div class="rd">전압선엔 전류가 거의 안 흘러 선 저항 영향 없음</div>`},
    {h:'2선식',b:`<div class="ln">R_측정 = Rs + 2r = ${Rs} + 2×${r} = ${R2} Ω</div>`},{h:'오차율',b:`<div class="ln">(${R2} − ${Rs}) ÷ ${Rs} × 100 = ${fx(err,3)} %</div>`}],
   ans:`4선식 ${Rs} Ω (V = ${fx(V,4)} V) · 2선식 ${R2} Ω, 오차 ${fx(err,3)} %`,ansRead:`오차 ${fxR(err)} 퍼센트`,calc:calcBlock([[['2','×',...ks(r),'÷',...ks(Rs),'×','1','0','0','='],casioDec(err),'오차율']],[]),
   easy:'긴 전선도 작은 저항이에요. 2선식은 그 전선 저항까지 센서 값에 더해 버려요.'}},
 pdAtoms(base){const a=0.389,Lmm=base?1:pick([0.5,1,2]),tnm=base?100:pick([20,50,100,200]);const a_cm=a*1e-7,den=4/a_cm**3,vol=(Lmm*0.1)**2*(tnm*1e-7),N=den*vol;
  return {kind:base?'기본':'유사',title:'Pd 박막 속 원자 수',
   q:`Pd는 FCC 구조(단위 격자 안 원자 4개), 격자상수 0.389 {{nm}}이다. ${Lmm} mm × ${Lmm} mm, 두께 ${tnm} nm인 Pd 박막 속 Pd 원자는 몇 개인가?`,
   first:['원자 밀도 = 4 ÷ a³','nm → cm: × 10⁻⁷','mm → cm: × 0.1'],
   steps:[{h:'격자상수를 cm로',b:`<div class="ln">a = 0.389 nm = 0.389 × 10⁻⁷ cm = ${sciT(sci(a_cm))} cm</div><div class="rd">1 nm = 10⁻⁹ m = 10⁻⁷ cm</div>`},
    {h:'원자 밀도',b:`<div class="ln">4 ÷ (${sciT(sci(a_cm))})³ = 4 ÷ ${sciT(sci(a_cm**3))} = ${sciT(sci(den))} 개/cm³</div><div class="rd">강의 값 6.78 × 10²² atoms/cm³ ✓</div>`},
    {h:'박막 부피 (cm³)',b:`<div class="ln">${Lmm} mm = ${Lmm/10} cm · ${tnm} nm = ${sciT(sci(tnm*1e-7))} cm</div><div class="ln">V = ${Lmm/10} × ${Lmm/10} × ${sciT(sci(tnm*1e-7))} = ${sciT(sci(vol))} cm³</div>`},
    {h:'원자 수',b:`<div class="ln">${sciT(sci(den))} × ${sciT(sci(vol))} = ${sciT(sci(N))} 개</div>`}],
   ans:`약 ${sciT(sci(N))} 개`,ansRead:`${sciR(sci(N))} 개`,
   calc:calcBlock([[['4','÷','(','0','.','3','8','9','×10ˣ','(−)','7',')','x³','='],casioDec(den),'개/cm³'],[['×',...ks(Lmm/10),'x²','×',...K(tnm,-7),'='],casioDec(N),'개']],['격자상수를 cm로 바꾼 뒤 세제곱(괄호 필수)',W_NEG]),
   easy:'작은 상자(단위 격자) 하나에 원자 4개. 박막 전체 부피 안에 상자가 몇 개 들어가는지 세면 원자 수가 나와요.'}},
 joule(){const V=pick([0.5,1,2,3]),ImA=pick([5,10,20,50]),tms=pick([1,2,5,10]),mug=pick([1,2,5,10]),Cp=133;const P=V*ImA/1000,E=P*tms/1000,m=mug*1e-9,dT=E/(Cp*m);
  return {kind:'응용',title:'마이크로히터 온도 상승 (방열 무시)',fig:FIG.heater(),
   q:`Pt 히터(질량 ${mug} {{ug}}, 비열 133 {{JkgK}})에 ${V} {{V}}, ${ImA} {{mA}}를 ${tms} {{ms}} 동안 걸었다. 열손실이 없다면 온도는 몇 K 오르나?`,
   first:['VI·t = Cₚ·m·ΔT','mA → A, ms → s, μg → kg'],
   steps:[{h:'단위 먼저 (전부 SI로)',b:`<div class="ln">I = ${ImA} mA = ${ImA/1000} A · t = ${tms} ms = ${tms/1000} s</div><div class="ln">m = ${mug} μg = ${mug} × 10⁻⁹ kg</div><div class="rd">⚠ μg → kg: 10⁻⁶ g × 10⁻³ = 10⁻⁹ kg</div>`},
    {h:'전력·에너지',b:`<div class="ln">P = ${V} × ${ImA/1000} = ${fx(P,3)} W</div><div class="ln">E = P × t = ${sciT(sci(E))} J</div>`},
    {h:'온도 상승',b:`<div class="ln">ΔT = E ÷ (Cₚ × m) = ${sciT(sci(E))} ÷ (133 × ${mug}×10⁻⁹) = ${fx(dT,3)} K</div>`},
    {h:'해석',b:`<div class="rd">질량이 아주 작아 적은 전력으로 빠르게 가열 → MEMS 히터의 장점. 실제로는 열손실 때문에 덜 오르고 열평형에서 멈춤</div>`}],
   ans:`ΔT ≈ ${fx(dT,3)} K`,ansRead:`${fxR(dT)} 켈빈`,
   calc:calcBlock([[[...ks(V),'×',...K(ImA,-3),'×',...K(tms,-3),'÷','(','1','3','3','×',...K(mug,-9),')','='],casioDec(dT),'K']],[W_NEG,'분모를 괄호로']),
   easy:'전기로 준 에너지가 모두 히터를 데우는 데 쓰인다고 보면, 가벼운 히터일수록 훨씬 뜨거워져요.'}},
 stefanB(){const TC=pick([27,100,200,300,400]),eps=pick([0.6,0.8,0.95,1]);const TK=TC+273.15,P=eps*5.67e-8*TK**4;
  return {kind:'응용',title:'IR 카메라 — 복사 에너지',q:`표면 온도 ${TC} {{degC}}, 방사율 ε = ${eps}인 물체가 내는 복사 에너지 P = εσT⁴는 몇 W/m²인가? (σ = 5.67 × 10⁻⁸ {{Wm2K4}})`,
   first:['°C → K: + 273.15','T⁴ (4제곱)'],
   steps:[{h:'절대온도로',b:`<div class="ln">T = ${TC} + 273.15 = ${fx(TK,5)} K</div><div class="rd">⚠ °C 그대로 넣으면 완전히 틀려요</div>`},{h:'4제곱',b:`<div class="ln">T⁴ = ${sciT(sci(TK**4,4))}</div>`},{h:'곱하기',b:`<div class="ln">P = ${eps} × 5.67 × 10⁻⁸ × ${sciT(sci(TK**4,4))} = ${fx(P,4)} W/m²</div>`},{h:'해석',b:`<div class="rd">ε가 실제와 다르게 설정되면 같은 P에서 T를 잘못 계산 → 온도 오차</div>`}],
   ans:`P ≈ ${fx(P,4)} W/m²`,ansRead:`${fxR(P,4)} 와트 퍼 제곱미터`,calc:calcBlock([[[...ks(eps),'×','5','.','6','7','×10ˣ','(−)','8','×','(',...ks(TC),'+','2','7','3','.','1','5',')','x■','4','='],casioDec(P)]],['[x■] 다음 4 · 괄호로 T를 먼저 묶기',W_NEG]),
   easy:'온도가 조금만 올라도 4제곱이라 내뿜는 열은 확 늘어요. IR 카메라는 그 열의 양으로 온도를 거꾸로 계산해요.'}},
 gcArea(){const w=pick([4,6,8,10]),h=pick([0.5,1.2,2,3.5]);const A=0.5*w*h;
  return {kind:'응용',title:'GC 피크 면적',q:`GC 검출기 피크를 삼각형으로 근사했다. 밑변 w_b = ${w} {{s}}, 높이 h = ${h} {{uA}}이다. 피크 면적(전하량)은 몇 μC인가?`,first:['면적 ≈ ½ w_b h','A × s = C'],
   steps:[{h:'공식',b:`<div class="ln">면적 = ½ × w_b × h</div><div class="rd">가우스 곡선을 삼각형으로 근사 · 높이는 접선이 만나는 꼭짓점까지</div>`},{h:'계산',b:`<div class="ln">½ × ${w} × ${h} = ${fx(A,4)} μA·s = ${fx(A,4)} μC</div><div class="rd">전류(C/s) × 시간(s) = 전하(C)</div>`},{h:'의미',b:`<div class="rd">면적이 클수록 그 성분이 많음 → 정량 분석</div>`}],
   ans:`${fx(A,4)} μC`,ansRead:`${fxR(A,4)} 마이크로쿨롬`,calc:calcBlock([[['0','.','5','×',...ks(w),'×',...ks(h),'='],casioDec(A)]],[]),easy:'산 모양 피크를 세모로 보고 넓이를 구하면 그 가스가 얼마나 있었는지 알 수 있어요.'}},
 mdlGas(){const S=pick([0.0019,0.005,0.012]),sg=pick([0.002,0.005,0.01]);const M=3*sg/S;
  return {kind:'응용',title:'교정 직선에서 MDL',q:`수소센서 교정 직선이 ΔV_out = ${S}x + 0.7442 (x: ppm, ΔV: mV)이다. 가스가 없을 때 출력 표준편차가 ${sg} mV면 MDL은 몇 ppm인가?`,first:['감도 = 기울기','MDL = 3σ/S'],
   steps:[{h:'감도',b:`<div class="ln">S = ${S} mV/ppm (기울기)</div>`},{h:'MDL',b:`<div class="ln">3 × ${sg} ÷ ${S} = ${fx(M,3)} ppm</div>`},{h:'검산',b:`<div class="rd">단위: mV ÷ (mV/ppm) = ppm ✓</div>`}],
   ans:`MDL ≈ ${fx(M,3)} ppm`,ansRead:`${fxR(M)} 피피엠`,calc:calcBlock([[['3','×',...ks(sg),'÷',...ks(S),'='],casioDec(M)]],['분수로 나오면 [S⇔D]']),easy:'잡음의 3배를 감도로 나누면 "확실히 있다"고 말할 수 있는 최소 농도가 나와요.'}}
});

ANIM.domain=host=>{let H=0;const D=[];for(let r=0;r<4;r++)for(let c=0;c<6;c++)D.push({a:Math.random()*6.28,x:40+c*48,y:40+r*40});
  host.innerHTML=`<figure class="figs"><svg viewBox="0 0 340 215" role="img" aria-label="자구 정렬"></svg><div class="figctl"><label class="small">외부 자계 H → <input type="range" min="0" max="1" step="0.02" value="0" data-h style="width:150px"></label></div>
   <figcaption>H = 0이면 자구들이 제각각이라 전체 자화 ≈ 0. H를 키우면 <b>자구벽이 이동하고 자구가 회전</b>해 H 방향으로 정렬 → 자화 M이 커져요.</figcaption></figure>`;
  const svg=host.querySelector('svg');
  const L=loop(()=>{let s='',mx=0;D.forEach(d=>{const tgt=0;const da=((tgt-d.a+Math.PI*3)%(Math.PI*2))-Math.PI;const a=d.a+da*H;mx+=Math.cos(a);const dx=16*Math.cos(a),dy=-16*Math.sin(a);
    s+=`<rect x="${d.x-22}" y="${d.y-18}" width="44" height="36" style="fill:var(--surface);stroke:var(--line)"/><line x1="${(d.x-dx).toFixed(1)}" y1="${(d.y-dy).toFixed(1)}" x2="${(d.x+dx).toFixed(1)}" y2="${(d.y+dy).toFixed(1)}" style="stroke:var(--bad);stroke-width:2.6"/><circle cx="${(d.x+dx).toFixed(1)}" cy="${(d.y+dy).toFixed(1)}" r="3.4" style="fill:var(--bad)"/>`});
   s+=`${tx(10,200,`H ${H>0?'→':''}  ·  자화 M ≈ ${(mx/D.length*100).toFixed(0)} %`,'b2')}`;svg.innerHTML=s});
  host.querySelector('[data-h]').oninput=e=>{H=+e.target.value};return L.stop};

  const svg=host.querySelector('svg'),q=s=>host.querySelector(s);const X=t=>40+t/180*280,Y=R=>190-(R-Rmin)/dR*150;

    <path d="${d}" style="fill:none;stroke:var(--ink);stroke-width:2.4"/><circle cx="${X(th)}" cy="${Y(R)}" r="6" style="fill:var(--bad)"/>${tx(36,Y(Rmin+dR)+4,'R_max','small2','end')}${tx(36,Y(Rmin)+4,'R_min','small2','end')}`;

ANIM.gmrx=host=>{let par=false;const E=Array.from({length:10},(_,i)=>({x:Math.random()*300,up:i%2===0,y:0}));
  host.innerHTML=`<figure class="figs"><svg viewBox="0 0 340 210" role="img" aria-label="GMR 스핀 의존 산란"></svg><div class="figctl"><button class="tbtn" data-h aria-pressed="false">외부 자계 H 걸기 → 평행</button></div>
   <div class="tofcalc small" data-o></div></figure>`;
  const svg=host.querySelector('svg'),q=s=>host.querySelector(s);
  const L=loop(tp=>{const lay=(y,dir,lb)=>`<rect x="20" y="${y}" width="300" height="34" style="fill:var(--warn-soft);stroke:var(--warn)"/>${[0,1,2,3,4].map(k=>ar(50+k*60-(dir>0?-14:14),y+17,50+k*60+(dir>0?14:-14),y+17,'w',2.4)).join('')}${tx(316,y+12,lb,'small2','end')}`;
   let s=lay(30,1,'강자성 1')+`<rect x="20" y="64" width="300" height="40" style="fill:var(--surface2);stroke:var(--line)"/>${tx(316,88,'비자성 (Cu)','m small2','end')}`+lay(104,par?1:-1,'강자성 2');
   E.forEach((e,i)=>{const blocked=!par||!e.up;e.x+=blocked?1.1:2.4;if(e.x>300)e.x=0;const jig=blocked?6*Math.sin(tp*9+i):0;const y=78+(i%3)*8+jig;
    s+=`<circle cx="${20+e.x}" cy="${y.toFixed(1)}" r="5" style="fill:${e.up?'var(--accent)':'var(--unit)'}"/>${tx(20+e.x,y+4,e.up?'↑':'↓','small2','middle').replace('class="small2"','class="small2" style="fill:#fff"')}`});
   s+=`${tx(10,172,'● ↑ 스핀 업 전자  ● ↓ 스핀 다운 전자','small2')}${tx(10,196,par?'평행: 스핀 업은 거의 산란 없이 통과 → 저항 최소 R_p':'반평행: 두 스핀 모두 어딘가에서 산란 → 저항 최대 R_ap','b2')}`;svg.innerHTML=s});
  const upd=()=>{q('[data-h]').setAttribute('aria-pressed',String(par));q('[data-h]').textContent=par?'H 끄기 → 반평행으로':'외부 자계 H 걸기 → 평행';q('[data-o]').innerHTML=`ΔR/R = (R_ap − R_p)/R_ap · AMR은 수 %, GMR은 수십 % (1988년 약 70 %)<br>층 두께는 평균자유행정보다 얇게 (약 10 nm 이하)`};
  q('[data-h]').onclick=()=>{par=!par;upd()};upd();return L.stop};

  const H=pick([5,12,80,1000]);const B=4*Math.PI*1e-7*H;return {kind:'응용',title:'A/m → 가우스 (인체 기준)',q:`자계 H = ${H} {{Am}}일 때 공기 중 자속밀도 B는 몇 {{G}}인가? (B = μ₀H, μ₀ = 4π × 10⁻⁷ {{Hm}})`,first:['B = μ₀H (T)','T → G: × 10⁴'],
   steps:[{h:'B 계산',b:`<div class="ln">B = 4π × 10⁻⁷ × ${H} = ${sciT(sci(B))} T</div>`},{h:'가우스로',b:`<div class="ln">${sciT(sci(B))} × 10⁴ = ${fx(B*1e4,3)} G</div>`},{h:'참고',b:`<div class="rd">강의: 150 kHz 미만 인체보호기준 직업인 12 A/m(≈ 0.15 G), 일반인 5 A/m(≈ 0.06 G)</div>`}],
   ans:`${fx(B*1e4,3)} G`,ansRead:`${fxR(B*1e4)} 가우스`,calc:calcBlock([[['4','×','SHIFT','×10ˣ','×','1','×10ˣ','(−)','7','×',...ks(H),'×','1','×10ˣ','4','='],casioDec(B*1e4),'π 꼴이면 S⇔D']],[W_PI,W_NEG]),easy:'H(A/m)에 μ₀를 곱하면 테슬라, 거기에 1만을 곱하면 가우스.'}},
 amrR(){const Rmin=pick([100,500,1000]),pct=pick([2,2.5,3,4]),th=pick([0,30,45,60,90]);const dR=Rmin*pct/100,R=Rmin+dR*Math.cos(th*Math.PI/180)**2;

   steps:[{h:'ΔR',b:`<div class="ln">ΔR = ${Rmin} × ${pct/100} = ${fx(dR,4)} Ω</div>`},{h:'cos²θ',b:`<div class="ln">cos ${th}° = ${Math.cos(th*Math.PI/180).toFixed(4)} → 제곱 ${(Math.cos(th*Math.PI/180)**2).toFixed(4)}</div>`},{h:'R',b:`<div class="ln">R = ${Rmin} + ${fx(dR,4)} × ${(Math.cos(th*Math.PI/180)**2).toFixed(4)} = ${fx(R,6)} Ω</div>`},{h:'해석',b:`<div class="rd">0°(평행) 최대, 90°(수직) 최소, 45°는 중간 → 직선 구간</div>`}],
   ans:`R ≈ ${fx(R,6)} Ω`,ansRead:`${fxR(R,6)} 옴`,calc:calcBlock([[['SHIFT','MODE','3'],'Deg'],[[...ks(Rmin),'+',...ks(dR),'×','(','cos',...ks(th),')',')','x²','='],casioDec(R)]],[W_DEG,'cos 값을 괄호로 묶고 제곱']),easy:'전류와 자석 방향이 나란하면 저항이 제일 크고, 직각이면 제일 작아요.'}},

ANIM.tonewheel=host=>{let sp=0.6,dig=false;const hist=[];let ang=0;
  host.innerHTML=`<figure class="figs"><svg viewBox="0 0 340 230" role="img" aria-label="톤 휠 속도센서"></svg>
   <div class="figctl"><label class="small">속도 <input type="range" min="0.1" max="2" step="0.05" value="0.6" data-s style="width:130px"></label><button class="tbtn" data-d aria-pressed="false">홀 센서(디지털)로</button></div>
   <figcaption>톱니가 센서 앞을 지날 때마다 자속이 바뀌어 신호가 나와요. <b>유도형</b>은 빠를수록 신호가 커지고 느리면 아주 작아져요. <b>홀 센서 + 슈미트 트리거</b>는 속도와 상관없이 같은 높이의 펄스라서 저속에도 강해요.</figcaption></figure>`;
  const svg=host.querySelector('svg'),q=s=>host.querySelector(s);const T=10;
  const L=loop(()=>{const da=0.02*sp;ang+=da;const cx=80,cy=80,R=52;let teeth='';let near=0;
    for(let k=0;k<T;k++){const a=ang+k*2*Math.PI/T;const x=cx+R*Math.cos(a),y=cy+R*Math.sin(a);teeth+=`<rect x="${(x-7).toFixed(1)}" y="${(y-7).toFixed(1)}" width="14" height="14" transform="rotate(${(a*180/Math.PI).toFixed(1)} ${x.toFixed(1)} ${y.toFixed(1)})" style="fill:var(--muted)"/>`;
     const d=Math.abs(((a%(2*Math.PI))+2*Math.PI)%(2*Math.PI));near+=Math.exp(-((Math.min(d,2*Math.PI-d))**2)/0.02)}
    // 센서는 오른쪽(각 0) 위치
    const flux=near;hist.push(flux);if(hist.length>140)hist.shift();
    let wave='';for(let i=1;i<hist.length;i++){const dv=(hist[i]-hist[i-1])*sp*14;const yv=dig?(hist[i]>0.45?-1:1)*22:Math.max(-40,Math.min(40,-dv*40));wave+=(i>1?'L':'M')+(180+i*1.05).toFixed(1)+' '+(80+yv).toFixed(1)}
    svg.innerHTML=`<circle cx="${cx}" cy="${cy}" r="${R-6}" style="fill:var(--surface2);stroke:var(--ink);stroke-width:1.4"/>${teeth}${tx(cx,cy+4,'톤 휠','small2','middle')}
     <rect x="${cx+R+10}" y="${cy-12}" width="22" height="24" rx="3" style="fill:${dig?'var(--unit)':'var(--warn)'}"/>${tx(cx+R+21,cy+40,dig?'홀':'코일+자석','small2','middle')}
     <line x1="178" y1="80" x2="330" y2="80" style="stroke:var(--line)"/>${wave?`<path d="${wave}" style="fill:none;stroke:${dig?'var(--unit)':'var(--warn)'};stroke-width:2.2"/>`:''}
     ${tx(254,26,dig?'디지털 펄스 (높이 일정)':'유도 전압 (속도에 비례)','b2','middle')}${tx(254,140,'시간 →','small2','middle')}
     ${tx(10,190,`속도 ×${sp.toFixed(2)} · 톱니 ${T}개`,'b2')}${tx(10,212,dig?'저속에서도 같은 크기 펄스 → 자동차에 널리 사용':'전원 불필요, 하지만 저속에서 출력 현저히 작아짐','small2')}`});
  q('[data-s]').oninput=e=>{sp=+e.target.value};q('[data-d]').onclick=e=>{dig=!dig;e.target.setAttribute('aria-pressed',String(dig));e.target.textContent=dig?'유도형(아날로그)으로':'홀 센서(디지털)로';hist.length=0};return L.stop};

ANIM.metaldet=host=>{let d=1;
  host.innerHTML=`<figure class="figs"><svg viewBox="0 0 340 230" role="img" aria-label="금속탐지 와전류"></svg><div class="figctl"><label class="small">금속까지 거리 <input type="range" min="0.15" max="1" step="0.01" value="1" data-d style="width:140px"></label></div>
   <figcaption>코일이 고주파 교류 자기장을 내요. 금속이 가까이 오면 <b>와전류</b>(빨간 고리)가 생기고 반대 자기장 + 줄 가열로 에너지를 빼앗아 <b>발진 진폭이 줄어들어요</b>. 진폭 변화를 보고 금속을 알아채요.</figcaption></figure>`;
  const svg=host.querySelector('svg');
  const L=loop(tp=>{const mx=110+d*170;const amp=1-0.75*Math.exp(-(d-0.15)*3.2);const ed=1-amp;
    let field='';for(let k=1;k<=4;k++){const r=18*k+6*Math.sin(tp*6);field+=`<path d="M70 ${110-r} A${r*1.2} ${r} 0 0 1 70 ${110+r}" style="fill:none;stroke:var(--unit);stroke-width:1.6;opacity:${(0.8-k*0.15)*amp+0.1}"/>`}
    let eddy='';if(ed>0.08){for(let k=1;k<=3;k++)eddy+=`<ellipse cx="${mx+12}" cy="110" rx="${6*k}" ry="${14*k}" style="fill:none;stroke:var(--bad);stroke-width:1.8;opacity:${Math.min(1,ed*1.4)}"/>`}
    let osc='';for(let i=0;i<=120;i++){const x=200+i;const y=200-22*amp*Math.sin(i/120*12*Math.PI+tp*8);osc+=(i?'L':'M')+x+' '+y.toFixed(1)}
    svg.innerHTML=`${[0,1,2,3,4,5].map(k=>`<ellipse cx="${40+k*6}" cy="110" rx="5" ry="30" style="fill:none;stroke:var(--warn);stroke-width:2.6"/>`).join('')}${tx(46,64,'코일','small2','middle')}${field}
     <rect x="${mx}" y="60" width="24" height="100" style="fill:var(--muted)"/>${tx(mx+12,54,'금속','small2','middle')}${eddy}
     <line x1="196" y1="200" x2="324" y2="200" style="stroke:var(--line)"/><path d="${osc}" style="fill:none;stroke:var(--ink);stroke-width:2"/>${tx(260,170,`발진 진폭 ${(amp*100).toFixed(0)} %`,'b2','middle')}`});
  host.querySelector('[data-d]').oninput=e=>{d=+e.target.value};return L.stop};

Object.assign(FIG,{
 detBlock(){const bx=(x,y,w,t1,t2,c)=>`<rect x="${x}" y="${y}" width="${w}" height="44" rx="7" style="fill:${c};stroke:var(--ink);stroke-width:1.4"/>${tx(x+w/2,y+20,t1,'b2','middle')}${tx(x+w/2,y+36,t2,'small2','middle')}`;

Object.assign(GEN,{
 rpmSpeed(base){const P=base?10000:pick([6000,9000,12000,15000,24000]),T=base?10:pick([10,20,24,48]),R=base?0.3:pick([0.25,0.3,0.32,0.35]);const rpm=P/T,rps=rpm/60,v=2*Math.PI*R*rps,kmh=v*3.6;
  return {kind:base?'기본':'유사',title:'펄스로 회전수와 차속',fig:FIG.pTooth(T),q:`톤 휠 톱니 ${T}개, 센서 출력이 분당 ${P.toLocaleString()} 펄스, 바퀴 반지름 ${R} {{m}}이다. (1) {{rpm}} (2) 차속 {{kmh}}는?`,
   first:['rpm = 펄스/min ÷ 톱니','÷ 60 → 회/s','× 2πR → m/s','× 3.6 → km/h'],
   steps:[{h:'회전수',b:`<div class="ln">${P.toLocaleString()} ÷ ${T} = ${fx(rpm,5)} rpm</div><div class="rd">한 바퀴에 톱니 수만큼 펄스</div>`},{h:'초당 회전',b:`<div class="ln">${fx(rpm,5)} ÷ 60 = ${fx(rps,4)} 회/s</div>`},
    {h:'둘레 × 회전',b:`<div class="ln">v = 2π × ${R} × ${fx(rps,4)} = ${fx(v,4)} m/s</div>`},{h:'km/h',b:`<div class="ln">${fx(v,4)} × 3.6 = ${fx(kmh,4)} km/h</div><div class="rd">1 m/s = 3600 m/h = 3.6 km/h</div>`}],
   ans:`${fx(rpm,5)} rpm · ${fx(kmh,4)} km/h`,ansRead:`시속 ${fxR(kmh,4)} 킬로미터`,
   calc:calcBlock([[[...ks(P),'÷',...ks(T),'='],String(rpm),'rpm'],[['×','2','×','SHIFT','×10ˣ','×',...ks(R),'÷','6','0','×','3','.','6','='],casioDec(kmh),'km/h (π 꼴이면 S⇔D)']],[W_PI,W_SD]),
   easy:'톱니가 10개면 펄스 10번에 바퀴가 한 바퀴. 한 바퀴에 바퀴 둘레(2πR)만큼 굴러가요.'}},
 pulseHz(){const kmh=pick([30,50,60,90,120]),R=pick([0.3,0.32]),T=pick([24,48,60]);const v=kmh/3.6,rps=v/(2*Math.PI*R),f=rps*T;
  return {kind:'응용',title:'차속에서 펄스 주파수 거꾸로',q:`바퀴 반지름 ${R} m, 톤 휠 톱니 ${T}개인 차가 ${kmh} km/h로 달린다. 홀 센서 펄스 주파수는 몇 Hz인가?`,first:['km/h ÷ 3.6 → m/s','÷ 2πR → 회/s','× 톱니 → Hz'],
   steps:[{h:'m/s로',b:`<div class="ln">${kmh} ÷ 3.6 = ${fx(v,4)} m/s</div>`},{h:'초당 회전',b:`<div class="ln">${fx(v,4)} ÷ (2π × ${R}) = ${fx(rps,4)} 회/s</div>`},{h:'펄스 주파수',b:`<div class="ln">${fx(rps,4)} × ${T} = ${fx(f,4)} Hz</div><div class="rd">Duty가 일정하지 않아도 주기·주파수로 속도 계산 가능</div>`}],
   ans:`${fx(f,4)} Hz`,ansRead:`${fxR(f,4)} 헤르츠`,calc:calcBlock([[[...ks(kmh),'÷','3','.','6','÷','(','2','×','SHIFT','×10ˣ','×',...ks(R),')','×',...ks(T),'='],casioDec(f)]],[W_PI,W_SD]),
   easy:'앞의 문제를 거꾸로 푸는 거예요. km/h → m/s → 바퀴가 1초에 몇 번 → 톱니 수를 곱하면 1초에 펄스 몇 번.'}}
});

 proofX(){const mug=pick([1,2,5,10]),k=pick([0.5,1,2,5]),g=pick([1,2,10,50]);const m=mug*1e-9,a=g*9.8,x=m*a/k;

   steps:[{h:'단위 먼저 (SI)',b:`<div class="ln">m = ${mug} μg = ${mug} × 10⁻⁹ kg</div><div class="ln">a = ${g} × 9.8 = ${fx(a,4)} m/s²</div><div class="rd">⚠ μg = 10⁻⁶ g = 10⁻⁹ kg</div>`},
    {h:'힘',b:`<div class="ln">F = ma = ${sciT(sci(m))} × ${fx(a,4)} = ${sciT(sci(m*a))} N</div>`},{h:'변위',b:`<div class="ln">x = F/k = ${sciT(sci(m*a))} ÷ ${k} = ${sciT(sci(x))} m = ${fx(x*1e9,3)} nm</div>`},

   easy:'가벼운 추가 단단한 스프링에 매달려 있으면 세게 흔들어도 조금만 움직여요.'}},
 accelVo(base){let r1,r2,Vs;if(base){Vs=3;r1=2;r2=1}else{Vs=pick([2,3,5]);[r1,r2]=pick([[3,1],[1,2],[1,3],[3,2],[4,1]])}const Vo=Vs*(r1-r2)/(r1+r2);
  return {kind:base?'기본':'유사',title:'C 비율로 출력 전압',fig:FIG.accCircuit(),q:`차동 용량식 가속도센서에 ±${Vs} V(1 MHz)를 걸었다. C₁ : C₂ = ${r1} : ${r2}일 때 V_o는?`,first:['V_o = V_s(C₁−C₂)/(C₁+C₂)','작은 쪽을 1로'],
   steps:[{h:'공식',b:`<div class="ln">V_o = V_s × (C₁ − C₂)/(C₁ + C₂)</div><div class="rd">교수님 식 V_o = −V_s + 2V_s·C₁/(C₁+C₂)와 같은 값</div>`},{h:'대입',b:`<div class="ln">${Vs} × (${r1} − ${r2}) ÷ (${r1} + ${r2}) = ${fx(Vo,4)} V</div>`},
    {h:'교수님 식 검산',b:`<div class="ln">−${Vs} + 2×${Vs}×${r1}/(${r1+r2}) = ${fx(-Vs+2*Vs*r1/(r1+r2),4)} V ✓</div>`},{h:'부호 의미',b:`<div class="rd">${Vo>0?'+ → C₁ 쪽으로 움직임':Vo<0?'− → C₂ 쪽으로 움직임':'0 → 가속도 없음'}</div>`}],

   easy:'두 콘덴서 크기 차이가 클수록, 질량이 많이 움직인 거예요.'}},
 accelDisp(){const d=pick([1,2,3]),x=pick([0.1,0.2,0.3]),C0=pick([0.5,1,2]),Vs=pick([2,3]);const C1=C0*d/(d-x),C2=C0*d/(d+x),Vo=Vs*(C1-C2)/(C1+C2);

   easy:'간격이 좁아진 쪽은 C가 커지고 넓어진 쪽은 작아져요. 출력은 결국 "얼마나 움직였나(x/d)"에 비례해요.'}},
 noiseDen(base){const sg=base?1:pick([0.5,1,2,3]),S=base?1:pick([0.2,0.5,1,2]),BW=base?100:pick([25,50,100,400]);const nd=sg*1e-3/S/Math.sqrt(BW);

   steps:[{h:'Zero-g',b:`<div class="ln">(${up} + ${dn}) ÷ 2 = ${fx(z,4)} V</div>`},{h:'감도',b:`<div class="ln">(${up} − ${dn}) ÷ 2 = ${fx(S,4)} V/g</div><div class="rd">+1 g와 −1 g 차이는 2 g라서 ÷ 2</div>`}],

 integ(){const a=[pick([0,1,2]),pick([2,3,4]),pick([3,4,5]),pick([2,4,6])],dt=pick([0.1,0.2,0.5]);let v=0;const V=[0];for(let i=1;i<a.length;i++){v+=(a[i-1]+a[i])/2*dt;V.push(+v.toFixed(4))}let s=0;const D=[0];for(let i=1;i<V.length;i++){s+=(V[i-1]+V[i])/2*dt;D.push(+s.toFixed(5))}

   ans:`v ≈ ${V[V.length-1]} m/s · 거리 ≈ ${D[D.length-1]} m`,ansRead:`${V[V.length-1]} 미터 퍼 세컨드`,calc:'<p class="small muted">구간마다 (앞값+뒷값)÷2×Δt를 계산해 더해 가요.</p>',
   easy:'가속도 막대들의 넓이를 차곡차곡 더하면 속도, 속도 막대 넓이를 더하면 거리예요.'}},
 piezoAccV(){const d=pick([100,200,300]),mg=pick([5,10,20]),g=pick([1,5,10]),C=pick([0.5,1]);const m=mg*1e-3,F=m*g*9.8,q=d*F,V=q/(C*1000);

 ntcR(base){const R0=10,B=base?3435:pick([3435,3950]);const T=base?50:pick([0,10,40,60,85]);const TK=T+273.15;const R=R0*Math.exp(B*(1/TK-1/298.15));
  return {kind:base?'기본':'응용',title:'NTC 서미스터 저항',q:`25 °C에서 10 kΩ, B = ${B} K인 NTC 서미스터의 ${T} °C 저항은?`,first:['R = R₀·exp[B(1/T − 1/T₀)]','T는 반드시 K'],
   steps:[{h:'K로',b:`<div class="ln">T = ${T} + 273.15 = ${fx(TK,5)} K, T₀ = 298.15 K</div>`},{h:'지수',b:`<div class="ln">B(1/T − 1/T₀) = ${B} × (1/${fx(TK,5)} − 1/298.15) = ${fx(B*(1/TK-1/298.15),4)}</div>`},{h:'저항',b:`<div class="ln">10 × e^(${fx(B*(1/TK-1/298.15),4)}) = ${fx(R,4)} kΩ</div><div class="rd">${T>25?'더 뜨거움 → R↓ (NTC)':'더 차가움 → R↑'}</div>`}],
   ans:`${fx(R,4)} kΩ`,ansRead:`${fxR(R,4)} 킬로옴`,calc:calcBlock([[['1','0','×','SHIFT','ln','(',...ks(B),'×','(','1','÷',...ks(TK),'−','1','÷','2','9','8','.','1','5',')',')','='],casioDec(R)]],['SHIFT ln = eˣ','괄호 개수 확인']),
   easy:'NTC는 데워지면 저항이 확 줄어요. 지수 함수라 곧은 선이 아니에요.'}},
 tcV(base){const S=base?41:pick([41,52]);const typ=S===41?'K':'J';const Tcj=base?25:pick([20,25,30]);const back=!base&&Math.random()<.5;const T=base?425:pick([150,300,500,800]);const V=S*(T-Tcj);
  return {kind:base?'기본':'응용',title:back?'열전대 전압 → 온도 (냉접점 보상)':'열전대 출력 전압',fig:FIG.tcFig(),q:back?`${typ}형 열전대(약 ${S} μV/°C)의 측정 전압이 ${fx(V/1000,4)} mV, 냉접점 온도가 ${Tcj} °C이다. 측정 온도는?`:`${typ}형 열전대(약 ${S} {{uVC}})로 ${T} °C를 잰다. 냉접점이 ${Tcj} °C일 때 출력은 몇 mV인가?`,first:['V ≈ S·(T − T_cj)','μV → mV: ÷ 1000'],
   steps:back?[{h:'온도차',b:`<div class="ln">ΔT = ${fx(V,5)} μV ÷ ${S} = ${fx(T-Tcj,4)} °C</div>`},{h:'냉접점 더하기',b:`<div class="ln">T = ${fx(T-Tcj,4)} + ${Tcj} = ${T} °C</div><div class="rd">보상 안 하면 ${Tcj} °C만큼 낮게 읽음</div>`}]:[{h:'온도차',b:`<div class="ln">${T} − ${Tcj} = ${T-Tcj} °C</div>`},{h:'전압',b:`<div class="ln">${S} μV × ${T-Tcj} = ${fx(V,5)} μV = ${fx(V/1000,4)} mV</div><div class="rd">실제는 비선형 → 표준 열기전력표 사용 [AI 보충]</div>`}],
   ans:back?`${T} °C`:`${fx(V/1000,4)} mV`,ansRead:back?`${T}도`:`${fxR(V/1000,4)} 밀리볼트`,calc:calcBlock([[back?[...ks(+(V/1000).toFixed(4)),'×','1','0','0','0','÷',...ks(S),'+',...ks(Tcj),'=']:[...ks(S),'×','(',...ks(T),'−',...ks(Tcj),')','÷','1','0','0','0','='],back?String(T):casioDec(V/1000)]],[]),
   easy:'열전대는 "차이"만 알려줘요. 기준점 온도를 더해야 진짜 온도예요.'}},
 tauResp(){const tau=pick([2,5,10]),Ti=pick([20,25]),Tf=pick([80,100]),t=pick([1,2,3,5]);const n=t;const val=Tf+(Ti-Tf)*Math.exp(-n);
  return {kind:'응용',title:'시정수와 응답',q:`시정수 τ = ${tau} s인 온도센서를 ${Ti} °C에서 ${Tf} °C 물에 넣었다. ${n*tau} s 뒤 읽는 값은?`,first:['T = T_f + (T_i − T_f)e^(−t/τ)','t = τ면 63.2 %'],
   steps:[{h:'t/τ',b:`<div class="ln">${n*tau}/${tau} = ${n}</div>`},{h:'계산',b:`<div class="ln">${Tf} + (${Ti} − ${Tf}) × e^(−${n}) = ${fx(val,4)} °C</div><div class="rd">진행률 ${fx((1-Math.exp(-n))*100,3)} % · 5τ면 99.3 %</div>`}],
   ans:`${fx(val,4)} °C`,ansRead:`${fxR(val,4)} 도`,calc:calcBlock([[[...ks(Tf),'+','(',...ks(Ti),'−',...ks(Tf),')','×','SHIFT','ln','(−)',...ks(n),')','='],casioDec(val)]],['SHIFT ln = eˣ']),easy:'센서도 데워지는 데 시간이 걸려요. τ 한 번에 63 %, 다섯 번이면 거의 다.'}},
 pConv(base){const U=[['kPa',1e3,'킬로파스칼'],['bar',1e5,'바'],['atm',101325,'기압'],['psi',6894.76,'피에스아이'],['mmHg',133.322,'밀리미터 수은'],['MPa',1e6,'메가파스칼']];let a=base?U[3]:pick(U),b=base?U[0]:pick(U.filter(x=>x!==a));const v=base?30:pick([1,2.5,10,30,100,150]);const r=v*a[1]/b[1];
  return {kind:base?'기본':'유사',title:'압력 단위 변환',q:`${v} ${a[0]}는 몇 ${b[0]}인가?`,first:['먼저 Pa로','1 bar = 10⁵ Pa, 1 atm = 101 325 Pa, 1 psi ≈ 6895 Pa'],
   steps:[{h:'Pa로',b:`<div class="ln">${v} × ${fx(a[1],6)} = ${fx(v*a[1],6)} Pa</div>`},{h:`${b[0]}로`,b:`<div class="ln">${fx(v*a[1],6)} ÷ ${fx(b[1],6)} = ${fx(r,4)} ${b[0]}</div>`}],
   ans:`${fx(r,4)} ${b[0]}`,ansRead:`${fxR(r,4)} ${b[2]}`,calc:calcBlock([[[...ks(v),'×',...ks(a[1]),'÷',...ks(b[1]),'='],casioDec(r)]],[]),easy:'모든 압력 단위를 일단 파스칼로 바꾸고, 다시 원하는 단위로 나눠요.'}},
 absGauge(){const g=pick([200,350,500,-30]);const a=g+101.3;
  return {kind:'유사',title:'게이지압 ↔ 절대압',q:`게이지압 ${g} kPa는 절대압으로 몇 kPa인가? (대기압 101.3 kPa)`,first:['P_abs = P_g + P_atm'],
   steps:[{h:'더하기',b:`<div class="ln">${g} + 101.3 = ${fx(a,5)} kPa(abs)</div><div class="rd">${g<0?'음의 게이지압 = 진공(부압)':'타이어·배관 압력은 보통 게이지압'}</div>`}],ans:`${fx(a,5)} kPa`,ansRead:`${fxR(a,5)} 킬로파스칼`,calc:'<p class="small muted">더하기만 하면 돼요.</p>',easy:'게이지압은 "대기압보다 얼마 더"예요. 대기압을 더하면 진짜(절대) 압력.'}},
 headP(base){const rho=base?1000:pick([1000,1030,800,13600]);const nm={1000:'물',1030:'바닷물',800:'기름',13600:'수은'}[rho];const h=base?10:pick([0.5,2,5,10,25]);const P=rho*9.81*h;const back=!base&&Math.random()<.5;
  return {kind:base?'기본':'유사',title:back?'바닥 압력 → 레벨':'정수압',q:back?`${nm}(ρ = ${rho} kg/m³) 탱크 바닥 압력계가 ${fx(P/1000,4)} kPa(게이지)를 가리킨다. 액위는?`:`${nm}(ρ = ${rho} {{kgm3}}) ${h} m 깊이의 정수압은 몇 kPa인가?`,first:['P = ρgh (g = 9.81)'],
   steps:back?[{h:'식 정리',b:`<div class="ln">h = P/(ρg) = ${fx(P,5)} ÷ (${rho} × 9.81) = ${h} m</div><div class="rd">kPa → Pa: × 1000 먼저</div>`}]:[{h:'대입',b:`<div class="ln">${rho} × 9.81 × ${h} = ${fx(P,5)} Pa = ${fx(P/1000,4)} kPa</div><div class="rd">물 10 m ≈ 98 kPa ≈ 1 bar</div>`}],
   ans:back?`${h} m`:`${fx(P/1000,4)} kPa`,ansRead:back?`${h} 미터`:`${fxR(P/1000,4)} 킬로파스칼`,calc:calcBlock([[back?[...ks(+(P/1000).toFixed(4)),'×','1','0','0','0','÷','(',...ks(rho),'×','9','.','8','1',')','=']:[...ks(rho),'×','9','.','8','1','×',...ks(h),'÷','1','0','0','0','='],back?String(h):casioDec(P/1000)]],[]),
   easy:'깊을수록, 액체가 무거울수록 바닥 압력이 커요. 거꾸로 압력으로 깊이를 알 수 있어요.'}},
 pSens(base){const S=base?2:pick([1.5,2,3]),V=base?10:pick([5,10]),FS=base?1000:pick([100,500,1000]),P=base?250:pick([0.1,0.25,0.5,0.8]).valueOf();const p=base?250:+(P*FS).toFixed(1);const out=S*V*p/FS;
  return {kind:base?'기본':'응용',title:'압력센서 출력 (mV/V)',q:`감도 ${S} {{mVV}} (풀스케일 ${FS} kPa)인 압력센서에 ${V} V를 공급했다. ${p} kPa에서 출력은?`,first:['풀스케일 출력 = 감도 × 공급전압','선형 비례'],
   steps:[{h:'풀스케일 출력',b:`<div class="ln">${S} mV/V × ${V} V = ${S*V} mV (${FS} kPa에서)</div>`},{h:'비례',b:`<div class="ln">${S*V} × ${p}/${FS} = ${fx(out,4)} mV</div>`}],
   ans:`${fx(out,4)} mV`,ansRead:`${fxR(out,4)} 밀리볼트`,calc:calcBlock([[[...ks(S),'×',...ks(V),'×',...ks(p),'÷',...ks(FS),'='],casioDec(out)]],[]),easy:'"1 V 넣으면 최대 2 mV"라는 뜻. 10 V면 20 mV, 압력이 ¼이면 ¼.'}},
 qAv(base){const D=base?50:pick([25,50,80,100]),v=base?2:pick([0.5,1,1.5,2,3]);const A=Math.PI*(D/1000)**2/4,Q=A*v;
  return {kind:base?'기본':'유사',title:'유량 Q = A·v',fig:null,q:`안지름 ${D} mm 관에 물이 ${v} m/s로 흐른다. 유량을 m³/h와 L/min으로?`,first:['mm → m','A = πD²/4','m³/s × 3600 = m³/h, × 60000 = L/min'],

   ans:`${fx(Q*3600,4)} m³/h = ${fx(Q*6e4,4)} L/min`,ansRead:`${fxR(Q*6e4,4)} 리터 퍼 미닛`,calc:calcBlock([[['SHIFT','×10ˣ','×','(',...K(D,-3),')','x²','÷','4','×',...ks(v),'×','3','6','0','0','='],casioDec(Q*3600),'m³/h'],[['Ans','÷','6','0','×','1','0','0','0','='],casioDec(Q*6e4),'L/min']],[W_PI,W_NEG]),
   easy:'관 구멍 넓이 × 물 속도 = 1초에 지나가는 물의 양.'}},
 dpFlow(base){const Q1=base?100:pick([50,100,200]),dP1=base?25:pick([10,25,40]);const k=base?4:pick([0.25,2,4,9]);const dP2=dP1*k,Q2=Q1*Math.sqrt(k);

   steps:[{h:'비율',b:`<div class="ln">ΔP 비 = ${fx(dP2,4)}/${dP1} = ${k}</div>`},{h:'√',b:`<div class="ln">Q₂ = ${Q1} × √${k} = ${fx(Q2,4)} m³/h</div><div class="rd">차압이 ${k}배여도 유량은 ${fx(Math.sqrt(k),3)}배 → 저유량에서 정밀도 낮음</div>`}],
   ans:`${fx(Q2,4)} m³/h`,ansRead:`${fxR(Q2,4)} 세제곱미터 퍼 아워`,calc:calcBlock([[[...ks(Q1),'×','√■',...ks(fx(dP2,4)),'÷',...ks(dP1),'='],casioDec(Q2)]],[]),easy:'압력 차이가 4배면 유량은 2배예요(루트).'}},
 magE(base){const B=base?0.01:pick([0.005,0.01,0.02]),D=base?100:pick([50,100,200]),v=base?2:pick([0.5,1,3]);const E=B*D/1000*v;

 vortexF(){const v=pick([1,2,5]),d=pick([10,20,30]);const f=0.2*v/(d/1000);

 levelToF(base){const H=base?5:pick([3,5,8,10]),c=343;const h=base?2:pick([0.5,1.5,2.5,4].filter(x=>x<H));const t=2*(H-h)/c;

 snEff(base){const Sn=base?8:pick([2,4,5,8,15]);const M=base?['철(Fe)',1]:pick([['철(Fe)',1],['스테인리스',0.7],['황동',0.5],['알루미늄',0.4],['구리',0.3]]);const Sa=0.81*Sn*M[1];

PAGES.temp={title:'온도센서',part:'제3편 7장',secs:[
 {k:'단위',h:'온도와 단위',b:`${AIX}<div class="rel mono">T[K] = t[°C] + 273.15 · °F = 1.8·°C + 32</div><div class="warnbox">T⁴, 1/T가 들어간 식(슈테판-볼츠만, 서미스터)에는 반드시 <b>K</b></div>
   <div class="flow"><div>온도</div><div>저항(RTD·서미스터) / 전압(열전대) / 복사(IR)</div><div>브리지·증폭</div><div>ADC → PLC</div></div>`,
  easy:'켈빈은 절대영도(−273 °C)를 0으로 잡은 온도예요.'},
 {k:'RTD',h:'측온저항체 RTD (Pt100)',b:`<div data-anim="tcurves"></div><div class="eqn">R(T) ≈ R₀(1 + αT), α = 0.00385/°C<small>[[rtd|RTD]] · Pt100 = 0 °C에서 100 Ω</small></div>
   <ul class="clean"><li>정밀·안정·거의 선형 → 공정 온도 표준</li><li>3선·4선식으로 리드선 오차 제거, 측정 전류 작게(자기발열)</li></ul>`,
  easy:'백금선 저항은 온도에 거의 정비례해서 늘어요.'},
 {k:'서미스터',h:'서미스터 NTC·PTC',b:`<div class="eqn">R = R₀·exp[B(1/T − 1/T₀)]<small>[[thermistor|NTC]] · B ≈ 3000~4500 K · T는 K</small></div>
   <ul class="clean"><li>감도 매우 큼 (1 °C당 약 −4 %) · 비선형 · 좁은 범위</li><li>가전·배터리 온도, 열전대 냉접점 측정</li><li>PTC: 일정 온도에서 R 급증 → 과전류 차단</li></ul>`,
  easy:'조금만 따뜻해져도 저항이 확 줄어요. 정밀하게 쓰려면 곡선을 보정해야 해요.'},
 {k:'열전대',h:'열전대 — 온도차가 전압으로',b:`${FIG.tcFig()}<div class="eqn">V ≈ S·(T − T_cj)<small>[[seebeck|제벡 효과]] · [[thermocouple|K형]] ≈ 41 {{uVC}}</small></div>
   <ul class="clean"><li>[[cjc|냉접점 보상]] 필수 · 보상도선 사용</li><li>넓은 범위(K형 약 −200~1250 °C)·튼튼·빠름 / 출력 μV 수준·잡음 주의</li></ul>`,
  easy:'두 금속의 온도차가 아주 작은 전압을 만들어요. 기준점 온도를 따로 재서 더해요.'},
 {k:'비교',h:'무엇을 고를까',b:`<div class="tblwrap fit"><table><tr><th></th><th>RTD</th><th>서미스터</th><th>열전대</th></tr><tr><td>범위</td><td class="small">−200~600 °C</td><td class="small">−50~150 °C</td><td class="small">−200~1250 °C+</td></tr><tr><td>정확도</td><td class="small">높음</td><td class="small">좁은 범위서 높음</td><td class="small">보통</td></tr><tr><td>선형성</td><td class="small">좋음</td><td class="small">나쁨</td><td class="small">보통</td></tr><tr><td>출력</td><td class="small">저항</td><td class="small">저항(큰 변화)</td><td class="small">μV 전압</td></tr></table></div>
   <p class="small">비접촉: 적외선 온도계(방사율 설정) · IC 센서(예: 10 mV/°C 선형 출력). 범위는 대략값 [AI 보충].</p>${symGrid(['thm','tc'])}<button class="ghost" data-goto="gas" data-i="7">↗ 슈테판-볼츠만·방사율</button>`,
  easy:'정밀하면 RTD, 싸고 민감하면 서미스터, 아주 뜨거우면 열전대.'},
 {k:'응답',h:'응답시간과 시정수',b:`<div class="eqn">T(t) = T_f + (T_i − T_f)e^(−t/τ)<small>[[timeconst|시정수]] τ · 1τ 63.2 % · 5τ 99.3 %</small></div><p class="small">보호관(써모웰)이 두껍고 유속이 느릴수록 τ↑. [현업] 반응기 온도 제어 지연의 원인.</p><button class="ghost" data-goto="char" data-i="5">↗ 응답시간 t₉₀</button>`,
  easy:'센서도 데워지는 데 시간이 걸려서, 바로 정확한 값을 내지 못해요.'},
 {k:'문제',h:'',b:'__PROBS__'},
 {k:'외울 것',h:'이것만은 외우기',b:`<ol class="clean"><li>K = °C + 273.15 · Pt100: R = 100(1 + 0.00385T)</li><li>NTC: 온도↑ R↓ 지수, T는 K · 열전대 V ≈ S·ΔT + 냉접점 보상</li><li>RTD 정밀 · 서미스터 민감 · 열전대 고온</li></ol>
   <details class="qa"><summary>열전대에 냉접점 보상이 필요한 이유는?</summary><div>열전대는 측정점과 기준점의 온도 "차이"에 비례하는 전압만 내기 때문.</div></details>
   <button class="primary" data-goto="cards">카드로 외우기</button>`}
]};

PAGES.press={title:'압력센서',part:'제3편 8장',secs:[
 {k:'단위',h:'압력과 단위',b:`${AIX}<div class="eqn">P = F/A<small>[[pressure|압력]] {{Pa}} = N/m²</small></div>
   <div class="rel mono">1 kPa = 10³ Pa · 1 bar = 100 kPa · 1 atm = 101.325 kPa<br>1 psi ≈ 6.895 kPa · 1 mmHg ≈ 133.3 Pa · 1 MPa = 10 bar</div>`,
  easy:'1 bar는 대략 1기압. 타이어 30 psi ≈ 207 kPa ≈ 2 bar예요.'},
 {k:'기준',h:'절대압·게이지압·차압',b:`<div class="f4"><div><div class="h">절대압 (abs)</div>진공 기준 · 기압계·진공 공정</div><div><div class="h">게이지압 (g)</div>대기압 기준 · 배관·타이어</div><div><div class="h">차압 (d)</div>두 점 차이 · 유량·필터 막힘·레벨</div></div><div class="rel mono">P_abs = P_g + P_atm</div><p class="small">[[gaugeabs|압력 기준]]을 헷갈리면 약 100 kPa씩 틀려요.</p>`,
  easy:'타이어 게이지 0은 "대기압과 같다"는 뜻이지 진공이 아니에요.'},
 {k:'감지 원리',h:'다이어프램 + 압저항',b:`<div data-anim="diaph"></div>
   <div class="tblwrap fit"><table><tr><th>방식</th><th>원리</th><th>특징</th></tr><tr><td>압저항 (MEMS)</td><td class="small">[[diaphragm|다이어프램]] 휨 → ρ 변화</td><td class="small">소형·저가·온도 보상 필요</td></tr><tr><td>정전용량</td><td class="small">휨 → 간격 d 변화 → C</td><td class="small">고감도·저전력</td></tr><tr><td>압전</td><td class="small">힘 → 전하</td><td class="small">동압·폭발만 (정압 X)</td></tr><tr><td>스트레인 게이지</td><td class="small">금속 다이어프램 + 게이지</td><td class="small">고압·튼튼</td></tr></table></div>
   <button class="ghost" data-goto="resist" data-i="2">↗ 압저항 효과</button>`,
  easy:'얇은 막이 압력에 휘고, 그 휨을 저항·정전용량으로 읽어요.'},
 {k:'정수압',h:'정수압 — 깊이와 압력',b:`<div class="eqn">P = ρgh<small>[[hydrostatic|정수압]] · 물 10 m ≈ 98 kPa ≈ 1 bar</small></div><p>탱크 바닥 압력 → 액위 측정(레벨). 밀도가 바뀌면 오차.</p><button class="ghost" data-goto="flow" data-i="4">↗ 레벨 측정</button>`,
  easy:'물 10 m 아래는 대기압 하나가 더 얹힌 것과 같아요.'},
 {k:'사양',h:'사양 읽기',b:`<ul class="clean"><li>감도 mV/V (공급 1 V당 풀스케일 출력)</li><li>측정 범위·과압 한계·파열압</li><li>오차 %FS · 온도 드리프트 · 응답 주파수</li><li>출력: mV(브리지) · 0~10 V · 4~20 mA(현장 표준)</li></ul><button class="ghost" data-goto="plant" data-i="2">↗ 4~20 mA</button>`,
  easy:'"2 mV/V"면 10 V 넣었을 때 최대 압력에서 20 mV가 나와요.'},
 {k:'문제',h:'',b:'__PROBS__'},
 {k:'외울 것',h:'이것만은 외우기',b:`<ol class="clean"><li>1 bar = 100 kPa, 1 atm = 101.325 kPa, 1 psi ≈ 6.9 kPa</li><li>P_abs = P_g + P_atm · P = ρgh</li><li>MEMS: 다이어프램 + 압저항 풀 브리지 · 압전형은 정압 불가</li></ol><button class="primary" data-goto="cards">카드로 외우기</button>`}
]};

PAGES.flow={title:'유량·레벨센서',part:'제3편 9장',secs:[
 {k:'유량',h:'유량이란',b:`${AIX}<div data-anim="pipe"></div><div class="eqn">Q = A·v,  ṁ = ρQ<small>[[flowrate|유량]] {{m3h}} · {{Lmin}} · 질량유량 {{kgs}}</small></div><div class="rel mono">1 m³/h = 16.67 L/min · 1 m³ = 1000 L</div>`,
  easy:'관 단면적 × 속도 = 1초에 지나가는 부피.'},
 {k:'차압식',h:'차압식 — 가장 오래된 방식',b:`<div class="eqn">Q ∝ √ΔP<small>[[dpflow|오리피스·벤투리]] · 베르누이</small></div><ul class="clean"><li>유량 2배 → 차압 4배 → 저유량 정밀도↓ (측정 범위비 약 3~4:1)</li><li>구조 간단·표준화, 압력 손실</li></ul>`,
  easy:'좁은 곳에서 빨라지면 압력이 떨어져요. 그 차이의 루트가 유량이에요.'},
 {k:'여러 방식',h:'유량계 종류',b:`<div class="f4"><div><div class="h">[[magflow|전자기]]</div><div class="ln">E = B·D·v</div><div class="rd">전도성 액체만 · 손실 없음</div></div><div><div class="h">초음파</div>상류·하류 전파 시간차 · 외부 부착형</div>
    <div><div class="h">[[vortex|와류]]</div><div class="ln">f = St·v/d</div><div class="rd">증기·가스·액체</div></div><div><div class="h">[[massflow|질량 (코리올리·열식)]]</div>질량 직접 측정 · 코리올리식 고정밀</div><div><div class="h">터빈</div>회전수 ∝ 유속 · 깨끗한 유체</div></div>
   <button class="ghost" data-goto="induct">↗ 패러데이 법칙</button> <button class="ghost" data-goto="gyro" data-i="2">↗ 코리올리 힘</button>`,
  easy:'전기·소리·소용돌이·비틀림·바퀴 — 흐름을 재는 방법이 이렇게 많아요.'},
 {k:'고르기',h:'유량계 고르는 기준',b:`<ul class="clean"><li>유체: 액체/가스/증기, 전도성, 이물질</li><li>체적이 필요한가 질량이 필요한가 (거래·배합 → 질량)</li><li>관경·압력 손실·직관부 길이·비용</li></ul><p class="small"><b>[현업]</b> 정수장 = 전자기, 증기 = 와류·차압, 정밀 배합 = 코리올리.</p>`,
  easy:'무엇이 흐르는지, 얼마나 정확해야 하는지로 골라요.'},
 {k:'레벨',h:'레벨 측정',b:`<div class="rel mono">h = P/(ρg) · h = H − c·t/2</div><div class="f4"><div><div class="h">정수압식</div>바닥 압력 → 밀도 알아야 함</div><div><div class="h">초음파·레이더</div>위에서 ToF · 레이더는 증기·거품에 강함</div><div><div class="h">정전용량식</div>전극과 탱크 사이 유전체 높이</div><div><div class="h">플로트·스위치</div>상·하한 경보 (포인트)</div></div>
   <p>[[level|레벨 센서]]: 연속 측정과 포인트(스위치) 측정을 구분.</p><button class="ghost" data-goto="ultra" data-i="2">↗ 초음파 거리 측정</button>`,
  easy:'바닥에서 압력으로, 위에서 메아리로, 옆에서 콘덴서로 높이를 재요.'},
 {k:'문제',h:'',b:'__PROBS__'},
 {k:'외울 것',h:'이것만은 외우기',b:`<ol class="clean"><li>Q = A·v · 1 m³/h = 16.67 L/min</li><li>차압 Q ∝ √ΔP · 전자기 E = BDv(전도성만) · 와류 f = St·v/d</li><li>레벨 h = P/(ρg), h = H − ct/2</li></ol><button class="primary" data-goto="cards">카드로 외우기</button>`}
]};

PAGES.prox={title:'근접·광전센서',part:'제3편 10장',secs:[
 {k:'종류',h:'근접 센서 — 닿지 않고 감지',b:`${AIX}${FIG.proxKinds()}<p>공장 자동화에서 가장 많이 쓰는 ON/OFF 센서. 물체 유무·위치·개수·회전 감지.</p>`,

  easy:'금속만 볼 거면 유도형, 금속 아닌 것도 볼 거면 정전용량형.'},
 {k:'감지 거리',h:'감지 거리와 히스테리시스',b:`<div class="eqn">Sa ≤ 0.81·Sn × 재질 계수<small>[[snDist|감지 거리]] · 표준 타겟 = 철</small></div>

  easy:'카탈로그 거리의 80 % 안에서, 금속 종류에 따라 더 가깝게.'},
 {k:'광전',h:'광전 센서',b:`<div class="f4"><div><div class="h">투과형</div>송·수광기 마주 봄 · 가장 멀리 · 불투명체</div><div><div class="h">회귀반사형</div>반사판 · 한쪽만 배선 · 투명체 주의</div><div><div class="h">확산반사형</div>물체 반사 · 색·광택 영향 · BGS로 배경 무시</div></div><p>[[photoelec|광전 센서]]: 수 m~수십 m 감지.</p><button class="ghost" data-goto="optic" data-i="4">↗ 광학 원리</button>`,

 {k:'배선',h:'출력과 배선',b:`${FIG.npnFig()}${symGrid(['npn','pnp','sw'])}<ul class="clean"><li>[[npnpnp|NPN·PNP]] · NO(평상시 열림)·NC(평상시 닫힘)</li><li>2선식(부하 직렬), 3선식(+V·0V·출력), IO-Link(디지털 통신+진단)</li></ul><p class="small"><b>[현업]</b> 유럽 설비는 PNP, 아시아 설비는 NPN이 많았음 — PLC 입력 카드와 꼭 맞추기 (추정·지역차).</p>`,

 {k:'외울 것',h:'이것만은 외우기',b:`<ol class="clean"><li>유도형 = 금속(와전류) · 정전용량형 = 모든 물체 · 광전형 = 빛</li><li>Sa ≤ 0.81·Sn × 재질 계수 · 히스테리시스로 채터링 방지</li><li>NPN 싱크 / PNP 소스 · 갈 +V, 청 0V, 흑 출력</li></ol><button class="primary" data-goto="cards">카드로 외우기</button>`}
]};
